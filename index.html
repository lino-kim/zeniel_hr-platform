// ---------------- Offline OCR (Tesseract.js) for image 근태표 ----------------
// Tuned to the "계약직 출근부" table layout seen across PRADA MIU MIU-style sheets:
// a title/info box, then a table with English column headers (Date/Day/From/To/
// Net/Overtime/Night/Remark/Signature), one row per calendar day. Printed dates,
// times, and remark codes (RO/AL/HOL/UNPAID) OCR reasonably well; handwritten
// signatures are ignored entirely since they carry no data we need.
const OCR_REMARK_TRANSLATE = {RO:'휴무', AL:'연차', HOL:'공휴일', UNPAID:'무급', UPAID:'무급', ANNUAL:'연차'};
const OCR_HEADERS = ['Date','Day','From','To','Net','Overtime','Night','Remark'];

function ocrCleanDigits(s){
  // OCR often confuses O/0, l/1, S/5 inside numeric tokens
  return s.replace(/[oO]/g,'0').replace(/[lI]/g,'1').replace(/[sS](?=\d)/g,'5');
}
// 근로기준법 제54조: 4시간 이상 근무 시 30분, 8시간 이상 근무 시 1시간의 휴게시간을
// 근로시간 도중에 주어야 한다. From~To 시간만 주어지고 실제 순 근무시간이 별도로
// 정확히 나와있지 않을 때(예: 사진 근태표), 이 규칙으로 실제 근무시간을 역산한다.
function legalBreakMinutes(spanMinutes){
  if(spanMinutes >= 8*60) return 60;
  if(spanMinutes >= 4*60) return 30;
  return 0;
}
function actualWorkedMinutes(fromHM, toHM){
  const [fh,fm] = fromHM.split(':').map(Number);
  const [th,tm] = toHM.split(':').map(Number);
  let span = (th*60+tm) - (fh*60+fm);
  if(span < 0) span += 24*60; // crosses midnight
  return Math.max(0, span - legalBreakMinutes(span));
}

function ocrFlattenWords(data){
  if(data.words && data.words.length) return data.words;
  // fallback for API shapes where words aren't exposed as a flat top-level array
  const out = [];
  (data.blocks||[]).forEach(b=>(b.paragraphs||[]).forEach(p=>(p.lines||[]).forEach(l=>(l.words||[]).forEach(w=>out.push(w)))));
  return out;
}

// 사진·PDF 근태표: Claude(이미지 인식)로 표를 읽는다.
const VISION_PROMPT = `너는 대한민국 인사/급여 담당자를 돕는 근태표 판독 AI다.
첨부 이미지는 근태표/출근부다. 한 장에 직원이 한 명일 수도, 여러 명일 수도 있다. 표에 나오는 직원을 한 명도 빠짐없이 각각 따로 읽어라.
JSON 하나로만 답한다: {"employees":[{"name":"직원명(표에 적힌 그대로)","rows":[{"d":"YYYY-MM-DD","from":"HH:MM","to":"HH:MM","remark":"비고"}]}]}
- 직원마다 employees 항목을 하나씩 만든다. 서로 다른 직원의 기록을 한 사람에게 합치지 않는다.
- 이름은 표의 성명 칸에 적힌 그대로 쓰고, 읽을 수 없으면 빈 문자열로 둔다. 이름을 지어내지 않는다.
- from/to: 출근·퇴근 시각이 명확히 읽히면 24시간 HH:MM으로. 없거나 읽을 수 없으면 생략.
- remark: 시각이 없을 때 그 날 적힌 문구(휴무, 연차, RO, AL, HOL, UNPAID, - 등)를 그대로. 아무 기록도 없는 날은 행 자체를 생략.
- 서명·도장은 무시한다. 읽을 수 없는 값은 추측하지 말고 생략한다.`;
async function ocrExtractAttendance(imageDataUrl){
  const sample = await claudeCap('sample');
  if(!sample) throw new Error('이미지 분석 기능을 쓸 수 없는 환경입니다 (claude.ai에서 열어주세요).');
  let parsed;
  try{
    parsed = await sample.json(VISION_PROMPT, {images: dataUrlToBlob(imageDataUrl), ...(state.abortCtl ? {signal: state.abortCtl.signal} : {})});
  }catch(e){
    const code = e && e.code;
    throw new Error(SAMPLE_ERR_COPY[code] || ('이미지 분석 실패' + (code?` (${code})`:'')));
  }
  // 예전 형식({name, rows})으로 답해도 받아준다
  const emps = Array.isArray(parsed && parsed.employees) ? parsed.employees : (parsed && parsed.rows ? [{name: parsed.name, rows: parsed.rows}] : []);
  const records = [], names = [];
  emps.forEach(emp=>{
    const name = typeof (emp&&emp.name)==='string' ? emp.name.replace(/[^가-힣a-zA-Z ]/g,'').trim() : '';
    if(/^(합\s*계|소\s*계|계|성\s*명|이\s*름|직원명?|비\s*고|총\s*계)$/.test(name)) return; // 표의 칸 이름은 직원이 아니다
    if(name && !names.includes(name)) names.push(name);
    ((emp && emp.rows) || []).forEach(r=>{
      if(!r || !/^\d{4}-\d{2}-\d{2}$/.test(r.d||'')) return;
      const from = String(r.from||'').trim(), to = String(r.to||'').trim();
      if(/^\d{1,2}:\d{2}$/.test(from) && /^\d{1,2}:\d{2}$/.test(to)){
        records.push({name, date:r.d, status:'O', from, to, workedMinutes: actualWorkedMinutes(from, to)});
      } else if(r.remark){
        const rm = String(r.remark).trim();
        const key = rm.toUpperCase().replace(/[^A-Z]/g,'');
        records.push({name, date:r.d, status: rm==='-' ? 'X' : (OCR_REMARK_TRANSLATE[key] || rm)});
      }
    });
  });
  return {name: names.length===1 ? names[0] : null, names, records};
}

// Runs OCR for a source exactly once (cached on s._ocrRecords) and applies the
// manual name override — shared by both the 월근태 pass and the 시간외수당 pass so
// image/PDF sources work correctly regardless of which target(s) were uploaded,
// and regardless of which pass happens to run first.
async function ensureOcrRecords(s){
  if(s._ocrRecords) return applyManualNameOverride(s, s._ocrRecords);
  const images = s.kind==='pdf' ? s.pages : [s.thumb];
  const merged = [];
  const allNames = [];
  let unnamedPages = 0;
  for(let pi=0; pi<images.length; pi++){
    const result = await ocrExtractAttendance(images[pi]);
    (result.names||[]).forEach(n=>{ if(!allNames.includes(n)) allNames.push(n); });
    if(result.records.some(r=>!r.name)) unnamedPages++;
    merged.push(...result.records.map(r=>({...r, page: pi+1})));
  }
  // 이름 칸으로 한꺼번에 덮어쓰는 것은 "직원 한 명 + 모든 페이지에서 그 이름이 읽힌" 파일만.
  // 여러 명이거나 이름 못 읽은 페이지가 있으면 사람마다 읽힌 이름을 그대로 쓰고, 이름 없는 기록은 따로 알린다.
  s.detectedNames = allNames.map(matchRosterName);
  s.unnamedPages = unnamedPages;
  s.singlePerson = allNames.length===1 && unnamedPages===0;
  if(s.singlePerson && !s.manualName) s.manualName = matchRosterName(allNames[0]);
  if(!s.singlePerson && allNames.length) s.manualName = '';
  if(unnamedPages && allNames.length) toast(`${s.file.name}: ${unnamedPages}쪽에서 직원명을 읽지 못해 그 쪽 기록은 넣지 않았습니다. 이름이 보이게 다시 찍거나 쪽을 나눠 올려주세요.`, {error:true});
  s._ocrRaw = merged;
  s._ocrRecords = fitToPeriod(merged); // 대상 월 기준, 이름은 아직 확정 전
  const withNames = applyManualNameOverride(s, s._ocrRecords);
  if(withNames.length===0 && s._ocrRecords.length>0){
    toast(s.file.name+': 직원명을 인식하지 못했습니다. 카드에 직접 입력한 뒤 재시도해주세요.', {error:true});
  }
  return withNames;
}
function applyManualNameOverride(s, rawRecords){
  // 직접 입력한 이름은 "한 사람짜리 파일"이거나 이름을 하나도 못 읽은 파일에만 쓴다
  const usable = s.singlePerson || (s.detectedNames||[]).length===0;
  const finalName = usable && s.manualName && s.manualName.trim() ? s.manualName.trim() : null;
  return rawRecords.map(r=>({...r, name: matchRosterName(finalName || r.name)})).filter(r=>r.name);
}

async function analyzeSource(s){
  s.status='run'; s.error=null; render();
  try{
    let records = [];
    if(s.kind==='excel'){
      const buf = await s.file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:false});
      const known = knownForPeriod(wb);
      if(known){
        records = known; s.method='direct';
      } else {
        s.method='ai';
        const ws = wb.Sheets[wb.SheetNames[0]];
        let rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
        rows = rows.filter(r=>r.some(c=>String(c).trim()!=='')).slice(0,150);
        const text = `다음은 근태표 엑셀에서 추출한 표 데이터(2차원 배열, JSON)이다:\n${JSON.stringify(rows)}\n이 표에 나오는 모든 직원의 날짜별 출근여부를 판정해줘.`;
        const raw = await callClaude([{type:'text', text}]);
        const parsed = parseAiJson(raw);
        (parsed.employees||[]).forEach(emp=>{
          (emp.days||[]).forEach(d=>records.push({name:matchRosterName(emp.name), date:d.d, status:d.s}));
        });
        records = fitToPeriod(records);
      }
    } else {
      // Offline OCR path (Tesseract.js) — no network call to Claude, works without
      // the claude.ai artifact environment. Tuned to the "계약직 출근부" style table
      // (PRADA MIU MIU format): Date/Day/From/To/Net/Overtime/Night/Remark/Signature
      // columns with printed dates/times/remark-codes and handwritten signatures
      // (signatures are irrelevant and ignored).
      s.method='ocr';
      records = await ensureOcrRecords(s);
    }
    s.records = records.map(r=>({...r, name: matchRosterName(r.name)}));
    s.status='ok';
  }catch(err){
    s.status='err'; s.error = err.message||String(err);
  }
  render();
}
async function analyzeAll(){
  state.busy=true;
  try{
    for(const s of state.sources){
      if(state.abortCtl && state.abortCtl.signal.aborted) break;
      // 양식이 없어도 근태·시간외를 모두 분석한다 (인보이스 내려받기에서 씀)
      if(s.status!=='ok') await analyzeSource(s);
      if(s.otStatus!=='ok') await analyzeSourceForOvertime(s);
    }
    if(state.target) buildGridFromSources();
    if(state.generic.overtime.target) buildCombinedOvertimeGrid();
  }catch(err){
    toast('분석 중 오류: '+(err.message||err));
    console.error(err);
  }finally{
    state.busy=false;
    render();
  }
}

// Runs the 시간외수당 (overtime) parser against the same uploaded 근태표 file,
// storing results separately (s.otRecords/s.otStatus) so they don't clash with
// the 월근태일괄등록 parse of the same file (s.records/s.status).
// When a source has no pre-computed 연장근무 column (사진/PDF OCR path), overtime
// has to be derived instead from actual worked minutes vs the registered
// 소정근로시간(일) — gated by the 연장/야간 가능성 toggles in 규칙 관리.
function deriveOvertimeFromWorkedMinutes(attRecords){
  return applyOtMap(rawFromWorkedMinutes(attRecords), state.otMap || defaultOtMap(), state.weekendDays);
}
// 사진·PDF 근태표: 소정근로시간을 넘은 시간 = "연장근무", 22시 이후 퇴근 = "야간근무" 칸으로 본다
function rawFromWorkedMinutes(attRecords){
  const raw = [];
  attRecords.forEach(rec=>{
    if(rec.status!=='O' || rec.workedMinutes==null) return;
    const emp = runEmp(rec.name);
    const std = emp.day!=='' && emp.day!=null ? Math.round(parseFloat(emp.day)*60) : null;
    const extra = std!=null && !isNaN(std) ? Math.max(0, rec.workedMinutes - std) : 0;
    let night = 0;
    if(rec.to){ const [th,tm] = rec.to.split(':').map(Number); const toMin = th*60+tm; if(toMin > NIGHT_THRESHOLD_MIN) night = toMin - NIGHT_THRESHOLD_MIN; }
    raw.push({name: rec.name, date: rec.date, cols: {'연장근무': emp.ot ? extra : 0, '야간근무': emp.night ? night : 0}, endNight: emp.night ? night : 0});
  });
  return raw;
}
function deriveOvertimeFromWorkedMinutesOld(attRecords){
  const out = [];
  attRecords.forEach(rec=>{
    if(rec.status!=='O' || rec.workedMinutes==null) return;
    const emp = runEmp(rec.name); // 직원별 소정근로시간(일)·연장/야간 가능 여부
    if(!emp.ot && !emp.night) return;
    const dailyStdMin = emp.day!=='' && emp.day!=null ? Math.round(parseFloat(emp.day)*60) : null;
    const d = new Date(rec.date+'T00:00:00Z');
    const weekday = d.getUTCDay();
    const isHoliday = state.weekendDays.includes(weekday) || isKoreanHoliday(rec.date);
    if(emp.ot && dailyStdMin!=null && !isNaN(dailyStdMin)){
      const extra = rec.workedMinutes - dailyStdMin;
      if(extra > 0) out.push({name:rec.name, date:rec.date, category: isHoliday?'휴일연장':'평일연장', minutes:extra});
    }
    if(emp.night && rec.to){
      const [th,tm] = rec.to.split(':').map(Number);
      const toMin = th*60+tm;
      if(toMin > NIGHT_THRESHOLD_MIN){
        out.push({name:rec.name, date:rec.date, category: isHoliday?'휴일심야':'평일심야', minutes: toMin-NIGHT_THRESHOLD_MIN});
      }
    }
  });
  return out;
}

async function analyzeSourceForOvertime(s){
  s.otStatus = 'run'; s.otError = null; render();
  try{
    if(s.kind==='excel'){
      const buf = await s.file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:false});
      s.otRaw = otRawForPeriod(wb) || [];
      s.otRecords = applyOtMap(s.otRaw, state.otMap || defaultOtMap(), state.weekendDays).map(r=>({...r, name: matchRosterName(r.name)}));
    } else {
      // shares the cached OCR pass with 월근태 (s._ocrRecords) rather than
      // re-running OCR a second time -- works even if only the 시간외수당
      // target was uploaded and the 월근태 pass never ran
      const attRecords = await ensureOcrRecords(s);
      s.otRaw = rawFromWorkedMinutes(attRecords);
      s.otRecords = applyOtMap(s.otRaw, state.otMap || defaultOtMap(), state.weekendDays);
    }
    s.otStatus = 'ok';
  }catch(err){
    s.otRecords = [];
    s.otError = err.message || String(err);
    s.otStatus = 'err';
  }
  render();
}

// Mirrors buildOvertimeGrid(), but reads from the shared state.sources/state.roster
// (combined-menu context) instead of the standalone 시간외수당 menu's own slot.
function buildCombinedOvertimeGrid(){
  const g = state.generic.overtime;
  const t = g.target;
  if(!t) return;
  const ws = t.wb.Sheets[t.sheetName];
  const blocks = scanOvertimeEmployees(t, ws);
  Object.values(state.roster).forEach(r=>ensureOvertimeBlock(t, ws, blocks, r.displayName));

  t.employees = [];
  Object.values(blocks).forEach(b=>Object.values(b.rows).forEach(R=>t.employees.push({row:R, name:b.name, site:'', hire:null, term:null})));

  g.grid = {};
  state.sources.forEach(s=>(s.otRecords||[]).forEach(rec=>{
    const key = normName(rec.name);
    const block = blocks[key];
    if(!block) return;
    const emp = runEmp(rec.name);
    if(/연장/.test(rec.category) && !emp.ot) return;   // 이 직원은 연장 불가로 설정됨
    if(/심야/.test(rec.category) && !emp.night) return; // 이 직원은 야간 불가로 설정됨
    const day = +rec.date.slice(8,10);
    if(!g.grid[block.name]) g.grid[block.name] = {};
    if(!g.grid[block.name][rec.category]) g.grid[block.name][rec.category] = {};
    g.grid[block.name][rec.category][day] = (g.grid[block.name][rec.category][day]||0) + rec.minutes;
  }));
  g._blocks = blocks;
}

// If a name found in a 근태표 has no existing row in the target sheet, create one —
// appended right after the last known employee row — so roster info and attendance
// can still be written for them, instead of only working for names ERP had already
// pre-populated a row for.
function ensureEmployeeRow(t, ws, name, site){
  if(t.nameCol==null) return null;
  const norm = normName(name);
  let existing = t.employees.find(e => normName(e.name)===norm);
  if(existing) return existing;

  const lastRow = t.employees.length ? Math.max(...t.employees.map(e=>e.row)) : t.labelRow;
  const newRow = lastRow + 1;

  // best-effort: copy each column's style from the previous row so the new row
  // isn't bare, when there is a previous employee row to copy from
  if(t.employees.length){
    for(let C=t.range.s.c; C<=t.range.e.c; C++){
      const srcAddr = XLSX.utils.encode_cell({r:lastRow, c:C});
      const dstAddr = XLSX.utils.encode_cell({r:newRow, c:C});
      const src = ws[srcAddr];
      if(src && src.s!=null && !ws[dstAddr]) ws[dstAddr] = {t:'z', s:src.s};
    }
  }

  if(newRow > t.range.e.r){ t.range.e.r = newRow; ws['!ref'] = XLSX.utils.encode_range(t.range); }

  const nameAddr = XLSX.utils.encode_cell({r:newRow, c:t.nameCol});
  const nameCell = ws[nameAddr];
  if(nameCell){ nameCell.v = name; nameCell.t = 's'; } else { ws[nameAddr] = {t:'s', v:name}; }

  const emp = {row:newRow, name, site: site||'', empId:null, hire:null, term:null};
  t.employees.push(emp);
  return emp;
}

function buildGridFromSources(){
  state.grid = {};
  const t = state.target;
  const ws = t.wb.Sheets[t.sheetName];

  // Only auto-create a target row for a name if they show real attendance
  // (at least one actual 출근) somewhere in the source. A name that only ever
  // appears with 휴무/"-"/blank (e.g. someone whose block exists in the 근태표
  // template but who hadn't actually started yet) shouldn't get pulled into
  // the output at all.
  const namesWithWork = new Set();
  const templateNames = new Set(t.employees.map(e=>normName(e.name)));
  state.sources.forEach(s=>(s.records||[]).forEach(rec=>{
    if(rec.name && rec.status==='O') namesWithWork.add(normName(rec.name));
  }));
  state.sources.forEach(s=>{
    s.records.forEach(rec=>{
      if(!rec.name) return;
      if(!namesWithWork.has(normName(rec.name))) return;
      ensureEmployeeRow(t, ws, rec.name.trim(), s.site);
    });
  });

  const empIndex = new Map(); // normalized name -> [{site,name}] for matching
  t.employees.forEach(e=>{
    const key = normName(e.name);
    if(!empIndex.has(key)) empIndex.set(key, []);
    empIndex.get(key).push(e);
  });
  state.sources.forEach(s=>{
    s.records.forEach(rec=>{
      if(!rec.name || !rec.date) return;
      // 양식에 이미 있는 직원은 출근이 없어도(전부 휴무 등) 그대로 반영한다
      if(!namesWithWork.has(normName(rec.name)) && !templateNames.has(normName(rec.name))) return;
      const candidates = empIndex.get(normName(rec.name)) || [];
      let target = candidates.find(e=>e.site===s.site) || candidates[0];
      if(!target){
        const key = 'UNMATCHED_'+uid();
        state.grid[key] = {unmatched: `${s.site||'(현장 미지정)'} / ${rec.name} / ${rec.date} — 양식에 해당 직원 없음`};
        return;
      }
      const key = `${target.site}||${target.name}||${rec.date}`;
      state.grid[key] = {status: rec.status};
    });
  });

  // Manual per-employee, per-date overrides (결근/휴무/출근/지각/외출/파업/생휴/육아기/
  // 돌봄단축/난휴/유휴) always win over whatever the automatic classification found —
  // this is exactly for cases like "-" normally meaning 휴무 but this particular day
  // should read 결근 instead.
  state.dateOverrides.forEach(ov=>{
    if(!ov.name || !ov.date || !ov.status) return;
    const key = normName(ov.name);
    const candidates = empIndex.get(key) || [];
    let target = candidates[0];
    if(!target){ target = ensureEmployeeRow(t, ws, ov.name.trim(), ''); if(target) empIndex.set(key, [target]); }
    if(!target) return;
    state.grid[`${target.site}||${target.name}||${ov.date}`] = {status: ov.status};
  });

  // 검토 화면에서 직접 바꾼 칸이 가장 우선한다
  Object.entries(state.manualCells||{}).forEach(([key,val])=>{
    if(val==='__blank') delete state.grid[key]; else state.grid[key] = {status:val};
  });
}

/* ---------------- Fill & download ---------------- */
function makeWriteCell(ws){
  return function writeCell(addr, val){
    const existing = ws[addr];
    if(existing){
      // merge into the existing cell object so any pre-applied style (.s), like a
      // highlighted background, survives — replacing the object wholesale would drop it.
      existing.v = val; existing.t = 's';
      delete existing.f; delete existing.w;
    } else {
      ws[addr] = {t:'s', v:val};
    }
  };
}

// Employee master-data columns (거래처코드/거래처/현장코드/현장/사번/직무/급여구분/
// 그룹입사일/입사일/퇴사일 등) — filled from the uploaded 근무자 정보(roster), matched
// by name (VLOOKUP-style against the roster's 성명 column), shaped by any
// user-registered 열별 입력 규칙 (규칙 관리 탭: 형식 검증 / 다른 열 복사 / 고정값).
// Only touches cells that are currently blank; never overwrites existing data.
function resolveFieldValue(label, rosterEntry, resolved, rules){
  const rule = rules.find(r=>r.label===label);
  if(rule && rule.type==='fixed') return rule.value;
  if(rule && rule.type==='copy') return resolved[rule.fromLabel] != null ? resolved[rule.fromLabel] : null;

  let val = rosterEntry ? findRosterValue(rosterEntry.fields, label) : null;
  if(rule && rule.type==='format'){
    const ok = rule.formatType==='date' ? /^\d{4}-\d{2}-\d{2}/.test(String(val||'').trim())
             : rule.formatType==='number' ? /^-?\d+(\.\d+)?$/.test(String(val||'').trim())
             : true;
    if(!ok) val = null;
  }
  return val;
}

function fillEmployeeInfo(t, ws, writeCell, report, rules, empOverride){
  rules = rules || state.fieldRules;
  const dateColSet = new Set(t.dateCols.map(d=>d.col));
  const allLabels = Object.keys(t.labelTexts || {}).filter(l=>{
    const col = t.labelTexts[l];
    return col!==t.nameCol && !dateColSet.has(col);
  });
  // copy-type rules must resolve after their source label, so process those last
  const ordered = [...allLabels].sort((a,b)=>{
    const ra = rules.find(r=>r.label===a), rb = rules.find(r=>r.label===b);
    return (ra&&ra.type==='copy'?1:0) - (rb&&rb.type==='copy'?1:0);
  });

  t.employees.forEach(e=>{
    const rosterEntry = state.roster[normName(e.name)];
    const resolved = {};
    ordered.forEach(label=>{
      const col = t.labelTexts[label];
      const addr = XLSX.utils.encode_cell({r:e.row, c:col});
      const existing = ws[addr];
      const oldVal = existing ? existing.v : null;
      const ov = empOverride ? empOverride(e.name, label) : null;
      const newVal = ov ? ov.value : resolveFieldValue(label, rosterEntry, resolved, rules);
      resolved[label] = newVal;
      // 이미 값이 있는 칸은 건드리지 않는다. 단, 직원별로 따로 바꾼 값(force)은 덮어쓴다.
      if(oldVal!=null && String(oldVal).trim()!=='' && !(ov && ov.force)) return;
      if(newVal==null || newVal==='') return; // no real data for this person — leave blank
      if(oldVal!=null && String(oldVal)===String(newVal)) return;

      writeCell(addr, newVal);
      report.filled++;
      report.changes.push([e.site, e.name, label, '', oldVal||'(공란)', newVal]);
    });
  });
}

function writeChangeLog(t, report){
  const oldLog = t.wb.Sheets['변경내역'];
  if(oldLog) delete t.wb.Sheets['변경내역'];
  const logAoa = [['현장','직원명','날짜/항목','요일','기존값','수정값'], ...report.changes];
  const logWs = XLSX.utils.aoa_to_sheet(logAoa);
  t.wb.SheetNames = t.wb.SheetNames.filter(n=>n!=='변경내역');
  t.wb.SheetNames.push('변경내역');
  t.wb.Sheets['변경내역'] = logWs;
}

// 날짜 글자를 원래 모양(구분자·자릿수·요일 괄호) 그대로 새 날짜로 바꾼다
function reformatDateText(orig, iso){
  const [y,m,d] = iso.split('-').map(Number);
  const wd = '일월화수목금토'[new Date(iso+'T00:00:00Z').getUTCDay()];
  const pad = (n, like) => like.length>=2 ? String(n).padStart(2,'0') : String(n);
  const fixWd = rest => rest.replace(/[월화수목금토일](?=\s*(요일)?\s*\)?\s*$)/, wd);
  let mm = /^(\d{4})(\s*[.\-\/년]\s*)(\d{1,2})(\s*[.\-\/월]\s*)(\d{1,2})(.*)$/.exec(orig);
  if(mm) return `${y}${mm[2]}${pad(m,mm[3])}${mm[4]}${pad(d,mm[5])}${fixWd(mm[6])}`;
  mm = /^(\d{1,2})(\s*[\/.\-월]\s*)(\d{1,2})(.*)$/.exec(orig);
  if(mm) return `${pad(m,mm[1])}${mm[2]}${pad(d,mm[3])}${fixWd(mm[4])}`;
  return iso;
}
function isoToSerialNum(iso){ const [y,m,d]=iso.split('-').map(Number); return Math.round((Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000); }
// 지난달 양식이면 머리글 날짜·요일·제목의 연월을 대상 월로 바꾼다
function retargetTemplateHeader(t, ws, report){
  const sh = t.monthShift; if(!sh) return;
  const [fy, fm] = sh.from.split('-').map(Number), [ty, tm] = sh.to.split('-').map(Number);
  const log = (addr, oldV, newV) => report.changes.push(['(양식)', addr, '머리글', '', String(oldV), String(newV)]);
  const setDate = (addr, iso) => {
    const c = ws[addr]; if(!c) return;
    const oldShown = c.w || c.v;
    if(c.t==='n'){ c.v = isoToSerialNum(iso); delete c.w; delete c.f; }
    else { c.v = reformatDateText(cellText(c), iso); c.t = 's'; delete c.w; delete c.f; }
    log(addr, oldShown, c.t==='n' ? iso : c.v);
  };
  t.dateCols.forEach(d=>{
    if(!d.origDate) return;
    setDate(XLSX.utils.encode_cell({r:t.headerRow, c:d.col}), d.date);
    if(d.hasWeekdayCell){
      const wa = XLSX.utils.encode_cell({r:t.weekdayRow, c:d.col}), wc = ws[wa];
      if(wc){ const old = cellText(wc); const nv = d.weekday + old.slice(1); if(nv!==old){ wc.v = nv; wc.t='s'; delete wc.w; delete wc.f; } }
    }
  });
  // 대상 월에 없는 날(예: 31일) 칸은 머리글·요일을 비운다
  (t.extraCols||[]).forEach(d=>{
    [t.headerRow, t.weekdayRow].forEach(r=>{
      const a = XLSX.utils.encode_cell({r, c:d.col}), c = ws[a];
      if(c && c.v!=null && c.v!==''){ log(a, c.w||c.v, '(빈칸)'); c.t='s'; c.v=''; delete c.w; delete c.f; }
    });
  });
  // 머리글 위쪽 제목 칸의 "2026년 7월", "2026.07", "2026-07" 같은 연월 표기
  const range = XLSX.utils.decode_range(ws['!ref']);
  for(let R=range.s.r; R<t.headerRow; R++){
    for(let C=range.s.c; C<=range.e.c; C++){
      const a = XLSX.utils.encode_cell({r:R,c:C}), c = ws[a];
      if(!c || c.v==null) continue;
      if(c.t==='s'){
        const old = String(c.v);
        let nv = old.replace(/(\d{4})(\s*년\s*)(\d{1,2})(\s*월)/g, (all,y,s1,m,s2)=> +y===fy && +m===fm ? `${ty}${s1}${m.length>1?String(tm).padStart(2,'0'):tm}${s2}` : all);
        nv = nv.replace(/(\d{4})([.\-\/])(\d{1,2})(?![\d])/g, (all,y,sp,m)=> +y===fy && +m===fm ? `${ty}${sp}${m.length>1?String(tm).padStart(2,'0'):tm}` : all);
        if(nv!==old){ c.v = nv; delete c.w; delete c.h; delete c.r; log(a, old, nv); }
      } else if(c.t==='n' && !c.f){
        const iso = cellToISO(c, null);
        if(iso && iso.startsWith(sh.from)){
          const day = Math.min(+iso.slice(8,10), lastDayOf(sh.to));
          setDate(a, `${sh.to}-${String(day).padStart(2,'0')}`);
        }
      }
    }
  }
}
function fillTarget(){
  const t = state.target;
  const ws = t.wb.Sheets[t.sheetName];
  const report = {filled:0, kept:0, unmatched:[], changes:[]};
  const writeCell = makeWriteCell(ws);
  retargetTemplateHeader(t, ws, report);

  // Step 1: 근무자 정보(로스터) 매칭 — 거래처코드/거래처/현장코드/현장/사번/급여구분/
  // 그룹입사일/입사일/퇴사일 등 인적사항부터 채운다.
  fillEmployeeInfo(t, ws, writeCell, report, state.fieldRules, runEmpFieldOverride);

  // Step 2: 근태표 판단 결과(출근/휴무/커스텀 라벨)를 날짜열에 채운다.
  t.employees.forEach(e=>{
    t.dateCols.forEach(d=>{
      const key = `${e.site}||${e.name}||${d.date}`;
      const g = state.grid[key];
      const addr = XLSX.utils.encode_cell({r:e.row, c:d.col});
      const existing = ws[addr];
      const oldVal = existing ? existing.v : null;
      if(!g){ report.unmatched.push(`${e.site} / ${e.name} / ${d.date}`); return; }
      let newVal;
      if(g.status==='O') newVal = '출근';
      else if(g.status==='X') newVal = '휴무';
      else if(g.status==='?') newVal = '확인필요';
      else newVal = g.status; // custom label passed through as-is (e.g. "무급")
      if(oldVal === newVal){ report.kept++; return; }
      writeCell(addr, newVal);
      report.filled++;
      report.changes.push([e.site, e.name, d.date, d.weekday, oldVal||'(공란)', newVal]);
    });
  });

  writeChangeLog(t, report);
  return report;
}

// Standalone test path: fill ONLY the employee master-data columns (no attendance
// judgment at all), so roster matching can be verified on its own before dealing
// with 근태표 analysis. Unlike the main flow (where rows get created from 근태표
// names during AI 분석), this path has no 근태표 to drive row creation — so it
// creates a row for every 근무자 정보(roster) entry that doesn't already have one.
function fillRosterOnly(){
  const t = state.target;
  const ws = t.wb.Sheets[t.sheetName];
  const report = {filled:0, kept:0, unmatched:[], changes:[]};
  const writeCell = makeWriteCell(ws);
  retargetTemplateHeader(t, ws, report);
  Object.values(state.roster).forEach(r=>{
    ensureEmployeeRow(t, ws, r.displayName, r.fields['현장']||'');
  });
  fillEmployeeInfo(t, ws, writeCell, report, state.fieldRules, runEmpFieldOverride);
  writeChangeLog(t, report);
  return report;
}

function downloadWorkbook(){
  const wbout = XLSX.write(state.target.wb, {bookType:'xlsx', type:'array', cellStyles:true, bookVBA:true});
  saveFile('월근태일괄등록_반영완료.xlsx', new Blob([wbout]));
}

/* =========================================================================
   Generic conversion engine — shared by 변동급여등록 자동 반영 and
   시간외수당 자동 반영. Unlike attendance, these don't have a known fixed
   structure yet, so the target's columns are detected generically and AI
   fills each one directly per employee. Reuses the attendance engine's
   ensureEmployeeRow / fillEmployeeInfo (for identity columns like 사번·현장
   that match the site roster) plus a new value-grid fill for everything else.
   ========================================================================= */
const GENERIC_MENU_TITLES = {variablepay:'변동급여등록 자동 반영', overtime:'시간외수당 자동 반영'};
const GENERIC_DOWNLOAD_NAMES = {variablepay:'변동급여등록_반영완료.xlsx', overtime:'시간외수당일괄등록_반영완료.xlsx'};

function parseGenericTarget(wb){
  const sheetName = wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const ref = ws['!ref'];
  const range = XLSX.utils.decode_range(ref);
  let headerRow=-1, bestCount=-1, labelTexts={};
  for(let R=range.s.r; R<=Math.min(range.e.r, range.s.r+5); R++){
    const labels={};
    for(let C=range.s.c; C<=range.e.c; C++){
      const cell = ws[XLSX.utils.encode_cell({r:R,c:C})];
      if(!cell || cell.v==null) continue;
      const label = String(cell.v).trim();
      if(label!=='' && !(label in labels)) labels[label]=C; // first occurrence wins
    }
    if(Object.keys(labels).length>bestCount){ bestCount=Object.keys(labels).length; headerRow=R; labelTexts=labels; }
  }
  let nameCol=null;
  for(const label in labelTexts){ if(/성\s*명|이\s*름|직원명|사원명/.test(label)){ nameCol=labelTexts[label]; break; } }
  const employees=[];
  if(nameCol!=null){
    for(let R=headerRow+1; R<=range.e.r; R++){
      const nc = ws[XLSX.utils.encode_cell({r:R,c:nameCol})];
      if(nc && nc.v!=null && String(nc.v).trim()!=='') employees.push({row:R, name:String(nc.v).trim(), site:'', hire:null, term:null});
    }
  }
  return {sheetName, headerRow, labelRow:headerRow, nameCol, labelTexts, dateCols:[], employees, range, auto: nameCol!=null};
}

function defaultSiteRules(){
  return {
    combined: {rules:[], fieldRules:[], weekendDays:[0,6], overtimePossible:true, nightPossible:true, offDays:'', otMap: defaultOtMap()}, // shared by 월근태일괄등록 + 시간외수당
    variablepay: {fieldRules:[]},
  };
}
function ensureSiteRules(site){
  if(!site.rules) site.rules = defaultSiteRules();
  if(!site.rules.combined){
    // migrate from the older split attendance/overtime rule sets, if present
    const oldAtt = site.rules.attendance || {rules:[], fieldRules:[]};
    const oldOt = site.rules.overtime || {fieldRules:[], weekendDays:[0,6]};
    site.rules.combined = {
      rules: oldAtt.rules || [],
      fieldRules: (oldAtt.fieldRules && oldAtt.fieldRules.length) ? oldAtt.fieldRules : (oldOt.fieldRules||[]),
      weekendDays: oldOt.weekendDays || [0,6],
      overtimePossible: true, nightPossible: true,
    };
  }
  if(site.rules.combined.overtimePossible==null) site.rules.combined.overtimePossible = true;
  if(site.rules.combined.nightPossible==null) site.rules.combined.nightPossible = true;
  if(site.rules.combined.offDays==null) site.rules.combined.offDays = '';
  if(!site.rules.combined.otMap) site.rules.combined.otMap = defaultOtMap();
  { const h = site.rules.combined.otMap.휴일근무; if(h && !('conv' in h)){ h.conv = 'day'; h.hours = 8; } }
  if(otMapKey(site.rules.combined.otMap)===OT_VP_OLD_KEY()) site.rules.combined.otMap = otVpMap();
  if(!site.rules.variablepay) site.rules.variablepay = {fieldRules:[]};
  return site.rules;
}
// Loads the given site's saved rules into the active working state. With no
// site selected, rule editing is blocked (there's nowhere to remember it).
function syncRulesFromSite(menuKey, siteId){
  const site = state.siteRegistry.find(s=>s.id===siteId);

    state.overtimePossible = r.overtimePossible!==false; state.nightPossible = r.nightPossible!==false;

}
function saveSiteRulesFor(menuKey){
  const siteId = menuKey==='attendance' ? state.selectedSiteId : state.generic[menuKey].siteId;

async function handleImportSettingsFile(file, domEvent){

    payload.siteRegistry.forEach(site=>{ if(!site.id) site.id = uid(); ensureSiteRules(site); });

async function analyzeGenericSource(menuKey, s){

/* =========================================================================
   시간외수당 (overtime) — specialized engine, not the generic AI-matching one.
   Target: 5 rows per employee (평일연장/평일심야/휴일근무/휴일연장/휴일심야),
   day columns M~AQ hold minutes for that category. Source: reuses the same
   근태확인표 block layout as attendance (출근시간/퇴근시간/근무시간/연장근무/
   야간근무 5-column blocks) but pulls 연장근무 and 퇴근시간 instead of status.
   ========================================================================= */
const OT_CATEGORIES = [
  {label:'평일연장', code:'A11-01'},
  {label:'평일심야', code:'A11-04'},
  {label:'휴일근무', code:'A11-02'},
  {label:'휴일연장', code:'A11-03'},
  {label:'휴일심야', code:'A11-05'},
];

function scanOvertimeEmployees(t, ws){
  const blocks = {};
  if(t.nameCol==null) return blocks;
  for(let R=t.labelRow+1; R<=t.range.e.r; R++){
    const nc = ws[XLSX.utils.encode_cell({r:R,c:t.nameCol})];
    if(!nc || nc.v==null || String(nc.v).trim()==='') continue;
    const name = String(nc.v).trim();
    const catCell = t.catCol!=null ? ws[XLSX.utils.encode_cell({r:R,c:t.catCol})] : null;
    const cat = catCell && catCell.v!=null ? String(catCell.v).trim() : null;
    const key = normName(name);
    if(!blocks[key]) blocks[key] = {name, rows:{}};
    if(cat) blocks[key].rows[cat] = R;
  }
  return blocks;
}

function ensureOvertimeBlock(t, ws, blocks, name){
  const key = normName(name);
  if(blocks[key] && OT_CATEGORIES.every(c=>blocks[key].rows[c.label]!=null)) return blocks[key];

  let lastRow = t.labelRow;
  Object.values(blocks).forEach(b=>Object.values(b.rows).forEach(r=>{ if(r>lastRow) lastRow=r; }));

  const entry = blocks[key] || {name, rows:{}};
  OT_CATEGORIES.forEach(cat=>{
    if(entry.rows[cat.label]!=null) return;
    lastRow += 1;
    for(let C=t.range.s.c; C<=t.range.e.c; C++){
      const srcAddr = XLSX.utils.encode_cell({r:lastRow-1, c:C});
      const dstAddr = XLSX.utils.encode_cell({r:lastRow, c:C});
      const src = ws[srcAddr];
      if(src && src.s!=null && !ws[dstAddr]) ws[dstAddr] = {t:'z', s:src.s};
    }
    ws[XLSX.utils.encode_cell({r:lastRow, c:t.nameCol})] = {t:'s', v:name};
    if(t.catCol!=null) ws[XLSX.utils.encode_cell({r:lastRow, c:t.catCol})] = {t:'s', v:cat.label};
    if(t.codeCol!=null) ws[XLSX.utils.encode_cell({r:lastRow, c:t.codeCol})] = {t:'s', v:cat.code};
    entry.rows[cat.label] = lastRow;
  });
  if(t.range.e.r < lastRow){ t.range.e.r = lastRow; ws['!ref'] = XLSX.utils.encode_range(t.range); }
  blocks[key] = entry;
  return entry;
}

// Reuses the exact same 근태확인표 block-detection as tryParseKnownSheet (SSF-based
// date parsing, distinctness-checked name row) but pulls 연장근무(col0+3) and
// 퇴근시간(col0+1) instead of a work/off status.
/* ===== 시간외 항목 규칙 =====
   근태표에서는 직원·날짜별로 칸마다 시간(분)을 그대로 읽어 두고(원자료),
   현장 규칙에 따라 평일연장·평일심야·휴일근무·휴일연장·휴일심야로 나눈다. */
const OT_CATS = ['평일연장','평일심야','휴일근무','휴일연장','휴일심야'];
const OT_SOURCES = [
  {v:'연장근무', l:'연장근무 칸'}, {v:'야간근무', l:'야간근무 칸'}, {v:'휴일근무', l:'휴일근무 칸'},
  {v:'@night', l:'퇴근시간 22시 이후'}, {v:'@custom', l:'칸 이름 직접 입력'}, {v:'', l:'사용 안 함'},
];
const OT_DAYS = [{v:'weekday', l:'평일만'}, {v:'holiday', l:'휴일만'}, {v:'all', l:'모든 날'}];
function defaultOtMap(){ return {
  평일연장:{src:'연장근무', days:'weekday'}, 평일심야:{src:'야간근무', days:'weekday'},
  휴일근무:{src:'휴일근무', days:'all', conv:'day', hours:8}, 휴일연장:{src:'연장근무', days:'holiday'}, 휴일심야:{src:'야간근무', days:'holiday'} }; }
function otVpMap(){ return {
  평일연장:{src:'연장근무', days:'all'}, 평일심야:{src:'야간근무', days:'all'},
  휴일근무:{src:'@sum', col:'미사용휴무개수', days:'all', conv:'day', hours:8}, 휴일연장:{src:'', days:'holiday'}, 휴일심야:{src:'', days:'holiday'} }; }
// 예전 "미사용휴무개수" 설정(토·일 연장을 휴일연장으로 나누던 것)을 새 설정으로 바꿔 준다
const OT_VP_OLD_KEY = ()=>otMapKey({평일연장:{src:'연장근무', days:'weekday'}, 평일심야:{src:'야간근무', days:'weekday'},
  휴일근무:{src:'@sum', col:'미사용휴무개수', days:'all', conv:'day', hours:8}, 휴일연장:{src:'연장근무', days:'holiday'}, 휴일심야:{src:'야간근무', days:'holiday'}});
const OT_PRESETS = [
  {k:'vp', l:'미사용휴무개수 → 휴일근무', d:'밸류포인트(교대 휴무): 토·일도 근무일이라 연장·야간은 모든 날을 평일연장·평일심야로, 휴일근무 = "미사용휴무개수"(일수) × 8시간 × 60분을 매월 1일 칸에 입력', map: otVpMap},
  {k:'default', l:'기본', d:'휴일근무는 근태표의 휴일근무 칸 (근무한 날 × 8시간), 휴일의 연장은 휴일연장', map: defaultOtMap},
  {k:'holAsWork', l:'휴일 연장시간 → 휴일근무', d:'휴일근무 칸이 없는 근태표: 연장근무 칸에 시간이 있는 휴일을 휴일근무로 (근무한 날 × 8시간)', map: ()=>({
    평일연장:{src:'연장근무', days:'weekday'}, 평일심야:{src:'야간근무', days:'weekday'},
    휴일근무:{src:'연장근무', days:'holiday', conv:'day', hours:8}, 휴일연장:{src:'', days:'holiday'}, 휴일심야:{src:'야간근무', days:'holiday'} })},
];
const otLabel = t => String(t==null?'':t).replace(/\s+/g,'');
function otColFor(rec, rule){
  if(!rule || !rule.src) return null;
  if(rule.src==='@sum'){
    const want = otLabel(rule.col); if(!want || !rec.sums) return null;
    const ks = Object.keys(rec.sums); const k = ks.find(x=>x===want) || ks.find(x=>x.includes(want) || want.includes(x));
    return k ? '@sum:'+k : null;
  }
  const keys = Object.keys(rec.cols||{});
  if(rule.src==='@night') return '@night';
  const want = otLabel(rule.src==='@custom' ? rule.col : rule.src);
  if(!want) return null;
  let k = keys.find(x=>x===want) || keys.find(x=>x.includes(want));
  if(!k && rule.src==='야간근무') k = keys.find(x=>/야간|심야/.test(x));
  if(!k && rule.src==='연장근무') k = keys.find(x=>/연장/.test(x) && !/휴일/.test(x));
  if(!k && rule.src==='휴일근무') k = keys.find(x=>/휴일/.test(x) && !/연장|야간|심야/.test(x));
  return k || null;
}
function otValue(rec, rule){
  const k = otColFor(rec, rule);
  if(k==='@night') return rec.endNight||0;
  if(k && k.startsWith('@sum:')) return rec.sums[k.slice(5)]||0;
  if(k==null) return 0;   // 규칙의 칸이 근태표에 없으면 0 (화면에 ⚠ 경고). 퇴근시간으로 계산하려면 "퇴근시간 22시 이후"를 고른다
  return rec.cols[k]||0;
}
function applyOtMap(raw, map, weekendDays){
  map = map || defaultOtMap(); weekendDays = weekendDays || [0,6];
  const out = [];
  (raw||[]).forEach(rec=>{
    const dow = new Date(rec.date+'T00:00:00Z').getUTCDay();
    const hol = weekendDays.includes(dow) || isKoreanHoliday(rec.date);
    OT_CATS.forEach(cat=>{
      const rule = map[cat]; if(!rule || !rule.src) return;
      const perDay = (parseFloat(rule.hours)||8) * 60;
      if(rule.src==='@sum'){
        // 합계 행(일수): 일수 × 8시간 × 60분을 그 달 1일 칸에 한 번에 넣는다
        const v = otValue(rec, rule); if(!(v>0)) return;
        if(rule.conv==='day' && rec.blankDays) return;   // 입사·퇴사로 한 달을 다 채우지 않은 직원은 미사용 휴무를 휴일근무로 보지 않음
        const m = Math.round(rule.conv==='day' ? v * perDay : v);
        if(m>0) out.push({name: rec.name, date: rec.date, category: cat, minutes: m, dayCount: rule.conv==='day' ? v : undefined});
        return;
      }
      if(rule.days==='weekday' && hol) return;
      if(rule.days==='holiday' && !hol) return;
      let m = Math.round(otValue(rec, rule));
      if(m>0 && rule.conv==='day') m = Math.round(perDay);   // 근무한 날 1일 = 8시간 = 480분
      if(m>0) out.push({name: rec.name, date: rec.date, category: cat, minutes: m});
    });
  });
  return out;
}
// 이 규칙이 실제 근태표 칸과 이어지는지 (휴일근무를 근태표 값으로 쓸지 판단)
function otRuleHasData(cat){
  const rule = (state.otMap||defaultOtMap())[cat];
  if(!rule || !rule.src) return false;
  return state.sources.some(s=>(s.otRaw||[]).some(r=>otColFor(r, rule)!=null));
}
function currentOtHeaders(){
  const set = new Set();
  state.sources.forEach(s=>{ if(s.kind!=='excel') return; (s.otRaw||[]).forEach(r=>Object.keys(r.cols||{}).forEach(k=>set.add(k))); });
  return [...set].filter(h=>!/^(출근|퇴근)/.test(h));   // 출근·퇴근 '시각' 칸은 시간 수가 아니므로 제외
}
function currentOtSumLabels(){
  const set = new Set();
  state.sources.forEach(s=>{ if(s.kind!=='excel') return; (s.otRaw||[]).forEach(r=>Object.keys(r.sums||{}).forEach(k=>set.add(k))); });
  return [...set];
}
// 근태표를 분석할 때마다 그 현장 근태표의 칸 이름을 현장 규칙에 저장 (다음 달에도 목록으로 고를 수 있게)
function rememberOtHeaders(){
  const site = selectedSite(); if(!site) return;
  const hs = currentOtHeaders(), ss = currentOtSumLabels(); if(!hs.length && !ss.length) return;
  const c = ensureSiteRules(site).combined;
  const old = c.otHeaders || [], oldS = c.otSumLabels || [];
  const add = hs.filter(h=>!old.includes(h)), addS = ss.filter(h=>!oldS.includes(h));
  if(!add.length && !addS.length) return;
  c.otHeaders = [...old, ...add]; c.otSumLabels = [...oldS, ...addS]; c.otHeadersAt = new Date().toISOString().slice(0,10);
  saveSiteRegistryBg();
}
// 이 현장의 고를 수 있는 칸 목록 (저장된 칸 + 지금 올린 근태표의 칸)
function siteOtHeaders(c){
  const set = new Set(c && c.otHeaders || []);
  if(!state.selectedSiteId || (c && selectedSite() && ensureSiteRules(selectedSite()).combined===c)) currentOtHeaders().forEach(h=>set.add(h));
  return [...set];
}
function siteOtSumLabels(c){
  const set = new Set(c && c.otSumLabels || []);
  currentOtSumLabels().forEach(h=>set.add(h));
  set.add('미사용휴무개수');
  return [...set];
}
// 규칙이 가리키는 칸이 실제로 어느 칸으로 연결되는지 (칸 목록 기준)
function otResolveHeader(rule, headers){
  if(!rule || !rule.src || rule.src==='@night') return null;
  const cols = {}; headers.forEach(h=>cols[h]=0);
  return otColFor({cols}, rule);
}
// 이번 달 근태표에서 찾지 못한 규칙 (엑셀 근태표를 분석했을 때만 판단)
function otMissingRules(map){
  map = map || state.otMap || defaultOtMap();
  const ex = state.sources.filter(s=>s.kind==='excel' && (s.otRaw||[]).length);
  if(!ex.length) return [];
  return OT_CATS.filter(cat=>{
    const r = map[cat];
    if(!r || !r.src || r.src==='@night' || ((r.src==='@custom'||r.src==='@sum') && !r.col)) return false;
    return !ex.some(s=>s.otRaw.some(x=>otColFor(x, r)!=null));
  }).map(cat=>({cat, col: (map[cat].src==='@custom'||map[cat].src==='@sum') ? map[cat].col : map[cat].src, night: map[cat].src==='야간근무'}));
}
function reapplyOtRules(){
  const map = state.otMap || defaultOtMap(), wd = state.weekendDays || [0,6];
  state.sources.forEach(s=>{ if(s.otRaw) s.otRecords = applyOtMap(s.otRaw, map, wd).map(r=>({...r, name: matchRosterName(r.name)})); });
  rememberOtHeaders();
}
// 회사 공통 근태확인표(직원별로 출근시간·퇴근시간… 칸 묶음)에서 원자료를 읽는다
function hitsRowHas(ws, r, range){
  for(let C=range.s.c; C<=range.e.c; C++){ const x = ws[XLSX.utils.encode_cell({r,c:C})]; if(x && x.v!=null && String(x.v).trim()==='출근시간') return true; }
  return false;
}
function tryParseOvertimeRaw(wb, nightThresholdMin, selectedPeriod){
  const raw = []; let matchedAny = false;
  function dateParts(c){
    if(!c || c.t!=='n' || c.v==null) return null;
    const d = XLSX.SSF.parse_date_code(c.v);
    if(!d || !d.y || d.y<1990 || d.y>2100) return null;
    return {y:d.y, m:d.m, d:d.d};
  }
  // unit: 'min' = 숫자가 분 (예: 480.00) / 'hour' = 숫자가 시간 (예: 8, 1.5) / 없으면 시각(h:mm)·하루 분수
  function cellNum(c){
    if(!c || c.v==null || c.v==='') return null;
    const disp = c.w!=null ? String(c.w).trim() : (typeof c.v==='string' ? c.v.trim() : String(c.v));
    if(disp==='' || disp==='-' || /:/.test(disp)) return null;
    const v = c.t==='n' ? c.v : parseFloat(disp.replace(/,/g,''));
    return isFinite(v) && /^-?[\d,]*\.?\d+\s*(분|시간|h)?$/i.test(disp.replace(/\s/g,'')) || c.t==='n' ? v : null;
  }
  function minutesFromCell(c, unit){
    if(!c || c.v==null || c.v==='') return null;
    const disp = c.w!=null ? String(c.w).trim() : (typeof c.v==='string' ? c.v.trim() : String(c.v));
    if(disp==='' || disp==='-') return null;
    const m = disp.match(/^(\d{1,3}):(\d{2})/);
    if(m) return parseInt(m[1],10)*60 + parseInt(m[2],10);
    const v = cellNum(c);
    if(v==null || !(v>0)) return null;
    if(unit==='min') return Math.round(v);
    if(unit==='hour') return Math.round(v*60);
    if(c.t==='n' && v<1) return Math.round(v*1440);     // 엑셀 시간값(하루의 분수)
    return null;
  }
  for(const sheetName of wb.SheetNames){
    const ws = wb.Sheets[sheetName];
    const ref = ws['!ref']; if(!ref) continue;
    const range = XLSX.utils.decode_range(ref);
    for(let R=range.s.r; R<=range.e.r; R++){
      const hits=[];
      for(let C=range.s.c; C<=range.e.c; C++){
        const cell = ws[XLSX.utils.encode_cell({r:R,c:C})];
        if(cell && cell.v!=null && String(cell.v).trim()==='출근시간'){
          const c2 = ws[XLSX.utils.encode_cell({r:R,c:C+1})];
          if(c2 && c2.v!=null && String(c2.v).trim()==='퇴근시간') hits.push(C);
        }
      }
      if(hits.length<1) continue;
      let nameRow=-1;
      for(let nr=R-1; nr>=Math.max(range.s.r,R-6); nr--){
        const vals = hits.map(c0=>{ const c=ws[XLSX.utils.encode_cell({r:nr,c:c0})]; return c?c.v:null; });
        const plausible = vals.filter(isPlausibleName);
        const distinct = new Set(plausible.map(v=>v.trim()));
        const distinctOk = hits.length>1 ? distinct.size>=2 : distinct.size>=1;
        if(plausible.length >= hits.length*0.5 && distinctOk){ nameRow=nr; break; }
      }
      if(nameRow<0) continue;
      let dateCol=-1, dateColHits=0;
      for(let C=Math.max(range.s.c, hits[0]-4); C<hits[0]; C++){
        let hitcount=0;
        for(let dr=R+1; dr<=Math.min(range.e.r,R+35); dr++) if(dateParts(ws[XLSX.utils.encode_cell({r:dr,c:C})])) hitcount++;
        if(hitcount>dateColHits){ dateColHits=hitcount; dateCol=C; }
      }
      if(dateCol<0 || dateColHits<5) continue;
      const employees = hits.map((c0,hi)=>{
        const nameCell = ws[XLSX.utils.encode_cell({r:nameRow,c:c0})];
        if(!isPlausibleName(nameCell&&nameCell.v)) return null;
        const end = hi+1<hits.length ? hits[hi+1] : Math.min(range.e.c+1, c0+10);
        const cols = [];
        for(let C=c0+2; C<end; C++){
          const h = ws[XLSX.utils.encode_cell({r:R,c:C})]; const t = h && h.v!=null ? otLabel(h.v) : '';
          if(t) cols.push({c:C, label:t});
        }
        const nightCols = cols.filter(x=>/야간|심야/.test(x.label));
        let nightEmpty = true;
        nightCols.forEach(nc=>{ for(let dr=R+1; dr<=Math.min(range.e.r,R+40); dr++){ const c=ws[XLSX.utils.encode_cell({r:dr,c:nc.c})]; if(c && c.v!=null && String(c.v).trim()!=='' && String(c.v).trim()!=='-'){ nightEmpty=false; return; } } });
        // 입사 전·퇴사 후처럼 출근·퇴근 칸이 모두 빈 날 (한 달을 다 채우지 않은 직원 판단용)
        let blankDays = 0;
        for(let dr=R+1; dr<=Math.min(range.e.r,R+40); dr++){
          if(!dateParts(ws[XLSX.utils.encode_cell({r:dr,c:dateCol})])) continue;
          const a = ws[XLSX.utils.encode_cell({r:dr,c:c0})], b = ws[XLSX.utils.encode_cell({r:dr,c:c0+1})];
          const empty = x => !x || x.v==null || String(x.v).trim()==='';
          if(empty(a) && empty(b)) blankDays++;
        }
        return {name:String(nameCell.v).trim(), col0:c0, cols, nightEmpty, blankDays};
      }).filter(Boolean);
      if(!employees.length) continue;
      // 숫자로 적힌 칸의 단위를 칸 이름별로 판단 (모든 직원 값을 함께 봄): 24 넘는 값이 있으면 분, 아니면 시간
      const unitOf = {};
      { const byLabel = {};
        employees.forEach(emp=>emp.cols.forEach(cc=>{
          const L = byLabel[cc.label] || (byLabel[cc.label] = {max:0, frac:false, hint:''});
          const h = ws[XLSX.utils.encode_cell({r:R,c:cc.c})]; const ht = h&&h.v!=null ? String(h.v) : '';
          if(/\(?분\)?$|\(분\)|min/i.test(ht)) L.hint='min'; else if(/시간\)|\(h\)|\(시\)/i.test(ht)) L.hint='hour';
          for(let dr=R+1; dr<=Math.min(range.e.r,R+40); dr++){
            const c = ws[XLSX.utils.encode_cell({r:dr,c:cc.c})];
            if(!dateParts(ws[XLSX.utils.encode_cell({r:dr,c:dateCol})])) continue;   // 날짜 행만 (합계 행 제외)
            const v = cellNum(c); if(v==null || !(v>0)) continue;
            const isTimeFrac = c && c.t==='n' && v<1 && c.z && /h|m/i.test(String(c.z)) && !/0\.0/.test(String(c.z));
            if(isTimeFrac) continue;
            L.max = Math.max(L.max, v); L.frac = true;
          }
        }));
        Object.entries(byLabel).forEach(([k,L])=>{ unitOf[k] = L.hint || (L.max>24 ? 'min' : L.frac ? 'hour' : ''); });
      }
      let anchorRow=-1, anchorYMD=null;
      for(let dr=R+1; dr<=range.e.r; dr++){
        const parts = dateParts(ws[XLSX.utils.encode_cell({r:dr,c:dateCol})]);
        if(parts){ anchorRow=dr; anchorYMD=parts; break; }
      }
      if(anchorRow<0) continue;
      // 날짜 아래 합계 행 (예: "미사용휴무개수 3.00") — 행 이름과 직원 칸의 숫자를 모아 둔다
      { let lastDate = anchorRow;
        for(let dr=anchorRow; dr<=Math.min(range.e.r, anchorRow+40); dr++) if(dateParts(ws[XLSX.utils.encode_cell({r:dr,c:dateCol})])) lastDate = dr;
        const txt = (r,c)=>{ const x=ws[XLSX.utils.encode_cell({r,c})]; if(!x || x.v==null || x.t==='n') return ''; return otLabel(x.v); };
        const isLabel = t => !!t && t.length>=2 && !/^[\d.:,\-]+$/.test(t);
        for(let dr=lastDate+1; dr<=Math.min(range.e.r, lastDate+20); dr++){
          if(hitsRowHas(ws, dr, range)) break;   // 다음 표가 시작되면 멈춤
          let rowLabel = '';
          for(let C=range.s.c; C<hits[0]; C++){ const t = txt(dr,C); if(isLabel(t)){ rowLabel = t; break; } }
          employees.forEach((emp, ei)=>{
            const end = ei+1<employees.length ? employees[ei+1].col0 : Math.min(range.e.c+1, emp.col0+10);
            const num = (r,c)=>cellNum(ws[XLSX.utils.encode_cell({r,c})]);
            const put = (label, v)=>{ if(label && v!=null){ emp.sums = emp.sums || {}; if(!(label in emp.sums)) emp.sums[label] = v; } };
            let sawLabel = false;
            // 직원 칸 안의 이름표: 바로 오른쪽 숫자, 없으면 바로 아래 숫자 (예: "미사용 휴무 개수" | 3.00 / "휴일근무(h)" 아래 1440)
            for(let C=emp.col0; C<end; C++){
              const t = txt(dr,C); if(!isLabel(t)) continue;
              sawLabel = true;
              const right = C+1<end && !isLabel(txt(dr,C+1)) ? num(dr,C+1) : null;
              put(t, right!=null ? right : num(dr+1,C));
            }
            // 행 이름이 왼쪽에만 있는 양식: 직원 칸의 마지막 숫자
            if(!sawLabel && rowLabel){ let val=null; for(let C=emp.col0; C<end; C++){ const v=num(dr,C); if(v!=null) val=v; } put(rowLabel, val); }
          });
        }
      }
      if(selectedPeriod){ const pm = selectedPeriod.match(/^(\d{4})-(\d{2})$/); if(pm) anchorYMD = {y:+pm[1], m:+pm[2], d:anchorYMD.d}; }
      const anchorMs = Date.UTC(anchorYMD.y, anchorYMD.m-1, anchorYMD.d);
      for(let i=0; i<dateColHits; i++){
        const dr = anchorRow+i;
        const dUtc = new Date(anchorMs + i*86400000);
        const dateStr = `${dUtc.getUTCFullYear()}-${String(dUtc.getUTCMonth()+1).padStart(2,'0')}-${String(dUtc.getUTCDate()).padStart(2,'0')}`;
        employees.forEach(emp=>{
          const rec = {name: emp.name, date: dateStr, cols:{}, endNight:0, nightEmpty: emp.nightEmpty};
          if(i===0 && emp.sums) rec.sums = emp.sums;   // 합계 행 값은 그 달 1일 기록에 붙인다
          if(i===0 && emp.blankDays) rec.blankDays = emp.blankDays;
          emp.cols.forEach(cc=>{ const m = minutesFromCell(ws[XLSX.utils.encode_cell({r:dr,c:cc.c})], unitOf[cc.label]); if(m!=null && m>0) rec.cols[cc.label] = (rec.cols[cc.label]||0) + m; });
          const endMin = minutesFromCell(ws[XLSX.utils.encode_cell({r:dr,c:emp.col0+1})]);
          const startMin = minutesFromCell(ws[XLSX.utils.encode_cell({r:dr,c:emp.col0})]);
          if(endMin!=null && endMin > nightThresholdMin) rec.endNight = endMin - nightThresholdMin;
          // 야간 칸 점검: 22:00 전에 끝난 날(밤샘 아님)이거나 8시간(22~06시)을 넘는 값은 근태표 수식 오류로 보고 0으로
          Object.keys(rec.cols).forEach(k=>{
            if(!/야간|심야/.test(k) || !(rec.cols[k]>0)) return;
            const sameDayEarly = endMin!=null && startMin!=null && startMin < endMin && endMin <= nightThresholdMin && endMin >= 360;
            if(sameDayEarly || rec.cols[k] > 480){ (rec.otWarn = rec.otWarn || []).push(`${k} ${Math.round(rec.cols[k])}분 → 0 (퇴근 ${endMin!=null?`${Math.floor(endMin/60)}:${String(endMin%60).padStart(2,'0')}`:'?'})`); rec.cols[k] = 0; }
          });
          // 머리글 이름은 있되 값이 없는 칸도 "있는 칸"으로 기록해 둔다 (규칙이 칸을 찾을 수 있게)
          emp.cols.forEach(cc=>{ if(!(cc.label in rec.cols)) rec.cols[cc.label] = 0; });
          raw.push(rec);
        });
      }
      matchedAny = true;
    }
  }
  return matchedAny ? raw : null;
}
// 예전 함수 이름 유지: 원자료를 읽고 현재 규칙으로 나눈 결과를 돌려준다
function tryParseOvertimeSource(wb, nightThresholdMin, weekendDays, selectedPeriod){
  const raw = tryParseOvertimeRaw(wb, nightThresholdMin, selectedPeriod);
  return raw ? applyOtMap(raw, state.otMap || defaultOtMap(), weekendDays) : null;
}

async function analyzeOvertimeSource(s){
  s.status='run'; s.error=null; render();
  try{
    let records=[];
    if(s.kind==='excel'){
      const buf = await s.file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:false});
      const g = state.generic.overtime;
      const known = tryParseOvertimeSource(wb, g.nightThresholdMin, g.weekendDays);
      if(known){ records = known; s.method='direct'; }
      else{
        s.method='ai';
        toast(s.file.name+': 회사 공통 근태확인표 형식이 아니라 인식하지 못했습니다.');
      }
    } else {
      s.method='unsupported';
      toast(s.file.name+': 시간외수당은 현재 회사 공통 근태확인표(엑셀) 형식만 지원합니다.');
    }
    s.records = records;
    s.status='ok';
  }catch(err){ s.status='err'; s.error = err.message||String(err); }
  render();
}

function buildOvertimeGrid(){
  const g = state.generic.overtime;
  const t = g.target;
  const ws = t.wb.Sheets[t.sheetName];
  const blocks = scanOvertimeEmployees(t, ws);

  // Only create a block for someone who actually matches the site roster
  // (거래처/현장 정보가 있는 사람) — a name that shows up in the 근태표 but isn't
  // in the roster gets dropped entirely, not just left with blank identity
  // columns. Roster-matched people always get a block, even with zero
  // overtime this month, so their row still exists (day columns just stay blank).
  Object.values(state.roster).forEach(r=>ensureOvertimeBlock(t, ws, blocks, r.displayName));

  t.employees = [];
  Object.values(blocks).forEach(b=>Object.values(b.rows).forEach(R=>t.employees.push({row:R, name:b.name, site:'', hire:null, term:null})));

  g.grid = {}; // name -> category -> day -> minutes
  g.sources.forEach(s=>(s.records||[]).forEach(rec=>{
    const key = normName(rec.name);
    const block = blocks[key];
    if(!block) return; // not roster-matched — discard, don't add to the list
    const day = +rec.date.slice(8,10);
    if(!g.grid[block.name]) g.grid[block.name] = {};
    if(!g.grid[block.name][rec.category]) g.grid[block.name][rec.category] = {};
    g.grid[block.name][rec.category][day] = (g.grid[block.name][rec.category][day]||0) + rec.minutes;
  }));
  g._blocks = blocks;
}

function fillOvertimeTarget(){
  const g = state.generic.overtime;
  const t = g.target;
  const ws = t.wb.Sheets[t.sheetName];
  const report = {filled:0, kept:0, unmatched:[], changes:[]};
  const writeCell = makeWriteCell(ws);

  syncRosterFromSite(g.siteId);
  fillEmployeeInfo(t, ws, writeCell, report, g.fieldRules, runEmpFieldOverride);

  const blocks = g._blocks || scanOvertimeEmployees(t, ws);
  Object.values(blocks).forEach(block=>{
    const values = g.grid[block.name] || {};
    OT_CATEGORIES.forEach(cat=>{
      const R = block.rows[cat.label];
      if(R==null) return;
      const dayValues = values[cat.label] || {};
      let total = 0;
      Object.entries(t.dayCols).forEach(([day,col])=>{
        const mins = dayValues[+day];
        if(mins==null) return;
        total += mins;
        const addr = XLSX.utils.encode_cell({r:R, c:col});
        const existing = ws[addr];
        const oldVal = existing ? existing.v : null;
        if(oldVal!=null && String(oldVal).trim()!=='') return; // 연장 미발생(공란)은 그대로 둔다
        writeCell(addr, mins);
        report.filled++;
        report.changes.push([block.name, cat.label, `${day}일`, '', oldVal||'(공란)', mins]);
      });
      if(total>0 && t.totalMinCol!=null){
        const addr = XLSX.utils.encode_cell({r:R, c:t.totalMinCol});
        const existing = ws[addr];
        if(!(existing && existing.v!=null && String(existing.v).trim()!=='')){ writeCell(addr, String(total)); report.filled++; }
      }
      if(total>0 && t.totalHourCol!=null){
        const addr = XLSX.utils.encode_cell({r:R, c:t.totalHourCol});
        const existing = ws[addr];
        if(!(existing && existing.v!=null && String(existing.v).trim()!=='')){
          const h = Math.floor(total/60), m = total%60;
          writeCell(addr, `${h}:${String(m).padStart(2,'0')}`);
          report.filled++;
        }
      }
    });
  });

  writeChangeLog(t, report);
  return report;
}

function fillGenericTarget(menuKey){
  const g = state.generic[menuKey];
  const t = g.target;
  const ws = t.wb.Sheets[t.sheetName];
  const report = {filled:0, kept:0, unmatched:[], changes:[]};
  const writeCell = makeWriteCell(ws);

  syncRosterFromSite(g.siteId);
  fillEmployeeInfo(t, ws, writeCell, report, g.fieldRules); // identity columns (사번/현장/거래처코드 등) from the site roster

  t.employees.forEach(e=>{
    const values = g.grid[e.name] || {};
    Object.keys(t.labelTexts).forEach(label=>{
      const col = t.labelTexts[label];
      if(col===t.nameCol) return;
      const addr = XLSX.utils.encode_cell({r:e.row, c:col});
      const existing = ws[addr];
      const oldVal = existing ? existing.v : null;
      if(oldVal!=null && String(oldVal).trim()!=='') return;
      const newVal = values[label];
      if(newVal==null || newVal==='') return;
      writeCell(addr, newVal);
      report.filled++;
      report.changes.push(['', e.name, label, '', oldVal||'(공란)', newVal]);
    });
  });

  writeChangeLog(t, report);
  return report;
}

function wireUp(){
  document.querySelectorAll('[data-act="set-page"]').forEach(b=>b.addEventListener('click', ()=>{ state.page=b.dataset.v; render(); }));

  const tbMenu = document.querySelectorAll('[data-act="set-menu"]');
  tbMenu.forEach(b=>b.addEventListener('click', ()=>{ state.menu=b.dataset.v; render(); }));

  const dropSiteRoster = document.getElementById('dropSiteRoster');
  if(dropSiteRoster){
    const input = document.getElementById('inputSiteRoster');
    input.addEventListener('change', e=>{ if(e.target.files[0]) handleSiteRosterFile(e.target.files[0]); });
    ['dragover','dragleave','drop'].forEach(evt=>dropSiteRoster.addEventListener(evt, e=>{
      e.preventDefault();
      if(evt==='dragover') dropSiteRoster.classList.add('drag');
      if(evt==='dragleave') dropSiteRoster.classList.remove('drag');
      if(evt==='drop'){ dropSiteRoster.classList.remove('drag'); if(e.dataTransfer.files[0]) handleSiteRosterFile(e.dataTransfer.files[0]); }
    }));
  }
  const siteNameInput = document.getElementById('siteNameInput');
  if(siteNameInput && !state.siteRegistryEditingId){
    // 한글 입력(IME) 조합 중에는 화면을 다시 그리지 않는다 — 다시 그리면 조합이 끊겨 "ㅂ ㅐ ㄹ"처럼 낱자로 들어간다.
    const refreshArchiveNotice = ()=>{
      state.siteNameDraft = siteNameInput.value;
      const box = document.getElementById('siteArchiveNotice');
      if(box) box.innerHTML = siteArchiveNoticeHtml(null);
      wireStageArchiveBtn();
    };
    siteNameInput.addEventListener('input', e=>{

/* =========================================================================
   4단계 마법사: ① 현장·월 → ② 파일 올리기 → ③ 확인·수정 → ④ 다운로드
   ========================================================================= */
const WZ_STEPS = [
  {n:1, l:'현장·월 선택', s:'대상 현장과 월'},
  {n:2, l:'파일 올리기', s:'양식·근태표 한 번에'},
  {n:3, l:'확인·수정', s:'직원별 설정·근태 확인'},
  {n:4, l:'다운로드', s:'결과 파일 받기'},
];
const ROLE_LABEL = {att:'월근태 양식', ot:'시간외수당 양식', src:'근태표'};
const ATT_READ_OPTS = {type:'array', cellStyles:true, bookVBA:true, cellDates:false, cellNF:true, sheetStubs:true};
const OT_READ_OPTS = {type:'array', cellStyles:true, bookVBA:true, cellDates:false, cellNF:true, sheetStubs:true};

function defaultPeriod(){
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
if(!state.selectedPeriod) state.selectedPeriod = defaultPeriod();
state.files = state.files || [];
state.manualCells = state.manualCells || {};
state.maxStep = state.maxStep || 1;
state.analyzed = false;
state.reviewTab = state.reviewTab || null;

/* ---------- 기간 맞추기 / 이름 맞추기 ---------- */
// 대상 월에 해당하는 기록만 쓴다. 대상 월 기록이 하나도 없으면(연·월 오인식 등) 일자만 살려 대상 월로 옮긴다.
function fitToPeriod(recs){
  const p = state.selectedPeriod;
  if(!p || !recs || !recs.length) return recs || [];
  const inP = recs.filter(r=>r.date && r.date.startsWith(p));
  if(inP.length) return inP;
  const maxDay = lastDayOf(p);
  return recs.filter(r=>r.date && +r.date.slice(8,10)<=maxDay).map(r=>({...r, date: p + r.date.slice(7)}));
}
function knownForPeriod(wb){
  const raw = tryParseKnownSheet(wb);
  if(!raw) return null;
  const inP = raw.filter(r=>r.date.startsWith(state.selectedPeriod));
  if(inP.length) return inP;
  return tryParseKnownSheet(wb, state.selectedPeriod) || [];
}
function otRawForPeriod(wb){
  const raw = tryParseOvertimeRaw(wb, NIGHT_THRESHOLD_MIN);
  if(!raw) return null;
  const inP = raw.filter(r=>r.date.startsWith(state.selectedPeriod));
  if(inP.length || raw.length===0) return inP;
  return tryParseOvertimeRaw(wb, NIGHT_THRESHOLD_MIN, state.selectedPeriod) || [];
}
function otKnownForPeriod(wb){
  const raw = otRawForPeriod(wb);
  return raw ? applyOtMap(raw, state.otMap || defaultOtMap(), state.weekendDays) : null;
}
function editDistanceLE1(a,b){
  if(a===b) return true;
  if(Math.abs(a.length-b.length)>1) return false;
  let i=0,j=0,diff=0;
  while(i<a.length && j<b.length){
    if(a[i]===b[j]){ i++; j++; continue; }
    if(++diff>1) return false;
    if(a.length>b.length) i++; else if(b.length>a.length) j++; else { i++; j++; }
  }
  return diff + (a.length-i) + (b.length-j) <= 1;
}
// AI가 읽은 이름이 사원명부와 한 글자 정도 다르면 사원명부 이름으로 맞춘다
function matchRosterName(name){
  if(!name) return name;
  const n = normName(name);
  const roster = Object.values(state.roster||{});
  if(state.roster[n]) return state.roster[n].displayName;
  if(n.length<2) return name;
  // 같은 길이에서 한 글자만 다른 경우(오인식)만 사원명부 이름으로 맞춘다. 후보가 둘 이상이면 맞추지 않는다.
  const hits = roster.filter(r=>{ const k=normName(r.displayName); return k.length===n.length && editDistanceLE1(k,n); });
  return hits.length===1 ? hits[0].displayName : name;
}

/* ---------- 파일 받기·자동 구분 ---------- */
function sheetHasText(wb, re){
  const ws = wb.Sheets[wb.SheetNames[0]];
  if(!ws || !ws['!ref']) return false;
  const range = XLSX.utils.decode_range(ws['!ref']);
  for(let R=range.s.r; R<=Math.min(range.e.r, range.s.r+40); R++)
    for(let C=range.s.c; C<=range.e.c; C++)
      if(re.test(cellText(ws[XLSX.utils.encode_cell({r:R,c:C})]))) return true;
  return false;
}
function classifyExcel(buf){
  let wb;
  try{ wb = XLSX.read(buf, {type:'array', cellDates:false, cellNF:true}); }catch(_){ return 'src'; }
  try{ if(tryParseKnownSheet(wb)) return 'src'; }catch(_){}
  try{
    const ot = parseOvertimeTarget(wb);
    if(ot.catCol!=null || ot.codeCol!=null || sheetHasText(wb, /^(평일|휴일)\s*(연장|심야)$/)) return 'ot';
  }catch(_){}
  try{
    const at = parseTarget(wb, state.selectedPeriod);
    if(at.dateCols.length>=5 && at.nameCol!=null){
      const ws = wb.Sheets[at.sheetName];
      let filled=0, total=0;
      at.employees.forEach(e=>at.dateCols.forEach(d=>{
        total++;
        const c = ws[XLSX.utils.encode_cell({r:e.row,c:d.col})];
        if(c && c.v!=null && String(c.v).trim()!=='') filled++;
      }));
      if(total===0 || filled/total < 0.3) return 'att';
    }
  }catch(_){}
  return 'src';
}
function normalizeAttTarget(t){
  t.employees.forEach(e=>{ if(!e.site) e.site = '현장'; });
  return t;
}
function loadAttTarget(entry){
  const wb = XLSX.read(entry.buf, ATT_READ_OPTS);
  const parsed = parseTarget(wb, state.selectedPeriod);
  if(parsed.error) throw new Error(parsed.error);
  if(parsed.dateCols.length<5) throw new Error(`날짜 열을 찾지 못했습니다. 머리글(위쪽 10행 안)에 날짜(예: 2026-09-01, 2026.09.01) 또는 1~31 일자가 있는지 확인해주세요. 대상 월: ${state.selectedPeriod}`);
  if(parsed.nameCol==null) throw new Error('"성명" 열을 찾지 못했습니다. 날짜 머리글 근처 행에 "성명" 칸이 있어야 합니다.');
  return normalizeAttTarget({file:entry.file, fileId:entry.id, wb, ...parsed, arrayBuffer:entry.buf});
}
function loadOtTarget(entry){
  const wb = XLSX.read(entry.buf, OT_READ_OPTS);
  if(!wb.Sheets[wb.SheetNames[0]] || !wb.Sheets[wb.SheetNames[0]]['!ref']) throw new Error('첫 번째 시트가 비어 있습니다.');
  const parsed = parseOvertimeTarget(wb);
  if(!parsed.nameFound) throw new Error('"성명" 열을 찾지 못했습니다.');
  if(parsed.dayCount<20) throw new Error(`일자 열을 ${parsed.dayCount}개만 찾았습니다. 머리글에 1~31 일자가 있는지 확인해주세요.`);
  const t = {file:entry.file, fileId:entry.id, wb, ...parsed, arrayBuffer:entry.buf};
  const blocks = scanOvertimeEmployees(t, wb.Sheets[parsed.sheetName]);
  t.employees = Object.values(blocks).map(b=>({row:Object.values(b.rows)[0], name:b.name}));
  return t;
}
async function makeSource(entry){
  const s = {id:entry.id, file:entry.file, kind:fileKind(entry.file), site: state.sites[0]||'', thumb:null, status:'wait', error:null, records:[], method:null};
  if(s.kind==='image'){
    const raw = await readAsDataURL(entry.file);
    try{ s.thumb = (await compressImageDataUrl(raw)).dataUrl; }catch(_){ s.thumb = raw; }
  } else if(s.kind==='pdf'){
    const imgs = await withTimeout(pdfToImages(entry.file), 90000, 'PDF를 이미지로 바꾸지 못했습니다 (90초 초과).');
    s.pages = imgs; s.thumb = imgs[0];
  }
  return s;
}
function unbindEntry(entry){
  if(state.target && state.target.fileId===entry.id){ state.target=null; state.sites=[]; }
  const o = state.generic.overtime;
  if(o.target && o.target.fileId===entry.id){ o.target=null; o.grid={}; o._blocks=undefined; }
  state.sources = state.sources.filter(s=>s.id!==entry.id);
}
function removeEntry(entry){ unbindEntry(entry); state.files = state.files.filter(f=>f!==entry); }
async function applyRole(entry){
  entry.error = null; entry.note = '';
  unbindEntry(entry);
  if(entry.role==='att'){
    const t = loadAttTarget(entry);
    const prev = state.files.find(f=>f!==entry && f.role==='att');
    if(prev){ removeEntry(prev); toast(`월근태 양식은 하나만 쓸 수 있어 "${prev.file.name}"을(를) 뺐습니다.`); }
    state.target = t;
    state.sites = [...new Set(t.employees.map(e=>e.site).filter(Boolean))];
    if(!state.sites.length) state.sites = ['현장'];
    state.sources.forEach(s=>{ if(!state.sites.includes(s.site)) s.site = state.sites[0]; });
    entry.note = `직원 ${t.employees.length}명 · ${t.dateCols.length}일 (${t.dateCols[0].date.slice(5)} ~ ${t.dateCols[t.dateCols.length-1].date.slice(5)})${t.dateMode==='day'?' · 일자 머리글':''}`
      + (t.monthShift ? ` · 양식 날짜 ${+t.monthShift.from.slice(5)}월 → ${+t.monthShift.to.slice(5)}월로 바꿔서 씀${t.monthShift.missingDays.length?` (${t.monthShift.missingDays.join('·')}일 칸 없음)`:''}` : '');
  } else if(entry.role==='ot'){
    const t = loadOtTarget(entry);
    const prev = state.files.find(f=>f!==entry && f.role==='ot');
    if(prev){ removeEntry(prev); toast(`시간외수당 양식은 하나만 쓸 수 있어 "${prev.file.name}"을(를) 뺐습니다.`); }
    state.generic.overtime.target = t;
    entry.note = `직원 ${t.employees.length}명 · 일자 ${t.dayCount}개`;
  } else {
    const s = await makeSource(entry);
    state.sources.push(s);
    entry.note = s.kind==='excel' ? '엑셀 근태표' : (s.kind==='pdf' ? `PDF ${s.pages.length}쪽` : '사진');
  }
}
async function intakeFiles(list){
  const files = Array.from(list||[]);
  if(!files.length) return;
  markNeedsAnalysis();
  for(const file of files){
    const entry = {id:uid(), file, role:null, error:null, note:'', busy:true};
    state.files.push(entry);
    render();
    try{
      entry.buf = await file.arrayBuffer();
      entry.role = fileKind(file)==='excel' ? classifyExcel(entry.buf) : 'src';
      await applyRole(entry);
    }catch(err){
      entry.error = err.message || String(err);
      if(!entry.role) entry.role = 'src';
    }
    entry.busy = false;
    render();
  }
  autoStartAnalysis();
}
async function changeRole(entry, role){
  markNeedsAnalysis();
  entry.role = role; entry.busy = true; render();
  try{ await applyRole(entry); }catch(err){ entry.error = err.message || String(err); }
  entry.busy = false; render();
  autoStartAnalysis();
}
function markNeedsAnalysis(){
  state.analyzed = false;
  state.maxStep = Math.min(state.maxStep, 2);
}
// 대상 월이 바뀌면 양식을 다시 읽고 근태표는 다시 분석한다 (사진·PDF는 AI를 다시 부르지 않음)
async function reloadForPeriod(){
  markNeedsAnalysis();
  state.manualCells = {};
  for(const entry of state.files){
    if(entry.role==='att' || entry.role==='ot'){
      try{ await applyRole(entry); }catch(err){ entry.error = err.message||String(err); }
    }
  }
  state.sources.forEach(s=>{
    s.status='wait'; s.otStatus=undefined; s.records=[]; s.otRecords=[];
    if(s._ocrRaw) s._ocrRecords = fitToPeriod(s._ocrRaw);
  });
}

/* ---------- 분석 / 재구성 ---------- */
function rebuildGrids(){
  useRunSettings();
  reconcileRecordNames();
  if(state.target) buildGridFromSources();
  if(state.generic.overtime.target) buildCombinedOvertimeGrid();
}
function recomputeAfterSettings(){
  if(!state.analyzed) return;
  useRunSettings();
  state.sources.forEach(s=>{
    if(s.kind!=='excel' && s._ocrRecords) s.otRaw = rawFromWorkedMinutes(applyManualNameOverride(s, s._ocrRecords));
  });
  reapplyOtRules();
  if(state.generic.overtime.target) buildCombinedOvertimeGrid();
}
function analysisProblems(){
  const errs = state.sources.filter(s=>sourceOverallStatus(s)==='err');
  const zero = state.sources.filter(s=>sourceOverallStatus(s)==='ok' && (s.records||[]).length===0 && (s.otRecords||[]).length===0);
  return {errs, zero};
}
async function startAnalysis(){
  if(state.busy) return;
  useRunSettings();
  state.generic.overtime.siteId = state.selectedSiteId;
  state.abortCtl = new AbortController();
  await analyzeAll();
  const stopped = state.abortCtl.signal.aborted;
  state.abortCtl = null;
  if(stopped){
    state.sources.forEach(s=>{ if(s.status==='run'){ s.status='err'; s.error='분석을 멈췄습니다.'; } if(s.otStatus==='run'){ s.otStatus='err'; s.otError='분석을 멈췄습니다.'; } });
    toast('분석을 멈췄습니다. 다시 시작하려면 "분석 시작"을 눌러주세요.');
    render(); return;
  }
  // 분석 중에 새로 올라온 근태표가 있으면 이어서 분석한다
  if(state.sources.some(s=>s.status==='wait' || s.otStatus==null)){ return startAnalysis(); }
  state.analyzed = true;
  const {errs, zero} = analysisProblems();
  if(!errs.length && !zero.length){ goStep(3); return; }
  toast(errs.length ? `${errs.length}개 파일 분석에 실패했습니다. 표에서 이유를 확인하고 재시도해주세요.` : `${zero.length}개 파일에서 인식된 기록이 없습니다. 직원명·종류를 확인해주세요.`, {error:true});
  render();
}
function stopAnalysis(){ if(state.abortCtl) state.abortCtl.abort(); }
// 근태표를 올리면 바로 분석을 시작한다 (2단계에 있을 때)
function autoStartAnalysis(){
  if(state.step!==2 || state.page!=='convert' || state.menu!=='attendance') return;
  if(state.busy || state.files.some(f=>f.busy)) return;
  if(state.sources.some(s=>s.status==='wait')) startAnalysis();
}
async function retrySource(id){
  const s = state.sources.find(x=>x.id===id); if(!s) return;
  useRunSettings();
  await analyzeSource(s);
  await analyzeSourceForOvertime(s);
  if(state.analyzed) rebuildGrids();
  render();
}
// 다운로드 직전: 원본 양식을 새로 읽어서 채운다 (몇 번을 다시 받아도 결과가 같다)

/* ---------- 단계 이동 ---------- */
function canGo(n){
  if(n<=1) return true;
  if(n===2) return !!state.selectedPeriod;
  return state.analyzed;
}
function goStep(n){
  if(!canGo(n)){ toast(n>=3 ? '먼저 2단계에서 분석을 마쳐주세요.' : '대상 월을 선택해주세요.', {error:true}); return; }
  if(n===3){ try{ rebuildGrids(); }catch(err){ toast('확인 화면을 만드는 중 오류: '+(err.message||err), {error:true}); console.error(err); return; } }
  if(n===4){
    try{ produceOutputs(); }
    catch(err){ toast('양식에 반영하는 중 오류: '+(err.message||err), {error:true}); console.error(err); return; }
  }
  state.step = n;
  state.maxStep = Math.max(state.maxStep, n);
  state.page = 'convert';
  render();
  window.scrollTo(0,0);
  if(n===2) autoStartAnalysis();
}
function restartWizard(){
  state.files = []; state.sources = []; state.target = null; state.sites = [];
  state.grid = {}; state.manualCells = {}; state.fillReport = null; state.dateOverrides = [];
  Object.assign(state.generic.overtime, {target:null, grid:{}, fillReport:null, _blocks:undefined});
  state.analyzed = false; state.maxStep = 1; state.reviewTab = null;
  if(state.run) state.run.emps = {};
  state.runSelected = new Set();
  goStep(1);
}

function fileStatusCell(entry){
  if(entry.busy) return `<span class="status run"><span class="spin"></span>읽는 중</span>`;
  if(entry.error) return `<span class="status err">⚠ 읽기 실패</span><div class="errmsg">${escapeHtml(entry.error)}</div>`;

  const st = sourceOverallStatus(s);
  const counts = `근태 ${(s.records||[]).length}건 · 연장/야간 ${(s.otRecords||[]).length}건`;
  let html = '';
  if(st==='wait') html = state.busy ? `<span class="status wait">순서 대기</span><div class="fmeta">앞 파일 분석이 끝나면 바로 시작합니다.</div>` : `<span class="status wait">분석 전</span><div class="fmeta">아래 "분석 시작"을 눌러주세요.</div>`;
  else if(st==='run') html = `<span class="status run"><span class="spin"></span>분석 중</span>${s.kind!=='excel'?'<div class="fmeta">Claude가 읽는 중 · 한 장에 30초~1분. 허용 창이 떠 있으면 허용해주세요.</div>':''}`;
  else if(st==='ok'){
    const zero = (s.records||[]).length===0 && (s.otRecords||[]).length===0;
    html = zero ? `<span class="status err">⚠ 0건</span><div class="errmsg">${s.kind==='excel' ? '이 파일에서 대상 월 기록을 찾지 못했습니다. 종류가 맞는지 확인해주세요.' : '직원명을 읽지 못했거나 대상 월 기록이 없습니다. 직원명을 입력한 뒤 다시 분석해주세요.'}</div>`
                : `<span class="status ok">✓ ${counts}</span>`;
  } else {
    html = `<span class="status err">⚠ 실패</span>${s.error?`<div class="errmsg">근태: ${escapeHtml(s.error)}</div>`:''}${s.otError?`<div class="errmsg">시간외: ${escapeHtml(s.otError)}</div>`:''}`;
  }
  html += `<div class="fmeta">${escapeHtml(entry.note||'')}${s.method?` · ${s.method==='direct'?'회사 공통 형식':(s.method==='ai'?'AI 판독':'이미지 판독')}`:''}</div>`;
  return html;
}

  if(!srcCount) hint = '근태표를 올려주세요. 올리면 바로 분석을 시작합니다.';

    <span class="ck-note">양식은 필요한 것만 올리면 됩니다. 인보이스만 받을 거면 근태표만 있어도 됩니다.</span>
  </div>
  <div class="drop big" data-w="drop">
    <div class="icon">📂</div>

    <div class="t2">.xlsx · .xls · .pdf · .jpg · .png — 여러 개 한 번에 가능</div>
    <input type="file" id="wzFiles" data-w="files" accept=".xlsx,.xls,.xlsm,.pdf,.jpg,.jpeg,.png" multiple />

  ${state.files.length ? `

        <tbody>
          ${state.files.map(entry=>{
            const s = entry.role==='src' ? state.sources.find(x=>x.id===entry.id) : null;
            const people = s ? [...new Set((s.records||[]).map(r=>r.name))] : [];
            const nameInput = !s ? '<span class="muted">–</span>'

                ? `<input type="text" class="cellin wide" data-w="src-name" data-id="${s.id}" value="${escapeHtml(s.manualName||'')}" placeholder="비우면 AI가 읽은 이름" aria-label="직원명" />`
                : (people.length ? `<span class="people" title="${escapeHtml(people.join(', '))}"><b>${people.length}명</b> ${escapeHtml(people.slice(0,4).join(', '))}${people.length>4?' …':''}</span>` : '<span class="muted">–</span>');
            const siteSel = s && state.sites.length>1 ? `<select data-w="src-site" data-id="${s.id}" style="margin-top:4px;" aria-label="현장">${state.sites.map(x=>`<option ${s.site===x?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select>` : '';
            const st = s ? sourceOverallStatus(s) : null;
            const canRetry = s && !busy && (st==='err' || (st==='ok' && (s.records||[]).length===0 && (s.otRecords||[]).length===0) || (st==='ok' && s.kind!=='excel'));

  </div>` : ''}
  ${actionBar(
    `<button type="button" class="btn ghost" data-w="goto" data-n="1" ${busy?'disabled':''}>← 현장·월</button>`,
    analyzedOk
      ? `<button type="button" class="btn ghost" data-w="analyze" ${ready?'':'disabled'}>다시 분석</button><button type="button" class="btn primary" data-w="goto" data-n="3">다음: 확인·수정 →</button>`
      : (state.analyzed && zero.length && !errs.length
          ? `<button type="button" class="btn ghost" data-w="goto" data-n="3">그래도 다음으로</button><button type="button" class="btn primary" data-w="analyze" ${ready?'':'disabled'}>다시 분석</button>`
          : (state.busy
              ? `<button type="button" class="btn ghost" data-w="stop">멈추기</button><button type="button" class="btn primary" disabled><span class="spin light"></span> 분석 중</button>`

/* ---------- ③ 확인·수정 ---------- */
function wzStep3(){
  const t = state.target, ot = state.generic.overtime.target;
  const tabs = [];
  if(t) tabs.push({k:'grid', l:'출근/휴무'});
  if(ot) tabs.push({k:'ot', l:'시간외수당'});
  tabs.push({k:'emps', l:'직원별 설정', badge: runEmployeeNames().length});
  tabs.push({k:'ov', l:'날짜별 예외', badge: state.dateOverrides.length});
  if(!tabs.find(x=>x.k===state.reviewTab)) state.reviewTab = tabs[0].k;
  const tab = state.reviewTab;

  // 요약
  let unsure=0, offBad=0, unmatched=0;
  if(t){
    Object.values(state.grid).forEach(g=>{ if(g.unmatched) unmatched++; else if(g.status==='?') unsure++; });
    t.employees.forEach(e=>{
      const std = runEmp(e.name).offDays;
      if(std===''||std==null) return;
      const cnt = t.dateCols.filter(d=>{ const g=state.grid[`${e.site}||${e.name}||${d.date}`]; return g && (g.status==='X'||g.status==='휴무'); }).length;
      if(+std!==cnt) offBad++;
    });
  }
  let otMin = 0;
  Object.values(state.generic.overtime.grid||{}).forEach(cats=>Object.values(cats).forEach(days=>Object.values(days).forEach(m=>otMin+=m)));

  let body='';
  if(tab==='grid'){
    const um = Object.values(state.grid).filter(g=>g.unmatched).map(g=>g.unmatched);
    body = `${um.length?`<div class="errbox"><h3>⚠ 양식·사원명부에서 직원을 찾지 못한 기록 ${um.length}건</h3><ul>${um.slice(0,8).map(m=>`<li>${escapeHtml(m)}</li>`).join('')}${um.length>8?`<li>… 외 ${um.length-8}건</li>`:''}</ul></div>`:''}
      <p class="desc">칸을 누르면 출근 → 휴무 → 확인필요 → 공란 순서로 바뀝니다. 이름 아래 "휴무 실제/설정"이 다르면 ⚠가 붙습니다.</p>
      ${state.sites.map(site=>siteGrid(site)).join('') || '<div class="notice">표시할 직원이 없습니다.</div>'}`;
  } else if(tab==='ot'){
    const miss = otMissingRules();
    const fixes = [], partial = [];
    const hr = (state.otMap||defaultOtMap()).휴일근무;
    state.sources.forEach(s=>(s.otRaw||[]).forEach(x=>{
      (x.otWarn||[]).forEach(t=>fixes.push(`${escapeHtml(x.name)} ${x.date.slice(5).replace('-','/')} ${escapeHtml(t)}`));
      if(hr && hr.src==='@sum' && hr.conv==='day' && x.blankDays && x.sums){ const k = otColFor(x, hr); if(k && x.sums[k.slice(5)]>0) partial.push(`${escapeHtml(x.name)} (${hr.col} ${x.sums[k.slice(5)]}일, 근태 빈 날 ${x.blankDays}일)`); }
    }));
    const notes = (fixes.length ? `<div class="notice" style="margin-bottom:10px;"><b>근태표 야간근무 칸 보정 ${fixes.length}건</b> — 22시 전에 퇴근한 날이거나 8시간을 넘는 야간 값은 근태표 수식 오류로 보고 0으로 넣었습니다.<ul style="margin:6px 0 0 18px;">${fixes.map(t=>`<li>${t}</li>`).join('')}</ul></div>` : '')
      + (partial.length ? `<div class="notice" style="margin-bottom:10px;"><b>휴일근무 제외 ${partial.length}명</b> — 입사·퇴사로 한 달을 다 채우지 않아 미사용 휴무를 휴일근무로 넣지 않았습니다: ${partial.join(', ')}</div>` : '');
    body = notes + (miss.length ? `<div class="errbox"><h3>⚠ 시간외 항목 규칙의 칸을 이번 근태표에서 찾지 못했습니다</h3><ul>${miss.map(m=>`<li><b>${m.cat}</b> ← "${escapeHtml(m.col)}" 칸 없음 — ${m.night?'퇴근시간(22시 이후)으로 계산했습니다':'0으로 들어갑니다'}</li>`).join('')}</ul><button type="button" class="btn sm" data-rx="goto-otmap">규칙 관리 › 시간외항목에서 칸 고르기</button></div>` : '') + overtimeReviewTable();
  } else if(tab==='emps'){
    body = `<p class="desc">여기서 바꾸면 시간외수당(연장·야간) 계산과 양식의 월/일/휴무일수 칸에 바로 반영됩니다.</p>${secEmps()}`;
  } else {
    body = wzOverridesPanel();
  }
  return `
  <div class="page-head">
    <h1>확인·수정</h1>
    <p>분석 결과를 확인하고 필요한 곳만 고치세요. 고친 내용은 다운로드할 때 원본 양식에 반영됩니다.</p>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="n">${t?t.employees.length:runEmployeeNames().length}<small>명</small></div><div class="l">직원</div></div>
    <div class="kpi"><div class="n" style="color:${unsure?'var(--warn)':'inherit'}">${unsure}</div><div class="l">확인필요 칸</div></div>
    <div class="kpi"><div class="n" style="color:${offBad||unmatched?'var(--warn)':'inherit'}">${offBad} / ${unmatched}</div><div class="l">휴무일수 불일치 / 매칭 실패</div></div>
    <div class="kpi"><div class="n">${Math.floor(otMin/60)}:${String(otMin%60).padStart(2,'0')}</div><div class="l">시간외 합계 (시:분)</div></div>
  </div>
  ${tabBar('review', tabs, tab)}
  <div class="tab-body">${body}</div>
  ${actionBar(`<button type="button" class="btn ghost" data-w="goto" data-n="2">← 파일 올리기</button>`,
    `<button type="button" class="btn primary" data-w="goto" data-n="4">다음: 양식에 반영하고 다운로드 →</button>`, '')}
  `;
}
