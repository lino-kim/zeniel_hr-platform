// ---------------- Offline OCR (Tesseract.js) for image 근태표 ----------------
// Tuned to the "계약직 출근부" table layout seen across PRADA MIU MIU-style sheets:
// a title/info box, then a table with English column headers (Date/Day/From/To/
// Net/Overtime/Night/Remark/Signature), one row per calendar day. Printed dates,
// times, and remark codes (RO/AL/HOL/UNPAID) OCR reasonably well; handwritten
// signatures are ignored entirely since they carry no data we need.
const OCR_REMARK_TRANSLATE = {RO:'휴무', AL:'연차', HOL:'공휴일', UNPAID:'무급', UPAID:'무급', ANNUAL:'연차'};
const OCR_HEADERS = ['Date','Day','From','To','Net','Overtime','Night','Remark'];

function ocrCleanDigits(s){
  // OCR often confuses O/0, l/1, S/5 inside numeric tokens
  return s.replace(/[oO]/g,'0').replace(/[lI]/g,'1').replace(/[sS](?=\d)/g,'5');
}
// 근로기준법 제54조: 4시간 이상 근무 시 30분, 8시간 이상 근무 시 1시간의 휴게시간을
// 근로시간 도중에 주어야 한다. From~To 시간만 주어지고 실제 순 근무시간이 별도로
// 정확히 나와있지 않을 때(예: 사진 근태표), 이 규칙으로 실제 근무시간을 역산한다.
function legalBreakMinutes(spanMinutes){
  if(spanMinutes >= 8*60) return 60;
  if(spanMinutes >= 4*60) return 30;
  return 0;
}
function actualWorkedMinutes(fromHM, toHM){
  const [fh,fm] = fromHM.split(':').map(Number);
  const [th,tm] = toHM.split(':').map(Number);
  let span = (th*60+tm) - (fh*60+fm);
  if(span < 0) span += 24*60; // crosses midnight
  return Math.max(0, span - legalBreakMinutes(span));
}

function ocrFlattenWords(data){
  if(data.words && data.words.length) return data.words;
  // fallback for API shapes where words aren't exposed as a flat top-level array
  const out = [];
  (data.blocks||[]).forEach(b=>(b.paragraphs||[]).forEach(p=>(p.lines||[]).forEach(l=>(l.words||[]).forEach(w=>out.push(w)))));
  return out;
}

// 사진·PDF 근태표: Claude(이미지 인식)로 표를 읽는다.
const VISION_PROMPT = `너는 대한민국 인사/급여 담당자를 돕는 근태표 판독 AI다.
첨부 이미지는 근태표/출근부다. 한 장에 직원이 한 명일 수도, 여러 명일 수도 있다. 표에 나오는 직원을 한 명도 빠짐없이 각각 따로 읽어라.
JSON 하나로만 답한다: {"employees":[{"name":"직원명(표에 적힌 그대로)","rows":[{"d":"YYYY-MM-DD","from":"HH:MM","to":"HH:MM","remark":"비고"}]}]}
- 직원마다 employees 항목을 하나씩 만든다. 서로 다른 직원의 기록을 한 사람에게 합치지 않는다.
- 이름은 표의 성명 칸에 적힌 그대로 쓰고, 읽을 수 없으면 빈 문자열로 둔다. 이름을 지어내지 않는다.
- from/to: 출근·퇴근 시각이 명확히 읽히면 24시간 HH:MM으로. 없거나 읽을 수 없으면 생략.
- remark: 시각이 없을 때 그 날 적힌 문구(휴무, 연차, RO, AL, HOL, UNPAID, - 등)를 그대로. 아무 기록도 없는 날은 행 자체를 생략.
- 서명·도장은 무시한다. 읽을 수 없는 값은 추측하지 말고 생략한다.`;
async function ocrExtractAttendance(imageDataUrl){
  const sample = await claudeCap('sample');
  if(!sample) throw new Error('이미지 분석 기능을 쓸 수 없는 환경입니다 (claude.ai에서 열어주세요).');
  let parsed;
  try{
    parsed = await sample.json(VISION_PROMPT, {images: dataUrlToBlob(imageDataUrl), ...(state.abortCtl ? {signal: state.abortCtl.signal} : {})});
  }catch(e){
    const code = e && e.code;
    throw new Error(SAMPLE_ERR_COPY[code] || ('이미지 분석 실패' + (code?` (${code})`:'')));
  }
  // 예전 형식({name, rows})으로 답해도 받아준다
  const emps = Array.isArray(parsed && parsed.employees) ? parsed.employees : (parsed && parsed.rows ? [{name: parsed.name, rows: parsed.rows}] : []);
  const records = [], names = [];
  emps.forEach(emp=>{
    const name = typeof (emp&&emp.name)==='string' ? emp.name.replace(/[^가-힣a-zA-Z ]/g,'').trim() : '';
    if(/^(합\s*계|소\s*계|계|성\s*명|이\s*름|직원명?|비\s*고|총\s*계)$/.test(name)) return; // 표의 칸 이름은 직원이 아니다
    if(name && !names.includes(name)) names.push(name);
    ((emp && emp.rows) || []).forEach(r=>{
      if(!r || !/^\d{4}-\d{2}-\d{2}$/.test(r.d||'')) return;
      const from = String(r.from||'').trim(), to = String(r.to||'').trim();
      if(/^\d{1,2}:\d{2}$/.test(from) && /^\d{1,2}:\d{2}$/.test(to)){
        records.push({name, date:r.d, status:'O', from, to, workedMinutes: actualWorkedMinutes(from, to)});
      } else if(r.remark){
        const rm = String(r.remark).trim();
        const key = rm.toUpperCase().replace(/[^A-Z]/g,'');
        records.push({name, date:r.d, status: rm==='-' ? 'X' : (OCR_REMARK_TRANSLATE[key] || rm)});
      }
    });
  });
  return {name: names.length===1 ? names[0] : null, names, records};
}

// Runs OCR for a source exactly once (cached on s._ocrRecords) and applies the
// manual name override — shared by both the 월근태 pass and the 시간외수당 pass so
// image/PDF sources work correctly regardless of which target(s) were uploaded,
// and regardless of which pass happens to run first.
async function ensureOcrRecords(s){
  if(s._ocrRecords) return applyManualNameOverride(s, s._ocrRecords);
  const images = s.kind==='pdf' ? s.pages : [s.thumb];
  const merged = [];
  const allNames = [];
  for(const img of images){
    const result = await ocrExtractAttendance(img);
    (result.names||[]).forEach(n=>{ if(!allNames.includes(n)) allNames.push(n); });
    merged.push(...result.records);
  }
  // 직원이 한 명뿐인 파일만 이름 칸을 채워 쓸 수 있게 한다. 여러 명이면 사람마다 읽힌 이름을 그대로 쓴다.
  s.detectedNames = allNames.map(matchRosterName);
  if(allNames.length===1 && !s.manualName) s.manualName = matchRosterName(allNames[0]);
  if(allNames.length>1) s.manualName = '';
  s._ocrRaw = merged;
  s._ocrRecords = fitToPeriod(merged); // 대상 월 기준, 이름은 아직 확정 전
  const withNames = applyManualNameOverride(s, s._ocrRecords);
  if(withNames.length===0 && s._ocrRecords.length>0){
    toast(s.file.name+': 직원명을 인식하지 못했습니다. 카드에 직접 입력한 뒤 재시도해주세요.', {error:true});
  }
  return withNames;
}
function applyManualNameOverride(s, rawRecords){
  const multi = (s.detectedNames||[]).length > 1;
  const finalName = !multi && s.manualName && s.manualName.trim() ? s.manualName.trim() : null;
  return rawRecords.map(r=>({...r, name: matchRosterName(finalName || r.name)})).filter(r=>r.name);
}

async function analyzeSource(s){
  s.status='run'; s.error=null; render();
  try{
    let records = [];
    if(s.kind==='excel'){
      const buf = await s.file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:false});
      const known = knownForPeriod(wb);
      if(known){
        records = known; s.method='direct';
      } else {
        s.method='ai';
        const ws = wb.Sheets[wb.SheetNames[0]];
        let rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
        rows = rows.filter(r=>r.some(c=>String(c).trim()!=='')).slice(0,150);
        const text = `다음은 근태표 엑셀에서 추출한 표 데이터(2차원 배열, JSON)이다:\n${JSON.stringify(rows)}\n이 표에 나오는 모든 직원의 날짜별 출근여부를 판정해줘.`;
        const raw = await callClaude([{type:'text', text}]);
        const parsed = parseAiJson(raw);
        (parsed.employees||[]).forEach(emp=>{
          (emp.days||[]).forEach(d=>records.push({name:matchRosterName(emp.name), date:d.d, status:d.s}));
        });
        records = fitToPeriod(records);
      }
    } else {
      // Offline OCR path (Tesseract.js) — no network call to Claude, works without
      // the claude.ai artifact environment. Tuned to the "계약직 출근부" style table
      // (PRADA MIU MIU format): Date/Day/From/To/Net/Overtime/Night/Remark/Signature
      // columns with printed dates/times/remark-codes and handwritten signatures
      // (signatures are irrelevant and ignored).
      s.method='ocr';
      records = await ensureOcrRecords(s);
    }
    s.records = records.map(r=>({...r, name: matchRosterName(r.name)}));
    s.status='ok';
  }catch(err){
    s.status='err'; s.error = err.message||String(err);
  }
  render();
}
async function analyzeAll(){
  state.busy=true;
  try{
    for(const s of state.sources){
      if(state.abortCtl && state.abortCtl.signal.aborted) break;
      // 양식이 없어도 근태·시간외를 모두 분석한다 (인보이스 내려받기에서 씀)
      if(s.status!=='ok') await analyzeSource(s);
      if(s.otStatus!=='ok') await analyzeSourceForOvertime(s);
    }
    if(state.target) buildGridFromSources();
    if(state.generic.overtime.target) buildCombinedOvertimeGrid();
  }catch(err){
    toast('분석 중 오류: '+(err.message||err));
    console.error(err);
  }finally{
    state.busy=false;
    render();
  }
}

// Runs the 시간외수당 (overtime) parser against the same uploaded 근태표 file,
// storing results separately (s.otRecords/s.otStatus) so they don't clash with
// the 월근태일괄등록 parse of the same file (s.records/s.status).
// When a source has no pre-computed 연장근무 column (사진/PDF OCR path), overtime
// has to be derived instead from actual worked minutes vs the registered
// 소정근로시간(일) — gated by the 연장/야간 가능성 toggles in 규칙 관리.
function deriveOvertimeFromWorkedMinutes(attRecords){
  const out = [];
  attRecords.forEach(rec=>{
    if(rec.status!=='O' || rec.workedMinutes==null) return;
    const emp = runEmp(rec.name); // 직원별 소정근로시간(일)·연장/야간 가능 여부
    if(!emp.ot && !emp.night) return;
    const dailyStdMin = emp.day!=='' && emp.day!=null ? Math.round(parseFloat(emp.day)*60) : null;
    const d = new Date(rec.date+'T00:00:00Z');
    const weekday = d.getUTCDay();
    const isHoliday = state.weekendDays.includes(weekday) || isKoreanHoliday(rec.date);
    if(emp.ot && dailyStdMin!=null && !isNaN(dailyStdMin)){
      const extra = rec.workedMinutes - dailyStdMin;
      if(extra > 0) out.push({name:rec.name, date:rec.date, category: isHoliday?'휴일연장':'평일연장', minutes:extra});
    }
    if(emp.night && rec.to){
      const [th,tm] = rec.to.split(':').map(Number);
      const toMin = th*60+tm;
      if(toMin > NIGHT_THRESHOLD_MIN){
        out.push({name:rec.name, date:rec.date, category: isHoliday?'휴일심야':'평일심야', minutes: toMin-NIGHT_THRESHOLD_MIN});
      }
    }
  });
  return out;
}

async function analyzeSourceForOvertime(s){
  s.otStatus = 'run'; s.otError = null; render();
  try{
    if(s.kind==='excel'){
      const buf = await s.file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:false});
      const known = otKnownForPeriod(wb);
      s.otRecords = (known || []).map(r=>({...r, name: matchRosterName(r.name)}));
    } else {
      // shares the cached OCR pass with 월근태 (s._ocrRecords) rather than
      // re-running OCR a second time -- works even if only the 시간외수당
      // target was uploaded and the 월근태 pass never ran
      const attRecords = await ensureOcrRecords(s);
      s.otRecords = deriveOvertimeFromWorkedMinutes(attRecords);
    }
    s.otStatus = 'ok';
  }catch(err){
    s.otRecords = [];
    s.otError = err.message || String(err);
    s.otStatus = 'err';
  }
  render();
}

// Mirrors buildOvertimeGrid(), but reads from the shared state.sources/state.roster
// (combined-menu context) instead of the standalone 시간외수당 menu's own slot.
function buildCombinedOvertimeGrid(){
  const g = state.generic.overtime;
  const t = g.target;
  if(!t) return;
  const ws = t.wb.Sheets[t.sheetName];
  const blocks = scanOvertimeEmployees(t, ws);
  Object.values(state.roster).forEach(r=>ensureOvertimeBlock(t, ws, blocks, r.displayName));

  t.employees = [];
  Object.values(blocks).forEach(b=>Object.values(b.rows).forEach(R=>t.employees.push({row:R, name:b.name, site:'', hire:null, term:null})));

  g.grid = {};
  state.sources.forEach(s=>(s.otRecords||[]).forEach(rec=>{
    const key = normName(rec.name);
    const block = blocks[key];
    if(!block) return;
    const emp = runEmp(rec.name);
    if(/연장/.test(rec.category) && !emp.ot) return;   // 이 직원은 연장 불가로 설정됨
    if(/심야/.test(rec.category) && !emp.night) return; // 이 직원은 야간 불가로 설정됨
    const day = +rec.date.slice(8,10);
    if(!g.grid[block.name]) g.grid[block.name] = {};
    if(!g.grid[block.name][rec.category]) g.grid[block.name][rec.category] = {};
    g.grid[block.name][rec.category][day] = (g.grid[block.name][rec.category][day]||0) + rec.minutes;
  }));
  g._blocks = blocks;
}

// If a name found in a 근태표 has no existing row in the target sheet, create one —
// appended right after the last known employee row — so roster info and attendance
// can still be written for them, instead of only working for names ERP had already
// pre-populated a row for.
function ensureEmployeeRow(t, ws, name, site){
  if(t.nameCol==null) return null;
  const norm = normName(name);
  let existing = t.employees.find(e => normName(e.name)===norm);
  if(existing) return existing;

  const lastRow = t.employees.length ? Math.max(...t.employees.map(e=>e.row)) : t.labelRow;
  const newRow = lastRow + 1;

  // best-effort: copy each column's style from the previous row so the new row
  // isn't bare, when there is a previous employee row to copy from
  if(t.employees.length){
    for(let C=t.range.s.c; C<=t.range.e.c; C++){
      const srcAddr = XLSX.utils.encode_cell({r:lastRow, c:C});
      const dstAddr = XLSX.utils.encode_cell({r:newRow, c:C});
      const src = ws[srcAddr];
      if(src && src.s!=null && !ws[dstAddr]) ws[dstAddr] = {t:'z', s:src.s};
    }
  }

  if(newRow > t.range.e.r){ t.range.e.r = newRow; ws['!ref'] = XLSX.utils.encode_range(t.range); }

  const nameAddr = XLSX.utils.encode_cell({r:newRow, c:t.nameCol});
  const nameCell = ws[nameAddr];
  if(nameCell){ nameCell.v = name; nameCell.t = 's'; } else { ws[nameAddr] = {t:'s', v:name}; }

  const emp = {row:newRow, name, site: site||'', empId:null, hire:null, term:null};
  t.employees.push(emp);
  return emp;
}

function buildGridFromSources(){
  state.grid = {};
  const t = state.target;
  const ws = t.wb.Sheets[t.sheetName];

  // Only auto-create a target row for a name if they show real attendance
  // (at least one actual 출근) somewhere in the source. A name that only ever
  // appears with 휴무/"-"/blank (e.g. someone whose block exists in the 근태표
  // template but who hadn't actually started yet) shouldn't get pulled into
  // the output at all.
  const namesWithWork = new Set();
  const templateNames = new Set(t.employees.map(e=>normName(e.name)));
  state.sources.forEach(s=>(s.records||[]).forEach(rec=>{
    if(rec.name && rec.status==='O') namesWithWork.add(normName(rec.name));
  }));
  state.sources.forEach(s=>{
    s.records.forEach(rec=>{
      if(!rec.name) return;
      if(!namesWithWork.has(normName(rec.name))) return;
      ensureEmployeeRow(t, ws, rec.name.trim(), s.site);
    });
  });

  const empIndex = new Map(); // normalized name -> [{site,name}] for matching
  t.employees.forEach(e=>{
    const key = normName(e.name);
    if(!empIndex.has(key)) empIndex.set(key, []);
    empIndex.get(key).push(e);
  });
  state.sources.forEach(s=>{
    s.records.forEach(rec=>{
      if(!rec.name || !rec.date) return;
      // 양식에 이미 있는 직원은 출근이 없어도(전부 휴무 등) 그대로 반영한다
      if(!namesWithWork.has(normName(rec.name)) && !templateNames.has(normName(rec.name))) return;
      const candidates = empIndex.get(normName(rec.name)) || [];
      let target = candidates.find(e=>e.site===s.site) || candidates[0];
      if(!target){
        const key = 'UNMATCHED_'+uid();
        state.grid[key] = {unmatched: `${s.site||'(현장 미지정)'} / ${rec.name} / ${rec.date} — 양식에 해당 직원 없음`};
        return;
      }
      const key = `${target.site}||${target.name}||${rec.date}`;
      state.grid[key] = {status: rec.status};
    });
  });

  // Manual per-employee, per-date overrides (결근/휴무/출근/지각/외출/파업/생휴/육아기/
  // 돌봄단축/난휴/유휴) always win over whatever the automatic classification found —
  // this is exactly for cases like "-" normally meaning 휴무 but this particular day
  // should read 결근 instead.
  state.dateOverrides.forEach(ov=>{
    if(!ov.name || !ov.date || !ov.status) return;
    const key = normName(ov.name);
    const candidates = empIndex.get(key) || [];
    let target = candidates[0];
    if(!target){ target = ensureEmployeeRow(t, ws, ov.name.trim(), ''); if(target) empIndex.set(key, [target]); }
    if(!target) return;
    state.grid[`${target.site}||${target.name}||${ov.date}`] = {status: ov.status};
  });

  // 검토 화면에서 직접 바꾼 칸이 가장 우선한다
  Object.entries(state.manualCells||{}).forEach(([key,val])=>{
    if(val==='__blank') delete state.grid[key]; else state.grid[key] = {status:val};
  });
}

/* ---------------- Fill & download ---------------- */
function makeWriteCell(ws){
  return function writeCell(addr, val){
    const existing = ws[addr];
    if(existing){
      // merge into the existing cell object so any pre-applied style (.s), like a
      // highlighted background, survives — replacing the object wholesale would drop it.
      existing.v = val; existing.t = 's';
      delete existing.f; delete existing.w;
    } else {
      ws[addr] = {t:'s', v:val};
    }
  };
}

// Employee master-data columns (거래처코드/거래처/현장코드/현장/사번/직무/급여구분/
// 그룹입사일/입사일/퇴사일 등) — filled from the uploaded 근무자 정보(roster), matched
// by name (VLOOKUP-style against the roster's 성명 column), shaped by any
// user-registered 열별 입력 규칙 (규칙 관리 탭: 형식 검증 / 다른 열 복사 / 고정값).
// Only touches cells that are currently blank; never overwrites existing data.
function resolveFieldValue(label, rosterEntry, resolved, rules){
  const rule = rules.find(r=>r.label===label);
  if(rule && rule.type==='fixed') return rule.value;
  if(rule && rule.type==='copy') return resolved[rule.fromLabel] != null ? resolved[rule.fromLabel] : null;

  let val = rosterEntry ? findRosterValue(rosterEntry.fields, label) : null;
  if(rule && rule.type==='format'){
    const ok = rule.formatType==='date' ? /^\d{4}-\d{2}-\d{2}/.test(String(val||'').trim())
             : rule.formatType==='number' ? /^-?\d+(\.\d+)?$/.test(String(val||'').trim())
             : true;
    if(!ok) val = null;
  }
  return val;
}

function fillEmployeeInfo(t, ws, writeCell, report, rules, empOverride){
  rules = rules || state.fieldRules;
  const dateColSet = new Set(t.dateCols.map(d=>d.col));
  const allLabels = Object.keys(t.labelTexts || {}).filter(l=>{
    const col = t.labelTexts[l];
    return col!==t.nameCol && !dateColSet.has(col);
  });
  // copy-type rules must resolve after their source label, so process those last
  const ordered = [...allLabels].sort((a,b)=>{
    const ra = rules.find(r=>r.label===a), rb = rules.find(r=>r.label===b);
    return (ra&&ra.type==='copy'?1:0) - (rb&&rb.type==='copy'?1:0);
  });

  t.employees.forEach(e=>{
    const rosterEntry = state.roster[normName(e.name)];
    const resolved = {};
    ordered.forEach(label=>{
      const col = t.labelTexts[label];
      const addr = XLSX.utils.encode_cell({r:e.row, c:col});
      const existing = ws[addr];
      const oldVal = existing ? existing.v : null;
      const ov = empOverride ? empOverride(e.name, label) : null;
      const newVal = ov ? ov.value : resolveFieldValue(label, rosterEntry, resolved, rules);
      resolved[label] = newVal;
      // 이미 값이 있는 칸은 건드리지 않는다. 단, 직원별로 따로 바꾼 값(force)은 덮어쓴다.
      if(oldVal!=null && String(oldVal).trim()!=='' && !(ov && ov.force)) return;
      if(newVal==null || newVal==='') return; // no real data for this person — leave blank
      if(oldVal!=null && String(oldVal)===String(newVal)) return;

      writeCell(addr, newVal);
      report.filled++;
      report.changes.push([e.site, e.name, label, '', oldVal||'(공란)', newVal]);
    });
  });
}

function writeChangeLog(t, report){
  const oldLog = t.wb.Sheets['변경내역'];
  if(oldLog) delete t.wb.Sheets['변경내역'];
  const logAoa = [['현장','직원명','날짜/항목','요일','기존값','수정값'], ...report.changes];
  const logWs = XLSX.utils.aoa_to_sheet(logAoa);
  t.wb.SheetNames = t.wb.SheetNames.filter(n=>n!=='변경내역');
  t.wb.SheetNames.push('변경내역');
  t.wb.Sheets['변경내역'] = logWs;
}

function fillTarget(){
  const t = state.target;
  const ws = t.wb.Sheets[t.sheetName];
  const report = {filled:0, kept:0, unmatched:[], changes:[]};
  const writeCell = makeWriteCell(ws);

  // Step 1: 근무자 정보(로스터) 매칭 — 거래처코드/거래처/현장코드/현장/사번/급여구분/
  // 그룹입사일/입사일/퇴사일 등 인적사항부터 채운다.
  fillEmployeeInfo(t, ws, writeCell, report, state.fieldRules, runEmpFieldOverride);

  // Step 2: 근태표 판단 결과(출근/휴무/커스텀 라벨)를 날짜열에 채운다.
  t.employees.forEach(e=>{
    t.dateCols.forEach(d=>{
      const key = `${e.site}||${e.name}||${d.date}`;
      const g = state.grid[key];
      const addr = XLSX.utils.encode_cell({r:e.row, c:d.col});
      const existing = ws[addr];
      const oldVal = existing ? existing.v : null;
      if(!g){ report.unmatched.push(`${e.site} / ${e.name} / ${d.date}`); return; }
      let newVal;
      if(g.status==='O') newVal = '출근';
      else if(g.status==='X') newVal = '휴무';
      else if(g.status==='?') newVal = '확인필요';
      else newVal = g.status; // custom label passed through as-is (e.g. "무급")
      if(oldVal === newVal){ report.kept++; return; }
      writeCell(addr, newVal);
      report.filled++;
      report.changes.push([e.site, e.name, d.date, d.weekday, oldVal||'(공란)', newVal]);
    });
  });

  writeChangeLog(t, report);
  return report;
}

// Standalone test path: fill ONLY the employee master-data columns (no attendance
// judgment at all), so roster matching can be verified on its own before dealing
// with 근태표 analysis. Unlike the main flow (where rows get created from 근태표
// names during AI 분석), this path has no 근태표 to drive row creation — so it

/* =========================================================================
   Generic conversion engine — shared by 변동급여등록 자동 반영 and
   시간외수당 자동 반영. Unlike attendance, these don't have a known fixed
   structure yet, so the target's columns are detected generically and AI
   fills each one directly per employee. Reuses the attendance engine's
   ensureEmployeeRow / fillEmployeeInfo (for identity columns like 사번·현장
   that match the site roster) plus a new value-grid fill for everything else.
   ========================================================================= */
const GENERIC_MENU_TITLES = {variablepay:'변동급여등록 자동 반영', overtime:'시간외수당 자동 반영'};
const GENERIC_DOWNLOAD_NAMES = {variablepay:'변동급여등록_반영완료.xlsx', overtime:'시간외수당일괄등록_반영완료.xlsx'};

function parseGenericTarget(wb){
  const sheetName = wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const ref = ws['!ref'];
  const range = XLSX.utils.decode_range(ref);
  let headerRow=-1, bestCount=-1, labelTexts={};
  for(let R=range.s.r; R<=Math.min(range.e.r, range.s.r+5); R++){
    const labels={};
    for(let C=range.s.c; C<=range.e.c; C++){
      const cell = ws[XLSX.utils.encode_cell({r:R,c:C})];
      if(!cell || cell.v==null) continue;
      const label = String(cell.v).trim();
      if(label!=='' && !(label in labels)) labels[label]=C; // first occurrence wins
    }
    if(Object.keys(labels).length>bestCount){ bestCount=Object.keys(labels).length; headerRow=R; labelTexts=labels; }
  }
  let nameCol=null;
  for(const label in labelTexts){ if(/성\s*명|이\s*름|직원명|사원명/.test(label)){ nameCol=labelTexts[label]; break; } }
  const employees=[];
  if(nameCol!=null){
    for(let R=headerRow+1; R<=range.e.r; R++){
      const nc = ws[XLSX.utils.encode_cell({r:R,c:nameCol})];
      if(nc && nc.v!=null && String(nc.v).trim()!=='') employees.push({row:R, name:String(nc.v).trim(), site:'', hire:null, term:null});
    }
  }
  return {sheetName, headerRow, labelRow:headerRow, nameCol, labelTexts, dateCols:[], employees, range, auto: nameCol!=null};
}

function genericSystemPrompt(columns){

업로드된 자료(이미지 또는 텍스트로 변환된 표)에서, 아래 "출력해야 하는 항목" 목록에 맞는 값을 직원별로 찾아라.
항목: ${columns.join(', ')}
절대 원본 서식에 의존하지 말고 열/값의 의미로 판단한다. 값을 찾을 수 없는 항목은 결과에서 생략한다 — 추측하지 않는다.
JSON으로만 응답, 마크다운 코드블록이나 설명 문장 금지: {"employees":[{"name":"직원명","values":{"항목명":"값"}}]}`;
}

function syncRosterFromSite(siteId){
  const site = state.siteRegistry.find(s=>s.id===siteId);
  state.roster = site ? site.roster : {};
  state.rosterMeta = site ? site.rosterMeta : null;
}

function defaultSiteRules(){
  return {
    combined: {rules:[], fieldRules:[], weekendDays:[0,6], overtimePossible:true, nightPossible:true, offDays:''}, // shared by 월근태일괄등록 + 시간외수당
    variablepay: {fieldRules:[]},
  };
}
function ensureSiteRules(site){
  if(!site.rules) site.rules = defaultSiteRules();
  if(!site.rules.combined){
    // migrate from the older split attendance/overtime rule sets, if present
    const oldAtt = site.rules.attendance || {rules:[], fieldRules:[]};
    const oldOt = site.rules.overtime || {fieldRules:[], weekendDays:[0,6]};
    site.rules.combined = {
      rules: oldAtt.rules || [],
      fieldRules: (oldAtt.fieldRules && oldAtt.fieldRules.length) ? oldAtt.fieldRules : (oldOt.fieldRules||[]),
      weekendDays: oldOt.weekendDays || [0,6],
      overtimePossible: true, nightPossible: true,
    };
  }
  if(site.rules.combined.overtimePossible==null) site.rules.combined.overtimePossible = true;
  if(site.rules.combined.nightPossible==null) site.rules.combined.nightPossible = true;
  if(site.rules.combined.offDays==null) site.rules.combined.offDays = '';
  if(!site.rules.variablepay) site.rules.variablepay = {fieldRules:[]};
  return site.rules;
}
// Loads the given site's saved rules into the active working state. With no
// site selected, rule editing is blocked (there's nowhere to remember it).
function syncRulesFromSite(menuKey, siteId){
  const site = state.siteRegistry.find(s=>s.id===siteId);
  if(menuKey==='attendance'){
    const r = site ? ensureSiteRules(site).combined : {rules:[], fieldRules:[], weekendDays:[0,6], overtimePossible:true, nightPossible:true};
    state.rules = r.rules; state.fieldRules = r.fieldRules; state.weekendDays = r.weekendDays || [0,6];
    state.overtimePossible = r.overtimePossible!==false; state.nightPossible = r.nightPossible!==false;
    // the 시간외수당 engine reads its rules from the same combined set
    state.generic.overtime.fieldRules = r.fieldRules;
    state.generic.overtime.weekendDays = r.weekendDays || [0,6];
    state.generic.overtime.nightThresholdMin = NIGHT_THRESHOLD_MIN;
    state.generic.overtime.overtimePossible = state.overtimePossible;
    state.generic.overtime.nightPossible = state.nightPossible;
  } else {
    const g = state.generic[menuKey];
    const r = site ? ensureSiteRules(site)[menuKey] : {fieldRules:[]};
    g.fieldRules = r.fieldRules;
  }
}
function saveSiteRulesFor(menuKey){
  const siteId = menuKey==='attendance' ? state.selectedSiteId : state.generic[menuKey].siteId;
  const site = state.siteRegistry.find(s=>s.id===siteId);
  if(!site) return false;
  const sr = ensureSiteRules(site);
  if(menuKey==='attendance') sr.combined = {rules: state.rules, fieldRules: state.fieldRules, weekendDays: state.weekendDays, overtimePossible: state.overtimePossible, nightPossible: state.nightPossible};
  else if(menuKey==='variablepay') sr.variablepay = {fieldRules: state.generic.variablepay.fieldRules};

  archiveSiteRules(site); // keep a name-keyed snapshot too, so it survives this site being deleted/recreated later
  return true;
}

async function handleImportSettingsFile(file, domEvent){
  if(domEvent && domEvent.target) domEvent.target.value = '';
  if(!file) return;
  try{
    const text = await file.text();
    const payload = JSON.parse(text);
    if(!payload || !Array.isArray(payload.siteRegistry)) throw new Error('올바른 백업 파일이 아닙니다.');
    payload.siteRegistry.forEach(site=>{ if(!site.id) site.id = uid(); ensureSiteRules(site); });
    state.siteRegistry = payload.siteRegistry;
    state.ruleArchive = payload.ruleArchive || state.ruleArchive;
    state.selectedSiteId = null;
    Object.keys(state.generic).forEach(k=>{ state.generic[k].siteId = null; });
    render();
    saveSiteRegistryBg();
    saveRuleArchiveBg();
    toast(`현장 ${state.siteRegistry.length}곳 복원 완료`);
  }catch(err){
    toast('가져오기 실패: '+(err.message||err), {error:true});
  }
}

async function handleGenTargetFile(menuKey, file){
  const g = state.generic[menuKey];
  try{
    const buf = await file.arrayBuffer();

    if(!wb.SheetNames || wb.SheetNames.length===0){ toast('엑셀 파일에서 시트를 찾을 수 없습니다.', {error:true}); return; }

    } else if(!parsed.auto){ toast('양식에서 "성명" 열을 찾지 못했습니다.', {error:true}); return; }
    g.target = {file, wb, ...parsed};

}

async function analyzeGenericSource(menuKey, s){
  const g = state.generic[menuKey];
  s.status='run'; s.error=null; render();
  const columns = Object.keys(g.target.labelTexts).filter(l=>g.target.labelTexts[l]!==g.target.nameCol);
  const sysPrompt = genericSystemPrompt(columns);
  try{
    let records=[];
    if(s.kind==='excel'){
      const buf = await s.file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      let rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
      rows = rows.filter(r=>r.some(c=>String(c).trim()!=='')).slice(0,150);
      const text = `다음은 표 데이터(2차원 배열, JSON)이다:\n${JSON.stringify(rows)}`;
      const raw = await callClaude([{type:'text', text}], sysPrompt);
      records = (parseAiJson(raw).employees)||[];
      s.method='ai';
    } else {
      s.method='ai';
      const images = s.kind==='pdf' ? s.pages : [(await compressImageDataUrl(await readAsDataURL(s.file))).dataUrl];
      const merged = {};
      for(const img of images){
        const [meta, base64] = img.split(',');
        const mediaType = (meta.match(/data:(.*);base64/)||[])[1] || 'image/png';
        const content = [{type:'image', source:{type:'base64', media_type:mediaType, data:base64}}, {type:'text', text:'이 표를 분석해줘.'}];
        const raw = await callClaude(content, sysPrompt);
        ((parseAiJson(raw).employees)||[]).forEach(emp=>{
          if(!merged[emp.name]) merged[emp.name] = {name:emp.name, values:{}};
          Object.assign(merged[emp.name].values, emp.values||{});
        });
      }
      records = Object.values(merged);
    }
    s.records = records;
    s.status='ok';
  }catch(err){ s.status='err'; s.error = err.message||String(err); }
  render();
}

function buildGenericGrid(menuKey){

  const ws = t.wb.Sheets[t.sheetName];

/* =========================================================================
   시간외수당 (overtime) — specialized engine, not the generic AI-matching one.
   Target: 5 rows per employee (평일연장/평일심야/휴일근무/휴일연장/휴일심야),
   day columns M~AQ hold minutes for that category. Source: reuses the same
   근태확인표 block layout as attendance (출근시간/퇴근시간/근무시간/연장근무/
   야간근무 5-column blocks) but pulls 연장근무 and 퇴근시간 instead of status.
   ========================================================================= */
const OT_CATEGORIES = [
  {label:'평일연장', code:'A11-01'},
  {label:'평일심야', code:'A11-04'},
  {label:'휴일근무', code:'A11-02'},
  {label:'휴일연장', code:'A11-03'},
  {label:'휴일심야', code:'A11-05'},
];

function scanOvertimeEmployees(t, ws){
  const blocks = {};
  if(t.nameCol==null) return blocks;
  for(let R=t.labelRow+1; R<=t.range.e.r; R++){
    const nc = ws[XLSX.utils.encode_cell({r:R,c:t.nameCol})];
    if(!nc || nc.v==null || String(nc.v).trim()==='') continue;
    const name = String(nc.v).trim();
    const catCell = t.catCol!=null ? ws[XLSX.utils.encode_cell({r:R,c:t.catCol})] : null;
    const cat = catCell && catCell.v!=null ? String(catCell.v).trim() : null;
    const key = normName(name);
    if(!blocks[key]) blocks[key] = {name, rows:{}};
    if(cat) blocks[key].rows[cat] = R;
  }
  return blocks;
}

function ensureOvertimeBlock(t, ws, blocks, name){
  const key = normName(name);
  if(blocks[key] && OT_CATEGORIES.every(c=>blocks[key].rows[c.label]!=null)) return blocks[key];

  let lastRow = t.labelRow;
  Object.values(blocks).forEach(b=>Object.values(b.rows).forEach(r=>{ if(r>lastRow) lastRow=r; }));

  const entry = blocks[key] || {name, rows:{}};
  OT_CATEGORIES.forEach(cat=>{
    if(entry.rows[cat.label]!=null) return;
    lastRow += 1;
    for(let C=t.range.s.c; C<=t.range.e.c; C++){
      const srcAddr = XLSX.utils.encode_cell({r:lastRow-1, c:C});
      const dstAddr = XLSX.utils.encode_cell({r:lastRow, c:C});
      const src = ws[srcAddr];
      if(src && src.s!=null && !ws[dstAddr]) ws[dstAddr] = {t:'z', s:src.s};
    }
    ws[XLSX.utils.encode_cell({r:lastRow, c:t.nameCol})] = {t:'s', v:name};
    if(t.catCol!=null) ws[XLSX.utils.encode_cell({r:lastRow, c:t.catCol})] = {t:'s', v:cat.label};
    if(t.codeCol!=null) ws[XLSX.utils.encode_cell({r:lastRow, c:t.codeCol})] = {t:'s', v:cat.code};
    entry.rows[cat.label] = lastRow;
  });
  if(t.range.e.r < lastRow){ t.range.e.r = lastRow; ws['!ref'] = XLSX.utils.encode_range(t.range); }
  blocks[key] = entry;
  return entry;
}

// Reuses the exact same 근태확인표 block-detection as tryParseKnownSheet (SSF-based
// date parsing, distinctness-checked name row) but pulls 연장근무(col0+3) and
// 퇴근시간(col0+1) instead of a work/off status.
function tryParseOvertimeSource(wb, nightThresholdMin, weekendDays, selectedPeriod){
  let allRecords = [];
  let matchedAny = false;

  function dateParts(c){
    if(!c || c.t!=='n' || c.v==null) return null;
    const d = XLSX.SSF.parse_date_code(c.v);
    if(!d || !d.y || d.y<1990 || d.y>2100) return null;
    return {y:d.y, m:d.m, d:d.d};
  }
  function minutesFromCell(c){
    if(!c || c.v==null || c.v==='') return null;
    const disp = c.w!=null ? String(c.w).trim() : (typeof c.v==='string' ? c.v.trim() : String(c.v));
    if(disp==='' || disp==='-') return null;
    const m = disp.match(/^(\d{1,2}):(\d{2})/);
    return m ? (parseInt(m[1],10)*60 + parseInt(m[2],10)) : null;
  }

  for(const sheetName of wb.SheetNames){
    const ws = wb.Sheets[sheetName];
    const ref = ws['!ref']; if(!ref) continue;
    const range = XLSX.utils.decode_range(ref);
    for(let R=range.s.r; R<=range.e.r; R++){
      const hits=[];
      for(let C=range.s.c; C<=range.e.c; C++){
        const cell = ws[XLSX.utils.encode_cell({r:R,c:C})];
        if(cell && cell.v!=null && String(cell.v).trim()==='출근시간'){
          const c2 = ws[XLSX.utils.encode_cell({r:R,c:C+1})];
          if(c2 && c2.v!=null && String(c2.v).trim()==='퇴근시간') hits.push(C);
        }
      }
      if(hits.length<1) continue;

      let nameRow=-1;
      for(let nr=R-1; nr>=Math.max(range.s.r,R-6); nr--){
        const vals = hits.map(c0=>{ const c=ws[XLSX.utils.encode_cell({r:nr,c:c0})]; return c?c.v:null; });
        const plausible = vals.filter(isPlausibleName);
        const distinct = new Set(plausible.map(v=>v.trim()));
        const distinctOk = hits.length>1 ? distinct.size>=2 : distinct.size>=1;
        if(plausible.length >= hits.length*0.5 && distinctOk){ nameRow=nr; break; }
      }
      if(nameRow<0) continue;

      let dateCol=-1, dateColHits=0;
      for(let C=Math.max(range.s.c, hits[0]-4); C<hits[0]; C++){
        let hitcount=0;
        for(let dr=R+1; dr<=Math.min(range.e.r,R+35); dr++){
          if(dateParts(ws[XLSX.utils.encode_cell({r:dr,c:C})])) hitcount++;
        }
        if(hitcount>dateColHits){ dateColHits=hitcount; dateCol=C; }
      }
      if(dateCol<0 || dateColHits<5) continue;

      const employees = hits.map(c0=>{
        const nameCell = ws[XLSX.utils.encode_cell({r:nameRow,c:c0})];
        return isPlausibleName(nameCell&&nameCell.v) ? {name:String(nameCell.v).trim(), col0:c0} : null;
      }).filter(Boolean);
      if(employees.length===0) continue;

      let anchorRow=-1, anchorYMD=null;
      for(let dr=R+1; dr<=range.e.r; dr++){
        const parts = dateParts(ws[XLSX.utils.encode_cell({r:dr,c:dateCol})]);
        if(parts){ anchorRow=dr; anchorYMD=parts; break; }
      }
      if(anchorRow<0) continue;
      if(selectedPeriod){
        const pm = selectedPeriod.match(/^(\d{4})-(\d{2})$/);
        if(pm) anchorYMD = {y:+pm[1], m:+pm[2], d:anchorYMD.d};
      }
      const anchorMs = Date.UTC(anchorYMD.y, anchorYMD.m-1, anchorYMD.d);

      for(let i=0; i<dateColHits; i++){
        const dr = anchorRow+i;
        const dUtc = new Date(anchorMs + i*86400000);
        const dateStr = `${dUtc.getUTCFullYear()}-${String(dUtc.getUTCMonth()+1).padStart(2,'0')}-${String(dUtc.getUTCDate()).padStart(2,'0')}`;
        const weekday = dUtc.getUTCDay(); // 0=Sun..6=Sat
        const isWeekend = weekendDays.includes(weekday) || isKoreanHoliday(dateStr); // 법정 공휴일도 휴일연장/휴일심야로 분류
        employees.forEach(emp=>{
          const endCell = ws[XLSX.utils.encode_cell({r:dr,c:emp.col0+1})]; // 퇴근시간
          const extCell = ws[XLSX.utils.encode_cell({r:dr,c:emp.col0+3})]; // 연장근무

          const extMin = minutesFromCell(extCell);
          if(extMin!=null && extMin>0){
            allRecords.push({name:emp.name, date:dateStr, category: isWeekend?'휴일연장':'평일연장', minutes:extMin});
          }
          const endMin = minutesFromCell(endCell);
          if(endMin!=null && endMin > nightThresholdMin){
            allRecords.push({name:emp.name, date:dateStr, category: isWeekend?'휴일심야':'평일심야', minutes: endMin-nightThresholdMin});
          }
        });
      }
      matchedAny = true;
    }
  }
  return matchedAny ? allRecords : null;
}

async function analyzeOvertimeSource(s){
  s.status='run'; s.error=null; render();
  try{
    let records=[];
    if(s.kind==='excel'){
      const buf = await s.file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:false});
      const g = state.generic.overtime;
      const known = tryParseOvertimeSource(wb, g.nightThresholdMin, g.weekendDays);
      if(known){ records = known; s.method='direct'; }
      else{
        s.method='ai';
        toast(s.file.name+': 회사 공통 근태확인표 형식이 아니라 인식하지 못했습니다.');
      }
    } else {
      s.method='unsupported';
      toast(s.file.name+': 시간외수당은 현재 회사 공통 근태확인표(엑셀) 형식만 지원합니다.');
    }
    s.records = records;
    s.status='ok';
  }catch(err){ s.status='err'; s.error = err.message||String(err); }
  render();
}

function buildOvertimeGrid(){
  const g = state.generic.overtime;
  const t = g.target;
  const ws = t.wb.Sheets[t.sheetName];
  const blocks = scanOvertimeEmployees(t, ws);

  // Only create a block for someone who actually matches the site roster
  // (거래처/현장 정보가 있는 사람) — a name that shows up in the 근태표 but isn't
  // in the roster gets dropped entirely, not just left with blank identity
  // columns. Roster-matched people always get a block, even with zero
  // overtime this month, so their row still exists (day columns just stay blank).
  Object.values(state.roster).forEach(r=>ensureOvertimeBlock(t, ws, blocks, r.displayName));

  t.employees = [];
  Object.values(blocks).forEach(b=>Object.values(b.rows).forEach(R=>t.employees.push({row:R, name:b.name, site:'', hire:null, term:null})));

  g.grid = {}; // name -> category -> day -> minutes
  g.sources.forEach(s=>(s.records||[]).forEach(rec=>{
    const key = normName(rec.name);
    const block = blocks[key];
    if(!block) return; // not roster-matched — discard, don't add to the list
    const day = +rec.date.slice(8,10);
    if(!g.grid[block.name]) g.grid[block.name] = {};
    if(!g.grid[block.name][rec.category]) g.grid[block.name][rec.category] = {};
    g.grid[block.name][rec.category][day] = (g.grid[block.name][rec.category][day]||0) + rec.minutes;
  }));
  g._blocks = blocks;
}

function fillOvertimeTarget(){
  const g = state.generic.overtime;
  const t = g.target;
  const ws = t.wb.Sheets[t.sheetName];
  const report = {filled:0, kept:0, unmatched:[], changes:[]};
  const writeCell = makeWriteCell(ws);

  syncRosterFromSite(g.siteId);
  fillEmployeeInfo(t, ws, writeCell, report, g.fieldRules, runEmpFieldOverride);

  const blocks = g._blocks || scanOvertimeEmployees(t, ws);
  Object.values(blocks).forEach(block=>{
    const values = g.grid[block.name] || {};
    OT_CATEGORIES.forEach(cat=>{
      const R = block.rows[cat.label];
      if(R==null) return;
      const dayValues = values[cat.label] || {};
      let total = 0;
      Object.entries(t.dayCols).forEach(([day,col])=>{
        const mins = dayValues[+day];
        if(mins==null) return;
        total += mins;
        const addr = XLSX.utils.encode_cell({r:R, c:col});
        const existing = ws[addr];
        const oldVal = existing ? existing.v : null;
        if(oldVal!=null && String(oldVal).trim()!=='') return; // 연장 미발생(공란)은 그대로 둔다
        writeCell(addr, mins);
        report.filled++;
        report.changes.push([block.name, cat.label, `${day}일`, '', oldVal||'(공란)', mins]);
      });
      if(total>0 && t.totalMinCol!=null){
        const addr = XLSX.utils.encode_cell({r:R, c:t.totalMinCol});
        const existing = ws[addr];
        if(!(existing && existing.v!=null && String(existing.v).trim()!=='')){ writeCell(addr, String(total)); report.filled++; }
      }
      if(total>0 && t.totalHourCol!=null){
        const addr = XLSX.utils.encode_cell({r:R, c:t.totalHourCol});
        const existing = ws[addr];
        if(!(existing && existing.v!=null && String(existing.v).trim()!=='')){
          const h = Math.floor(total/60), m = total%60;
          writeCell(addr, `${h}:${String(m).padStart(2,'0')}`);
          report.filled++;
        }
      }
    });
  });

  writeChangeLog(t, report);
  return report;
}

function fillGenericTarget(menuKey){

  syncRosterFromSite(g.siteId);
  fillEmployeeInfo(t, ws, writeCell, report, g.fieldRules); // identity columns (사번/현장/거래처코드 등) from the site roster

  t.employees.forEach(e=>{
    const values = g.grid[e.name] || {};
    Object.keys(t.labelTexts).forEach(label=>{
      const col = t.labelTexts[label];
      if(col===t.nameCol) return;
      const addr = XLSX.utils.encode_cell({r:e.row, c:col});
      const existing = ws[addr];
      const oldVal = existing ? existing.v : null;
      if(oldVal!=null && String(oldVal).trim()!=='') return;
      const newVal = values[label];
      if(newVal==null || newVal==='') return;
      writeCell(addr, newVal);
      report.filled++;
      report.changes.push(['', e.name, label, '', oldVal||'(공란)', newVal]);
    });
  });

  writeChangeLog(t, report);
  return report;
}

    <p class="desc">항목(열 제목)만 있고 값은 비어있는 최종 제출 양식입니다.</p>

    <div class="drop" id="genDropSources"><div class="t1">파일을 드래그하거나 클릭해서 업로드</div><div class="t2">여러 개 선택 가능</div><input type="file" id="genInputSources" accept="${menuKey==='overtime'?'.xls,.xlsx':'.jpg,.jpeg,.png,.pdf,.xls,.xlsx'}" multiple ${!g.target?'disabled':''} /></div>
    ${g.sources.length? `<div class="cards">${g.sources.map(s=>`<div class="card"><div class="fname">${escapeHtml(s.file.name)}</div><button class="btn sm ghost" data-act="gen-remove-source" data-id="${s.id}" style="margin-top:6px;">제거</button></div>`).join('')}</div>`:''}
  </div>
  <div class="row-actions"><button class="btn primary" id="genBtnAnalyze" ${(!g.target||g.sources.length===0)?'disabled':''}>${menuKey==='overtime'?'계산 시작':'AI 분석 시작'} →</button></div>
  `;
}
function genericAnalyze(menuKey){
  const g = state.generic[menuKey];
  const done = g.sources.filter(s=>s.status==='ok').length;
  const failed = g.sources.filter(s=>s.status==='err').length;
  const total = g.sources.length;
  return `
  <div class="page-head"><h1>AI 분석 중</h1></div>
  <div class="kpis">
    <div class="kpi"><div class="n">${total}</div><div class="l">전체</div></div>
    <div class="kpi"><div class="n" style="color:var(--good)">${done}</div><div class="l">완료</div></div>
    <div class="kpi"><div class="n" style="color:${failed?'var(--danger)':'inherit'}">${failed}</div><div class="l">실패</div></div>
    <div class="kpi"><div class="n">${total-done-failed}</div><div class="l">대기/진행중</div></div>
  </div>
  <div class="panel"><div class="cards">
    ${g.sources.map(s=>`<div class="card"><div class="fname">${escapeHtml(s.file.name)}</div>
      ${s.status==='wait'?`<span class="status wait">대기중</span>`:''}
      ${s.status==='run'?`<span class="status run"><span class="spin"></span>분석중</span>`:''}
      ${s.status==='ok'?`<span class="status ok">✓ ${(s.records||[]).length}명 인식</span>`:''}
      ${s.status==='err'?`<span class="status err">⚠ 실패</span><div class="errmsg">${escapeHtml(s.error||'')}</div><button class="btn sm" data-act="gen-retry-source" data-id="${s.id}" style="margin-top:6px;">재시도</button>`:''}
    </div>`).join('')}
  </div></div>
  <div class="row-actions"><button class="btn primary" id="genBtnToReview" ${(g.busy||total-done-failed>0)?'disabled':''}>검토 단계로 →</button></div>
  `;
}
function genericReview(menuKey){
  const g = state.generic[menuKey];
  const t = g.target;
  const cols = Object.keys(t.labelTexts).filter(l=>t.labelTexts[l]!==t.nameCol);
  return `
  <div class="page-head"><h1>검토</h1><p>AI가 인식한 값을 확인하고 필요하면 직접 수정하세요.</p></div>
  <div class="panel">
    <div class="gridwrap">
      <table class="att" style="font-size:12px;">
        <thead><tr><th class="namecol">직원명</th>${cols.map(c=>`<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>
        <tbody>
          ${t.employees.map(e=>`<tr>
            <td class="namecol">${escapeHtml(e.name)}</td>
            ${cols.map(c=>`<td style="padding:2px;"><input type="text" data-gen-edit="${escapeHtml(e.name)}||${escapeHtml(c)}" value="${escapeHtml((g.grid[e.name]||{})[c]||'')}" style="width:74px;border:1px solid var(--line);border-radius:5px;padding:4px 6px;font-size:11.5px;" /></td>`).join('')}
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>
  <div class="row-actions">
    <button class="btn ghost" data-act="gen-step" data-step="analyze">← 뒤로</button>
    <button class="btn primary" id="genBtnApply">양식에 반영하기 →</button>
  </div>
  `;
}
function genericDone(menuKey){
  const g = state.generic[menuKey];
  const r = g.fillReport;
  return `
  <div class="page-head"><h1>반영 완료</h1></div>
  ${r?`<div class="panel"><div class="kpis">
    <div class="kpi"><div class="n" style="color:var(--good)">${r.filled}</div><div class="l">채운 셀</div></div>
    <div class="kpi"><div class="n">${r.kept}</div><div class="l">기존과 동일</div></div>
  </div></div>`:''}
  <div class="panel" style="text-align:center;padding:34px 20px;">
    <div style="font-size:30px;margin-bottom:8px;">✅</div>
    <button class="btn brand" id="genBtnDownload" style="padding:11px 20px;">엑셀 다운로드</button>
  </div>
  <div class="row-actions">
    <button class="btn ghost" data-act="gen-step" data-step="review">← 검토로</button>
    <button class="btn ghost" data-act="gen-restart">새 변환 시작</button>
