/* ---------------- Wire up ---------------- */
function wireStageArchiveBtn(){
  const stageArchiveBtn = document.querySelector('[data-act="stage-rule-archive"]');
  if(stageArchiveBtn) stageArchiveBtn.addEventListener('click', ()=>{
    state.stagedRuleArchiveName = state.siteNameDraft.trim().normalize('NFC');
    render();
    toast('현장을 등록하면 이 규칙이 같이 적용됩니다.');
  });
}
function wireUp(){
  document.querySelectorAll('[data-act="set-page"]').forEach(b=>b.addEventListener('click', ()=>{ state.page=b.dataset.v; render(); }));

  const tbMenu = document.querySelectorAll('[data-act="set-menu"]');
  tbMenu.forEach(b=>b.addEventListener('click', ()=>{ state.menu=b.dataset.v; render(); }));

  const dropSiteRoster = document.getElementById('dropSiteRoster');
  if(dropSiteRoster){
    const input = document.getElementById('inputSiteRoster');
    input.addEventListener('change', e=>{ if(e.target.files[0]) handleSiteRosterFile(e.target.files[0]); });
    ['dragover','dragleave','drop'].forEach(evt=>dropSiteRoster.addEventListener(evt, e=>{
      e.preventDefault();
      if(evt==='dragover') dropSiteRoster.classList.add('drag');
      if(evt==='dragleave') dropSiteRoster.classList.remove('drag');
      if(evt==='drop'){ dropSiteRoster.classList.remove('drag'); if(e.dataTransfer.files[0]) handleSiteRosterFile(e.dataTransfer.files[0]); }
    }));
  }
  const siteNameInput = document.getElementById('siteNameInput');
  if(siteNameInput && !state.siteRegistryEditingId){
    // 한글 입력(IME) 조합 중에는 화면을 다시 그리지 않는다 — 다시 그리면 조합이 끊겨 "ㅂ ㅐ ㄹ"처럼 낱자로 들어간다.
    const refreshArchiveNotice = ()=>{
      state.siteNameDraft = siteNameInput.value;
      const box = document.getElementById('siteArchiveNotice');
      if(box) box.innerHTML = siteArchiveNoticeHtml(null);
      wireStageArchiveBtn();
    };
    siteNameInput.addEventListener('input', e=>{
      state.siteNameDraft = siteNameInput.value;
      if(e.isComposing) return;
      refreshArchiveNotice();
    });
    siteNameInput.addEventListener('compositionend', refreshArchiveNotice);
  }

  const btnSaveSite = document.getElementById('btnSaveSite');
  if(btnSaveSite) btnSaveSite.addEventListener('click', ()=>{
    const name = document.getElementById('siteNameInput').value.trim();
    if(!name){ toast('현장명을 입력해주세요.'); return; }
    if(state.siteRegistryEditingId){
      const s = state.siteRegistry.find(x=>x.id===state.siteRegistryEditingId);
      s.name = name;
      if(state.pendingSiteRoster){ s.roster = state.pendingSiteRoster.roster; s.rosterMeta = state.pendingSiteRoster.meta; }
    } else {
      if(!state.pendingSiteRoster){ toast('사원명부를 먼저 업로드해주세요.'); return; }
      const rules = (state.stagedRuleArchiveName===name.normalize('NFC') && state.ruleArchive[name.normalize('NFC')])
        ? JSON.parse(JSON.stringify(state.ruleArchive[name.normalize('NFC')])) // {combined, variablepay, savedAt} -> reuse directly as site.rules shape
        : defaultSiteRules();
      state.siteRegistry.push({id:uid(), name, roster:state.pendingSiteRoster.roster, rosterMeta:state.pendingSiteRoster.meta, createdAt:new Date().toISOString(), rules});
      if(state.stagedRuleArchiveName===name) toast('예전 규칙을 적용해서 현장을 등록했습니다.');
    }
    state.pendingSiteRoster = null; state.siteRegistryEditingId = null; state.siteNameDraft=''; state.stagedRuleArchiveName=null;
    render(); saveSiteRegistryBg();
  });
  document.querySelectorAll('[data-act="edit-site"]').forEach(b=>b.addEventListener('click', ()=>{
    state.siteRegistryEditingId = b.dataset.id; state.pendingSiteRoster = null; render();
  }));
  const cancelSiteEdit = document.querySelector('[data-act="cancel-site-edit"]');
  if(cancelSiteEdit) cancelSiteEdit.addEventListener('click', ()=>{ state.siteRegistryEditingId=null; state.pendingSiteRoster=null; render(); });
  document.querySelectorAll('[data-act="delete-site"]').forEach(b=>b.addEventListener('click', ()=>{
    state.siteRegistry = state.siteRegistry.filter(s=>s.id!==b.dataset.id);
    render(); saveSiteRegistryBg();
  }));

  wireStageArchiveBtn();
  document.querySelectorAll('[data-act="apply-rule-archive"]').forEach(b=>b.addEventListener('click', ()=>{
    const site = state.siteRegistry.find(x=>x.id===b.dataset.id);
    const archived = site && state.ruleArchive[site.name.normalize('NFC')];
    if(!site || !archived) return;
    site.rules = JSON.parse(JSON.stringify(archived));
    ensureSiteRules(site);
    if(state.run && state.run.siteId===site.id && !state.run.dirty) state.run = null;
    render(); saveSiteRegistryBg();
    toast('예전 규칙을 이 현장에 적용했습니다.');
  }));

  const btnExportSettings = document.getElementById('btnExportSettings');
  if(btnExportSettings) btnExportSettings.addEventListener('click', ()=>{
    const payload = {exportedAt: new Date().toISOString(), siteRegistry: state.siteRegistry, ruleArchive: state.ruleArchive};
    saveFile(`근태자동화_설정백업_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(payload, null, 2));
  });
  const btnImportTrigger = document.getElementById('btnImportSettingsTrigger');
  if(btnImportTrigger) btnImportTrigger.addEventListener('click', ()=>{ document.getElementById('inputImportSettings').click(); });
  const inputImportSettings = document.getElementById('inputImportSettings');
  if(inputImportSettings) inputImportSettings.addEventListener('change', e=>handleImportSettingsFile(e.target.files[0], e));

  const btnImportRules = document.getElementById('btnImportSettingsRules');
  if(btnImportRules) btnImportRules.addEventListener('click', ()=>{ document.getElementById('inputImportSettingsRules').click(); });
  const inputImportSettingsRules = document.getElementById('inputImportSettingsRules');
  if(inputImportSettingsRules) inputImportSettingsRules.addEventListener('change', e=>handleImportSettingsFile(e.target.files[0], e));

  const gotoSiteReg = document.querySelector('[data-act="goto-siteregistry"]');
  if(gotoSiteReg) gotoSiteReg.addEventListener('click', ()=>{ state.menu='siteRegistry'; render(); });
  const addOvBtn = document.querySelector('[data-act="add-date-override"]');
  if(addOvBtn) addOvBtn.addEventListener('click', ()=>{
    const checked = [...document.querySelectorAll('.ovEmpCheck:checked')].map(cb=>cb.value);
    const manualInput = document.getElementById('ovNameManual');
    const manual = manualInput ? manualInput.value.split(',').map(s=>s.trim()).filter(Boolean) : [];
    const names = [...new Set([...checked, ...manual])];
    const startDate = document.getElementById('ovDateStart').value;
    const endDateRaw = document.getElementById('ovDateEnd').value;
    const status = document.getElementById('ovStatus').value;
    if(names.length===0 || !startDate || !status) return;
    const endDate = endDateRaw || startDate;
    const dates = [];
    let cur = new Date(startDate+'T00:00:00Z');
    const end = new Date(endDate+'T00:00:00Z');
    if(end < cur){ toast('종료일이 시작일보다 빠릅니다.', {error:true}); return; }
    while(cur <= end){
      dates.push(cur.toISOString().slice(0,10));
      cur = new Date(cur.getTime()+86400000);
    }
    names.forEach(name=>dates.forEach(date=>{
      state.dateOverrides.push({id:uid(), name, date, status});
    }));
    render();
  });
  document.querySelectorAll('[data-act="del-date-override-group"]').forEach(b=>b.addEventListener('click', ()=>{
    const ids = new Set(b.dataset.ids.split(','));
    state.dateOverrides = state.dateOverrides.filter(ov=>!ids.has(ov.id));
    render();
  }));

  const siteSelect = document.getElementById('siteSelect');
  if(siteSelect) siteSelect.addEventListener('change', ()=>{
    state.selectedSiteId = siteSelect.value || null;
    state.generic.overtime.siteId = state.selectedSiteId; // keep the shared overtime engine's site in sync
    syncRosterFromSite(state.selectedSiteId);
    initRun(state.selectedSiteId); // 현장 규칙 관리 값을 이번 변환 기본값으로 불러온다
    state.runSelected = new Set();
    render();
  });
  const rulesSiteSelect = document.getElementById('rulesSiteSelect');
  if(rulesSiteSelect) rulesSiteSelect.addEventListener('change', ()=>{
    state.selectedSiteId = rulesSiteSelect.value || null;
    state.generic.overtime.siteId = state.selectedSiteId;
    syncRosterFromSite(state.selectedSiteId);
    state.runSelected = new Set();
    render();
  });

  // ---- generic engine (변동급여등록 / 시간외수당) ----
  if(state.menu==='variablepay' || state.menu==='overtime'){
    const menuKey = state.menu;
    const g = state.generic[menuKey];

    document.querySelectorAll('[data-act="gen-set-page"]').forEach(b=>b.addEventListener('click', ()=>{ g.page=b.dataset.v; render(); }));

    const genFrType = document.getElementById('genFrType');
    if(genFrType){
      const sync = ()=>{
        document.getElementById('genFrFormatWrap').style.display = genFrType.value==='format' ? '' : 'none';
        document.getElementById('genFrCopyWrap').style.display = genFrType.value==='copy' ? '' : 'none';
        document.getElementById('genFrFixedWrap').style.display = genFrType.value==='fixed' ? '' : 'none';
      };
      genFrType.addEventListener('change', sync); sync();
    }
    const genAddFr = document.querySelector('[data-act="gen-add-fieldrule"]');
    if(genAddFr) genAddFr.addEventListener('click', ()=>{
      if(!g.siteId){ toast('먼저 현장을 선택해주세요. 규칙은 현장별로 저장됩니다.', {error:true}); return; }
      const label = document.getElementById('genFrLabel').value.trim();
      const type = document.getElementById('genFrType').value;
      if(!label) return;
      const rule = {id:uid(), label, type};
      if(type==='format') rule.formatType = document.getElementById('genFrFormat').value;
      else if(type==='copy'){
        const fromLabel = document.getElementById('genFrFromLabel').value.trim();
        if(!fromLabel) return;
        rule.fromLabel = fromLabel;
      } else {
        const value = document.getElementById('genFrValue').value.trim();
        if(!value) return;
        rule.value = value;
      }
      g.fieldRules = g.fieldRules.filter(r=>r.label!==label);
      g.fieldRules.push(rule);
      render(); saveSiteRulesFor(menuKey);
    });
    document.querySelectorAll('[data-act="gen-del-fieldrule"]').forEach(b=>b.addEventListener('click', ()=>{
      g.fieldRules = g.fieldRules.filter(r=>r.id!==b.dataset.id);
      render(); saveSiteRulesFor(menuKey);
    }));

    const genSaveStdHoursBtn = document.querySelector('[data-act="gen-save-standard-hours"]');
    if(genSaveStdHoursBtn) genSaveStdHoursBtn.addEventListener('click', ()=>{
      if(!g.siteId){ toast('먼저 현장을 선택해주세요.', {error:true}); return; }
      const monthVal = document.getElementById('genStdHoursMonth').value.trim();
      const dayVal = document.getElementById('genStdHoursDay').value.trim();
      ['월','일'].forEach((label,i)=>{
        const val = i===0 ? monthVal : dayVal;
        g.fieldRules = g.fieldRules.filter(r=>r.label!==label);
        if(val!=='') g.fieldRules.push({id:uid(), label, type:'fixed', value:val});
      });
      render(); saveSiteRulesFor(menuKey);
      toast('소정근로시간 저장됨');
    });

    if(menuKey==='overtime'){
      const nightInput = document.getElementById('otNightThreshold');
      if(nightInput) nightInput.addEventListener('change', ()=>{
        if(!g.siteId){ toast('먼저 현장을 선택해주세요.', {error:true}); render(); return; }
        const m = nightInput.value.match(/^(\d{1,2}):(\d{2})$/);
        if(!m){ toast('시:분 형식으로 입력해주세요 (예: 22:00)', {error:true}); render(); return; }
        g.nightThresholdMin = (+m[1])*60 + (+m[2]);
        saveSiteRulesFor('overtime');
      });
      document.querySelectorAll('[data-act="toggle-weekend-day"]').forEach(cb=>cb.addEventListener('change', ()=>{
        if(!g.siteId){ toast('먼저 현장을 선택해주세요.', {error:true}); render(); return; }
        const day = +cb.dataset.day;
        const set = new Set(g.weekendDays);
        if(cb.checked) set.add(day); else set.delete(day);
        g.weekendDays = [...set].sort();
        saveSiteRulesFor('overtime');
      }));
    }

    const genSiteSelect = document.getElementById('genSiteSelect');
    if(genSiteSelect) genSiteSelect.addEventListener('change', ()=>{ g.siteId = genSiteSelect.value || null; syncRulesFromSite(menuKey, g.siteId); render(); });
    const genRulesSiteSelect = document.getElementById('genRulesSiteSelect');
    if(genRulesSiteSelect) genRulesSiteSelect.addEventListener('change', ()=>{ g.siteId = genRulesSiteSelect.value || null; syncRulesFromSite(menuKey, g.siteId); render(); });

    const genDropTarget = document.getElementById('genDropTarget');
    if(genDropTarget){
      const input = document.getElementById('genInputTarget');
      input.addEventListener('change', e=>{ if(e.target.files[0]) handleGenTargetFile(menuKey, e.target.files[0]); });
      ['dragover','dragleave','drop'].forEach(evt=>genDropTarget.addEventListener(evt, e=>{
        e.preventDefault();
        if(evt==='dragover') genDropTarget.classList.add('drag');
        if(evt==='dragleave') genDropTarget.classList.remove('drag');
        if(evt==='drop'){ genDropTarget.classList.remove('drag'); if(e.dataTransfer.files[0]) handleGenTargetFile(menuKey, e.dataTransfer.files[0]); }
      }));
    }
    const genRemoveTarget = document.querySelector('[data-act="gen-remove-target"]');
    if(genRemoveTarget) genRemoveTarget.addEventListener('click', ()=>{ g.target=null; render(); });

    const genDropSources = document.getElementById('genDropSources');
    if(genDropSources){
      const input = document.getElementById('genInputSources');
      input.addEventListener('change', e=>{ if(e.target.files.length) handleGenSourceFiles(menuKey, e.target.files); e.target.value=''; });
      ['dragover','dragleave','drop'].forEach(evt=>genDropSources.addEventListener(evt, e=>{
        e.preventDefault();
        if(evt==='dragover') genDropSources.classList.add('drag');
        if(evt==='dragleave') genDropSources.classList.remove('drag');
        if(evt==='drop'){ genDropSources.classList.remove('drag'); if(e.dataTransfer.files.length) handleGenSourceFiles(menuKey, e.dataTransfer.files); }
      }));
    }
    document.querySelectorAll('[data-act="gen-remove-source"]').forEach(b=>b.addEventListener('click', ()=>{
      g.sources = g.sources.filter(s=>s.id!==b.dataset.id); render();
    }));

    const genBtnAnalyze = document.getElementById('genBtnAnalyze');
    if(genBtnAnalyze) genBtnAnalyze.addEventListener('click', ()=>{ syncRosterFromSite(g.siteId); g.step='analyze'; render(); analyzeGenericAll(menuKey); });
    document.querySelectorAll('[data-act="gen-retry-source"]').forEach(b=>b.addEventListener('click', ()=>{
      const s = g.sources.find(x=>x.id===b.dataset.id);
      if(s) analyzeGenericSource(menuKey, s).then(()=>{ buildGenericGrid(menuKey); render(); });
    }));
    const genBtnToReview = document.getElementById('genBtnToReview');
    if(genBtnToReview) genBtnToReview.addEventListener('click', ()=>{ g.step='review'; render(); });

    document.querySelectorAll('[data-gen-edit]').forEach(inp=>inp.addEventListener('change', ()=>{
      const [name, col] = inp.dataset.genEdit.split('||');
      if(!g.grid[name]) g.grid[name]={};
      g.grid[name][col] = inp.value;
    }));
    document.querySelectorAll('[data-act="gen-step"]').forEach(b=>b.addEventListener('click', ()=>{ g.step=b.dataset.step; render(); }));
    const genBtnApply = document.getElementById('genBtnApply');
    if(genBtnApply) genBtnApply.addEventListener('click', ()=>{
      try{ g.fillReport = menuKey==='overtime' ? fillOvertimeTarget() : fillGenericTarget(menuKey); g.step='done'; render(); }
      catch(err){ toast('반영 중 오류: '+(err.message||err)); console.error(err); }
    });
    const genBtnDownload = document.getElementById('genBtnDownload');
    if(genBtnDownload) genBtnDownload.addEventListener('click', ()=>downloadGenericWorkbook(menuKey));
    const genRestart = document.querySelector('[data-act="gen-restart"]');
    if(genRestart) genRestart.addEventListener('click', ()=>{
      const keepRules = state.generic[menuKey].fieldRules;
      state.generic[menuKey] = {siteId:null, target:null, sources:[], grid:{}, fillReport:null, step:'setup', busy:false, fieldRules:keepRules, page:'convert'};
      render();
    });
  }

  const dt = document.getElementById('dropTarget');
  if(dt){
    const input = document.getElementById('inputTarget');
    input.addEventListener('change', e=>{ if(e.target.files[0]) handleTargetFile(e.target.files[0]); });
    ['dragover','dragleave','drop'].forEach(evt=>dt.addEventListener(evt, e=>{
      e.preventDefault();
      if(evt==='dragover') dt.classList.add('drag');
      if(evt==='dragleave') dt.classList.remove('drag');
      if(evt==='drop'){ dt.classList.remove('drag'); if(e.dataTransfer.files[0]) handleTargetFile(e.dataTransfer.files[0]); }
    }));
  }
  const rmT = document.querySelector('[data-act="remove-target"]');
  if(rmT) rmT.addEventListener('click', ()=>{ state.target=null; state.sites=[]; render(); });

  const dropOtTarget = document.getElementById('dropOtTarget');
  if(dropOtTarget){
    const input = document.getElementById('inputOtTarget');
    input.addEventListener('change', e=>{ if(e.target.files[0]) handleGenTargetFile('overtime', e.target.files[0]); });
    ['dragover','dragleave','drop'].forEach(evt=>dropOtTarget.addEventListener(evt, e=>{
      e.preventDefault();
      if(evt==='dragover') dropOtTarget.classList.add('drag');
      if(evt==='dragleave') dropOtTarget.classList.remove('drag');
      if(evt==='drop'){ dropOtTarget.classList.remove('drag'); if(e.dataTransfer.files[0]) handleGenTargetFile('overtime', e.dataTransfer.files[0]); }
    }));
  }
  const rmOtT = document.querySelector('[data-act="remove-ot-target"]');
  if(rmOtT) rmOtT.addEventListener('click', ()=>{ state.generic.overtime.target=null; render(); });

  const ds = document.getElementById('dropSources');
  if(ds){
    const input = document.getElementById('inputSources');
    input.addEventListener('change', e=>{ if(e.target.files.length) handleSourceFiles(e.target.files); e.target.value=''; });
    ['dragover','dragleave','drop'].forEach(evt=>ds.addEventListener(evt, e=>{
      e.preventDefault();
      if(evt==='dragover') ds.classList.add('drag');
      if(evt==='dragleave') ds.classList.remove('drag');
      if(evt==='drop'){ ds.classList.remove('drag'); if(e.dataTransfer.files.length) handleSourceFiles(e.dataTransfer.files); }
    }));
  }
  document.querySelectorAll('[data-act="remove-source"]').forEach(b=>b.addEventListener('click', ()=>{ state.sources=state.sources.filter(s=>s.id!==b.dataset.id); render(); }));
  document.querySelectorAll('[data-act="assign-site"]').forEach(sel=>sel.addEventListener('change', ()=>{ const s=state.sources.find(x=>x.id===sel.dataset.id); if(s) s.site=sel.value; }));
  document.querySelectorAll('[data-act="ocr-name-override"]').forEach(inp=>inp.addEventListener('change', ()=>{ const s=state.sources.find(x=>x.id===inp.dataset.id); if(s) s.manualName=inp.value.trim(); }));

  const btnToAnalyze = document.getElementById('btnToAnalyze');
  if(btnToAnalyze) btnToAnalyze.addEventListener('click', ()=>{ useRunSettings(); state.step=2; render(); analyzeAll(); });

  const btnRosterOnly = document.getElementById('btnRosterOnly');
  if(btnRosterOnly) btnRosterOnly.addEventListener('click', ()=>{
    try{
      useRunSettings();
      const report = fillRosterOnly();
      downloadWorkbook();
      toast(`근무자 정보 ${report.filled}칸 채움`);
    }catch(err){
      toast('근무자 정보 반영 중 오류: '+(err.message||err));
      console.error(err);
    }
  });

  document.querySelectorAll('[data-act="retry-source"]').forEach(b=>b.addEventListener('click', async ()=>{
    const s = state.sources.find(x=>x.id===b.dataset.id);
    if(!s) return;
    useRunSettings();
    // "다시 분석" also needs to work when status already shows 'ok' but returned
    // zero usable records (e.g. OCR found the table but not the employee name,
    // fixed by typing it into the card) — so this isn't gated to error-only.
    // ensureOcrRecords() already reuses a cached OCR pass and just re-applies the
    // (now-updated) manual name, which is both correct and much faster than
    // re-running OCR on the same image (Tesseract is deterministic, so a fresh
    // pass would just reproduce the same misreads, if any).
    if(state.target) await analyzeSource(s);
    if(state.generic.overtime.target) await analyzeSourceForOvertime(s);
    if(state.target) buildGridFromSources();
    if(state.generic.overtime.target) buildCombinedOvertimeGrid();
    render();
  }));
  const btnBackUpload = document.getElementById('btnBackUpload');
  if(btnBackUpload) btnBackUpload.addEventListener('click', ()=>{ state.step=1; render(); });
  const btnToReview = document.getElementById('btnToReview');
  if(btnToReview) btnToReview.addEventListener('click', ()=>{ state.step=3; render(); });

  document.querySelectorAll('[data-act="toggle-cell"]').forEach(td=>td.addEventListener('click', ()=>{
    if(td.dataset.inrange==='0') return;
    const key = td.dataset.key;
    const cur = state.grid[key] ? state.grid[key].status : undefined;
    const order = [undefined,'O','X','?'];
    const next = order[(order.indexOf(cur)+1)%order.length];
    if(next===undefined) delete state.grid[key]; else state.grid[key] = {status:next};
    render();
  }));
  const btnBackAnalyze = document.getElementById('btnBackAnalyze');
  if(btnBackAnalyze) btnBackAnalyze.addEventListener('click', ()=>{ state.step=2; render(); });
  const btnToDownload = document.getElementById('btnToDownload');
  if(btnToDownload) btnToDownload.addEventListener('click', ()=>{
    try{
      useRunSettings();
      if(state.target) state.fillReport = fillTarget();
      if(state.generic.overtime.target) state.generic.overtime.fillReport = fillOvertimeTarget();
      state.step=4; render();
    }catch(err){
      toast('반영 중 오류: '+(err.message||err));
      console.error(err);
    }
  });

  const btnDownload = document.getElementById('btnDownload');
  if(btnDownload) btnDownload.addEventListener('click', downloadWorkbook);
  const btnDownloadOt = document.getElementById('btnDownloadOt');
  if(btnDownloadOt) btnDownloadOt.addEventListener('click', ()=>downloadGenericWorkbook('overtime'));
  const btnBackReview = document.getElementById('btnBackReview');
  if(btnBackReview) btnBackReview.addEventListener('click', ()=>{ state.step=3; render(); });
  const btnRestart = document.getElementById('btnRestart');
  if(btnRestart) btnRestart.addEventListener('click', ()=>{
    Object.assign(state, {step:1, target:null, sites:[], sources:[], grid:{}, fillReport:null, busy:false});
    const otSiteId = state.generic.overtime.siteId; // keep the site selection, just clear the run
    Object.assign(state.generic.overtime, {target:null, grid:{}, fillReport:null, _blocks:undefined, siteId:otSiteId});
    render();
  });
}

/* =========================================================================
   4단계 마법사: ① 현장·월 → ② 파일 올리기 → ③ 확인·수정 → ④ 다운로드
   ========================================================================= */
const WZ_STEPS = [
  {n:1, l:'현장·월 선택', s:'대상 현장과 월'},
  {n:2, l:'파일 올리기', s:'양식·근태표 한 번에'},
  {n:3, l:'확인·수정', s:'직원별 설정·근태 확인'},
  {n:4, l:'다운로드', s:'결과 파일 받기'},
];
const ROLE_LABEL = {att:'월근태 양식', ot:'시간외수당 양식', src:'근태표'};
const ATT_READ_OPTS = {type:'array', cellStyles:true, bookVBA:true, cellDates:false, cellNF:true, sheetStubs:true};
const OT_READ_OPTS = {type:'array', cellStyles:true, bookVBA:true, cellDates:false, cellNF:true, sheetStubs:true};

function defaultPeriod(){
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
if(!state.selectedPeriod) state.selectedPeriod = defaultPeriod();
state.files = state.files || [];
state.manualCells = state.manualCells || {};
state.maxStep = state.maxStep || 1;
state.analyzed = false;
state.reviewTab = state.reviewTab || null;

/* ---------- 기간 맞추기 / 이름 맞추기 ---------- */
// 대상 월에 해당하는 기록만 쓴다. 대상 월 기록이 하나도 없으면(연·월 오인식 등) 일자만 살려 대상 월로 옮긴다.
function fitToPeriod(recs){
  const p = state.selectedPeriod;
  if(!p || !recs || !recs.length) return recs || [];
  const inP = recs.filter(r=>r.date && r.date.startsWith(p));
  if(inP.length) return inP;
  const maxDay = lastDayOf(p);
  return recs.filter(r=>r.date && +r.date.slice(8,10)<=maxDay).map(r=>({...r, date: p + r.date.slice(7)}));
}
function knownForPeriod(wb){
  const raw = tryParseKnownSheet(wb);
  if(!raw) return null;
  const inP = raw.filter(r=>r.date.startsWith(state.selectedPeriod));
  if(inP.length) return inP;
  return tryParseKnownSheet(wb, state.selectedPeriod) || [];
}
function otKnownForPeriod(wb){
  const raw = tryParseOvertimeSource(wb, NIGHT_THRESHOLD_MIN, state.weekendDays);
  if(!raw) return null;
  const inP = raw.filter(r=>r.date.startsWith(state.selectedPeriod));
  if(inP.length || raw.length===0) return inP;
  return tryParseOvertimeSource(wb, NIGHT_THRESHOLD_MIN, state.weekendDays, state.selectedPeriod) || [];
}
function editDistanceLE1(a,b){
  if(a===b) return true;
  if(Math.abs(a.length-b.length)>1) return false;
  let i=0,j=0,diff=0;
  while(i<a.length && j<b.length){
    if(a[i]===b[j]){ i++; j++; continue; }
    if(++diff>1) return false;
    if(a.length>b.length) i++; else if(b.length>a.length) j++; else { i++; j++; }
  }
  return diff + (a.length-i) + (b.length-j) <= 1;
}
// AI가 읽은 이름이 사원명부와 한 글자 정도 다르면 사원명부 이름으로 맞춘다
function matchRosterName(name){
  if(!name) return name;
  const n = normName(name);
  const roster = Object.values(state.roster||{});
  if(state.roster[n]) return state.roster[n].displayName;
  if(n.length<2) return name;
  // 같은 길이에서 한 글자만 다른 경우(오인식)만 사원명부 이름으로 맞춘다. 후보가 둘 이상이면 맞추지 않는다.
  const hits = roster.filter(r=>{ const k=normName(r.displayName); return k.length===n.length && editDistanceLE1(k,n); });
  return hits.length===1 ? hits[0].displayName : name;
}

/* ---------- 파일 받기·자동 구분 ---------- */
function sheetHasText(wb, re){
  const ws = wb.Sheets[wb.SheetNames[0]];
  if(!ws || !ws['!ref']) return false;
  const range = XLSX.utils.decode_range(ws['!ref']);
  for(let R=range.s.r; R<=Math.min(range.e.r, range.s.r+40); R++)
    for(let C=range.s.c; C<=range.e.c; C++)
      if(re.test(cellText(ws[XLSX.utils.encode_cell({r:R,c:C})]))) return true;
  return false;
}
function classifyExcel(buf){
  let wb;
  try{ wb = XLSX.read(buf, {type:'array', cellDates:false, cellNF:true}); }catch(_){ return 'src'; }
  try{ if(tryParseKnownSheet(wb)) return 'src'; }catch(_){}
  try{
    const ot = parseOvertimeTarget(wb);
    if(ot.catCol!=null || ot.codeCol!=null || sheetHasText(wb, /^(평일|휴일)\s*(연장|심야)$/)) return 'ot';
  }catch(_){}
  try{
    const at = parseTarget(wb, state.selectedPeriod);
    if(at.dateCols.length>=5 && at.nameCol!=null){
      const ws = wb.Sheets[at.sheetName];
      let filled=0, total=0;
      at.employees.forEach(e=>at.dateCols.forEach(d=>{
        total++;
        const c = ws[XLSX.utils.encode_cell({r:e.row,c:d.col})];
        if(c && c.v!=null && String(c.v).trim()!=='') filled++;
      }));
      if(total===0 || filled/total < 0.3) return 'att';
    }
  }catch(_){}
  return 'src';
}
function normalizeAttTarget(t){
  t.employees.forEach(e=>{ if(!e.site) e.site = '현장'; });
  return t;
}
function loadAttTarget(entry){
  const wb = XLSX.read(entry.buf, ATT_READ_OPTS);
  const parsed = parseTarget(wb, state.selectedPeriod);
  if(parsed.error) throw new Error(parsed.error);
  if(parsed.dateCols.length<5) throw new Error(`날짜 열을 찾지 못했습니다. 머리글(위쪽 10행 안)에 날짜(예: 2026-09-01, 2026.09.01) 또는 1~31 일자가 있는지 확인해주세요. 대상 월: ${state.selectedPeriod}`);
  if(parsed.nameCol==null) throw new Error('"성명" 열을 찾지 못했습니다. 날짜 머리글 근처 행에 "성명" 칸이 있어야 합니다.');
  return normalizeAttTarget({file:entry.file, fileId:entry.id, wb, ...parsed, arrayBuffer:entry.buf});
}
function loadOtTarget(entry){
  const wb = XLSX.read(entry.buf, OT_READ_OPTS);
  if(!wb.Sheets[wb.SheetNames[0]] || !wb.Sheets[wb.SheetNames[0]]['!ref']) throw new Error('첫 번째 시트가 비어 있습니다.');
  const parsed = parseOvertimeTarget(wb);
  if(!parsed.nameFound) throw new Error('"성명" 열을 찾지 못했습니다.');
  if(parsed.dayCount<20) throw new Error(`일자 열을 ${parsed.dayCount}개만 찾았습니다. 머리글에 1~31 일자가 있는지 확인해주세요.`);
  const t = {file:entry.file, fileId:entry.id, wb, ...parsed, arrayBuffer:entry.buf};
  const blocks = scanOvertimeEmployees(t, wb.Sheets[parsed.sheetName]);
  t.employees = Object.values(blocks).map(b=>({row:Object.values(b.rows)[0], name:b.name}));
  return t;
}
async function makeSource(entry){
  const s = {id:entry.id, file:entry.file, kind:fileKind(entry.file), site: state.sites[0]||'', thumb:null, status:'wait', error:null, records:[], method:null};
  if(s.kind==='image'){
    const raw = await readAsDataURL(entry.file);
    try{ s.thumb = (await compressImageDataUrl(raw)).dataUrl; }catch(_){ s.thumb = raw; }
  } else if(s.kind==='pdf'){
    const imgs = await withTimeout(pdfToImages(entry.file), 90000, 'PDF를 이미지로 바꾸지 못했습니다 (90초 초과).');
    s.pages = imgs; s.thumb = imgs[0];
  }
  return s;
}
function unbindEntry(entry){
  if(state.target && state.target.fileId===entry.id){ state.target=null; state.sites=[]; }
  const o = state.generic.overtime;
  if(o.target && o.target.fileId===entry.id){ o.target=null; o.grid={}; o._blocks=undefined; }
  state.sources = state.sources.filter(s=>s.id!==entry.id);
}
function removeEntry(entry){ unbindEntry(entry); state.files = state.files.filter(f=>f!==entry); }
async function applyRole(entry){
  entry.error = null; entry.note = '';
  unbindEntry(entry);
  if(entry.role==='att'){
    const t = loadAttTarget(entry);
    const prev = state.files.find(f=>f!==entry && f.role==='att');
    if(prev){ removeEntry(prev); toast(`월근태 양식은 하나만 쓸 수 있어 "${prev.file.name}"을(를) 뺐습니다.`); }
    state.target = t;
    state.sites = [...new Set(t.employees.map(e=>e.site).filter(Boolean))];
    if(!state.sites.length) state.sites = ['현장'];
    state.sources.forEach(s=>{ if(!state.sites.includes(s.site)) s.site = state.sites[0]; });
    entry.note = `직원 ${t.employees.length}명 · ${t.dateCols.length}일 (${t.dateCols[0].date.slice(5)} ~ ${t.dateCols[t.dateCols.length-1].date.slice(5)})${t.dateMode==='day'?' · 일자 머리글':''}`;
  } else if(entry.role==='ot'){
    const t = loadOtTarget(entry);
    const prev = state.files.find(f=>f!==entry && f.role==='ot');
    if(prev){ removeEntry(prev); toast(`시간외수당 양식은 하나만 쓸 수 있어 "${prev.file.name}"을(를) 뺐습니다.`); }
    state.generic.overtime.target = t;
    entry.note = `직원 ${t.employees.length}명 · 일자 ${t.dayCount}개`;
  } else {
    const s = await makeSource(entry);
    state.sources.push(s);
    entry.note = s.kind==='excel' ? '엑셀 근태표' : (s.kind==='pdf' ? `PDF ${s.pages.length}쪽` : '사진');
  }
}
async function intakeFiles(list){
  const files = Array.from(list||[]);
  if(!files.length) return;
  markNeedsAnalysis();
  for(const file of files){
    const entry = {id:uid(), file, role:null, error:null, note:'', busy:true};
    state.files.push(entry);
    render();
    try{
      entry.buf = await file.arrayBuffer();
      entry.role = fileKind(file)==='excel' ? classifyExcel(entry.buf) : 'src';
      await applyRole(entry);
    }catch(err){
      entry.error = err.message || String(err);
      if(!entry.role) entry.role = 'src';
    }
    entry.busy = false;
    render();
  }
  autoStartAnalysis();
}
async function changeRole(entry, role){
  markNeedsAnalysis();
  entry.role = role; entry.busy = true; render();
  try{ await applyRole(entry); }catch(err){ entry.error = err.message || String(err); }
  entry.busy = false; render();
  autoStartAnalysis();
}
function markNeedsAnalysis(){
  state.analyzed = false;
  state.maxStep = Math.min(state.maxStep, 2);
}
// 대상 월이 바뀌면 양식을 다시 읽고 근태표는 다시 분석한다 (사진·PDF는 AI를 다시 부르지 않음)
async function reloadForPeriod(){
  markNeedsAnalysis();
  state.manualCells = {};
  for(const entry of state.files){
    if(entry.role==='att' || entry.role==='ot'){
      try{ await applyRole(entry); }catch(err){ entry.error = err.message||String(err); }
    }
  }
  state.sources.forEach(s=>{
    s.status='wait'; s.otStatus=undefined; s.records=[]; s.otRecords=[];
    if(s._ocrRaw) s._ocrRecords = fitToPeriod(s._ocrRaw);
  });
}

/* ---------- 분석 / 재구성 ---------- */
function rebuildGrids(){
  useRunSettings();
  if(state.target) buildGridFromSources();
  if(state.generic.overtime.target) buildCombinedOvertimeGrid();
}
function recomputeAfterSettings(){
  if(!state.analyzed) return;
  useRunSettings();
  state.sources.forEach(s=>{
    if(s.kind!=='excel' && s._ocrRecords) s.otRecords = deriveOvertimeFromWorkedMinutes(applyManualNameOverride(s, s._ocrRecords));
  });
  if(state.generic.overtime.target) buildCombinedOvertimeGrid();
}
function analysisProblems(){
  const errs = state.sources.filter(s=>sourceOverallStatus(s)==='err');
  const zero = state.sources.filter(s=>sourceOverallStatus(s)==='ok' && (s.records||[]).length===0 && (s.otRecords||[]).length===0);
  return {errs, zero};
}
async function startAnalysis(){
  if(state.busy) return;
  useRunSettings();
  state.generic.overtime.siteId = state.selectedSiteId;
  state.abortCtl = new AbortController();
  await analyzeAll();
  const stopped = state.abortCtl.signal.aborted;
  state.abortCtl = null;
  if(stopped){
    state.sources.forEach(s=>{ if(s.status==='run'){ s.status='err'; s.error='분석을 멈췄습니다.'; } if(s.otStatus==='run'){ s.otStatus='err'; s.otError='분석을 멈췄습니다.'; } });
    toast('분석을 멈췄습니다. 다시 시작하려면 "분석 시작"을 눌러주세요.');
    render(); return;
  }
  // 분석 중에 새로 올라온 근태표가 있으면 이어서 분석한다
  if(state.sources.some(s=>s.status==='wait' || s.otStatus==null)){ return startAnalysis(); }
  state.analyzed = true;
  const {errs, zero} = analysisProblems();
  if(!errs.length && !zero.length){ goStep(3); return; }
  toast(errs.length ? `${errs.length}개 파일 분석에 실패했습니다. 표에서 이유를 확인하고 재시도해주세요.` : `${zero.length}개 파일에서 인식된 기록이 없습니다. 직원명·종류를 확인해주세요.`, {error:true});
  render();
}
function stopAnalysis(){ if(state.abortCtl) state.abortCtl.abort(); }
// 근태표를 올리면 바로 분석을 시작한다 (2단계에 있을 때)
function autoStartAnalysis(){
  if(state.step!==2 || state.page!=='convert' || state.menu!=='attendance') return;
  if(state.busy || state.files.some(f=>f.busy)) return;
  if(state.sources.some(s=>s.status==='wait')) startAnalysis();
}
async function retrySource(id){
  const s = state.sources.find(x=>x.id===id); if(!s) return;
  useRunSettings();
  await analyzeSource(s);
  await analyzeSourceForOvertime(s);
  if(state.analyzed) rebuildGrids();
  render();
}
// 다운로드 직전: 원본 양식을 새로 읽어서 채운다 (몇 번을 다시 받아도 결과가 같다)
function produceOutputs(){
  useRunSettings();
  syncRosterFromSite(state.selectedSiteId);
  state.generic.overtime.siteId = state.selectedSiteId;
  const attEntry = state.files.find(f=>f.role==='att' && !f.error);
  const otEntry = state.files.find(f=>f.role==='ot' && !f.error);
  if(attEntry){ state.target = loadAttTarget(attEntry); buildGridFromSources(); state.fillReport = fillTarget(); }
  if(otEntry){ state.generic.overtime.target = loadOtTarget(otEntry); buildCombinedOvertimeGrid(); state.generic.overtime.fillReport = fillOvertimeTarget(); }
}
function rosterOnlyDownload(){
  const attEntry = state.files.find(f=>f.role==='att' && !f.error);
  if(!attEntry) return;
  useRunSettings();
  state.target = loadAttTarget(attEntry);
  const report = fillRosterOnly();
  downloadWorkbook();
  toast(`근무자 정보 ${report.filled}칸 채움`);
  try{ produceOutputs(); }catch(_){}
}

/* ---------- 단계 이동 ---------- */
function canGo(n){
  if(n<=1) return true;
  if(n===2) return !!state.selectedPeriod;
  return state.analyzed;
}
function goStep(n){
  if(!canGo(n)){ toast(n>=3 ? '먼저 2단계에서 분석을 마쳐주세요.' : '대상 월을 선택해주세요.', {error:true}); return; }
  if(n===3){ try{ rebuildGrids(); }catch(err){ toast('확인 화면을 만드는 중 오류: '+(err.message||err), {error:true}); console.error(err); return; } }
  if(n===4){
    try{ produceOutputs(); }
    catch(err){ toast('양식에 반영하는 중 오류: '+(err.message||err), {error:true}); console.error(err); return; }
  }
  state.step = n;
  state.maxStep = Math.max(state.maxStep, n);
  state.page = 'convert';
  render();
  window.scrollTo(0,0);
  if(n===2) autoStartAnalysis();
}
function restartWizard(){
  state.files = []; state.sources = []; state.target = null; state.sites = [];
  state.grid = {}; state.manualCells = {}; state.fillReport = null; state.dateOverrides = [];
  Object.assign(state.generic.overtime, {target:null, grid:{}, fillReport:null, _blocks:undefined});
  state.analyzed = false; state.maxStep = 1; state.reviewTab = null;
  if(state.run) state.run.emps = {};
  state.runSelected = new Set();
  goStep(1);
}

  return `
    <div class="shell">

function rail(){
  return `<div class="rail">

    <div class="seg" style="margin-bottom:16px;width:100%;">
      <button type="button" data-w="page" data-v="convert" class="${state.page==='convert'?'on':''}" style="flex:1;">변환하기</button>
      <button type="button" data-w="page" data-v="rules" class="${state.page==='rules'?'on':''}" style="flex:1;">규칙 관리</button>
    </div>
    ${state.page==='convert' ? WZ_STEPS.map(s=>{
      const done = state.step>s.n, active = state.step===s.n, reachable = s.n<=state.maxStep && canGo(s.n);
      return `<button type="button" class="step ${active?'active':''} ${done?'done':''}" data-w="goto" data-n="${s.n}" ${reachable?'':'disabled'}>
        <span class="num">${done?'✓':String(s.n).padStart(2,'0')}</span>

      </button>`;
    }).join('') : ''}
    <div class="rail-foot">${state.selectedSiteId ? escapeHtml((selectedSite()||{}).name||'') : '현장 미선택'} · ${escapeHtml(state.selectedPeriod||'')}</div>
  </div>`;
}
function actionBar(left, right, hint){
  return `<div class="row-actions action-bar">
    <div class="ab-left">${left||''}</div>
    <span class="action-hint">${hint||''}</span>
    <div class="ab-right">${right||''}</div>
  </div>`;
}
function wizardStep(){
  if(state.step===1) return wzStep1();
  if(state.step===2) return wzStep2();
  if(state.step===3) return wzStep3();
  return wzStep4();
}

/* ---------- ② 파일 올리기 ---------- */
function fileStatusCell(entry){
  if(entry.busy) return `<span class="status run"><span class="spin"></span>읽는 중</span>`;
  if(entry.error) return `<span class="status err">⚠ 읽기 실패</span><div class="errmsg">${escapeHtml(entry.error)}</div>`;
  if(entry.role!=='src') return `<span class="status ok">✓ 준비됨</span><div class="fmeta">${escapeHtml(entry.note)}</div>`;
  const s = state.sources.find(x=>x.id===entry.id);
  if(!s) return '';
  const st = sourceOverallStatus(s);
  const counts = `근태 ${(s.records||[]).length}건 · 연장/야간 ${(s.otRecords||[]).length}건`;
  let html = '';
  if(st==='wait') html = state.busy ? `<span class="status wait">순서 대기</span><div class="fmeta">앞 파일 분석이 끝나면 바로 시작합니다.</div>` : `<span class="status wait">분석 전</span><div class="fmeta">아래 "분석 시작"을 눌러주세요.</div>`;
  else if(st==='run') html = `<span class="status run"><span class="spin"></span>분석 중</span>${s.kind!=='excel'?'<div class="fmeta">Claude가 읽는 중 · 한 장에 30초~1분. 허용 창이 떠 있으면 허용해주세요.</div>':''}`;
  else if(st==='ok'){
    const zero = (s.records||[]).length===0 && (s.otRecords||[]).length===0;
    html = zero ? `<span class="status err">⚠ 0건</span><div class="errmsg">${s.kind==='excel' ? '이 파일에서 대상 월 기록을 찾지 못했습니다. 종류가 맞는지 확인해주세요.' : '직원명을 읽지 못했거나 대상 월 기록이 없습니다. 직원명을 입력한 뒤 다시 분석해주세요.'}</div>`
                : `<span class="status ok">✓ ${counts}</span>`;
  } else {
    html = `<span class="status err">⚠ 실패</span>${s.error?`<div class="errmsg">근태: ${escapeHtml(s.error)}</div>`:''}${s.otError?`<div class="errmsg">시간외: ${escapeHtml(s.otError)}</div>`:''}`;
  }
  html += `<div class="fmeta">${escapeHtml(entry.note||'')}${s.method?` · ${s.method==='direct'?'회사 공통 형식':(s.method==='ai'?'AI 판독':'이미지 판독')}`:''}</div>`;
  return html;
}
function wzStep2(){

  const srcCount = state.sources.length;
  const busy = state.busy || state.files.some(f=>f.busy);
  const {errs, zero} = analysisProblems();
  const ready = srcCount>0 && !busy;
  const analyzedOk = state.analyzed && !errs.length;
  let hint = '';
  const doneCnt = state.sources.filter(x=>sourceOverallStatus(x)==='ok' || sourceOverallStatus(x)==='err').length;
  if(!srcCount) hint = '근태표를 올려주세요. 올리면 바로 분석을 시작합니다.';
  else if(state.busy) hint = `분석 중 ${doneCnt}/${srcCount} · 분석 중에도 파일을 더 올릴 수 있습니다.`;
  else if(busy) hint = '파일을 읽는 중입니다.';
  else if(!hasTpl && !state.analyzed) hint = '양식 없이 분석하면 결과는 인보이스 내려받기에서 쓸 수 있습니다.';
  else if(state.analyzed && (errs.length||zero.length)) hint = `확인 필요: 실패 ${errs.length}개 · 0건 ${zero.length}개`;
  const roleSelect = entry => `<select data-w="role" data-id="${entry.id}" ${entry.busy||busy?'disabled':''} aria-label="파일 종류">
      ${['att','ot','src'].map(r=>`<option value="${r}" ${entry.role===r?'selected':''}>${ROLE_LABEL[r]}</option>`).join('')}
    </select>`;
  return `
  <div class="page-head">
    <h1>파일 올리기</h1>
    <p>월근태 양식, 시간외수당 양식, 근태표(엑셀·사진·PDF)를 한 번에 끌어다 놓으세요. 종류는 자동으로 구분하고, 틀리면 표에서 바꿀 수 있습니다.</p>
  </div>
  <div class="checklist">
    <span class="ck ${state.target?'on':''}">${state.target?'✓':'○'} 월근태 양식</span>
    <span class="ck ${state.generic.overtime.target?'on':''}">${state.generic.overtime.target?'✓':'○'} 시간외수당 양식</span>
    <span class="ck ${srcCount?'on':''}">${srcCount?'✓':'○'} 근태표 ${srcCount}개</span>
    <span class="ck-note">양식은 필요한 것만 올리면 됩니다. 인보이스만 받을 거면 근태표만 있어도 됩니다.</span>
  </div>
  <div class="drop big" data-w="drop">
    <div class="icon">📂</div>
    <div class="t1">파일을 여기에 끌어다 놓거나 클릭해서 고르세요</div>
    <div class="t2">.xlsx · .xls · .pdf · .jpg · .png — 여러 개 한 번에 가능</div>
    <input type="file" id="wzFiles" data-w="files" accept=".xlsx,.xls,.xlsm,.pdf,.jpg,.jpeg,.png" multiple />
  </div>
  ${state.files.length ? `
  <div class="panel" style="margin-top:14px;">
    <div class="tablewrap">
      <table class="list files-table">
        <thead><tr><th style="width:38%;">파일</th><th style="width:150px;">종류</th><th>상태</th><th style="width:180px;">직원명 (사진·PDF)</th><th></th></tr></thead>
        <tbody>
          ${state.files.map(entry=>{
            const s = entry.role==='src' ? state.sources.find(x=>x.id===entry.id) : null;
            const people = s ? [...new Set((s.records||[]).map(r=>r.name))] : [];
            const nameInput = !s ? '<span class="muted">–</span>'
              : (s.kind!=='excel' && (s.detectedNames||[]).length<=1)
                ? `<input type="text" class="cellin wide" data-w="src-name" data-id="${s.id}" value="${escapeHtml(s.manualName||'')}" placeholder="비우면 AI가 읽은 이름" aria-label="직원명" />`
                : (people.length ? `<span class="people" title="${escapeHtml(people.join(', '))}"><b>${people.length}명</b> ${escapeHtml(people.slice(0,4).join(', '))}${people.length>4?' …':''}</span>` : '<span class="muted">–</span>');
            const siteSel = s && state.sites.length>1 ? `<select data-w="src-site" data-id="${s.id}" style="margin-top:4px;" aria-label="현장">${state.sites.map(x=>`<option ${s.site===x?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select>` : '';
            const st = s ? sourceOverallStatus(s) : null;
            const canRetry = s && !busy && (st==='err' || (st==='ok' && (s.records||[]).length===0 && (s.otRecords||[]).length===0) || (st==='ok' && s.kind!=='excel'));
            return `<tr>
              <td><div class="fcell">${s&&s.thumb?`<img src="${s.thumb}" alt="" />`:`<span class="ftag">${fileEmoji(fileKind(entry.file))}</span>`}<span class="fname" title="${escapeHtml(entry.file.name)}">${escapeHtml(entry.file.name)}</span></div></td>
              <td>${roleSelect(entry)}</td>

              <td>${nameInput}${siteSel}</td>
              <td style="text-align:right;white-space:nowrap;">
                ${canRetry?`<button type="button" class="btn sm" data-w="retry" data-id="${s.id}">${st==='err'?'재시도':'다시 분석'}</button>`:''}
                <button type="button" class="btn sm ghost" data-w="remove" data-id="${entry.id}" ${busy?'disabled':''} aria-label="빼기">✕</button>

            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <p class="desc" style="margin:10px 0 0;">사진·PDF는 Claude가 표를 읽습니다. 처음 분석할 때 Claude 사용 허용 창이 뜹니다. 직원명을 고친 뒤 "다시 분석"을 누르면 AI를 다시 부르지 않고 바로 반영됩니다.</p>
  </div>` : ''}
  ${actionBar(
    `<button type="button" class="btn ghost" data-w="goto" data-n="1" ${busy?'disabled':''}>← 현장·월</button>`,
    analyzedOk
      ? `<button type="button" class="btn ghost" data-w="analyze" ${ready?'':'disabled'}>다시 분석</button><button type="button" class="btn primary" data-w="goto" data-n="3">다음: 확인·수정 →</button>`
      : (state.analyzed && zero.length && !errs.length
          ? `<button type="button" class="btn ghost" data-w="goto" data-n="3">그래도 다음으로</button><button type="button" class="btn primary" data-w="analyze" ${ready?'':'disabled'}>다시 분석</button>`
          : (state.busy
              ? `<button type="button" class="btn ghost" data-w="stop">멈추기</button><button type="button" class="btn primary" disabled><span class="spin light"></span> 분석 중</button>`
              : `<button type="button" class="btn primary" data-w="analyze" ${ready?'':'disabled'}>분석 시작 →</button>`)),
    hint)}
  `;
}

/* ---------- ③ 확인·수정 ---------- */
function wzStep3(){
  const t = state.target, ot = state.generic.overtime.target;
  const tabs = [];
  if(t) tabs.push({k:'grid', l:'출근/휴무'});
  if(ot) tabs.push({k:'ot', l:'시간외수당'});
  tabs.push({k:'emps', l:'직원별 설정', badge: runEmployeeNames().length});
  tabs.push({k:'ov', l:'날짜별 예외', badge: state.dateOverrides.length});
  if(!tabs.find(x=>x.k===state.reviewTab)) state.reviewTab = tabs[0].k;
  const tab = state.reviewTab;

  // 요약
  let unsure=0, offBad=0, unmatched=0;
  if(t){
    Object.values(state.grid).forEach(g=>{ if(g.unmatched) unmatched++; else if(g.status==='?') unsure++; });
    t.employees.forEach(e=>{
      const std = runEmp(e.name).offDays;
      if(std===''||std==null) return;
      const cnt = t.dateCols.filter(d=>{ const g=state.grid[`${e.site}||${e.name}||${d.date}`]; return g && (g.status==='X'||g.status==='휴무'); }).length;
      if(+std!==cnt) offBad++;
    });
  }
  let otMin = 0;
  Object.values(state.generic.overtime.grid||{}).forEach(cats=>Object.values(cats).forEach(days=>Object.values(days).forEach(m=>otMin+=m)));

  let body='';
  if(tab==='grid'){
    const um = Object.values(state.grid).filter(g=>g.unmatched).map(g=>g.unmatched);
    body = `${um.length?`<div class="errbox"><h3>⚠ 양식·사원명부에서 직원을 찾지 못한 기록 ${um.length}건</h3><ul>${um.slice(0,8).map(m=>`<li>${escapeHtml(m)}</li>`).join('')}${um.length>8?`<li>… 외 ${um.length-8}건</li>`:''}</ul></div>`:''}
      <p class="desc">칸을 누르면 출근 → 휴무 → 확인필요 → 공란 순서로 바뀝니다. 이름 아래 "휴무 실제/설정"이 다르면 ⚠가 붙습니다.</p>
      ${state.sites.map(site=>siteGrid(site)).join('') || '<div class="notice">표시할 직원이 없습니다.</div>'}`;
  } else if(tab==='ot'){
    body = overtimeReviewTable();
  } else if(tab==='emps'){
    body = `<p class="desc">여기서 바꾸면 시간외수당(연장·야간) 계산과 양식의 월/일/휴무일수 칸에 바로 반영됩니다.</p>${secEmps()}`;
  } else {
    body = wzOverridesPanel();
  }
  return `
  <div class="page-head">
    <h1>확인·수정</h1>
    <p>분석 결과를 확인하고 필요한 곳만 고치세요. 고친 내용은 다운로드할 때 원본 양식에 반영됩니다.</p>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="n">${t?t.employees.length:runEmployeeNames().length}<small>명</small></div><div class="l">직원</div></div>
    <div class="kpi"><div class="n" style="color:${unsure?'var(--warn)':'inherit'}">${unsure}</div><div class="l">확인필요 칸</div></div>
    <div class="kpi"><div class="n" style="color:${offBad||unmatched?'var(--warn)':'inherit'}">${offBad} / ${unmatched}</div><div class="l">휴무일수 불일치 / 매칭 실패</div></div>
    <div class="kpi"><div class="n">${Math.floor(otMin/60)}:${String(otMin%60).padStart(2,'0')}</div><div class="l">시간외 합계 (시:분)</div></div>
  </div>
  ${tabBar('review', tabs, tab)}
  <div class="tab-body">${body}</div>
  ${actionBar(`<button type="button" class="btn ghost" data-w="goto" data-n="2">← 파일 올리기</button>`,
    `<button type="button" class="btn primary" data-w="goto" data-n="4">다음: 양식에 반영하고 다운로드 →</button>`, '')}
  `;
}

  const p = state.selectedPeriod;
  const min = p ? `${p}-01` : '', max = p ? `${p}-${String(lastDayOf(p)).padStart(2,'0')}` : '';
  const names = runEmployeeNames();
  return `
    <p class="desc">근태표와 다르게 처리해야 하는 날을 지정합니다. 예: "-"로 찍혀 휴무로 판정됐지만 실제로는 결근인 날. 자동 판독보다 항상 우선합니다.</p>
    <div class="grid2" style="margin-bottom:0;">

function wzClick(e){
  const el = e.target.closest('[data-w]');
  if(!el || el.disabled) return;
  const w = el.dataset.w;
  if(el.tagName==='INPUT' || el.tagName==='SELECT') return;
  if(w==='page'){ state.page = el.dataset.v; render(); return; }
  if(w==='goto'){ goStep(+el.dataset.n); return; }
  if(w==='analyze'){ startAnalysis(); return; }
  if(w==='stop'){ stopAnalysis(); return; }
  if(w==='retry'){ retrySource(el.dataset.id); return; }
  if(w==='remove'){ const entry = state.files.find(f=>f.id===el.dataset.id); if(entry){ markNeedsAnalysis(); removeEntry(entry); render(); } return; }
  if(w==='cell'){
    const key = el.dataset.key;
    const cur = state.grid[key] ? state.grid[key].status : undefined;
    const order = [undefined,'O','X','?'];
    const idx = order.indexOf(cur);
    const next = order[(idx<0?0:idx+1)%order.length];
    state.manualCells[key] = next===undefined ? '__blank' : next;
    if(next===undefined) delete state.grid[key]; else state.grid[key] = {status:next};
    render(); return;
  }
  if(w==='ov-add'){
    const checked = [...document.querySelectorAll('.ovEmpCheck:checked')].map(cb=>cb.value);
    const manual = (document.getElementById('ovNameManual').value||'').split(',').map(x=>x.trim()).filter(Boolean);
    const names = [...new Set([...checked, ...manual])];
    const start = document.getElementById('ovDateStart').value;
    const endRaw = document.getElementById('ovDateEnd').value;
    const status = document.getElementById('ovStatus').value;
    if(!names.length){ toast('직원을 선택하거나 입력해주세요.', {error:true}); return; }
    if(!start){ toast('시작일을 선택해주세요.', {error:true}); return; }
    const end = endRaw || start;
    if(end < start){ toast('종료일이 시작일보다 빠릅니다.', {error:true}); return; }
    for(let cur = new Date(start+'T00:00:00Z'); cur <= new Date(end+'T00:00:00Z'); cur = new Date(cur.getTime()+86400000)){
      const date = cur.toISOString().slice(0,10);
      names.forEach(name=>state.dateOverrides.push({id:uid(), name, date, status}));
    }
    rebuildGrids(); render(); toast('예외를 추가했습니다.'); return;
  }
  if(w==='ov-del'){
    const ids = new Set(el.dataset.ids.split(','));
    state.dateOverrides = state.dateOverrides.filter(o=>!ids.has(o.id));
    rebuildGrids(); render(); return;
  }
  if(w==='dl-att'){ downloadWorkbook(); return; }
  if(w==='dl-ot'){ downloadGenericWorkbook('overtime'); return; }
  if(w==='dl-roster'){ try{ rosterOnlyDownload(); }catch(err){ toast('인적사항 반영 중 오류: '+(err.message||err), {error:true}); } return; }
  if(w==='restart'){ restartWizard(); return; }
  if(w==='goto-invoice'){ state.menu='invoice'; render(); window.scrollTo(0,0); return; }
}

  if(!el) return;
  const w = el.dataset.w;
  if(w==='site'){

    state.generic.overtime.siteId = state.selectedSiteId;
