    `<button type="button" class="btn" data-w="restart">새 변환 시작</button>`, '같은 현장·월은 그대로 두고 파일만 비웁니다.')}
  `;
}

/* ---------- 이벤트 (위임) ---------- */
function wzClick(e){
  const el = e.target.closest('[data-w]');
  if(!el || el.disabled) return;
  const w = el.dataset.w;
  if(el.tagName==='INPUT' || el.tagName==='SELECT') return;
  if(w==='page'){ state.page = el.dataset.v; render(); return; }
  if(w==='goto'){ goStep(+el.dataset.n); return; }
  if(w==='analyze'){ startAnalysis(); return; }
  if(w==='stop'){ stopAnalysis(); return; }
  if(w==='retry'){ retrySource(el.dataset.id); return; }
  if(w==='remove'){ const entry = state.files.find(f=>f.id===el.dataset.id); if(entry){ markNeedsAnalysis(); removeEntry(entry); render(); } return; }
  if(w==='cell'){
    const key = el.dataset.key;
    const cur = state.grid[key] ? state.grid[key].status : undefined;
    const order = [undefined,'O','X','?'];
    const idx = order.indexOf(cur);
    const next = order[(idx<0?0:idx+1)%order.length];
    state.manualCells[key] = next===undefined ? '__blank' : next;
    if(next===undefined) delete state.grid[key]; else state.grid[key] = {status:next};
    render(); return;
  }
  if(w==='ov-add'){
    const checked = [...document.querySelectorAll('.ovEmpCheck:checked')].map(cb=>cb.value);
    const manual = (document.getElementById('ovNameManual').value||'').split(',').map(x=>x.trim()).filter(Boolean);
    const names = [...new Set([...checked, ...manual])];
    const start = document.getElementById('ovDateStart').value;
    const endRaw = document.getElementById('ovDateEnd').value;
    const status = document.getElementById('ovStatus').value;
    if(!names.length){ toast('직원을 선택하거나 입력해주세요.', {error:true}); return; }
    if(!start){ toast('시작일을 선택해주세요.', {error:true}); return; }
    const end = endRaw || start;
    if(end < start){ toast('종료일이 시작일보다 빠릅니다.', {error:true}); return; }
    for(let cur = new Date(start+'T00:00:00Z'); cur <= new Date(end+'T00:00:00Z'); cur = new Date(cur.getTime()+86400000)){
      const date = cur.toISOString().slice(0,10);
      names.forEach(name=>state.dateOverrides.push({id:uid(), name, date, status}));
    }
    rebuildGrids(); render(); toast('예외를 추가했습니다.'); return;
  }
  if(w==='ov-del'){
    const ids = new Set(el.dataset.ids.split(','));
    state.dateOverrides = state.dateOverrides.filter(o=>!ids.has(o.id));
    rebuildGrids(); render(); return;
  }
  if(w==='dl-att'){ downloadWorkbook(); return; }
  if(w==='dl-ot'){ downloadGenericWorkbook('overtime'); return; }
  if(w==='dl-roster'){ try{ rosterOnlyDownload(); }catch(err){ toast('인적사항 반영 중 오류: '+(err.message||err), {error:true}); } return; }
  if(w==='restart'){ restartWizard(); return; }
  if(w==='goto-invoice'){ state.menu='invoice'; render(); window.scrollTo(0,0); return; }
}
async function wzChange(e){
  const el = e.target.closest('[data-w]');
  if(!el) return;
  const w = el.dataset.w;
  if(w==='site'){
    state.selectedSiteId = el.value || null;
    state.generic.overtime.siteId = state.selectedSiteId;
    syncRosterFromSite(state.selectedSiteId);
    initRun(state.selectedSiteId);
    state.runSelected = new Set();
    if(state.analyzed) rebuildGrids();
    render(); return;
  }
  if(w==='period'){
    if(!el.value) return;
    state.selectedPeriod = el.value;
    if(state.files.length){ await reloadForPeriod(); toast('대상 월이 바뀌어 양식을 다시 읽었습니다. 2단계에서 다시 분석해주세요.'); }
    render(); return;
  }
  if(w==='files'){ const list = el.files; await intakeFiles(list); el.value=''; return; }
  if(w==='role'){ const entry = state.files.find(f=>f.id===el.dataset.id); if(entry) await changeRole(entry, el.value); return; }
  if(w==='src-name'){
    const s = state.sources.find(x=>x.id===el.dataset.id); if(!s) return;
    s.manualName = el.value.trim();
    if(s._ocrRecords){ await retrySource(s.id); } // 이미 읽은 결과에 이름만 다시 붙인다 (AI 재호출 없음)
    return;
  }
  if(w==='src-site'){ const s = state.sources.find(x=>x.id===el.dataset.id); if(s){ s.site = el.value; if(state.analyzed) rebuildGrids(); } return; }
}
function wzDrag(e){
  const zone = e.target.closest('[data-w="drop"]');
  if(!zone) return;
  e.preventDefault();
  if(e.type==='dragover') zone.classList.add('drag');
  else if(e.type==='dragleave') zone.classList.remove('drag');
  else if(e.type==='drop'){ zone.classList.remove('drag'); intakeFiles(e.dataTransfer.files); }
}
(function(){
  const app = document.getElementById('app');
  app.addEventListener('click', wzClick);
  app.addEventListener('change', wzChange);
  ['dragover','dragleave','drop'].forEach(t=>app.addEventListener(t, wzDrag));
})();

/* =========================================================================
   인보이스 엔진: 원본 xlsx의 XML을 직접 고쳐서 서식·수식·외부연결·메모를 그대로 둔다.
   세부정산내역 시트의 입력 칸(성명·구분·매장명·입사일·퇴사일·근무일수·연장·야간·휴일)만 바꾸고,
   직원이 늘거나 줄면 행을 추가/삭제하면서 모든 수식·메모·필터 참조를 함께 옮긴다.
   ========================================================================= */
const INV_SHEET = '세부정산내역';
const SSML = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';

/* ---- A1 참조 도구 ---- */
function colToNum(c){ let n=0; for(const ch of c) n = n*26 + (ch.charCodeAt(0)-64); return n; }
function numToCol(n){ let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
const REF_RE = /(?<![A-Za-z0-9_.ㄱ-힝\]'$])((?:'(?:[^']|'')+'|[A-Za-z_ㄱ-힝][A-Za-z0-9_.ㄱ-힝]*)!)?(\$?)([A-Z]{1,3})(\$?)(\d+)(?::(\$?)([A-Z]{1,3})(\$?)(\d+))?(?![A-Za-z0-9_(!])/g;
function sheetOfPrefix(p){ if(!p) return null; let s=p.slice(0,-1); if(s.startsWith("'")) s=s.slice(1,-1).replace(/''/g,"'"); return s; }
// 문자열 상수("...") 바깥에서만 참조를 바꾼다
function mapFormulaRefs(f, fn){
  return f.split(/("(?:[^"]|"")*")/).map((seg,i)=> i%2 ? seg : seg.replace(REF_RE, (...m)=>{
    const [all, prefix, c1a, c1, r1a, r1, c2a, c2, r2a, r2] = m;
    const out = fn({prefix: prefix||'', sheet: sheetOfPrefix(prefix), c1a, c1, r1a, r1:+r1, isRange: r2!=null, c2a, c2, r2a, r2: r2!=null?+r2:null});
    return out==null ? all : out;
  })).join('');
}
function fmtRef(o){
  const a = `${o.c1a}${o.c1}${o.r1a}${o.r1}`;
  return o.prefix + (o.isRange ? `${a}:${o.c2a}${o.c2}${o.r2a}${o.r2}` : a);
}
// 복사 의미의 이동: 상대 참조만 dRow만큼 옮긴다
function translateFormula(f, dRow){
  if(!dRow) return f;
  return mapFormulaRefs(f, o=>{
    if(!o.r1a) o.r1 += dRow;
    if(o.isRange && !o.r2a) o.r2 += dRow;
    return fmtRef(o);
  });
}
// 구조 이동: 대상 시트를 가리키는 참조의 행 번호를 행 지도에 맞춰 바꾼다
function structuralFormula(f, onTargetSheet, rm){
  return mapFormulaRefs(f, o=>{
    const target = o.sheet ? o.sheet===INV_SHEET : onTargetSheet;
    if(!target) return null;
    if(!o.isRange){
      const n = rm.single(o.r1);
      if(n==null) return o.prefix + '#REF!';
      o.r1 = n; return fmtRef(o);
    }
    const a = rm.start(o.r1), b = rm.end(o.r2);
    if(a==null || b==null || b<a) return o.prefix + '#REF!';
    o.r1 = a; o.r2 = b; return fmtRef(o);
  });
}
function makeRowMap(first, last, newCount, oldToNew){
  const delta = newCount - (last-first+1);
  return {
    delta,
    single: x => x<first ? x : (x>last ? x+delta : (oldToNew.has(x) ? oldToNew.get(x) : null)),
    start:  x => x<first ? x : (x>last ? x+delta : first),
    end:    x => x<first ? x : (x>last ? x+delta : first+newCount-1),
  };
}

/* ---- XML 도구 ---- */
function kids(el, name){ return Array.from(el.childNodes).filter(n=>n.nodeType===1 && n.localName===name); }
function kid(el, name){ return kids(el, name)[0] || null; }
function cellRefParts(r){ const m = /^([A-Z]+)(\d+)$/.exec(r); return m ? {col:m[1], row:+m[2]} : null; }
function parseXml(text){ return new DOMParser().parseFromString(text, 'application/xml'); }
function serializeXml(doc){
  let s = new XMLSerializer().serializeToString(doc);
  if(!s.startsWith('<?xml')) s = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + s;
  return s;
}

/* ---- 통합 문서 읽기 ---- */
async function invLoad(arrayBuffer){
  const zip = await JSZip.loadAsync(new Uint8Array(arrayBuffer));
  const wbXml = parseXml(await zip.file('xl/workbook.xml').async('string'));
  const relsXml = parseXml(await zip.file('xl/_rels/workbook.xml.rels').async('string'));
  const rels = {};
  Array.from(relsXml.getElementsByTagName('Relationship')).forEach(r=>{ rels[r.getAttribute('Id')] = r.getAttribute('Target'); });
  const sheets = Array.from(wbXml.getElementsByTagNameNS(SSML,'sheet')).map(s=>{
    const rid = s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id') || s.getAttribute('r:id');
    let target = rels[rid] || '';
    target = target.startsWith('/') ? target.slice(1) : 'xl/' + target.replace(/^\.\//,'');
    return {name: s.getAttribute('name'), path: target};
  });
  const sheet = sheets.find(s=>s.name===INV_SHEET);
  if(!sheet) throw new Error(`"${INV_SHEET}" 시트를 찾지 못했습니다. 지난달 인보이스 파일이 맞는지 확인해주세요.`);
  let shared = [];
  if(zip.file('xl/sharedStrings.xml')){
    const ss = parseXml(await zip.file('xl/sharedStrings.xml').async('string'));
    shared = Array.from(ss.getElementsByTagNameNS(SSML,'si')).map(si=>Array.from(si.getElementsByTagNameNS(SSML,'t')).filter(t=>{
      // 윗주(rPh) 안의 글자는 빼고 본문만
      let p=t.parentNode; while(p && p!==si){ if(p.localName==='rPh') return false; p=p.parentNode; } return true;
    }).map(t=>t.textContent).join(''));
  }
  const sheetDoc = parseXml(await zip.file(sheet.path).async('string'));
  const info = invInspect(sheetDoc, shared);
  return {zip, sheets, sheet, shared, info, wbXml};
}
function cellValue(c, shared){
  if(!c) return null;
  const t = c.getAttribute('t');
  if(t==='inlineStr'){ const is = kid(c,'is'); return is ? is.textContent : ''; }
  const v = kid(c,'v'); if(!v) return null;
  if(t==='s') return shared[+v.textContent] ?? '';
  if(t==='str' || t==='e') return v.textContent;
  const n = +v.textContent; return isNaN(n) ? v.textContent : n;
}
function rowCells(rowEl){ const map={}; kids(rowEl,'c').forEach(c=>{ const p = cellRefParts(c.getAttribute('r')); if(p) map[p.col]=c; }); return map; }
function serialToISO(n){ if(typeof n!=='number' || !n) return ''; const d = new Date(Date.UTC(1899,11,30) + Math.round(n)*86400000); return d.toISOString().slice(0,10); }
function isoToSerial(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); if(!m) return null; return Math.round((Date.UTC(+m[1],+m[2]-1,+m[3]) - Date.UTC(1899,11,30))/86400000); }

// 머리글 "성명" 행을 찾고, 그 아래부터 "합계" 행 전까지를 직원 구역으로 본다
function invInspect(doc, shared){
  const sd = doc.getElementsByTagNameNS(SSML,'sheetData')[0];
  const rows = kids(sd,'row');
  let headerRow=null, cols={};
  for(const r of rows){
    const cells = rowCells(r);
    const labels = {};
    for(const col in cells){ const v = cellValue(cells[col], shared); if(typeof v==='string') labels[v.replace(/\s+/g,'')] = col; }
    if(labels['성명'] && (labels['구분'] || labels['입사일'])){
      headerRow = +r.getAttribute('r');
      const pick = re => { for(const l in labels) if(re.test(l)) return labels[l]; return null; };
      cols = {no: pick(/^No$/i), name: labels['성명'], grade: pick(/^구분$/), store: pick(/^매장명?$/), hire: pick(/^입사일/), term: pick(/^퇴사일/),
              days: pick(/^근무일수/), ot: pick(/^연장근무$/), night: pick(/^야간근무$/), hol: pick(/^휴일근무$/)};
      break;
    }
  }
  if(headerRow==null) throw new Error('세부정산내역 시트에서 "성명" 머리글 행을 찾지 못했습니다.');
  const missing = ['grade','store','hire','term','days','ot','night','hol'].filter(k=>!cols[k]);
  if(missing.length) throw new Error('세부정산내역 머리글에서 찾지 못한 칸이 있습니다: ' + missing.map(k=>({grade:'구분',store:'매장명',hire:'입사일',term:'퇴사일',days:'근무일수',ot:'연장근무',night:'야간근무',hol:'휴일근무'})[k]).join(', '));
  let totalRow=null; const employees=[];
  for(const r of rows){
    const rn = +r.getAttribute('r'); if(rn<=headerRow) continue;
    const cells = rowCells(r);
    const a = cellValue(cells.A, shared), b = cellValue(cells[cols.name], shared);
    if((typeof a==='string' && a.replace(/\s/g,'')==='합계') || (typeof b==='string' && b.replace(/\s/g,'')==='합계')){ totalRow = rn; break; }
    employees.push({row: rn, name: typeof b==='string' ? b.trim() : (b==null?'':String(b)),
      grade: cellValue(cells[cols.grade], shared) ?? '', store: cellValue(cells[cols.store], shared) ?? '',
      hire: serialToISO(cellValue(cells[cols.hire], shared)), term: serialToISO(cellValue(cells[cols.term], shared)),
      days: cellValue(cells[cols.days], shared), ot: cellValue(cells[cols.ot], shared), night: cellValue(cells[cols.night], shared), hol: cellValue(cells[cols.hol], shared)});
  }
  if(totalRow==null) throw new Error('세부정산내역 시트에서 "합계" 행을 찾지 못했습니다.');
  // 성명·매장명 칸이 여러 행에 걸쳐 병합돼 있으면 (이전 결과 파일 등) 이름을 1명만 읽게 된다
  const mergedCols = new Set();
  Array.from(doc.getElementsByTagNameNS(SSML,'mergeCell')).forEach(mc=>{
    const m = /^([A-Z]+)(\d+):([A-Z]+)(\d+)$/.exec(mc.getAttribute('ref')||''); if(!m) return;
    if(+m[4] > +m[2] && +m[2] > headerRow && +m[2] < totalRow) for(let ci=colToNum(m[1]); ci<=colToNum(m[3]); ci++) mergedCols.add(numToCol(ci));
  });
  const mergedNames = mergedCols.has(cols.name);
  const first = headerRow+1, last = totalRow-1;
  // 정산일자·기준일수 칸 (머리글 바로 위 행)
  let periodCell=null, baseDaysCell=null;
  for(const r of rows){
    const rn = +r.getAttribute('r'); if(rn>=headerRow) break;
    const cells = rowCells(r);
    for(const col in cells){
      const v = cellValue(cells[col], shared);
      if(typeof v!=='string') continue;
      const k = v.replace(/\s/g,'');
      const right = numToCol(colToNum(col)+1);
      if(k==='정산일자') periodCell = `${right}${rn}`;
      if(k==='기준일수') baseDaysCell = `${right}${rn}`;
    }
  }
  const grades = [];
  return {headerRow, first, last, totalRow, cols, employees: employees.filter(e=>e.name), allRows: employees, periodCell, baseDaysCell, grades, mergedNames, mergedCols:[...mergedCols]};
}

/* ---- 직급참고시트의 구분 목록 (VLOOKUP 대상) ---- */
// 직급참고시트의 직급 순서 → 정렬 순위 (없는 직급은 맨 뒤)
function invGradeRank(grades){
  const list = (grades||[]).map(g=>String(g).replace(/\s+/g,''));
  return g => { const k = String(g||'').replace(/\s+/g,''); const i = list.indexOf(k); return i<0 ? list.length : i; };
}
async function invGrades(ctx){
  // 세부정산내역 수식에서 VLOOKUP 범위를 찾는다: '시트'!$B$3:$H$7
  const sheetXml = await ctx.zip.file(ctx.sheet.path).async('string');
  const m = /VLOOKUP\([A-Z]+\d+,((?:'(?:[^']|'')+'|[^!,()]+))!\$?([A-Z]+)\$?(\d+):\$?[A-Z]+\$?(\d+)/.exec(sheetXml.replace(/&apos;/g,"'"));
  if(!m) return [];
  const sname = sheetOfPrefix(m[1]+'!'), col = m[2], r1 = +m[3], r2 = +m[4];
  const s = ctx.sheets.find(x=>x.name===sname); if(!s) return [];
  const doc = parseXml(await ctx.zip.file(s.path).async('string'));
  const out = [];
  kids(doc.getElementsByTagNameNS(SSML,'sheetData')[0],'row').forEach(r=>{
    const rn = +r.getAttribute('r'); if(rn<r1 || rn>r2) return;
    const v = cellValue(rowCells(r)[col], ctx.shared);
    if(typeof v==='string' && v.trim()) out.push(v.trim());
  });
  return out;
}

/* ---- 셀 쓰기 ---- */
function ensureCell(doc, rowEl, col, rowNum){
  const ref = col + rowNum;
  const cells = kids(rowEl,'c');
  let c = cells.find(x=>x.getAttribute('r')===ref);
  if(c) return c;
  c = doc.createElementNS(SSML,'c'); c.setAttribute('r', ref);
  const n = colToNum(col);
  const after = cells.find(x=>colToNum(cellRefParts(x.getAttribute('r')).col) > n);
  rowEl.insertBefore(c, after||null);
  return c;
}
function clearCellContent(c){ ['f','v','is'].forEach(n=>kids(c,n).forEach(x=>c.removeChild(x))); c.removeAttribute('t'); }
function writeText(doc, c, text){
  clearCellContent(c);
  if(text==null || text==='') return;
  c.setAttribute('t','inlineStr');
  const is = doc.createElementNS(SSML,'is'), t = doc.createElementNS(SSML,'t');
  t.setAttributeNS('http://www.w3.org/XML/1998/namespace', 'xml:space', 'preserve'); // 앞 공백·줄바꿈 유지
  t.textContent = String(text); is.appendChild(t); c.appendChild(is);
}
function writeNumber(doc, c, num){
  clearCellContent(c);
  if(num==null || num==='' || isNaN(+num)) return;
  const v = doc.createElementNS(SSML,'v'); v.textContent = String(+num); c.appendChild(v);
}

/* ---- 공유 수식 풀기 (행을 옮기기 전에 모든 수식을 명시적으로) ---- */
function expandSharedFormulas(doc){
  const masters = {};
  const cs = Array.from(doc.getElementsByTagNameNS(SSML,'c'));
  cs.forEach(c=>{
    const f = kid(c,'f');
    if(f && f.getAttribute('t')==='shared' && f.getAttribute('ref')!=null){
      const p = cellRefParts(c.getAttribute('r'));
      masters[f.getAttribute('si')] = {text: f.textContent, row: p.row, col: colToNum(p.col)};
    }
  });
  cs.forEach(c=>{
    const f = kid(c,'f');
    if(!f || f.getAttribute('t')!=='shared') return;
    const m = masters[f.getAttribute('si')];
    const p = cellRefParts(c.getAttribute('r'));
    if(m){
      const dCol = colToNum(p.col) - m.col;
      let text = translateFormula(m.text, p.row - m.row);
      if(dCol) text = mapFormulaRefs(text, o=>{ if(!o.c1a) o.c1 = numToCol(colToNum(o.c1)+dCol); if(o.isRange && !o.c2a) o.c2 = numToCol(colToNum(o.c2)+dCol); return fmtRef(o); });
      f.textContent = text;
    }
    f.removeAttribute('t'); f.removeAttribute('ref'); f.removeAttribute('si');
  });
}
function stripCachedFormulaValues(doc){
  Array.from(doc.getElementsByTagNameNS(SSML,'c')).forEach(c=>{
    if(!kid(c,'f')) return;
    kids(c,'v').forEach(v=>c.removeChild(v));
    const t = c.getAttribute('t'); if(t==='str' || t==='e' || t==='b' || t==='n') c.removeAttribute('t');
  });
}
function setRowNumber(rowEl, newNum){
  rowEl.setAttribute('r', String(newNum));
  kids(rowEl,'c').forEach(c=>{ const p = cellRefParts(c.getAttribute('r')); if(p) c.setAttribute('r', p.col + newNum); });
}

/* ---- 인보이스(청구내역서) 시트: 건명·기간·작성자·담당자·책임자 ---- */
function invoiceSheetOf(ctx){ return ctx.sheets.find(s=>/인보이스|청구/.test(s.name) && s!==ctx.sheet) || ctx.sheets.find(s=>s!==ctx.sheet) || null; }
// "담당자 : 홍길동 매니저 / 연락처 : … / 이메일 : …" 같은 줄에서 값만 꺼낸다
function readLabeled(text, label){ const m = new RegExp('^\\s*'+label+'\\s*:\\s*(.*)$','m').exec(text||''); return m ? m[1].trim() : ''; }
function writeLabeled(text, label, value){
  if(value==null || value==='') return text;
  const re = new RegExp('^(\\s*'+label+'\\s*:\\s*)(.*)$','m');
  return re.test(text) ? text.replace(re, (all, pre)=>pre+value) : text;
}
function retargetMonthText(text, period){
  if(!period || !text) return text;
  const [ty, tm] = period.split('-').map(Number), last = new Date(Date.UTC(ty, tm, 0)).getUTCDate();
  const pad = (n, like) => like && like.length>=2 ? String(n).padStart(2,'0') : String(n);
  let out = text.replace(/(\d{4})(\s*년\s*)(\d{1,2})(\s*월\s*)(\d{1,2})(\s*일\s*)(~|∼|～|–|-)(\s*)(\d{4})(\s*년\s*)(\d{1,2})(\s*월\s*)(\d{1,2})(\s*일)/g,
    (all, y1,a1,m1,b1,d1,c1,sep,sp,y2,a2,m2,b2,d2,c2) => `${ty}${a1}${pad(tm,m1)}${b1}${pad(1,d1)}${c1}${sep}${sp}${ty}${a2}${pad(tm,m2)}${b2}${pad(last,d2)}${c2}`);
  out = out.replace(/(\d{4})([.\-\/])(\d{1,2})\2(\d{1,2})(\s*(?:~|∼|～|–)\s*)(\d{4})([.\-\/])(\d{1,2})\7(\d{1,2})/g,
    (all, y1,s1,m1,d1,sep,y2,s2,m2,d2) => `${ty}${s1}${pad(tm,m1)}${s1}${pad(1,d1)}${sep}${ty}${s2}${pad(tm,m2)}${s2}${pad(last,d2)}`);
  out = out.replace(/(\d{4})(\s*년\s*)(\d{1,2})(\s*월)(?!\s*\d)/g, (all, y, a, m, b) => `${ty}${a}${pad(tm,m)}${b}`);
  return out;
}
async function invReadHeader(ctx){
  const s = invoiceSheetOf(ctx); if(!s) return null;
  const doc = parseXml(await ctx.zip.file(s.path).async('string'));
  const h = {sheet: s.name, writer:'', mgr:{name:'',phone:'',email:''}, boss:{name:'',phone:'',email:''}, title:'', period:''};
  Array.from(doc.getElementsByTagNameNS(SSML,'c')).forEach(c=>{
    if(kid(c,'f')) return;
    const v = cellValue(c, ctx.shared); if(typeof v!=='string') return;
    if(/작성자\s*:/.test(v)) h.writer = readLabeled(v, '작성자');
    if(/담당자\s*:/.test(v)) h.mgr = {name: readLabeled(v,'담당자'), phone: readLabeled(v,'연락처'), email: readLabeled(v,'이메일')};
    if(/책임자\s*:/.test(v)) h.boss = {name: readLabeled(v,'책임자'), phone: readLabeled(v,'연락처'), email: readLabeled(v,'이메일')};
    if(/건\s*명\s*:/.test(v)) h.title = v.replace(/^\s*건\s*명\s*:\s*/,'').trim();
    if(/\d{4}\s*년\s*\d{1,2}\s*월\s*\d{1,2}\s*일\s*[~∼～–-]/.test(v)) h.period = (/\d{4}\s*년[^~∼～–-]*[~∼～–-]\s*\d{4}\s*년\s*\d{1,2}\s*월\s*\d{1,2}\s*일/.exec(v)||[''])[0];
  });
  return h;
}
async function invUpdateInvoiceSheet(ctx, opts){
  const s = invoiceSheetOf(ctx); if(!s) return [];
  const doc = parseXml(await ctx.zip.file(s.path).async('string'));
  const changed = [];
  const m = opts.meta || {};
  Array.from(doc.getElementsByTagNameNS(SSML,'c')).forEach(c=>{
    if(kid(c,'f')) return;
    const v = cellValue(c, ctx.shared); if(typeof v!=='string' || !v.trim()) return;
    let nv = v;
    if(/\d{4}\s*년\s*\d{1,2}\s*월/.test(nv) || /\d{4}[.\-\/]\d{1,2}[.\-\/]\d{1,2}\s*[~∼～–]/.test(nv)) nv = retargetMonthText(nv, opts.period);
    if(/작성자\s*:/.test(nv)) nv = writeLabeled(nv, '작성자', m.writer);
    if(/담당자\s*:/.test(nv)){ nv = writeLabeled(nv,'담당자', m.mgrName); nv = writeLabeled(nv,'연락처', m.mgrPhone); nv = writeLabeled(nv,'이메일', m.mgrEmail); }
    if(/책임자\s*:/.test(nv)){ nv = writeLabeled(nv,'책임자', m.bossName); nv = writeLabeled(nv,'연락처', m.bossPhone); nv = writeLabeled(nv,'이메일', m.bossEmail); }
    if(nv!==v){ writeText(doc, c, nv); changed.push({ref: c.getAttribute('r'), from: v, to: nv}); }
  });
  if(changed.length) ctx.zip.file(s.path, serializeXml(doc));
  return changed;
}

/* ---- 메인: 반영된 xlsx 만들기 ----
   plan: [{name, grade, store, hire, term, days, ot, night, hol, srcRow|null}] — 출력 순서대로
   srcRow가 있으면 그 행을 그대로 옮겨 쓰고(개인별 수식·메모 유지), 없으면 비슷한 행을 복제한다. */
async function invBuild(ctx, plan, opts){
  const {zip, sheets, sheet} = ctx;
  const info = ctx.info;
  const doc = parseXml(await zip.file(sheet.path).async('string'));
  expandSharedFormulas(doc);
  const sd = doc.getElementsByTagNameNS(SSML,'sheetData')[0];
  const rowEls = {}; kids(sd,'row').forEach(r=>rowEls[+r.getAttribute('r')] = r);
  const {first, last, cols} = info;
  const n = plan.length;
  if(n===0) throw new Error('반영할 직원이 없습니다.');

  // 새로 넣을 직원이 복제할 행: 같은 구분의 기존 행 → 가장 흔한 형태의 행
  const blockRows = []; for(let r=first; r<=last; r++) if(rowEls[r]) blockRows.push(r);
  const fCount = r => kids(rowEls[r],'c').filter(c=>kid(c,'f')).length;
  const employeesByRow = {}; info.allRows.forEach(e=>employeesByRow[e.row]=e);
  const fallbackRow = blockRows.filter(r=>employeesByRow[r] && employeesByRow[r].name).sort((a,b)=>fCount(b)-fCount(a))[0] || blockRows[0];
  const templateFor = grade => {
    const same = blockRows.filter(r=>employeesByRow[r] && employeesByRow[r].grade===grade).sort((a,b)=>fCount(b)-fCount(a));
    return same[0] || fallbackRow;
  };

  const oldToNew = new Map();
  const newRows = plan.map((p,i)=>{
    const newNum = first + i;
    let src = p.srcRow, el;
    if(src!=null && rowEls[src]){ el = rowEls[src]; oldToNew.set(src, newNum); }
    else { src = templateFor(p.grade); el = rowEls[src].cloneNode(true); el.__cloned = true; }
    return {p, el, src, newNum};
  });
  const rm = makeRowMap(first, last, n, oldToNew);

  // 0) 직원 구역 안의 셀 병합은 따로 다룬다 (구조 이동으로 늘리면 No·성명·매장명이 한 칸으로 합쳐진다)
  //    - 한 행 안 병합: 그 행(또는 그 행을 복제한 행)을 따라간다
  //    - 여러 행에 걸친 병합: 풀고, 행마다 값·수식을 채운다
  const rowMerges = [], vertMerges = [];
  Array.from(doc.getElementsByTagNameNS(SSML,'mergeCell')).forEach(mc=>{
    const m = /^([A-Z]+)(\d+)(?::([A-Z]+)(\d+))?$/.exec(mc.getAttribute('ref')||''); if(!m) return;
    const r1 = +m[2], r2 = m[4] ? +m[4] : r1;
    if(r2 < first || r1 > last) return;
    const g = {c1:m[1], c2:m[3]||m[1], r1, r2};
    if(r1===r2) rowMerges.push(g);
    else {
      g.anchor = {};
      const ar = rowEls[Math.max(r1, first)];
      for(let ci=colToNum(g.c1); ci<=colToNum(g.c2); ci++){
        const col = numToCol(ci), c = ar && kids(ar,'c').find(x=>x.getAttribute('r')===col+Math.max(r1, first));
        g.anchor[col] = {f: c && kid(c,'f') ? kid(c,'f').textContent : null, s: c ? c.getAttribute('s') : null, row: Math.max(r1, first),
          val: c && !kid(c,'f') && (kid(c,'v') || kid(c,'is')) ? {t: c.getAttribute('t'), node: (kid(c,'v') || kid(c,'is')).cloneNode(true)} : null};
      }
      vertMerges.push(g);
    }
    mc.parentNode.removeChild(mc);
  });

  // 1) 직원 구역 밖(위·아래) 수식: 구조 이동
  kids(sd,'row').forEach(r=>{
    const rn = +r.getAttribute('r');
    if(rn>=first && rn<=last) return;
    kids(r,'c').forEach(c=>{ const f=kid(c,'f'); if(f) f.textContent = structuralFormula(f.textContent, true, rm); });
  });
  // 2) 직원 구역: 행마다 복사 의미로 수식 이동
  newRows.forEach(x=>{
    kids(x.el,'c').forEach(c=>{ const f=kid(c,'f'); if(f) f.textContent = translateFormula(f.textContent, x.newNum - x.src); });
  });
  // 3) 행 재배치: 직원 구역을 통째로 다시 만들고, 아래 행은 delta만큼 민다
  for(let r=first; r<=last; r++) if(rowEls[r] && rowEls[r].parentNode===sd) sd.removeChild(rowEls[r]);
  const below = kids(sd,'row').filter(r=>+r.getAttribute('r')>last);
  below.forEach(r=>setRowNumber(r, +r.getAttribute('r') + rm.delta));
  const anchor = below[0] || null;
  newRows.forEach(x=>{ setRowNumber(x.el, x.newNum); sd.insertBefore(x.el, anchor); });

  // 3-1) 지난달 파일에 필터(예: 성명=최혜원)가 걸린 채 저장됐으면 나머지 행이 숨겨져 있다 → 직원 행과 합계 쪽 숨김을 풀고 필터 조건을 지운다
  const hadFilter = Array.from(doc.getElementsByTagNameNS(SSML,'filterColumn')).length > 0;
  Array.from(doc.getElementsByTagNameNS(SSML,'filterColumn')).forEach(fc=>fc.parentNode.removeChild(fc));
  newRows.forEach(x=>{ x.el.removeAttribute('hidden'); });
  if(hadFilter) kids(sd,'row').forEach(r=>{ if(+r.getAttribute('r') > first + n - 1) r.removeAttribute('hidden'); });
  // 4) 입력 칸 쓰기
  newRows.forEach(x=>{
    const {p, el, newNum} = x;
    const put = (key, fn) => { if(cols[key]) fn(ensureCell(doc, el, cols[key], newNum)); };
    put('name', c=>writeText(doc, c, p.name));
    put('grade', c=>writeText(doc, c, p.grade));
    put('store', c=>writeText(doc, c, p.store));
    put('hire', c=>writeNumber(doc, c, isoToSerial(p.hire)));
    put('term', c=>writeNumber(doc, c, isoToSerial(p.term)));
    put('days', c=>writeNumber(doc, c, p.days));
    put('ot', c=>writeNumber(doc, c, p.ot));
    put('night', c=>writeNumber(doc, c, p.night));
    put('hol', c=>writeNumber(doc, c, p.hol));
    if(el.__cloned){
      // 복제한 행은 개인별 수기 입력(기타수당 등 숫자 상수)을 비운다
      kids(el,'c').forEach(c=>{
        const col = cellRefParts(c.getAttribute('r')).col;
        if(Object.values(cols).includes(col)) return;
        if(!kid(c,'f') && (kid(c,'v') || kid(c,'is'))) clearCellContent(c);
      });
    }
  });
  // 4-1) 병합 다시 적용 / 풀린 칸 채우기
  const mcParent = doc.getElementsByTagNameNS(SSML,'mergeCells')[0];
  const freshMerges = new Set();   // 여기서 다시 붙인 병합은 아래 6)의 구조 이동에서 건드리지 않는다
  const addMerge = ref => { if(!mcParent) return; const mc = doc.createElementNS(SSML,'mergeCell'); mc.setAttribute('ref', ref); mcParent.appendChild(mc); freshMerges.add(mc); };
  newRows.forEach(x=>{
    rowMerges.forEach(g=>{ if(g.r1===x.src) addMerge(`${g.c1}${x.newNum}:${g.c2}${x.newNum}`); });
    vertMerges.forEach(g=>{
      for(const col in g.anchor){
        const a = g.anchor[col], c = ensureCell(doc, x.el, col, x.newNum);
        const empty = !kid(c,'f') && !kid(c,'v') && !kid(c,'is');
        if(empty && a.f){ const f = doc.createElementNS(SSML,'f'); f.textContent = translateFormula(a.f, x.newNum - a.row); c.insertBefore(f, c.firstChild); c.removeAttribute('t'); }
        else if(empty && a.val){ c.appendChild(a.val.node.cloneNode(true)); if(a.val.t) c.setAttribute('t', a.val.t); }   // 병합돼 있던 같은 값을 행마다
        if(!c.getAttribute('s') && a.s) c.setAttribute('s', a.s);
      }
    });
  });
  if(mcParent && !kids(mcParent,'mergeCell').length) mcParent.parentNode.removeChild(mcParent);
  // 5) 정산일자·기준일수
  if(opts && opts.period){
    const [y,m] = opts.period.split('-').map(Number);
    const lastDay = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const setRef = (ref, fn) => {
      if(!ref) return; const p = cellRefParts(ref); const row = kids(sd,'row').find(r=>+r.getAttribute('r')===p.row); if(!row) return;
      fn(ensureCell(doc, row, p.col, p.row));
    };
    setRef(info.periodCell, c=>writeText(doc, c, `${y}.${String(m).padStart(2,'0')}.01 ~ ${y}.${String(m).padStart(2,'0')}.${lastDay}`));
    setRef(info.baseDaysCell, c=>writeNumber(doc, c, lastDay));
  }
  // 6) 시트 부속 정보: dimension, autoFilter, 병합, 조건부서식
  const mapRangeText = (txt, onTarget=true) => structuralFormula(txt, onTarget, rm);
  const dim = doc.getElementsByTagNameNS(SSML,'dimension')[0];
  if(dim) dim.setAttribute('ref', mapRangeText(dim.getAttribute('ref')));
  Array.from(doc.getElementsByTagNameNS(SSML,'autoFilter')).forEach(a=>a.setAttribute('ref', mapRangeText(a.getAttribute('ref'))));
  ['sortState','sortCondition'].forEach(tag=>Array.from(doc.getElementsByTagNameNS(SSML,tag)).forEach(a=>a.setAttribute('ref', mapRangeText(a.getAttribute('ref')))));
  Array.from(doc.getElementsByTagNameNS(SSML,'mergeCell')).forEach(mc=>{ if(!freshMerges.has(mc)) mc.setAttribute('ref', mapRangeText(mc.getAttribute('ref'))); });
  Array.from(doc.getElementsByTagNameNS(SSML,'mergeCells')).forEach(mp=>mp.setAttribute('count', String(kids(mp,'mergeCell').length)));
  Array.from(doc.getElementsByTagNameNS(SSML,'conditionalFormatting')).forEach(cf=>{
    const parts = cf.getAttribute('sqref').split(/\s+/).map(rg=>{
      const m = /^([A-Z]+)(\d+)(?::([A-Z]+)(\d+))?$/.exec(rg); if(!m) return rg;
      const r1=+m[2], r2=m[4]?+m[4]:r1;
      if(r1>=first && r2<=last) return `${m[1]}${first}:${m[3]||m[1]}${first+n-1}`; // 직원 구역 안 → 새 구역 전체
      return mapRangeText(rg);
    });
    cf.setAttribute('sqref', [...new Set(parts)].join(' '));
  });
  Array.from(doc.getElementsByTagNameNS(SSML,'selection')).forEach(s=>{ s.setAttribute('activeCell', `${cols.name}${first}`); s.setAttribute('sqref', `${cols.name}${first}`); });
  stripCachedFormulaValues(doc);
  zip.file(sheet.path, serializeXml(doc));

  // 7) 메모(comments + vml): 행을 따라 옮기고, 삭제된 행의 메모는 지운다
  const relPath = sheet.path.replace(/([^/]+)$/, '_rels/$1.rels');
  if(zip.file(relPath)){
    const rels = parseXml(await zip.file(relPath).async('string'));
    const resolve = t => { const base = sheet.path.split('/').slice(0,-1); t.split('/').forEach(seg=>{ if(seg==='..') base.pop(); else if(seg!=='.') base.push(seg); }); return base.join('/'); };
    for(const r of Array.from(rels.getElementsByTagName('Relationship'))){
      const type = r.getAttribute('Type')||'', path = resolve(r.getAttribute('Target'));
      if(!zip.file(path)) continue;
      if(/\/comments$/.test(type)){
        const cdoc = parseXml(await zip.file(path).async('string'));
        Array.from(cdoc.getElementsByTagNameNS(SSML,'comment')).forEach(cm=>{
          const p = cellRefParts(cm.getAttribute('ref')); if(!p) return;
          const nr = rm.single(p.row);
          if(nr==null) cm.parentNode.removeChild(cm); else cm.setAttribute('ref', p.col+nr);
        });
        zip.file(path, serializeXml(cdoc));
      } else if(/\/vmlDrawing$/.test(type)){
        let vml = await zip.file(path).async('string');
        vml = vml.replace(/<v:shape\b[\s\S]*?<\/v:shape>/g, shape=>{
          const rowM = /<x:Row>(\d+)<\/x:Row>/.exec(shape);
          if(!rowM || !/ObjectType="Note"/.test(shape)) return shape;
          const oldRow = +rowM[1] + 1, nr = rm.single(oldRow);
          if(nr==null) return '';
          const d = nr - oldRow; if(!d) return shape;
          return shape.replace(/<x:Row>\d+<\/x:Row>/, `<x:Row>${nr-1}</x:Row>`)
            .replace(/<x:Anchor>([\s\S]*?)<\/x:Anchor>/, (all, a)=>{ const v = a.split(',').map(s=>s.trim()); v[2] = String(+v[2]+d); v[6] = String(+v[6]+d); return `<x:Anchor>${v.join(', ')}</x:Anchor>`; });
        });
        zip.file(path, vml);
      }
    }
  }
  // 8) 다른 시트에서 세부정산내역을 가리키는 수식
  for(const s of sheets){
    if(s===sheet || !zip.file(s.path)) continue;
    const text = await zip.file(s.path).async('string');
    if(!text.includes(INV_SHEET)) continue;
    const sdoc = parseXml(text);
    let touched = false;
    Array.from(sdoc.getElementsByTagNameNS(SSML,'f')).forEach(f=>{
      if(!f.textContent.includes(INV_SHEET)) return;
      const nf = structuralFormula(f.textContent, false, rm);
      if(nf!==f.textContent){ f.textContent = nf; touched = true; }
    });
    stripCachedFormulaValues(sdoc);
    zip.file(s.path, serializeXml(sdoc));
  }
  // 8-1) 인보이스 시트의 건명·기간·작성자·담당자·책임자
  if(opts && opts.period) ctx.invoiceChanges = await invUpdateInvoiceSheet(ctx, opts);
  // 9) 이름 정의(필터 범위 등) + 열 때 전체 다시 계산 + calcChain 제거
  const wbXml = parseXml(await zip.file('xl/workbook.xml').async('string'));
  Array.from(wbXml.getElementsByTagNameNS(SSML,'definedName')).forEach(dn=>{
    if(dn.textContent.includes(INV_SHEET)) dn.textContent = structuralFormula(dn.textContent, false, rm);
  });
  let calcPr = wbXml.getElementsByTagNameNS(SSML,'calcPr')[0];
  if(!calcPr){ calcPr = wbXml.createElementNS(SSML,'calcPr'); wbXml.documentElement.appendChild(calcPr); }
  calcPr.setAttribute('fullCalcOnLoad','1');
  zip.file('xl/workbook.xml', serializeXml(wbXml));
  if(zip.file('xl/calcChain.xml')){
    zip.remove('xl/calcChain.xml');
    const rels = await zip.file('xl/_rels/workbook.xml.rels').async('string');
    zip.file('xl/_rels/workbook.xml.rels', rels.replace(/<Relationship\b[^>]*calcChain[^>]*\/>/g,''));
    const ct = await zip.file('[Content_Types].xml').async('string');
    zip.file('[Content_Types].xml', ct.replace(/<Override\b[^>]*calcChain[^>]*\/>/g,''));
  }
  return await zip.generateAsync({type:'blob', compression:'DEFLATE'});
}
/* =========================================================================
   인보이스 내려받기: 근태 분석 결과 → 지난달 청구내역서의 세부정산내역 입력 칸
   ========================================================================= */
state.invoice = state.invoice || {file:null, buf:null, info:null, grades:[], rows:[], error:null, busy:false};

function normDateStr(v){
  if(v==null || v==='') return '';
  if(v instanceof Date) return ymd(v.getFullYear(), v.getMonth()+1, v.getDate()) || '';
  const s = String(v).trim();
  let m = s.match(/^(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);
  if(m) return ymd(+m[1], +m[2], +m[3]) || '';
  if(/^\d{5}(\.\d+)?$/.test(s)){ const d = XLSX.SSF.parse_date_code(+s); return d ? (ymd(d.y,d.m,d.d)||'') : ''; }
  return '';
}
function periodBounds(p){ const [y,m] = p.split('-').map(Number); return {ps: Date.UTC(y,m-1,1), pe: Date.UTC(y,m,0), y, m, days: new Date(Date.UTC(y,m,0)).getUTCDate()}; }
function employmentDays(hire, term, p){
  const {ps, pe} = periodBounds(p);
  const h = hire ? Date.parse(hire+'T00:00:00Z') : ps;
  const t = term ? Date.parse(term+'T00:00:00Z') : pe;
  const s = Math.max(h, ps), e = Math.min(t, pe);
  return e < s ? 0 : Math.round((e-s)/86400000) + 1;
}
function employedInPeriod(hire, term, p){
  const {ps, pe} = periodBounds(p);
  if(hire && Date.parse(hire+'T00:00:00Z') > pe) return false;
  if(term && Date.parse(term+'T00:00:00Z') < ps) return false;
  return true;
}
const PT_GRADE_RE = /PT|파트|알바|아르바이트|시간제|일용/i;
const WORK_OVERRIDE = new Set(['출근','지각','외출']);

// 분석 결과를 직원별로 모은다: 출근일·휴일출근일·연장·야간(분)
// 근태표에서 읽힌 이름을 직원 이름(사원명부·양식·인보이스)에 맞춘다.
// 1) 정확히 같은 이름은 그대로 2) 남은 이름끼리만 같은 길이·한 글자 차이로 1:1 연결 3) 사용자가 직접 연결한 별칭이 가장 우선
state.nameAliases = state.nameAliases || {};
function knownEmployeeNames(){
  const set = new Map();
  const add = n => { const k = normName(n); if(k && !set.has(k)) set.set(k, String(n).trim()); };
  Object.values(state.roster||{}).forEach(r=>add(r.displayName));
  if(state.target) state.target.employees.forEach(e=>add(e.name));
  if(state.invoice && state.invoice.info) state.invoice.info.employees.forEach(e=>add(e.name));
  const ob = state.generic && state.generic.overtime && state.generic.overtime._blocks;
  if(ob) Object.values(ob).forEach(b=>add(b.name));
  return set;
}
function reconcileRecordNames(){
  const known = knownEmployeeNames();
  const recNames = new Map();
  const collect = r => { if(r && r.name){ const k = normName(r.name); if(!recNames.has(k)) recNames.set(k, r.name); } };
  state.sources.forEach(s=>{ (s.records||[]).forEach(collect); (s.otRecords||[]).forEach(collect); });
  const map = {};
  // 직접 연결한 별칭
  Object.entries(state.nameAliases).forEach(([from,to])=>{ if(recNames.has(from)) map[from] = to; });
  const claimed = new Set([...recNames.keys()].filter(k=>known.has(k)));
  Object.values(map).forEach(to=>claimed.add(normName(to)));
  const pending = [...recNames.keys()].filter(k=>!known.has(k) && !map[k]);
  const free = [...known.keys()].filter(k=>!claimed.has(k));
  const near = (a,b) => a.length===b.length && a.length>=2 && editDistanceLE1(a,b);
  pending.forEach(k=>{
    const c = free.filter(f=>near(f,k));
    if(c.length!==1) return;
    const others = pending.filter(p=>p!==k && near(c[0],p));   // 같은 직원을 노리는 다른 이름이 있으면 연결하지 않는다
    if(others.length) return;
    map[k] = known.get(c[0]);
  });
  const fix = r => { if(r && r.name){ const to = map[normName(r.name)]; if(to){ r.readAs = r.readAs || r.name; r.name = to; } } };
  state.sources.forEach(s=>{ (s.records||[]).forEach(fix); (s.otRecords||[]).forEach(fix); });
  return map;
}
function invAnalysisSummary(){
  reconcileRecordNames();
  const p = state.selectedPeriod;
  const map = new Map();
  const get = name => { const k = normName(name); if(!map.has(k)) map.set(k, {name, status:{}, ot:0, night:0}); return map.get(k); };
  state.sources.forEach(s=>(s.records||[]).forEach(r=>{ if(r.name && r.date && r.date.startsWith(p)){ const x = get(r.name); x.status[r.date] = r.status; if(r.readAs && normName(r.readAs)!==normName(r.name)) x.readAs = r.readAs; } }));
  state.dateOverrides.forEach(o=>{ if(o.name && o.date && o.date.startsWith(p)) get(matchRosterName(o.name)).status[o.date] = WORK_OVERRIDE.has(o.status) ? 'O' : o.status; });
  Object.entries(state.manualCells||{}).forEach(([key,val])=>{
    const [, name, date] = key.split('||'); if(!name || !date || !date.startsWith(p)) return;
    const x = get(name); if(val==='__blank') delete x.status[date]; else x.status[date] = val;
  });
  state.sources.forEach(s=>(s.otRecords||[]).forEach(r=>{
    if(!r.name || !r.date || !r.date.startsWith(p)) return;
    const x = get(r.name), e = runEmp(r.name);
    if(/연장/.test(r.category) && e.ot) x.ot += r.minutes;
    if(/심야/.test(r.category) && e.night) x.night += r.minutes;
    if(r.category==='휴일근무'){ x.holOt = (x.holOt||0) + r.minutes; if(r.dayCount!=null) x.holDayN = (x.holDayN||0) + r.dayCount; else x.holDates = (x.holDates||[]).concat(r.date); }
  }));
  // 엑셀 근태표를 읽었으면 휴일근무는 "시간외 항목 규칙" 값만 쓴다 (없으면 0). 사진·PDF만 있을 때만 공휴일 출근일로 추정
  const hasHolData = state.sources.some(s=>s.kind==='excel' && (s.otRaw||[]).length) || otRuleHasData('휴일근무') || state.sources.some(s=>(s.otRecords||[]).some(r=>r.category==='휴일근무'));
  map.forEach(x=>{
    const work = Object.entries(x.status).filter(([,st])=>st==='O').map(([d])=>d);
    x.workDays = work.length;
    if(hasHolData){
      // 근태확인표의 휴일근무 칸 값 그대로
      x.hol = Math.round(x.holOt||0); x.holDays = new Set(x.holDates||[]).size + (x.holDayN||0);
    } else {
      // 휴일근무 칸이 없으면 법정 공휴일에 출근한 날 × 일 소정근로시간 (토·일 정기 근무는 휴일근무로 보지 않는다)
      const dayStd = parseFloat(runEmp(x.name).day);
      x.holDays = work.filter(d=>isKoreanHoliday(d)).length;
      x.hol = x.holDays * Math.round((isNaN(dayStd) ? 8 : dayStd) * 60);
    }
  });
  return map;
}
function invFindSummary(summary, name, used, known){
  const k = normName(name);
  if(summary.has(k) && !used.has(k)) return summary.get(k);
  // 같은 길이·한 글자 차이, 후보가 하나일 때만. 명단·양식에 정확히 있는 다른 직원의 기록은 후보에서 뺀다
  const cands = [...summary.entries()].filter(([key])=>!used.has(key) && !(known && known.has(key)) && key.length===k.length && k.length>=2 && editDistanceLE1(key, k));
  return cands.length===1 ? cands[0][1] : null;
}
function rosterGrade(name, grades){
  const r = state.roster[normName(name)]; if(!r) return '';
  for(const key of Object.keys(r.fields)){
    if(!/^(구분|직급|직위|직책|직무|직종)$/.test(key.replace(/\s/g,''))) continue;
    const v = String(r.fields[key]).trim();
    if(grades.includes(v)) return v;
  }
  return '';
}
function rosterField(name, re){
  const r = state.roster[normName(name)]; if(!r) return '';
  for(const key of Object.keys(r.fields)) if(re.test(key.replace(/\s/g,''))) return String(r.fields[key]).trim();
  return '';
}

function invBuildRowsFromAnalysis(){
  const inv = state.invoice, info = inv.info;
  if(!info) return;
  const p = state.selectedPeriod;
  const summary = invAnalysisSummary();
  const used = new Set();
  const storeCount = {}; info.employees.forEach(e=>{ if(e.store) storeCount[e.store] = (storeCount[e.store]||0)+1; });
  const commonStore = Object.entries(storeCount).sort((a,b)=>b[1]-a[1])[0]?.[0] || '';
  const fill = (base, x) => {
    const name = base.name;
    const rf = (state.roster[normName(name)]||{fields:{}}).fields;
    // 입사일: 기존 인보이스 행은 그 값을 그대로, 새 직원만 직원명단 값을 쓴다
    const hire = base.hire || normDateStr(findRosterValue(rf, '입사일')) || '';
    const periodStart = `${p}-01`;
    const staleTerm = t => !t
      || (hire && t < hire)                                   // 입사일보다 앞선 퇴사일 = 지난 계약
      || (t < periodStart && x && x.workDays > 0);            // 이번 달 근무 기록이 있는데 이번 달 이전 퇴사일
    let term = normDateStr(findRosterValue(rf, '퇴사일'));
    if(staleTerm(term)) term = '';
    if(!term && base.term && !staleTerm(base.term)) term = base.term;
    const grade = base.grade || rosterGrade(name, inv.grades);
    const isPT = PT_GRADE_RE.test(grade);
    return {
      name, grade,
      store: base.store || rosterField(name, /^(매장명?|점포명?)$/) || commonStore,
      hire, term,
      days: isPT && x ? x.workDays : employmentDays(hire, term, p),
      workDays: x ? x.workDays : null,
      ot: x ? Math.round(x.ot) : 0, night: x ? Math.round(x.night) : 0, hol: x ? x.hol : 0,
      holDays: x ? x.holDays : 0,
    };
  };
  // 기준 명단: 선택한 현장의 직원명단(사원명부). 명단이 있으면 명단에 있는 사람만 인보이스에 넣는다.
  const rosterList = Object.values(state.roster||{});
  const useRoster = rosterList.length > 0;
  const rosterKeyOf = name => { const m = matchRosterName(name); return state.roster[normName(m)] ? normName(m) : null; };
  const rosterUsed = new Set();
  const rows = [];
  // 정확히 같은 이름을 먼저 모두 연결하고, 남은 행만 한 글자 차이로 찾는다
  const knownNames = knownEmployeeNames();
  const exactOf = new Map();
  info.employees.forEach(e=>{ const k = normName(e.name); if(summary.has(k) && !used.has(k)){ exactOf.set(e.row, summary.get(k)); used.add(k); } });
  info.employees.forEach(e=>{
    const x = exactOf.get(e.row) || invFindSummary(summary, e.name, used, knownNames);
    if(x) used.add(normName(x.name));
    const row = fill(e, x);
    row.matched = x ? (x.readAs || x.name) : '';
    row.srcRow = e.row;
    row.kind = x ? 'keep' : 'nodata';
    const rk = rosterKeyOf(e.name);
    if(rk) rosterUsed.add(rk);
    if(useRoster && !rk){
      row.kind = 'notInRoster';   // 기존 인보이스에만 있고 이번 달 직원명단에 없는 사람 (퇴사자 등) → 행 삭제
      row.include = false;
    } else {
      row.include = x ? true : employedInPeriod(row.hire, row.term, p);
    }
    rows.push(row);
  });
  summary.forEach((x, k)=>{
    if(used.has(k)) return;
    const rk = rosterKeyOf(x.name);
    if(x.workDays===0 && !x.ot && !x.night) return; // 출근 기록이 없는 이름은 넣지 않는다
    if(rk && rosterUsed.has(rk)) return;            // 이미 다른 행으로 들어간 사람
    const row = fill({name: rk ? state.roster[rk].displayName : x.name, grade:'', store:'', hire:'', term:''}, x);
    row.matched = x.readAs || x.name;
    row.srcRow = null; row.kind = rk ? 'new' : 'unknown';
    row.include = !!rk; // 직원명단에 없는 이름은 잘못 읽힌 이름일 수 있어 기본으로 빼둔다
    if(rk) rosterUsed.add(rk);
    rows.push(row);
  });
  // 직원명단에 있는데 인보이스·근태 어디에도 없는 사람도 명단 기준으로 넣는다
  if(useRoster){
    rosterList.forEach(r=>{
      const rk = normName(r.displayName);
      if(rosterUsed.has(rk)) return;
      const row = fill({name: r.displayName, grade:'', store:'', hire:'', term:''}, null);
      row.matched = ''; row.srcRow = null; row.kind = 'rosterOnly';
      row.include = employedInPeriod(row.hire, row.term, p);
      rosterUsed.add(rk);
      rows.push(row);
    });
  }
  inv.basis = useRoster ? {roster: rosterList.length, site: (selectedSite()||{}).name || ''} : null;
  const dropCount = rows.filter(r=>r.kind==='notInRoster').length;
  if(useRoster && info.employees.length>=3 && dropCount > info.employees.length/2){
    // 명단을 잘못 읽었을 가능성이 크다 → 지우지 않고 포함해 둔 채 알린다
    rows.forEach(r=>{ if(r.kind==='notInRoster'){ r.kind = 'rosterMismatch'; r.include = true; } });
    inv.basis.suspicious = dropCount;
  }
  // 화면 표도 직급참고시트 순서로 (같은 직급은 기존 순서)
  const gRank = invGradeRank(inv.grades);
  rows.forEach((r,i)=>r._ord=i);
  rows.sort((a,b)=> gRank(a.grade) - gRank(b.grade) || a._ord - b._ord);
  rows.forEach(r=>delete r._ord);
  inv.rows = rows;
  inv.filledAt = Date.now();
}

async function invLoadFile(file){
  const inv = state.invoice;
  inv.busy = true; inv.error = null; render();
  try{
    if(typeof JSZip==='undefined') throw new Error('엑셀 처리 도구를 불러오지 못했습니다. 페이지를 새로고침해주세요.');
    const buf = await file.arrayBuffer();
    const ctx = await invLoad(buf);
    inv.file = file; inv.buf = buf; inv.info = ctx.info;
    inv.grades = await invGrades(ctx);
    inv.header = await invReadHeader(ctx);
    invBuildRowsFromAnalysis();
  }catch(err){
    inv.error = err.message || String(err);
    inv.file = file; inv.info = null; inv.rows = [];
  }
  inv.busy = false; render();
}
function invValidate(){
  const inv = state.invoice;
  const inc = inv.rows.filter(r=>r.include);
  const problems = [];
  if(!inc.length) problems.push('반영할 직원이 없습니다.');
  inc.forEach(r=>{
    if(!r.name) problems.push('성명이 비어 있는 행이 있습니다.');
    if(inv.grades.length && !inv.grades.includes(r.grade)) problems.push(`${r.name||'(이름 없음)'}: 구분을 골라주세요`);
  });
  return problems;
}
async function invDownload(meta){
  const inv = state.invoice;
  const problems = invValidate();
  if(problems.length){ inv.modalError = '받기 전에 고칠 곳이 있습니다: ' + problems.slice(0,3).join(' · '); render(); return; }
  if(!inv.buf){ inv.modalError = '인보이스 파일 내용을 찾지 못했습니다. 파일을 다시 올려주세요.'; render(); return; }
  inv.busy = true; inv.modalError = null; inv.ready = null; render();
  try{
    const ctx = await invLoad(inv.buf); // 매번 원본에서 새로 만든다
    const plan = inv.rows.filter(r=>r.include).map(r=>({
      name: r.name.trim(), grade: r.grade, store: r.store, hire: r.hire, term: r.term,
      days: r.days===''||r.days==null ? null : +r.days,
      ot: +r.ot||0, night: +r.night||0, hol: +r.hol||0, srcRow: r.srcRow,
    }));
    // 직급참고시트 순서(총괄매니저 → 관리매니저 → …)대로, 같은 직급은 기존 순서, 새 직원은 그 직급의 뒤에
    const gRank = invGradeRank(inv.grades);
    plan.sort((a,b)=> gRank(a.grade) - gRank(b.grade) || (a.srcRow==null) - (b.srcRow==null) || (a.srcRow||0) - (b.srcRow||0));
    const blob = await invBuild(ctx, plan, {period: state.selectedPeriod, meta});
    const base = inv.file.name.replace(/\.xlsx?$/i,'');
    const [py, pm] = state.selectedPeriod.split('-');
    // 파일 이름 끝의 "26.07" 같은 연월은 대상 월로 바꾼다
    const name = /\d{2}[.\-_]\d{2}\s*$/.test(base) ? base.replace(/(\d{2})([.\-_])(\d{2})\s*$/, `${py.slice(2)}$2${pm}`) : `${base}_${py.slice(2)}.${pm}`;
    inv.ready = {blob, name: `${name}.xlsx`, size: blob.size, changes: (ctx.invoiceChanges||[]).length, count: plan.length};
    inv.busy = false; render();
    invSaveReady(true); // 자동 저장을 한 번 시도하고, 막히면 창의 "파일 받기" 버튼으로 받는다
    return;
  }catch(err){
    console.error(err);
    inv.modalError = '인보이스를 만들지 못했습니다: ' + (err && err.message || err);
  }
  inv.busy = false; render();
}
async function invSaveReady(auto){
  const inv = state.invoice, r = inv.ready; if(!r) return;
  inv.saving = true; render();
  const res = await saveFile(r.name, r.blob, {quiet:true});
  inv.saving = false;
  if(res.ok){ inv.modalError = null; r.saved = true; }
  else inv.modalError = res.reason;
  render();
}

        <button type="button" class="btn ghost" data-inv="meta-cancel">${inv.ready ? '닫기' : '취소'}</button>
        ${inv.ready ? `<button type="button" class="btn primary" data-inv="save-ready" ${inv.saving?'disabled':''}>${inv.saving?'<span class="spin light"></span> 저장 중':'파일 받기'}</button>` : ''}
        <button type="submit" class="btn ${inv.ready?'':'primary'}" ${inv.busy?'disabled':''}>${inv.busy?'<span class="spin light"></span> 만드는 중':(inv.ready?'다시 만들기':'이 내용으로 받기')}</button>
      </div>
    </form>
  </div>`;
}

/* ---------- 화면 ---------- */
function viewInvoice(){

    </div>` : ''}

      `<button type="button" class="btn primary" data-inv="download" ${inv.info && !inv.error && !inv.busy ? '' : 'disabled'}>${inv.busy?'<span class="spin light"></span> 만드는 중':`인보이스 받기 (${inc.length}명)`}</button>`,
      inv.info ? (problems.length ? `⚠ ${escapeHtml(problems[0])}${problems.length>1?` 외 ${problems.length-1}건`:''}` : '세부정산내역 입력 칸과 인보이스 시트의 건명·기간·담당자만 바뀝니다.') : '지난달 인보이스 파일을 올려주세요.')}
    ${inv.modal ? invModalHtml() : ''}
  </div>`;

/* ---------- 이벤트 ---------- */
function invClick(e){
  const el = e.target.closest('[data-inv]');
  if(!el || el.disabled || el.tagName==='INPUT' || el.tagName==='SELECT') return;
  const a = el.dataset.inv, inv = state.invoice;
  if(a==='goto-analysis'){ state.menu='attendance'; state.page='convert'; goStep(state.analyzed ? 2 : (state.selectedPeriod ? 2 : 1)); return; }
  if(a==='remove'){ Object.assign(inv, {file:null, buf:null, info:null, grades:[], rows:[], error:null}); render(); return; }
  if(a==='refill'){ invBuildRowsFromAnalysis(); render(); toast('분석 결과로 다시 채웠습니다.'); return; }
  if(a==='unlink'){
    const from = normName(el.dataset.from); const to = state.nameAliases[from]; delete state.nameAliases[from];
    // 이미 바꿔둔 기록 이름을 원래 읽힌 이름으로 되돌린다
    state.sources.forEach(s=>{ [...(s.records||[]), ...(s.otRecords||[])].forEach(rc=>{ if(rc.readAs && normName(rc.readAs)===from){ rc.name = rc.readAs; delete rc.readAs; } }); });
    invBuildRowsFromAnalysis(); if(state.analyzed) rebuildGrids(); render(); toast(`"${el.dataset.from}" 연결을 풀었습니다.`); return;
  }
  if(a==='add'){ inv.rows.push({name:'', grade:'', store:(inv.rows.find(r=>r.store)||{}).store||'', hire:'', term:'', days: periodBounds(state.selectedPeriod).days, workDays:null, ot:0, night:0, hol:0, holDays:0, srcRow:null, kind:'new', include:true}); render(); return; }
  if(a==='download'){
    const problems = invValidate();
    if(problems.length){ toast(problems.slice(0,3).join(' · '), {error:true}); return; }
    state.invoice.metaDraft = null; state.invoice.modal = true; state.invoice.ready = null; state.invoice.modalError = null; render();
    setTimeout(()=>{ const i = document.querySelector('form[data-inv-form="meta"] input'); if(i) i.focus(); }, 0); return;
  }
  if(a==='meta-cancel'){ state.invoice.modal = false; state.invoice.ready = null; state.invoice.modalError = null; render(); return; }
  if(a==='save-ready'){ invSaveReady(false); return; }
}
function invChange(e){
  const el = e.target.closest('[data-inv]');
  if(!el) return;
  const a = el.dataset.inv, inv = state.invoice;
  if(a==='file'){ if(el.files[0]) invLoadFile(el.files[0]); el.value=''; return; }
  if(a==='link'){
    if(!el.value) return;
    state.nameAliases[normName(el.value)] = el.dataset.to;
    invBuildRowsFromAnalysis(); if(state.analyzed) rebuildGrids(); render();
    toast(`근태표의 "${el.value}"을(를) ${el.dataset.to}(으)로 연결했습니다.`); return;
  }
  const r = inv.rows[+el.dataset.i]; if(!r) return;
  if(a==='inc'){ r.include = el.checked; render(); return; }
  if(a==='f'){
    const k = el.dataset.k;
    r[k] = ['days','ot','night','hol'].includes(k) ? (el.value===''?'':+el.value) : el.value;
    if(k==='hire' || k==='term' || k==='grade') r.days = PT_GRADE_RE.test(r.grade) && r.workDays!=null ? r.workDays : employmentDays(r.hire, r.term, state.selectedPeriod);
    invPatchRow(+el.dataset.i); // 표를 다시 그리지 않고 바뀐 칸만 고친다 → 스크롤·커서 그대로
    return;
  }
}
// 값 하나를 고쳤을 때: 그 행의 계산 칸과 아래쪽 안내만 바꾼다
function invPatchRow(i){
  const inv = state.invoice, r = inv.rows[i]; if(!r) return;
  const q = k => document.querySelector(`#app [data-inv="f"][data-k="${k}"][data-i="${i}"]`);
  const days = q('days'); if(days && document.activeElement!==days) days.value = r.days==null ? '' : r.days;
  const grade = q('grade'); if(grade) grade.classList.toggle('bad', !!(r.include && inv.grades.length && !inv.grades.includes(r.grade)));
  const fmtMin = m => { m = +m||0; return m ? `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}` : ''; };
  ['ot','night','hol'].forEach(k=>{ const el = q(k); const note = el && el.nextElementSibling; if(note && note.classList.contains('sub-note')) note.textContent = fmtMin(r[k]); });
  const problems = invValidate(), inc = inv.rows.filter(x=>x.include).length;
  const hint = document.querySelector('#app .inv-page .action-hint');
  if(hint) hint.textContent = problems.length ? `⚠ ${problems[0]}${problems.length>1?` 외 ${problems.length-1}건`:''}` : '세부정산내역 입력 칸과 인보이스 시트의 건명·기간·담당자만 바뀝니다.';
  const btn = document.querySelector('#app .inv-page .action-bar [data-inv="download"]');
  if(btn && !inv.busy) btn.textContent = `인보이스 받기 (${inc}명)`;
}
function invDrag(e){
  const zone = e.target.closest('[data-inv-drop]'); if(!zone) return;
  e.preventDefault();
  if(e.type==='dragover') zone.classList.add('drag');
  else if(e.type==='dragleave') zone.classList.remove('drag');
  else if(e.type==='drop'){ zone.classList.remove('drag'); if(e.dataTransfer.files[0]) invLoadFile(e.dataTransfer.files[0]); }
}
function invSubmit(e){
  const form = e.target.closest('form[data-inv-form="meta"]'); if(!form) return;
  e.preventDefault();
  const meta = {}; new FormData(form).forEach((v,k)=>{ meta[k] = String(v).trim(); });
  state.invoice.metaDraft = meta;
  try{ localStorage.setItem('hrp_invoice_people', JSON.stringify(meta)); }catch(_){}
  invDownload(meta);
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && state.invoice && state.invoice.modal && !state.invoice.busy){ state.invoice.modal = false; render(); } });
(function(){
  const app = document.getElementById('app');
  app.addEventListener('submit', invSubmit);
  app.addEventListener('click', invClick);
  app.addEventListener('change', invChange);
  ['dragover','dragleave','drop'].forEach(t=>app.addEventListener(t, invDrag));
})();

   직원 로그인 · 사용자 가입 · 관리자 모드 (Vercel 서버 기능 /api/auth 사용)
   - Vercel에 올렸을 때만 로그인이 켜진다. claude.ai·내 PC에서 연 파일은 로그인 없이 쓴다.
   ========================================================================= */
const API_URL = '/api/auth';
const AUTH = {mode:'checking', view:'login', token:null, user:null, adminToken:null, adminApp:false, adminData:null,
  busy:false, msg:null, f:{}, signup:{step:1}, adminModal:false, codeSet:true};
const AUTH_DEPTS = [{v:'HR-Biz', l:'HR-Biz 사업부'}];
const AUTH_TEAMS = ['인재사업 1팀','인재사업 2팀'];
const store = {
  get(k, s){ try{ return (s?sessionStorage:localStorage).getItem(k); }catch(_){ return null; } },
  set(k, v, s){ try{ (s?sessionStorage:localStorage).setItem(k, v); }catch(_){} },
  del(k, s){ try{ (s?sessionStorage:localStorage).removeItem(k); }catch(_){} },
};
async function api(action, body, asAdmin){
  const headers = {'Content-Type':'application/json'};
  const tok = asAdmin ? AUTH.adminToken : AUTH.token;
  if(tok) headers.Authorization = 'Bearer ' + tok;
  let r;
  try{ r = await fetch(API_URL, {method:'POST', headers, cache:'no-store', body: JSON.stringify({action, ...(body||{})})}); }
  catch(_){ const e = new Error('서버에 연결하지 못했습니다. 인터넷 연결을 확인해주세요.'); e.status = 0; throw e; }
  const j = await r.json().catch(()=>({ok:false, error:'서버 응답을 읽지 못했습니다.'}));
  if(!r.ok || !j.ok){ const e = new Error(j.error || ('오류 '+r.status)); e.status = r.status; e.code = j.code; throw e; }
  return j;
}
async function authInit(){
  if(!/^https?:$/.test(location.protocol)){ AUTH.mode = 'local'; return; }
  // GitHub Pages에는 로그인 서버가 없어 로그인 없이 열리게 된다 → Vercel 주소로 안내만 한다
  if(/\.github\.io$/i.test(location.hostname)){ AUTH.mode = 'moved'; return; }
  let r, onVercel = /\.vercel\.app$/i.test(location.hostname);
  try{
    const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), 8000);
    r = await fetch(API_URL, {method:'GET', cache:'no-store', signal: ctl.signal});
    clearTimeout(tm);
    onVercel = onVercel || !!r.headers.get('x-vercel-id');
  }catch(_){ AUTH.mode = onVercel ? 'error' : 'local'; return; }
  const isJson = (r.headers.get('content-type')||'').includes('json');
  if(!isJson){ AUTH.mode = onVercel ? (r.status===404 ? 'setup-api' : 'error') : 'local'; return; }
  const j = await r.json().catch(()=>null);
  if(!j || !j.ok){ AUTH.mode = 'error'; return; }
  if(!j.ready){ AUTH.mode = 'setup'; return; }
  AUTH.mode = 'server'; AUTH.codeSet = j.codeSet;
  try{ const last = JSON.parse(store.get('hrp_last')||'null'); if(last) AUTH.f.login = last; }catch(_){}
  AUTH.token = store.get('hrp_token');
  if(AUTH.token){
    try{ AUTH.user = (await api('me')).user; }
    catch(_){ AUTH.token = null; store.del('hrp_token'); }
  }
  AUTH.adminToken = store.get('hrp_admin_token', true);
  if(AUTH.adminToken && store.get('hrp_admin_app', true)==='1') AUTH.adminApp = true;
}
function authSetMsg(type, text){ AUTH.msg = text ? {type, text} : null; }
function authLogout(){
  AUTH.token = null; AUTH.user = null; store.del('hrp_token');
  AUTH.adminApp = false; store.del('hrp_admin_app', true);
  AUTH.view = 'login'; authSetMsg('ok', '로그아웃했습니다.'); render();
}
function adminExit(){
  AUTH.adminToken = null; AUTH.adminApp = false; AUTH.adminData = null;
  store.del('hrp_admin_token', true); store.del('hrp_admin_app', true);
  AUTH.view = 'login'; authSetMsg(null); render();
}

            <thead><tr><th>이름</th><th>사내메일</th><th>소속</th><th>가입</th><th>등록일</th><th></th></tr></thead>
            <tbody>
              ${d.allow.length ? d.allow.map(a=>{ const u = users.get(a.email); return `<tr>
                <td class="emp-name">${escapeHtml(a.name)}</td><td class="mono">${escapeHtml(a.email)}</td><td>${escapeHtml(a.team||'소속 무관')}</td>
                <td>${u ? `<span class="pill good">가입 · ${escapeHtml(u.team)}</span>` : '<span class="pill">미가입</span>'}</td>
                <td class="mono muted">${fmt(a.addedAt)}</td>
                <td style="text-align:right;white-space:nowrap;">${u?`<button type="button" class="btn sm ghost" data-au="admin-reset" data-email="${escapeHtml(a.email)}" title="계정을 지워 다시 가입하게 합니다">비밀번호 초기화</button>`:''}
                  <button type="button" class="btn sm danger" data-au="admin-remove" data-email="${escapeHtml(a.email)}">명단에서 삭제</button></td>
              </tr>`; }).join('') : `<tr><td colspan="6" class="muted" style="padding:14px;">아직 명단이 없습니다. 위에서 이름과 사내메일을 추가해주세요.</td></tr>`}
            </tbody>
          </table>
        </div>
        ${orphan.length ? `<p class="desc" style="margin-top:10px;">명단에서 빠진 가입 계정 ${orphan.length}개: ${orphan.map(u=>`${escapeHtml(u.name)}(${escapeHtml(u.email)}) <button type="button" class="au-link" data-au="admin-reset" data-email="${escapeHtml(u.email)}">계정 삭제</button>`).join(', ')}</p>` : ''}
      </section>
    </main>
  </div>`;
}
async function adminLoad(){
  try{ AUTH.adminData = await api('adminGet', {}, true); }
  catch(e){ if(e.status===401){ adminExit(); authSetMsg('err','관리자 접속 시간이 지났습니다. 다시 접속해주세요.'); AUTH.adminModal = true; } else authSetMsg('err', e.message); }
  render();
}

/* ---------- 이벤트 ---------- */
function formData(form){ const o = {}; new FormData(form).forEach((v,k)=>{ o[k] = String(v).trim(); }); return o; }
async function authRun(fn){
  if(AUTH.busy) return;
  AUTH.busy = true; render();
  try{ await fn(); }
  catch(e){ if(e.code==='admin_required'){ adminExit(); AUTH.adminModal = true; authSetMsg('err','관리자 접속 시간이 지났습니다. 다시 접속해주세요.'); } else authSetMsg('err', e.message); }
  AUTH.busy = false; render();
}
async function authSubmit(e){
  const form = e.target.closest('form[data-au-form]'); if(!form) return;
  e.preventDefault();
  const kind = form.dataset.auForm, v = formData(form);
  if(kind==='login'){
    AUTH.f.login = {dept:v.dept, team:v.team, email:v.email};
    if(!v.team) return authSetMsg('err','소속을 선택해주세요.'), render();
    if(!v.email || !v.password) return authSetMsg('err','사내메일과 비밀번호를 입력해주세요.'), render();
    return authRun(async()=>{
      const j = await api('login', v);
      AUTH.token = j.token; AUTH.user = j.user; store.set('hrp_token', j.token); authSetMsg(null);
      store.set('hrp_last', JSON.stringify({dept:v.dept, team:v.team, email:v.email}));
      toast(`${j.user.name}님, 환영합니다.`);
    });
  }
  if(kind==='signup'){
    const s = AUTH.signup;
    if(s.step===1){
      AUTH.f.signup = {dept:v.dept, team:v.team, name:v.name, email:v.email};
      if(!v.dept || !v.team) return authSetMsg('err','사업부와 소속을 선택해주세요.'), render();
      if(!v.name || !v.email) return authSetMsg('err','이름과 사내메일을 입력해주세요.'), render();
      return authRun(async()=>{ const j = await api('signupCheck', AUTH.f.signup); s.existing = j.existing; s.step = 2; authSetMsg(null); });
    }
    if(s.step===2){
      if(!/^\d{4}$/.test(v.code||'')) return authSetMsg('err','가입 코드는 숫자 4자리입니다.'), render();
      return authRun(async()=>{ const j = await api('signupVerify', {...AUTH.f.signup, code:v.code}); s.ticket = j.ticket; s.step = 3; authSetMsg(null); });
    }
    if(s.step===3){
      if(v.password !== v.password2) return authSetMsg('err','비밀번호 확인이 다릅니다.'), render();
      return authRun(async()=>{
        const j = await api('signupComplete', {ticket:s.ticket, password:v.password});
        AUTH.token = j.token; AUTH.user = j.user; store.set('hrp_token', j.token);
        AUTH.signup = {step:1}; AUTH.view = 'login'; authSetMsg(null);
        toast(j.reset ? '비밀번호를 새로 정했습니다.' : `가입했습니다. ${j.user.name}님, 환영합니다.`);
      });
    }
  }
  if(kind==='admin-login'){
    if(!v.password) return authSetMsg('err','관리자 비밀번호를 입력해주세요.'), render();
    return authRun(async()=>{
      const j = await api('adminLogin', v);
      AUTH.adminToken = j.token; store.set('hrp_admin_token', j.token, true);
      AUTH.adminModal = false; AUTH.view = 'admin'; authSetMsg(null);
      AUTH.adminData = null; setTimeout(adminLoad, 0);
    });
  }
  if(kind==='admin-code'){
    if(!/^\d{4}$/.test(v.code||'')) return authSetMsg('err','가입 코드는 숫자 4자리로 정해주세요.'), render();
    return authRun(async()=>{ await api('adminSetCode', v, true); AUTH.adminData = (await api('adminGet', {}, true)); authSetMsg('ok', `가입 코드를 ${v.code}(으)로 정했습니다.`); });
  }
  if(kind==='admin-pw'){
    if(v.next !== v.next2) return authSetMsg('err','새 비밀번호 확인이 다릅니다.'), render();
    return authRun(async()=>{ await api('adminSetPassword', v, true); AUTH.adminData = (await api('adminGet', {}, true)); authSetMsg('ok','관리자 비밀번호를 바꿨습니다.'); });
  }
  if(kind==='admin-add' || kind==='admin-bulk'){
    let entries;
    if(kind==='admin-add') entries = [{name:v.name, email:v.email, team:v.team}];
    else entries = (v.rows||'').split(/\r?\n/).map(l=>l.split(/[,\t]/).map(x=>x.trim())).filter(c=>c[0]||c[1]).map(c=>({name:c[0], email:c[1]||'', team:c[2]||''}));
    if(!entries.length || entries.some(x=>!x.name || !x.email)) return authSetMsg('err','이름과 사내메일을 모두 입력해주세요.'), render();
    return authRun(async()=>{
      const j = await api('adminAddAllow', {entries}, true);
      AUTH.adminData = await api('adminGet', {}, true);
      authSetMsg(j.skipped.length?'warn':'ok', `${j.added}명을 명단에 넣었습니다.${j.skipped.length?` 넣지 못한 ${j.skipped.length}명: ${j.skipped.join(' / ')}`:''}`);
    });
  }
}
function authClick(e){
  const el = e.target.closest('[data-au]');
  if(!el || el.disabled) return;
  const a = el.dataset.au;
  if(a==='to-signup'){ AUTH.view='signup'; AUTH.signup={step:1}; AUTH.f.signup = {dept:(AUTH.f.login||{}).dept, team:(AUTH.f.login||{}).team, email:(AUTH.f.login||{}).email}; authSetMsg(null); render(); return; }
  if(a==='to-login'){ AUTH.view='login'; authSetMsg(null); render(); return; }
  if(a==='admin-open'){ AUTH.adminModal = true; authSetMsg(null); render(); setTimeout(()=>{ const i=document.getElementById('auAdminPw'); if(i) i.focus(); }, 0); return; }
  if(a==='admin-close'){ AUTH.adminModal = false; authSetMsg(null); render(); return; }
  if(a==='admin-exit'){ adminExit(); return; }
  if(a==='admin-to-app'){ AUTH.adminApp = true; store.set('hrp_admin_app','1',true); AUTH.view='login'; authSetMsg(null); render(); return; }
  if(a==='to-admin'){ AUTH.view='admin'; AUTH.adminData=null; render(); adminLoad(); return; }
  if(a==='logout'){ authLogout(); return; }
  if(a==='reload'){ location.reload(); return; }
  if(a==='allow-export'){
    const d = AUTH.adminData; if(!d) return;
    const users = new Map(d.users.map(u=>[u.email,u]));
    const aoa = [['이름','사내메일','소속','가입','등록일'], ...d.allow.map(x=>[x.name, x.email, x.team||'', users.has(x.email)?'가입':'미가입', (x.addedAt||'').slice(0,10)])];
    const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = [{wch:10},{wch:28},{wch:14},{wch:8},{wch:12}];
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '가입허용명단');
    const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const t = new Date(); const ds = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
    saveFile(`가입허용명단_${ds}.xlsx`, new Blob([out])).then(r=>{ if(r && r.ok) { authSetMsg('ok', `가입 허용 명단 ${d.allow.length}명을 엑셀로 내려받았습니다.`); render(); } });
    return;
  }
  if(a==='allow-import-pick'){ const f = document.getElementById('auAllowFile'); if(f){ f.value=''; f.click(); } return; }
  if(a==='admin-remove'){
    const email = el.dataset.email;
    if(el.dataset.confirm!=='1'){ el.dataset.confirm='1'; el.textContent='한 번 더 누르면 삭제'; setTimeout(()=>{ if(el.isConnected){ el.dataset.confirm=''; el.textContent='명단에서 삭제'; } }, 3000); return; }
    return authRun(async()=>{ await api('adminRemoveAllow', {email, alsoUser:true}, true); AUTH.adminData = await api('adminGet', {}, true); authSetMsg('ok', `${email}을(를) 명단에서 지웠습니다.`); });
  }
  if(a==='admin-reset'){
    const email = el.dataset.email;
    if(el.dataset.confirm!=='1'){ el.dataset.confirm='1'; const t=el.textContent; el.textContent='한 번 더 누르면 실행'; setTimeout(()=>{ if(el.isConnected){ el.dataset.confirm=''; el.textContent=t; } }, 3000); return; }
    return authRun(async()=>{ await api('adminRemoveUser', {email}, true); AUTH.adminData = await api('adminGet', {}, true); authSetMsg('ok', `${email} 계정을 지웠습니다. 다시 가입하면 새 비밀번호로 쓸 수 있습니다.`); });
  }
}
// 엑셀 명단 읽기: 머리글에서 이름/성명, 사내메일/이메일, 소속/팀 칸을 찾는다
function parseAllowWorkbook(wb){
  for(const sn of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:false, defval:''});
    for(let h=0; h<Math.min(rows.length, 10); h++){
      const hdr = rows[h].map(v=>String(v).replace(/\s+/g,''));
      const ni = hdr.findIndex(v=>/^(이름|성명|직원명|사원명)$/.test(v));
      const ei = hdr.findIndex(v=>/(사내)?(그룹)?(메일|이메일|e-?mail)(주소)?$/i.test(v));
      if(ni<0 || ei<0) continue;
      const ti = hdr.findIndex(v=>/^(소속|팀|부서|소속팀)$/.test(v));
      const out = [], bad = [];
      rows.slice(h+1).forEach((r,i)=>{
        const name = String(r[ni]||'').trim(), email = String(r[ei]||'').trim();
        if(!name && !email) return;
        let team = ti>=0 ? String(r[ti]||'').replace(/\s+/g,'') : '';
        team = /1팀/.test(team) ? '인재사업 1팀' : /2팀/.test(team) ? '인재사업 2팀' : '';
        if(!name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) bad.push(`${h+i+2}행 ${name||'(이름 없음)'} ${email}`);
        else out.push({name, email, team});
      });
      return {entries: out, bad, sheet: sn};
    }
  }
  return null;
}
async function importAllowFile(file){
  const sync = !!(document.getElementById('auAllowSync')||{}).checked;
  await authRun(async()=>{
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
    const parsed = parseAllowWorkbook(wb);
    if(!parsed) throw new Error('엑셀에서 "이름"과 "사내메일" 머리글을 찾지 못했습니다. 첫 줄에 이름 · 사내메일 · 소속 머리글을 넣어주세요.');
    if(!parsed.entries.length) throw new Error('엑셀에 넣을 사람이 없습니다.' + (parsed.bad.length ? ` 형식이 맞지 않는 줄: ${parsed.bad.slice(0,3).join(' / ')}` : ''));
    let added = 0;
    for(let i=0; i<parsed.entries.length; i+=500){
      const j = await api('adminAddAllow', {entries: parsed.entries.slice(i, i+500)}, true);
      added += j.added;
    }
    let removed = 0;
    if(sync){
      const keep = new Set(parsed.entries.map(e=>e.email.toLowerCase()));
      const cur = (await api('adminGet', {}, true)).allow;
      for(const x of cur){ if(!keep.has(x.email)){ await api('adminRemoveAllow', {email:x.email, alsoUser:false}, true); removed++; } }
    }
    AUTH.adminData = await api('adminGet', {}, true);
    authSetMsg(parsed.bad.length ? 'warn' : 'ok', `엑셀에서 ${added}명을 명단에 넣었습니다(이미 있던 사람은 이름·소속만 고침).${removed?` 엑셀에 없는 ${removed}명은 명단에서 지웠습니다.`:''}${parsed.bad.length?` 넣지 못한 줄 ${parsed.bad.length}개: ${parsed.bad.slice(0,4).join(' / ')}`:''}`);
  });
}
function authKey(e){ if(e.key==='Escape' && AUTH.adminModal){ AUTH.adminModal=false; authSetMsg(null); render(); } }
(function(){
  const app = document.getElementById('app');
  app.addEventListener('submit', authSubmit);
  app.addEventListener('change', e=>{ if(e.target && e.target.id==='auAllowFile' && e.target.files[0]) importAllowFile(e.target.files[0]); });
  app.addEventListener('click', authClick);
  document.addEventListener('keydown', authKey);
})();
// 앱 상단에 보여줄 로그인 정보
function authChipHtml(){
  if(AUTH.mode!=='server') return '';
  if(AUTH.user) return `<div class="tb-user"><span class="tb-user-name"><b>${escapeHtml(AUTH.user.name)}</b> · ${escapeHtml(AUTH.user.team)}</span><button type="button" class="btn sm ghost" data-au="logout">로그아웃</button></div>`;
  if(AUTH.adminApp) return `<div class="tb-user"><span class="pill warn">관리자</span><button type="button" class="btn sm" data-au="to-admin">관리자 화면</button><button type="button" class="btn sm ghost" data-au="admin-exit">나가기</button></div>`;
  return '';
}

(async function boot(){
  render();
  await Promise.all([loadSiteRegistry(), loadRuleArchive(), authInit()]);
  render();
})();
