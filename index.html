<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="ZENIEL HR-Biz 사업부 인재사업 2팀 · 월근태일괄등록, 시간외수당, 인보이스 자동화" />
<title>HR Operations Platform · ZENIEL</title>
<style>html,body{margin:0;padding:0;}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
  :root{
    --paper:#F3F8FC; --panel:#FFFFFF; --ink:#14171F; --steel:#5B6472;
    --line:#DCE6EE; --line-strong:#BFD0DD;
    --brand:#0284C7; --brand-ink:#0369A1; --sky:#38BDF8; --brand-dim:#E0F2FE; --brand-line:#BAE6FD;
    --warn:#C0721E; --warn-dim:#FBF0DE;
    --danger:#C23B3B; --danger-dim:#FBEAEA;
    --good:#1F8A5D; --good-dim:#E7F5EE;
    --off:#EDEFF3;
    --radius:10px;
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  .topbar{background:#fff;color:var(--ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:10;
    border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(12,74,110,.06);}
  .tb-row1{position:relative;display:flex;align-items:center;height:56px;padding:0 20px;}
  .tb-title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;white-space:nowrap;pointer-events:none;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;letter-spacing:.01em;color:#0C3B5A;}
  .tb-title .hr{background:linear-gradient(180deg,#38BDF8,#0284C7);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .tb-nav{display:flex;justify-content:center;align-items:center;gap:10px;padding:4px 20px 12px;flex-wrap:wrap;}
  .topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--brand),var(--sky));pointer-events:none;}
  .topbar .tb-brand{display:flex;align-items:center;gap:12px;margin-right:14px;white-space:nowrap;flex:none;}
  .topbar .tb-logo{height:36px;width:auto;display:block;}
  .topbar .tb-sub{display:flex;flex-direction:column;gap:2px;padding-left:12px;border-left:1px solid var(--line-strong);line-height:1.2;}
  .topbar .tb-sub b{font-size:12.5px;font-weight:700;color:#24435A;letter-spacing:-.01em;}
  .topbar .tb-sub span{font-size:11px;font-weight:600;color:var(--steel);}
  .topbar .tb-item{
    --lift:0px;
    display:inline-flex;align-items:center;gap:7px;flex:none;white-space:nowrap;
    font-size:13px;font-weight:700;color:#24435A;padding:8px 15px 9px;border-radius:11px;
    background:linear-gradient(180deg,#FFFFFF 0%,#EDF6FC 100%);
    border:1px solid #CFE0EC;
    box-shadow:inset 0 1px 0 #fff, 0 3px 0 #C3D8E7, 0 5px 10px rgba(2,132,199,.10);
    transform:translateY(var(--lift));
    transition:transform .16s cubic-bezier(.3,.7,.4,1.4), box-shadow .16s ease, background .16s ease, color .16s ease, border-color .16s ease;
  }
  .topbar .tb-item svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:.85;}
  .topbar .tb-item:hover{--lift:-2px;color:var(--brand-ink);border-color:#9FD3F2;
    background:linear-gradient(180deg,#FFFFFF 0%,#E0F2FE 100%);
    box-shadow:inset 0 1px 0 #fff, 0 5px 0 #A9CDE6, 0 10px 18px rgba(2,132,199,.22);}
  .topbar .tb-item:active{--lift:2px;box-shadow:inset 0 2px 4px rgba(2,132,199,.18), 0 1px 0 #C3D8E7;transition-duration:.06s;}
  .topbar .tb-item.on{color:#fff;border-color:#0277B6;
    background:linear-gradient(180deg,#4CC6F9 0%,#0EA5E9 45%,#0284C7 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 3px 0 #01659C, 0 6px 14px rgba(2,132,199,.35);
    text-shadow:0 1px 0 rgba(1,80,125,.35);}
  .topbar .tb-item.on svg{opacity:1;}
  .topbar .tb-item.on:hover{--lift:-2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 5px 0 #01659C, 0 10px 20px rgba(2,132,199,.42);}
  .topbar .tb-item.on:active{--lift:2px;box-shadow:inset 0 2px 5px rgba(1,80,125,.35), 0 1px 0 #01659C;}
  .topbar .tb-item:focus-visible{outline:2px solid var(--brand);outline-offset:3px;}
  @media (prefers-reduced-motion: reduce){ .topbar .tb-item{transition:none;} .topbar .tb-item:hover,.topbar .tb-item:active,.topbar .tb-item.on:hover,.topbar .tb-item.on:active{--lift:0px;} }
  @media (max-width:1100px){ .topbar .tb-sub span{display:none;} }
  @media (max-width:900px){ .topbar .tb-sub{display:none;} .tb-title{font-size:17px;} }
  .erp-body{min-height:calc(100vh - 110px);}

  .shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100%;}
  @media (max-width:860px){ .shell{grid-template-columns:1fr;} .rail{position:static;flex-direction:row;overflow-x:auto;} }
  .rail{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:110px;height:calc(100vh - 110px);display:flex;flex-direction:column;gap:2px;}
  .rail-brand{font-family:'Space Grotesk';font-weight:700;font-size:14.5px;margin-bottom:22px;display:flex;align-items:center;gap:8px;}
  .rail-brand .dot{width:8px;height:8px;border-radius:2px;background:var(--brand);}
  .step{display:flex;gap:11px;padding:10px 9px;border-radius:8px;width:100%;text-align:left;background:none;border:none;font:inherit;color:inherit;}
  .step:not(:disabled):hover{background:var(--off);}
  .step:disabled{cursor:default;opacity:.55;}
  .step .lbl,.step .sub{display:block;}
  .step .num{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--steel);width:18px;flex:none;padding-top:1px;}
  .step .lbl{font-size:13px;font-weight:500;color:var(--steel);line-height:1.4;}
  .step .sub{font-size:11px;color:#8891A0;margin-top:2px;}
  .step.active{background:var(--brand-dim);}
  .step.active .num,.step.active .lbl{color:var(--brand-ink);}
  .step.done .num{color:var(--good);}
  .step.done .lbl{color:var(--ink);}
  .rail-foot{margin-top:auto;font-size:10.5px;color:#9AA3B0;line-height:1.7;padding:8px;}

  .main{padding:22px 28px 40px;max-width:1440px;width:100%;min-width:0;}
  @media (max-width:860px){ .main{padding:22px 16px 60px;} }
  .page-head{margin-bottom:16px;}
  .page-head h1{font-family:'Space Grotesk';font-size:21px;margin:0 0 6px;}
  .page-head p{color:var(--steel);font-size:13px;margin:0;max-width:820px;line-height:1.6;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;min-width:0;}
  .panel h2{font-family:'Space Grotesk';font-size:14.5px;margin:0 0 4px;}
  .panel .desc{color:var(--steel);font-size:12.5px;margin:0 0 14px;line-height:1.6;}

  .drop{border:1.5px dashed var(--line-strong);border-radius:var(--radius);padding:18px 16px;text-align:center;position:relative;background:var(--paper);}
  .drop.drag{border-color:var(--brand);background:var(--brand-dim);}
  .drop .icon{font-size:20px;margin-bottom:6px;}
  .drop .t1{font-size:13px;font-weight:600;}
  .drop .t2{font-size:11.5px;color:var(--steel);margin-top:3px;}
  .drop input{position:absolute;inset:0;opacity:0;cursor:pointer;}

  .file-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-top:9px;background:var(--paper);}
  .file-row .fi{flex:1;min-width:0;}
  .file-row .fname{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .file-row .fmeta{font-size:11px;color:var(--steel);margin-top:2px;}
  .file-row .x{border:none;background:none;color:#9AA3B0;font-size:15px;padding:4px;}
  .file-row .x:hover{color:var(--danger);}
  .file-row select{border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px;font-size:12px;}

  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);font-size:12.5px;font-weight:600;padding:9px 15px;border-radius:8px;}
  .btn:hover{border-color:var(--brand);color:var(--brand-ink);}
  .btn.primary:hover,.btn.brand:hover{color:#fff;}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);}
  .btn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink);}
  .btn.brand{background:var(--brand);color:#fff;border-color:var(--brand);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn.danger{color:var(--danger);border-color:#E9C3C3;}
  .btn.danger:hover{background:var(--danger-dim);border-color:var(--danger);}
  .btn.sm{padding:6px 10px;font-size:11.5px;}
  .btn.ghost{background:none;border-color:transparent;color:var(--steel);}
  .btn.ghost:hover{color:var(--ink);}
  .row-actions{display:flex;gap:9px;margin-top:16px;justify-content:flex-end;}

  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;}
  .seg button{border:none;background:var(--panel);padding:8px 13px;font-size:12px;font-weight:600;color:var(--steel);}
  .seg button.on{background:var(--brand);color:#fff;}

  .pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;}
  .pill.warn{background:var(--warn-dim);color:#8A5A15;}
  .pill.good{background:var(--good-dim);color:var(--good);}
  .pill.brand{background:var(--brand-dim);color:var(--brand-ink);}

  table.list{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.list th{text-align:left;font-family:'IBM Plex Mono';font-size:10.3px;color:var(--steel);text-transform:uppercase;letter-spacing:.02em;border-bottom:1px solid var(--line-strong);padding:8px 8px;}
  table.list td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:middle;}
  table.list tr:last-child td{border-bottom:none;}
  .inline-form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .inline-form input, .inline-form select{border:1px solid var(--line-strong);border-radius:7px;padding:8px 10px;font-size:12.3px;}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:16px;}
  @media (max-width:700px){.kpis{grid-template-columns:repeat(2,1fr);}}
  .kpi{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:13px 15px;}
  .kpi .n{font-family:'Space Grotesk';font-size:20px;font-weight:700;}
  .kpi .l{font-size:10.5px;color:var(--steel);margin-top:2px;}

  .errbox{border:1px solid #EAD3A6;background:var(--warn-dim);border-radius:8px;padding:13px 15px;margin-bottom:14px;}
  .errbox h3{font-family:'Space Grotesk';font-size:12.5px;margin:0 0 7px;color:#8A5A15;}
  .errbox ul{margin:0;padding-left:17px;font-size:12px;color:#6B4A16;line-height:1.85;}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:11px;margin-top:14px;}
  .card{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--paper);position:relative;}
  .card .thumb{height:100px;background:#EDEFF3;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  .card .thumb img{width:100%;height:100%;object-fit:cover;}
  .card .thumb .filetag{font-size:24px;color:#B7BEC9;}
  .scan{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--brand),transparent);animation:scan 1.3s linear infinite;}
  @keyframes scan{0%{top:0;}100%{top:98px;}}
  .card .body{padding:9px 11px;}
  .card .fname{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .status{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;margin-top:5px;padding:3px 7px;border-radius:20px;font-weight:600;}
  .status.wait{background:#EEF0F3;color:var(--steel);}
  .status.run{background:var(--brand-dim);color:var(--brand);}
  .status.ok{background:var(--good-dim);color:var(--good);}
  .status.err{background:var(--danger-dim);color:var(--danger);}
  .spin{width:12px;height:12px;border-radius:50%;border:2px solid rgba(2,132,199,.25);border-top-color:var(--brand);animation:sp .7s linear infinite;display:inline-block;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .errmsg{font-size:10.5px;color:var(--danger);margin-top:5px;line-height:1.5;}

  .gridwrap{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:520px;}
  table.att{border-collapse:collapse;font-size:11.5px;}
  table.att th,table.att td{border:1px solid var(--line);padding:0;text-align:center;}
  table.att th{position:sticky;top:0;background:var(--panel);font-family:'IBM Plex Mono';font-weight:500;font-size:10px;color:var(--steel);padding:6px 4px;z-index:2;white-space:nowrap;}
  table.att th.namecol{position:sticky;left:0;background:var(--panel);z-index:3;text-align:left;padding:6px 10px;min-width:80px;}
  table.att td.namecol{position:sticky;left:0;background:var(--panel);z-index:1;text-align:left;padding:6px 10px;font-weight:600;white-space:nowrap;}
  table.att td.cell{width:34px;height:28px;cursor:pointer;user-select:none;font-weight:600;}
  table.att td.cell.work{background:var(--good-dim);color:var(--good);}
  table.att td.cell.off{background:var(--off);color:var(--steel);}
  table.att td.cell.blank{background:repeating-linear-gradient(45deg,#fff,#fff 4px,#F2F3F5 4px,#F2F3F5 8px);}
  table.att td.cell.unsure{background:var(--warn-dim);color:#8A5A15;}
  table.att td.cell.custom{background:#EFE6FA;color:#6B3FA0;font-size:9.5px;}
  table.att td.cell:hover{outline:2px solid var(--brand);outline-offset:-2px;}

  .notice{font-size:11.5px;color:var(--steel);line-height:1.7;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-top:12px;}
  .notice b{color:var(--ink);}

  .promptbox{background:#0C2A3D;color:#D7DEEA;border-radius:9px;padding:16px 18px;font-family:'IBM Plex Mono';font-size:11.3px;line-height:1.75;white-space:pre-wrap;max-height:320px;overflow:auto;}
  details.promptdetails{border:1px solid var(--line);border-radius:9px;padding:14px 16px;background:var(--panel);}
  details.promptdetails summary{cursor:pointer;font-weight:600;font-size:13px;font-family:'Space Grotesk';}
  details.promptdetails summary::marker{color:var(--brand);}

  .tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;overflow:visible;border-bottom:1px solid var(--line-strong);margin:0 0 14px;padding:0;}
  .tab{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--line);border-bottom:none;background:#F7FAFD;color:var(--steel);font-size:12.5px;font-weight:600;padding:10px 10px;border-radius:9px 9px 0 0;position:relative;top:1px;transition:background .15s, color .15s;}
  .tab:hover{color:var(--ink);background:var(--off);}
  .tab.on{background:var(--panel);color:var(--brand-ink);border-color:var(--line-strong);border-bottom:1px solid var(--panel);}
  .tab .tn{font-family:'IBM Plex Mono',monospace;font-size:10.5px;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--off);color:var(--steel);}
  .tab.on .tn{background:var(--brand);color:#fff;}
  .tab .tb{font-size:10.5px;background:var(--brand-dim);color:var(--brand-ink);border-radius:10px;padding:1px 6px;}
  /* 짧은 이름 탭: 한 줄로 촘촘하게, 마우스를 올리면 원래 제목 말풍선 */
  .tabs.compact{display:flex;flex-wrap:nowrap;gap:4px;}
  .tabs.compact .tab{flex:none;overflow:visible;padding:8px 12px;font-size:12.5px;}
  .tabs.compact .tab[data-full]::after{
    content:attr(data-full);position:absolute;left:50%;bottom:calc(100% + 9px);transform:translate(-50%,4px);
    background:#0C3B5A;color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:7px;white-space:nowrap;
    box-shadow:0 6px 16px rgba(12,59,90,.25);opacity:0;pointer-events:none;transition:opacity .12s, transform .12s;z-index:30;}
  .tabs.compact .tab[data-full]::before{
    content:"";position:absolute;left:50%;bottom:calc(100% + 3px);transform:translate(-50%,4px);
    border:6px solid transparent;border-top-color:#0C3B5A;border-bottom:0;opacity:0;pointer-events:none;transition:opacity .12s, transform .12s;z-index:30;}
  .tabs.compact .tab[data-full]:hover::after,.tabs.compact .tab[data-full]:hover::before,
  .tabs.compact .tab[data-full]:focus-visible::after,.tabs.compact .tab[data-full]:focus-visible::before{opacity:1;transform:translate(-50%,0);}
  @media (prefers-reduced-motion: reduce){ .tabs.compact .tab::after,.tabs.compact .tab::before{transition:none;} }
  .tab:focus-visible,.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  .tab-panel{border-top-left-radius:0;}
  .tab-nav{display:flex;justify-content:space-between;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}
  .field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
  .fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--steel);position:relative;}
  .fld input,.fld select{border:1px solid var(--line-strong);border-radius:7px;padding:8px 10px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--panel);}
  .fld em{position:absolute;right:10px;bottom:9px;font-style:normal;font-size:11.5px;color:var(--steel);font-weight:500;pointer-events:none;}
  .fld.sm{min-width:0;}
  .fld.sm input,.fld.sm select{padding:6px 8px;font-size:12px;width:84px;}
  .fld-label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;}
  .chk{display:flex;align-items:center;gap:6px;font-size:12.5px;}
  .site-select{padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;font-size:13px;min-width:0;width:min(320px,100%);}
  .sep{height:1px;background:var(--line);margin:18px 0;}
  .run-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:14px;}
  .run-head > div:first-child{min-width:0;flex:1 1 320px;}
  .run-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .bulk{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;background:var(--brand-dim);border:1px solid var(--brand-line);border-radius:9px;padding:12px 14px;margin-bottom:12px;}
  .bulk-title{font-size:12.5px;font-weight:700;color:var(--brand-ink);align-self:center;margin-right:4px;}
  .bulk-title b{font-weight:600;color:var(--ink);margin-left:4px;}
  .tablewrap{overflow-x:auto;}
  .emp-wrap{max-height:max(260px, calc(100vh - 430px));overflow:auto;border:1px solid var(--line);border-radius:8px;}
  .emp-table th{position:sticky;top:0;background:var(--panel);z-index:1;}
  .emp-table td{padding:5px 8px;}
  .emp-table tr.changed td{background:#FFFBF2;}
  .emp-name{font-weight:600;white-space:nowrap;}
  .cellin{width:70px;border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-size:12px;font-variant-numeric:tabular-nums;background:var(--panel);color:var(--ink);}
  .cellin.ov{border-color:var(--warn);background:var(--warn-dim);font-weight:600;}
  input[type=checkbox].ov{outline:2px solid var(--warn);outline-offset:1px;}
  .offcheck{display:block;font-size:10px;font-weight:500;color:var(--steel);margin-top:1px;}
  .offcheck.bad{color:#8A5A15;font-weight:700;}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px;align-items:start;}
  .grid2 > .panel{margin-bottom:0;height:100%;}

<script>
/* ---- claude.ai 아티팩트 실행 환경 연결 ---- */
const _capCache = {};
function claudeCap(name){
  if(!_capCache[name]) _capCache[name] = (window.claude && window.claude.use) ? window.claude.use(name).catch(()=>null) : Promise.resolve(null);
  return _capCache[name];
}
async function saveFile(filename, data){
  const dl = await claudeCap('downloads');
  if(!dl){
    // claude.ai 밖(GitHub Pages, 내 PC에서 연 파일 등)에서는 브라우저 기본 다운로드를 쓴다
    try{
      const blob = data instanceof Blob ? data : new Blob([data]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
    }catch(err){ toast('파일을 저장하지 못했습니다: '+(err.message||err), {error:true}); }
    return;
  }
  try{ await dl.save({filename, data}); }
  catch(e){ if(e && e.code!=='declined') toast('저장하지 못했습니다 ('+(e.code||'오류')+')', {error:true}); }
}
/* window.storage: 내 계정 전용 db 저장소(data/users/<id>/kv) + 브라우저 저장소 백업 */
(function(){
  const CHUNK = 150000;
  let basePromise = null;
  function base(){
    if(!basePromise) basePromise = (async()=>{
      const [db, user] = await Promise.all([claudeCap('db'), claudeCap('user')]);
      if(!db || !user) return null;
      const id = await user.id().catch(()=>null);
      return id ? {db, path:'data/users/'+id+'/kv'} : null;
    })();
    return basePromise;
  }
  const ls = {
    get(k){ try{ return localStorage.getItem('kv:'+k); }catch(_){ return null; } },
    set(k,v){ try{ localStorage.setItem('kv:'+k, v); }catch(_){} },
    del(k){ try{ localStorage.removeItem('kv:'+k); }catch(_){} },
  };
  const docId = k => encodeURIComponent(k).replace(/[^A-Za-z0-9_-]/g,'_');
  window.storage = {
    async get(key){
      const b = await base();
      if(b){
        try{
          const head = await b.db.doc(b.path+'/'+docId(key)).get();
          if(head.exists){
            const d = head.data();
            let v = '';
            for(let i=0;i<(d.n||0);i++){
              const part = await b.db.doc(b.path+'/'+docId(key)+'__'+i).get();
              v += part.exists ? (part.data().v||'') : '';
            }
            return {key, value:v};
          }
        }catch(_){}
      }
      const v = ls.get(key);
      return v==null ? null : {key, value:v};
    },
    async set(key, value){
      value = String(value);
      ls.set(key, value);
      const b = await base();
      if(!b) return {key, value};
      const n = Math.max(1, Math.ceil(value.length/CHUNK));
      for(let i=0;i<n;i++) await b.db.doc(b.path+'/'+docId(key)+'__'+i).set({v:value.slice(i*CHUNK,(i+1)*CHUNK)});
      await b.db.doc(b.path+'/'+docId(key)).set({n, updatedAt:new Date().toISOString()});
      return {key, value};
    },
    async delete(key){
      ls.del(key);
      const b = await base();
      if(b){ try{ await b.db.doc(b.path+'/'+docId(key)).delete(); }catch(_){} }
      return {key, deleted:true};
    },
  };
})();
</script>

<script>
/* =========================================================================
   월근태일괄등록 자동 반영 — 대상자산출 후 양식(A~M 자동, N~ 공란)에
   현장별 근태표(사진/PDF/엑셀)를 읽어 출근/휴무(또는 시간)를 채워 넣는다.
   ========================================================================= */

const AI_SYSTEM_PROMPT = `너는 대한민국 인사/급여 담당자를 돕는 근태표 분석 AI다.
업로드된 근태표(이미지 또는 텍스트로 변환된 엑셀 표)를 분석해서, 이 표에 등장하는 "모든" 직원 각각에 대해 하루 단위로 근무 여부를 판정한다.

절대 원본 서식(현장/고객사마다 다른 양식)에 의존하지 말고, 열 이름과 값의 의미를 이해해서 판단한다. 값을 읽을 수 없으면 절대로 추측하지 말고 "?"로 표시한다.

아래 JSON 스키마로만 응답한다. 마크다운 코드블록, 설명 문장 없이 압축된 JSON 한 개만 응답한다.

스키마:
{"employees":[{"name":"직원명","days":[{"d":"YYYY-MM-DD","s":"O"}]}]}

s 값 규칙:
- "O" = 그 날 출근했다는 신호가 있는 경우 — 출근시간·퇴근시간 등 시각이 적혀 있거나, 근무시간을 나타내는 숫자(예: 8, 8.5)가 적혀 있거나, "출근"이라는 글자가 적혀 있는 경우. 셋 중 하나라도 해당하면 무조건 O.
- "X" = 그 날짜 칸에 값이 있지만 위 O 조건에 해당하지 않는 경우 — 휴무, 연차, 결근, 경조휴무, 무급, 반차, 교육 등 문구 종류에 상관없이 전부 X로 통일 (사유는 구분하지 않는다)
- "?" = 손글씨나 이미지 화질 등으로 값을 읽을 수 없어 O/X를 확신할 수 없는 경우
- 칸이 완전히 비어 있어 아무 기록도 없는 날짜(입사 전/퇴사 후 등)는 결과에 아예 포함하지 않는다

표에 날짜가 나온 범위 전체에 대해, 표에 있는 모든 직원을 빠짐없이 포함한다. 직원명은 표에 적힌 그대로 사용한다.`;

async function loadRules(){
  try{
    const r = await window.storage.get('rules', false);
    state.rules = r && r.value ? JSON.parse(r.value) : [];
  }catch(_){ state.rules = []; }
}

async function loadFieldRules(){
  try{
    const r = await window.storage.get('fieldRules', false);
    state.fieldRules = r && r.value ? JSON.parse(r.value) : [];
  }catch(_){ state.fieldRules = []; }
  // one-time migration from the older, fixed-value-only system
  try{
    const legacy = await window.storage.get('fixedValues', false);
    if(legacy && legacy.value){
      const old = JSON.parse(legacy.value);
      old.forEach(fv=>{
        if(!state.fieldRules.some(r=>r.label===fv.label)){
          state.fieldRules.push({id:uid(), label:fv.label, type:'fixed', value:fv.value});
        }
      });
      await window.storage.delete('fixedValues', false).catch(()=>{});
      saveFieldRulesBg();
    }
  }catch(_){ /* nothing to migrate */ }
}

// Tries a real write+read round trip so we can tell the user definitively
// whether their session will actually survive a refresh, instead of letting
// them discover it the hard way (this has come up repeatedly: it silently
// fails outside the live claude.ai artifact context, e.g. a downloaded copy
// opened as a local file).
async function checkStorageHealth(){
  try{
    const testKey = '__health_check__';
    await window.storage.set(testKey, String(Date.now()), false);
    const r = await window.storage.get(testKey, false);
    state.storageHealthy = !!(r && r.value);
  }catch(err){
    state.storageHealthy = false;
  }
}

}
// Snapshots a site's current rules into the name-keyed archive, so they can be
// re-applied later even if this exact site gets deleted and recreated (e.g.
// a new month's roster registered fresh under the same 현장명).
function archiveSiteRules(site){
  state.ruleArchive[site.name.normalize('NFC')] = {
    combined: JSON.parse(JSON.stringify(site.rules.combined)),
    variablepay: JSON.parse(JSON.stringify(site.rules.variablepay)),
    savedAt: new Date().toISOString(),
  };
  saveRuleArchiveBg();
}
async function loadSiteRegistry(){
  try{
    const r = await window.storage.get('siteRegistry', false);
    state.siteRegistry = r && r.value ? JSON.parse(r.value) : [];
  }catch(_){ state.siteRegistry = []; }
  if(state.siteRegistry.length===0){
    try{
      const legacy = await window.storage.get('roster', false);
      if(legacy && legacy.value){
        const parsed = JSON.parse(legacy.value);
        if(parsed.roster && Object.keys(parsed.roster).length){
          const name = (parsed.meta && parsed.meta.fileName ? parsed.meta.fileName.replace(/\.(xlsx|xls)$/i,'') : '기존 현장');
          state.siteRegistry.push({id:uid(), name, roster:parsed.roster, rosterMeta:parsed.meta, createdAt:new Date().toISOString(), rules:defaultSiteRules()});
        }
      }
    }catch(_){ /* nothing to migrate */ }
  }
  // backward compat: sites created before per-site rules existed
  let migratedAny = false;
  state.siteRegistry.forEach(site=>{ if(!site.rules){ ensureSiteRules(site); migratedAny = true; } });
  // one-time best-effort migration of the old global rule keys into the first site,
  // so nothing already configured gets silently lost
  if(state.siteRegistry.length>0){
    try{
      const [oldRules, oldFieldRules, oldFRVar, oldFROt] = await Promise.all([
        window.storage.get('rules', false).catch(()=>null),
        window.storage.get('fieldRules', false).catch(()=>null),
        window.storage.get('fieldRules_variablepay', false).catch(()=>null),
        window.storage.get('fieldRules_overtime', false).catch(()=>null),
      ]);
      const first = state.siteRegistry[0];
      const sr = ensureSiteRules(first);
      if(oldRules && oldRules.value && sr.attendance.rules.length===0){ sr.attendance.rules = JSON.parse(oldRules.value); migratedAny=true; }
      if(oldFieldRules && oldFieldRules.value && sr.attendance.fieldRules.length===0){ sr.attendance.fieldRules = JSON.parse(oldFieldRules.value); migratedAny=true; }
      if(oldFRVar && oldFRVar.value && sr.variablepay.fieldRules.length===0){ sr.variablepay.fieldRules = JSON.parse(oldFRVar.value); migratedAny=true; }
      if(oldFROt && oldFROt.value && sr.overtime.fieldRules.length===0){ sr.overtime.fieldRules = JSON.parse(oldFROt.value); migratedAny=true; }
    }catch(_){ /* nothing to migrate */ }
  }
  if(migratedAny) saveSiteRegistryBg();
}

function normName(s){ return String(s==null?'':s).replace(/\s+/g,'').trim(); }

// A generic 사원명부 parser — does not assume the header sits on row 1, the exact
// label text, or which sheet holds the data. It scans every sheet and the first
// several rows for anything that looks like a "성명"-style column, then reads
// whatever other columns exist verbatim under their own header text.
function parseRoster(wb){
  for(const sheetName of wb.SheetNames){
    const ws = wb.Sheets[sheetName];
    const ref = ws['!ref']; if(!ref) continue;
    const range = XLSX.utils.decode_range(ref);
    const maxScan = Math.min(range.e.r, range.s.r + 10);

    for(let R=range.s.r; R<=maxScan; R++){
      const headers = {};
      let nameCol = null;
      for(let C=range.s.c; C<=range.e.c; C++){
        const cell = ws[XLSX.utils.encode_cell({r:R,c:C})];
        if(!cell || cell.v==null) continue;
        const label = String(cell.v).trim();
        if(!label) continue;
        headers[C] = label;
        if(nameCol==null && /성\s*명|이\s*름|직원명|사원명|근로자명/.test(label)) nameCol = C;
      }
      if(nameCol==null) continue; // not the header row — try the next one

      const roster = {};
      for(let DR=R+1; DR<=range.e.r; DR++){
        const nc = ws[XLSX.utils.encode_cell({r:DR,c:nameCol})];
        if(!nc || nc.v==null || String(nc.v).trim()==='') continue;
        const name = String(nc.v).trim();
        if(!isPlausibleName(name)) continue; // skip stray/blank/note rows
        const fields = {};
        for(const c in headers){
          if(+c===nameCol) continue;
          const cell = ws[XLSX.utils.encode_cell({r:DR,c:+c})];
          if(!cell || cell.v==null || cell.v==='') continue;
          let val;
          if(typeof cell.v==='string') val = cell.v.trim();
          else if(cell.v instanceof Date) val = `${cell.v.getFullYear()}-${String(cell.v.getMonth()+1).padStart(2,'0')}-${String(cell.v.getDate()).padStart(2,'0')}`; // 현지 날짜 기준 (UTC로 바꾸면 하루 당겨짐)
          else val = String(cell.v);
          fields[headers[c]] = val;
        }
        roster[normName(name)] = {displayName:name, fields};
      }
      if(Object.keys(roster).length>0) return roster; // found real data — done
    }
  }
  return {};
}

const LABEL_SYNONYM_GROUPS = [
  ['입사일','그룹입사일','입사일자'],
  ['퇴사일','퇴사일자','최종퇴사일'],
];
function findRosterValue(fields, targetLabel){
  if(fields[targetLabel]!=null) return fields[targetLabel];
  for(const group of LABEL_SYNONYM_GROUPS){
    if(group.includes(targetLabel)){
      for(const alt of group){ if(fields[alt]!=null) return fields[alt]; }
    }
  }
  for(const key in fields){
    if(key.includes(targetLabel) || targetLabel.includes(key)) return fields[key];
  }
  return null;
}

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, opts){
  opts = opts || {};
  const el=document.createElement('div');
  el.className='toast';
  if(opts.error) el.style.background = 'var(--danger)';
  el.style.cursor = 'pointer';
  el.style.maxWidth = '480px';
  el.textContent = msg + (opts.error ? '  (클릭하면 닫힘)' : '');
  el.addEventListener('click', ()=>el.remove());
  document.body.appendChild(el);
  if(!opts.error) setTimeout(()=>el.remove(), 3200);
}

/* ---------------- Rules page ---------------- */
function standardHoursValue(fieldRules, label){
  const r = fieldRules.find(x=>x.label===label && x.type==='fixed');
  return r ? r.value : '';
}
function standardHoursPanel(fieldRules, siteExists, monthInputId, dayInputId, saveAct){
  return `
  <div class="panel">
    <h2>소정근로시간</h2>
    <p class="desc">양식의 "월"/"일" 열에 들어갈 소정근로시간을 직접 입력합니다. 이미 근무자 정보나 양식에 값이 있으면 그 값이 우선되고, 비어있을 때만 여기 입력한 값이 채워집니다.</p>
    <div class="inline-form" style="align-items:center;">

      <label style="font-size:12.5px;font-weight:600;margin-left:10px;">일 (시간)</label>
      <input type="number" id="${dayInputId}" ${!siteExists?'disabled':''} value="${escapeHtml(standardHoursValue(fieldRules,'일'))}" placeholder="예: 8" style="width:100px;" />
      <button class="btn sm primary" data-act="${saveAct}" ${!siteExists?'disabled':''}>저장</button>
    </div>
  </div>
  `;

/* =========================================================================
   규칙 = 현장 기본값 / 이번 변환 설정(run)
   - 규칙 관리(ctx 'site'): 현장에 저장되는 기본값을 편집한다.
   - 변환하기(ctx 'run'): 현장 기본값을 복사해서 시작하고, 이번 변환에만 바꾼다.
     직원별 소정근로시간·휴무일수·연장/야간 가능 여부를 일괄 또는 개별로 바꿀 수 있다.
   ========================================================================= */
const WEEKDAY_NAMES = ['일','월','화','수','목','금','토'];
const RULE_TABS = [
  {k:'site',  l:'현장 선택',            s:'현장'},
  {k:'hours', l:'소정근로시간·휴무일수', s:'근로시간'},
  {k:'rules', l:'등록된 규칙',          s:'규칙목록'},
  {k:'add',   l:'새 규칙 추가',         s:'규칙추가'},
  {k:'ot',    l:'연장/야간 계산 기준',   s:'연장·야간'},
  {k:'field', l:'열별 입력 규칙',       s:'열별입력'},
];
const deepCopy = o => JSON.parse(JSON.stringify(o));

function selectedSite(){ return state.siteRegistry.find(s=>s.id===state.selectedSiteId) || null; }

function initRun(siteId){
  const site = state.siteRegistry.find(s=>s.id===siteId);
  const c = site ? ensureSiteRules(site).combined : {rules:[], fieldRules:[], weekendDays:[0,6], overtimePossible:true, nightPossible:true, offDays:''};
  const prevTab = state.run ? state.run.tab : 'emps';
  state.run = {
    siteId: siteId||null,
    rules: deepCopy(c.rules||[]),
    fieldRules: deepCopy(c.fieldRules||[]),
    weekendDays: [...(c.weekendDays||[0,6])],
    overtimePossible: c.overtimePossible!==false,
    nightPossible: c.nightPossible!==false,
    offDays: c.offDays==null ? '' : String(c.offDays),
    emps: {},
    dirty: false,
    tab: prevTab,
  };
  return state.run;
}
function ensureRun(){
  if(!state.run || state.run.siteId!==(state.selectedSiteId||null)) initRun(state.selectedSiteId);
  return state.run;
}
// 분석·반영 직전에 호출: 계산 엔진이 읽는 state.* 값을 이번 변환 설정으로 맞춘다.
function useRunSettings(){
  const r = ensureRun();
  state.rules = r.rules; state.fieldRules = r.fieldRules; state.weekendDays = r.weekendDays;
  state.overtimePossible = r.overtimePossible; state.nightPossible = r.nightPossible;
  const o = state.generic.overtime;
  o.fieldRules = r.fieldRules; o.weekendDays = r.weekendDays;
  o.overtimePossible = r.overtimePossible; o.nightPossible = r.nightPossible;
  o.nightThresholdMin = NIGHT_THRESHOLD_MIN;
}

// 직원 한 명의 실제 적용값 = 이번 변환 기본값 + 그 직원만 바꾼 값
function runEmp(name){
  const r = ensureRun();
  const base = {
    month: standardHoursValue(r.fieldRules,'월'),
    day: standardHoursValue(r.fieldRules,'일'),
    offDays: r.offDays,
    ot: r.overtimePossible,
    night: r.nightPossible,
  };
  const ov = r.emps[normName(name)] || {};
  return Object.assign({}, base, ov, {overrides: ov, changed: Object.keys(ov).length>0, base});
}
function setEmpField(name, field, value){
  const r = ensureRun();
  const key = normName(name);
  const cur = r.emps[key] || {};
  const base = runEmp(name).base;
  if(String(value)===String(base[field])) delete cur[field]; else cur[field] = value;
  if(Object.keys(cur).length) r.emps[key] = cur; else delete r.emps[key];
}
// 양식의 "월"/"일"/"휴무일수" 열에 직원별 값을 넣는다.
// 그 직원만 따로 바꾼 값은 양식에 이미 값이 있어도 덮어쓴다(force).
function runEmpFieldOverride(name, label){
  const e = runEmp(name);
  const compact = String(label).replace(/\s/g,'');
  let key = null;
  if(compact==='월') key = 'month';
  else if(compact==='일') key = 'day';
  else if(compact.includes('휴무일수')) key = 'offDays';
  if(!key) return null;
  const v = e[key];
  if(v==null || v==='') return null;
  return {value: String(v), force: key in e.overrides};
}
function runEmployeeNames(){
  const names = new Map();
  Object.values(state.roster||{}).forEach(r=>names.set(normName(r.displayName), r.displayName));
  if(state.target) state.target.employees.forEach(e=>{ if(!names.has(normName(e.name))) names.set(normName(e.name), e.name); });
  return [...names.values()];
}

function rctx(ctx){

}
function rctxChanged(ctx){
  if(ctx==='run'){ state.run.dirty = true; return; }

}

/* ---- 이벤트 (한 번만 등록, #app에 위임) ---- */
function rxRead(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function rxClick(e){
  const el = e.target.closest('[data-rx]');
  if(!el || el.disabled) return;
  const act = el.dataset.rx, ctx = el.dataset.ctx;
  if(el.tagName==='INPUT' || el.tagName==='SELECT') return; // change 이벤트에서 처리
  if(act==='tab'){
    if(ctx==='site') state.rulesTab = el.dataset.v; else if(ctx==='review') state.reviewTab = el.dataset.v; else ensureRun().tab = el.dataset.v;
    render(); return;
  }
  if(act==='run-reset'){ const tab = ensureRun().tab; initRun(state.selectedSiteId); state.run.tab = tab; state.runSelected = new Set(); recomputeAfterSettings(); render(); toast('개별 변경을 모두 초기화했습니다.'); return; }
  if(act==='run-save-default'){
    const site = selectedSite(); if(!site) return;
    const r = ensureRun(), c = ensureSiteRules(site).combined;
    c.rules = deepCopy(r.rules); c.fieldRules = deepCopy(r.fieldRules); c.weekendDays = [...r.weekendDays];
    c.overtimePossible = r.overtimePossible; c.nightPossible = r.nightPossible; c.offDays = r.offDays;
    saveSiteRegistryBg(); archiveSiteRules(site);
    r.dirty = false; render(); toast(`"${site.name}" 현장 기본값으로 저장했습니다. 직원별 변경은 저장되지 않습니다.`);
    return;
  }
  if(act==='bulk-apply' || act==='bulk-reset'){
    const r = ensureRun();
    const names = runEmployeeNames().filter(n=>state.runSelected.has(normName(n)));
    if(act==='bulk-reset'){ names.forEach(n=>delete r.emps[normName(n)]); recomputeAfterSettings(); render(); toast(`${names.length}명을 기본값으로 되돌렸습니다.`); return; }
    const vals = {month:rxRead('bulkMonth'), day:rxRead('bulkDay'), offDays:rxRead('bulkOff'), ot:rxRead('bulkOt'), night:rxRead('bulkNight')};
    if(Object.values(vals).every(v=>v==='')){ toast('바꿀 값을 하나 이상 입력해주세요.', {error:true}); return; }
    names.forEach(n=>{
      ['month','day','offDays'].forEach(f=>{ if(vals[f]!=='') setEmpField(n, f, vals[f]); });
      ['ot','night'].forEach(f=>{ if(vals[f]!=='') setEmpField(n, f, vals[f]==='1'); });
    });
    recomputeAfterSettings(); render(); toast(`${names.length}명에게 일괄 적용했습니다.`); return;
  }
  if(act==='goto-rules'){ state.page='rules'; state.rulesTab='hours'; render(); return; }
  if(act==='emp-reset'){ delete ensureRun().emps[normName(el.dataset.name)]; recomputeAfterSettings(); render(); return; }

  const c = rctx(ctx);
  if(!c){ toast('먼저 현장을 선택해주세요. 규칙은 현장별로 저장됩니다.', {error:true}); return; }
  if(act==='save-hours'){
    const month = rxRead(ctx+'-stdMonth'), day = rxRead(ctx+'-stdDay'), off = rxRead(ctx+'-offDays');
    c.fieldRules = c.fieldRules.filter(r=>r.label!=='월' && r.label!=='일');
    if(month!=='') c.fieldRules.push({id:uid(), label:'월', type:'fixed', value:month});
    if(day!=='') c.fieldRules.push({id:uid(), label:'일', type:'fixed', value:day});
    c.offDays = off;
    rctxChanged(ctx); render(); toast(ctx==='site'?'현장 기본값을 저장했습니다.':'이번 변환에 적용했습니다.'); return;
  }
  if(act==='add-rule'){
    const pattern = rxRead(ctx+'-rulePattern'), action = rxRead(ctx+'-ruleAction'), value = rxRead(ctx+'-ruleValue');
    if(!pattern){ toast('감지할 텍스트를 입력해주세요.', {error:true}); return; }
    if(action==='custom' && !value){ toast('출력할 텍스트를 입력해주세요.', {error:true}); return; }
    c.rules.push({id:uid(), pattern, action, value: action==='custom'?value:''});
    rctxChanged(ctx); render(); return;
  }
  if(act==='del-rule'){ c.rules = c.rules.filter(r=>r.id!==el.dataset.id); rctxChanged(ctx); render(); return; }
  if(act==='add-fieldrule'){
    const label = rxRead(ctx+'-frLabel'), type = rxRead(ctx+'-frType');
    if(!label){ toast('양식 열 이름을 입력해주세요.', {error:true}); return; }
    const rule = {id:uid(), label, type};
    if(type==='format') rule.formatType = rxRead(ctx+'-frFormat');
    else if(type==='copy'){ rule.fromLabel = rxRead(ctx+'-frFromLabel'); if(!rule.fromLabel){ toast('원본 열 이름을 입력해주세요.', {error:true}); return; } }
    else { rule.value = rxRead(ctx+'-frValue'); if(!rule.value){ toast('값을 입력해주세요.', {error:true}); return; } }
    c.fieldRules = c.fieldRules.filter(r=>r.label!==label);
    c.fieldRules.push(rule);
    rctxChanged(ctx); render(); return;
  }
  if(act==='del-fieldrule'){ c.fieldRules = c.fieldRules.filter(r=>r.id!==el.dataset.id); rctxChanged(ctx); render(); return; }
}
function rxChange(e){
  const el = e.target.closest('[data-rx]');
  if(!el) return;
  const act = el.dataset.rx, ctx = el.dataset.ctx;
  if(act==='fr-type'){
    const v = el.value;
    document.getElementById(ctx+'-frFormatWrap').hidden = v!=='format';
    document.getElementById(ctx+'-frCopyWrap').hidden = v!=='copy';
    document.getElementById(ctx+'-frFixedWrap').hidden = v!=='fixed';
    return;
  }
  if(act==='emp-check'){
    const sel = state.runSelected || (state.runSelected = new Set());
    if(el.checked) sel.add(el.dataset.k); else sel.delete(el.dataset.k);
    render(); return;
  }
  if(act==='emp-check-all'){
    state.runSelected = el.checked ? new Set(runEmployeeNames().map(normName)) : new Set();
    render(); return;
  }
  if(act==='emp-edit'){ setEmpField(el.dataset.name, el.dataset.f, el.value.trim()); recomputeAfterSettings(); render(); return; }
  if(act==='emp-flag'){ setEmpField(el.dataset.name, el.dataset.f, el.checked); recomputeAfterSettings(); render(); return; }

  const c = rctx(ctx);
  if(!c){ toast('먼저 현장을 선택해주세요.', {error:true}); render(); return; }
  if(act==='weekend'){
    const set = new Set(c.weekendDays||[]);
    if(el.checked) set.add(+el.dataset.day); else set.delete(+el.dataset.day);
    c.weekendDays = [...set].sort();
    rctxChanged(ctx); render(); return;
  }
  if(act==='ot-possible'){ c.overtimePossible = el.checked; rctxChanged(ctx); render(); return; }
  if(act==='night-possible'){ c.nightPossible = el.checked; rctxChanged(ctx); render(); return; }
}
document.getElementById('app').addEventListener('click', rxClick);
document.getElementById('app').addEventListener('change', rxChange);

// Groups date-overrides by (employee, status) and compresses each group's
// sorted dates into consecutive ranges ("06-01~06-05") joined by "/" for
// non-consecutive stretches, instead of listing every single date.
function compressDateOverrides(overrides){
  const groups = {};
  overrides.forEach(ov=>{
    const key = ov.name+'||'+ov.status;
    if(!groups[key]) groups[key] = {name:ov.name, status:ov.status, dates:[], ids:[]};
    groups[key].dates.push(ov.date);
    groups[key].ids.push(ov.id);
  });
  return Object.values(groups).map(g=>{
    const sorted = [...g.dates].sort();
    const segments = [];
    let segStart = sorted[0], prev = sorted[0];
    for(let i=1;i<=sorted.length;i++){
      const cur = sorted[i];
      const prevMs = new Date(prev+'T00:00:00Z').getTime();
      const curMs = cur ? new Date(cur+'T00:00:00Z').getTime() : null;
      if(cur && curMs - prevMs === 86400000){ prev = cur; continue; }
      segments.push(segStart===prev ? segStart : `${segStart}~${prev}`);
      segStart = cur; prev = cur;
    }
    return {name:g.name, status:g.status, display:segments.join(' / '), ids:g.ids};
  });
}

function sourceOverallStatus(s){
  const attReq = true, otReq = true;
  const attErr = attReq && s.status==='err';
  const otErr = otReq && s.otStatus==='err';
  if(attErr || otErr) return 'err';
  const attDone = !attReq || s.status==='ok';
  const otDone = !otReq || s.otStatus==='ok';
  if(attDone && otDone) return 'ok';
  const attRun = attReq && s.status==='run';
  const otRun = otReq && s.otStatus==='run';
  if(attRun || otRun) return 'run';
  return 'wait';
}

/* ---------------- Target parsing ---------------- */
/* ---------------- 양식 파싱 (날짜·머리글을 넓게 인식) ---------------- */
const NAME_LABEL_RE = /^(성\s*명|이\s*름|직원\s*명|사원\s*명|근로자\s*명|성\s*함)$/;
function ymd(y,m,d){
  if(!(y>=1990 && y<=2100 && m>=1 && m<=12 && d>=1 && d<=31)) return null;
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function cellText(c){ return !c || c.v==null || c.v==='' ? '' : (c.w!=null ? String(c.w).trim() : String(c.v).trim()); }
// 셀 하나를 날짜(YYYY-MM-DD)로 읽는다. 엑셀 날짜 숫자, "2026-09-01", "2026.09.01", "2026/9/1",
// "2026년 9월 1일", 대상 월이 있으면 "9/1", "09-01", "9월 1일"도 인식한다.
function cellToISO(cell, period){
  if(!cell || cell.v==null || cell.v==='') return null;
  if(cell.v instanceof Date){ const d=cell.v; return ymd(d.getFullYear(), d.getMonth()+1, d.getDate()); }
  if(cell.t==='n'){
    const fmt = cell.z || '';
    const isDateFmt = fmt && typeof XLSX.SSF.is_date==='function' && XLSX.SSF.is_date(fmt);
    const looksDate = isDateFmt || (cell.w && /[\/\-.년월]/.test(cell.w) && cell.v>30000 && cell.v<80000);
    if(!looksDate) return null;
    const d = XLSX.SSF.parse_date_code(cell.v);
    return d ? ymd(d.y, d.m, d.d) : null;
  }
  const t = cellText(cell);
  let m = t.match(/^(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);
  if(m) return ymd(+m[1], +m[2], +m[3]);
  if(period){
    const [py] = period.split('-').map(Number);
    m = t.match(/^(\d{1,2})\s*[\/.\-월]\s*(\d{1,2})\s*일?\s*(\(.\))?$/);
    if(m) return ymd(py, +m[1], +m[2]);
  }
  return null;
}
// "1"~"31" 또는 "1일" 같은 일자만 있는 머리글
function cellToDay(cell){
  const t = cellText(cell);
  const m = t.match(/^(\d{1,2})\s*일?$/);
  return m && +m[1]>=1 && +m[1]<=31 ? +m[1] : null;
}
function lastDayOf(period){ const [y,m] = period.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); }

function findDateHeader(ws, range, period){
  let best = {row:-1, cols:[]};
  const end = Math.min(range.e.r, range.s.r+9);
  for(let R=range.s.r; R<=end; R++){
    const cols=[];
    for(let C=range.s.c; C<=range.e.c; C++){
      const d = cellToISO(ws[XLSX.utils.encode_cell({r:R,c:C})], period);
      if(d) cols.push({col:C, letter:XLSX.utils.encode_col(C), date:d});
    }
    if(cols.length > best.cols.length) best = {row:R, cols};
  }
  if(best.cols.length >= 5) return {...best, mode:'date'};
  if(!period) return {row:-1, cols:[], mode:'none'};
  // 일자(1~31)만 있는 머리글 → 대상 월로 날짜를 만든다
  const [py, pm] = period.split('-').map(Number);
  const maxDay = lastDayOf(period);
  let bestDay = {row:-1, cols:[]};
  for(let R=range.s.r; R<=end; R++){
    const cols=[];
    for(let C=range.s.c; C<=range.e.c; C++){
      const day = cellToDay(ws[XLSX.utils.encode_cell({r:R,c:C})]);
      if(day && day<=maxDay) cols.push({col:C, letter:XLSX.utils.encode_col(C), date:ymd(py,pm,day)});
    }
    // 같은 일자가 두 번 나오면 그 행은 일자 머리글이 아니다
    const uniq = new Set(cols.map(c=>c.date));
    if(uniq.size===cols.length && cols.length > bestDay.cols.length) bestDay = {row:R, cols};
  }
  return bestDay.cols.length >= 5 ? {...bestDay, mode:'day'} : {row:-1, cols:[], mode:'none'};
}
// 머리글 행 근처에서 "성명" 칸이 있는 행을 찾는다
function findLabelRow(ws, range, nearRow, beforeCol){
  let best=-1, bestDist=99;
  const from = Math.max(range.s.r, nearRow-4), to = Math.min(range.e.r, nearRow+4);
  for(let R=from; R<=to; R++){
    for(let C=range.s.c; C<=Math.min(range.e.c, beforeCol); C++){
      if(NAME_LABEL_RE.test(cellText(ws[XLSX.utils.encode_cell({r:R,c:C})]))){
        const dist = Math.abs(R-nearRow) + (R<nearRow?0.5:0);
        if(dist<bestDist){ best=R; bestDist=dist; }
        break;
      }
    }
  }
  return best;
}

function parseTarget(wb, selectedPeriod){
  const sheetName = wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  if(!ws || !ws['!ref']) return {sheetName, dateCols:[], employees:[], labelTexts:{}, auto:false, nameCol:null, error:'첫 번째 시트가 비어 있습니다.'};
  const range = XLSX.utils.decode_range(ws['!ref']);
  const hdr = findDateHeader(ws, range, selectedPeriod);
  const headerRow = hdr.row;
  let dateCols = hdr.cols;
  if(selectedPeriod && hdr.mode==='date'){
    const inMonth = dateCols.filter(d=>d.date.startsWith(selectedPeriod));
    if(inMonth.length>=5) dateCols = inMonth;
  }
  const firstDateCol = dateCols[0] ? dateCols[0].col : range.e.c+1;
  const weekdayRow = headerRow+1;
  dateCols.forEach(d=>{
    const c = ws[XLSX.utils.encode_cell({r:weekdayRow,c:d.col})];
    const txt = cellText(c);
    d.weekday = /^[월화수목금토일]/.test(txt) ? txt.slice(0,1) : (()=>{ const x=new Date(d.date+'T00:00:00Z').getUTCDay(); return '일월화수목금토'[x]; })();
  });

  let labelRow = headerRow>=0 ? findLabelRow(ws, range, headerRow, firstDateCol-1) : -1;
  if(labelRow<0) labelRow = headerRow>=0 ? weekdayRow : range.s.r;
  const labelTexts = {};
  for(let C=range.s.c; C<firstDateCol; C++){
    const label = cellText(ws[XLSX.utils.encode_cell({r:labelRow,c:C})]);
    if(label && !(label in labelTexts)) labelTexts[label] = C; // 첫 번째 열이 우선
  }
  const findCol = re => { for(const l in labelTexts) if(re.test(l)) return labelTexts[l]; return null; };
  const nameCol = findCol(NAME_LABEL_RE);
  const siteCol = findCol(/^현장(명)?$/);
  const empIdCol = findCol(/^사번$/);
  const hireCol = findCol(/^입사일(자)?$/);
  const termCol = findCol(/^퇴사일(자)?$/);
  const auto = nameCol!=null && dateCols.length>=5;

  const employees = [];
  const start = Math.max(labelRow, headerRow) + 1;
  for(let R=start; R<=range.e.r; R++){
    const nameCell = nameCol!=null ? ws[XLSX.utils.encode_cell({r:R,c:nameCol})] : null;
    const name = cellText(nameCell);
    if(!name || NAME_LABEL_RE.test(name) || /^(합\s*계|소\s*계|계|비\s*고)$/.test(name)) continue;
    const get = (colIdx)=>{
      if(colIdx==null) return null;
      const c = ws[XLSX.utils.encode_cell({r:R,c:colIdx})];
      if(!c || c.v==null) return null;
      const iso = cellToISO(c, null);
      if(iso) return iso;
      return cellText(c) || null;
    };
    employees.push({row:R, name, site: siteCol!=null ? (get(siteCol)||'') : '', empId:get(empIdCol), hire:get(hireCol), term:get(termCol)});
  }
  return {sheetName, headerRow, labelRow, nameCol, siteCol, labelTexts, dateCols, employees, auto, range, dateMode:hdr.mode};
}

function parseOvertimeTarget(wb){
  const sheetName = wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const range = XLSX.utils.decode_range(ws['!ref']);
  const end = Math.min(range.e.r, range.s.r+9);
  let dayRow=-1, dayCols={};
  for(let R=range.s.r; R<=end; R++){
    const found = {};
    for(let C=range.s.c; C<=range.e.c; C++){
      const cell = ws[XLSX.utils.encode_cell({r:R,c:C})];
      let day = cellToDay(cell);
      if(!day){ const iso = cellToISO(cell, state.selectedPeriod); if(iso) day = +iso.slice(8,10); }
      if(day && found[day]==null) found[day]=C;
    }
    if(Object.keys(found).length > Object.keys(dayCols).length){ dayCols=found; dayRow=R; }
  }
  const firstDayCol = Object.keys(dayCols).length ? Math.min(...Object.values(dayCols)) : range.e.c+1;
  let labelRow = dayRow>=0 ? findLabelRow(ws, range, dayRow, firstDayCol-1) : -1;
  if(labelRow<0) labelRow = dayRow+1;
  const labelTexts = {};
  let catCol=null, codeCol=null, totalMinCol=null, totalHourCol=null;
  for(let C=range.s.c; C<=range.e.c; C++){
    const label = cellText(ws[XLSX.utils.encode_cell({r:labelRow,c:C})]);
    if(label==='') continue;
    const compact = label.replace(/\s/g,'');
    if(compact==='연장시간' || compact==='시간외구분' || compact==='근무구분'){ catCol=C; continue; }
    if(compact==='코드명' || compact==='코드'){ codeCol=C; continue; }
    if(compact.includes('총시간') && compact.includes('분')){ totalMinCol=C; continue; }
    if(compact==='총시간(시)' || (compact.includes('총시간') && compact.includes('시)'))){ totalHourCol=C; continue; }
    if(C < firstDayCol && !(label in labelTexts)) labelTexts[label]=C;
  }
  // "연장시간" 머리글이 없어도, 아래 칸에 "평일연장" 같은 값이 있는 열을 구분 열로 쓴다
  if(catCol==null){
    outer: for(let R=labelRow+1; R<=Math.min(range.e.r, labelRow+40); R++){
      for(let C=range.s.c; C<firstDayCol; C++){
        if(/^(평일|휴일)(연장|심야|근무)$/.test(cellText(ws[XLSX.utils.encode_cell({r:R,c:C})]).replace(/\s/g,''))){ catCol=C; break outer; }
      }
    }
    if(catCol!=null) for(const l in labelTexts) if(labelTexts[l]===catCol) delete labelTexts[l];
  }
  let nameCol = null;
  for(const l in labelTexts) if(NAME_LABEL_RE.test(l)){ nameCol = labelTexts[l]; break; }
  const dayCount = Object.keys(dayCols).length;
  return {sheetName, dayRow, labelRow, dayCols, labelTexts, nameCol, catCol, codeCol, totalMinCol, totalHourCol, range, dateCols:[], employees:[],
    auto: nameCol!=null && dayCount>=20, nameFound: nameCol!=null, dayCount};
}

/* ---------------- Source intake ---------------- */
async function handleSourceFiles(fileList){
  const files = Array.from(fileList);
  for(const file of files){
    const kind = fileKind(file);
    const s = {id:uid(), file, kind, site: state.sites[0]||'', thumb:null, status:'wait', error:null, records:[], method:null};
    state.sources.push(s);
    if(kind==='image'){
      try{
        const raw = await readAsDataURL(file);
        s.thumb = (await compressImageDataUrl(raw)).dataUrl;
      }catch(_){ try{ s.thumb = await readAsDataURL(file); }catch(_){} }
    } else if(kind==='pdf'){
      try{ const imgs = await pdfToImages(file); s.pages = imgs; s.thumb = imgs[0]; }catch(err){ s.status='err'; s.error='PDF 변환 실패: '+(err.message||err); }
    }
  }
  render();
}
function fileKind(file){ const n=file.name.toLowerCase(); if(n.endsWith('.pdf')) return 'pdf'; if(n.endsWith('.xls')||n.endsWith('.xlsx')) return 'excel'; return 'image'; }
function readAsDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('파일을 읽을 수 없습니다')); r.readAsDataURL(file); }); }

function withTimeout(promise, ms, msg){
  let t; return Promise.race([promise, new Promise((_,rej)=>{ t=setTimeout(()=>rej(new Error(msg)), ms); })]).finally(()=>clearTimeout(t));
}
function compressImageDataUrl(dataUrl, maxDim=1568, quality=0.85){
  return withTimeout(compressImageDataUrlRaw(dataUrl, maxDim, quality), 20000, '이미지를 열지 못했습니다 (20초 초과). JPG/PNG 파일인지 확인해주세요.');
}
function compressImageDataUrlRaw(dataUrl, maxDim=1568, quality=0.85){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>{
      let {width,height} = img;
      const scale = Math.max(width,height)>maxDim ? maxDim/Math.max(width,height) : 1;
      const w=Math.round(width*scale), h=Math.round(height*scale);
      const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
      let out = canvas.toDataURL('image/jpeg', quality);
      if(out.length>3_500_000) out = canvas.toDataURL('image/jpeg',0.6);
      resolve({dataUrl:out});
    };
    img.onerror=()=>reject(new Error('이미지 디코딩 실패'));
    img.src = dataUrl;
  });
}

async function pdfToImages(file){
  if(!window.pdfjsLib) throw new Error('PDF 라이브러리를 불러오지 못했습니다.');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const images=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p);
    const viewport = page.getViewport({scale:1.8});
    const canvas=document.createElement('canvas'); canvas.width=viewport.width; canvas.height=viewport.height;
    const ctx=canvas.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    await page.render({canvasContext:ctx, viewport}).promise;
    const raw = canvas.toDataURL('image/jpeg',0.85);
    const c = await compressImageDataUrl(raw).catch(()=>({dataUrl:raw}));
    images.push(c.dataUrl);
  }
  return images;
}

/* ---------------- Deterministic parser for the company's own 근태확인표 layout ---------------- */
// A valid employee name here is 2-4 Hangul syllables — this excludes instructional
// labels some month-tabs contain (e.g. a leading "1. 예시" example column) that would
// otherwise be misread as a real employee block.
function isPlausibleName(v){
  return typeof v==='string' && /^[가-힣]{2,5}$/.test(v.trim());
}

function tryParseKnownSheet(wb, selectedPeriod){
  let allRecords = [];
  let matchedAny = false;

  // Detect "this cell is a date" purely from its raw numeric serial via SSF —
  // never from a constructed JS Date object, which can be timezone-sensitive
  // in the live browser in a way server-side testing can't reproduce.
  function dateParts(c){
    if(!c || c.t!=='n' || c.v==null) return null;
    const d = XLSX.SSF.parse_date_code(c.v);
    if(!d || !d.y || d.y<1990 || d.y>2100) return null;
    return {y:d.y, m:d.m, d:d.d};
  }

  for(const sheetName of wb.SheetNames){
    const ws = wb.Sheets[sheetName];
    const ref = ws['!ref']; if(!ref) continue;
    const range = XLSX.utils.decode_range(ref);
    for(let R=range.s.r; R<=range.e.r; R++){
      const hits=[];
      for(let C=range.s.c; C<=range.e.c; C++){
        const cell = ws[XLSX.utils.encode_cell({r:R,c:C})];
        if(cell && cell.v!=null && String(cell.v).trim()==='출근시간'){
          const c2 = ws[XLSX.utils.encode_cell({r:R,c:C+1})];
          if(c2 && c2.v!=null && String(c2.v).trim()==='퇴근시간') hits.push(C);
        }
      }
      if(hits.length<1) continue;

      // The name row has a plausible-looking name at each employee block. With
      // several blocks, a repeated label row (e.g. "퇴사일") also matches the
      // Hangul-length pattern but repeats the same text everywhere, so we
      // require at least two distinct values to rule that out — but a sheet
      // with only one employee block (e.g. a single-person weekly attendance
      // form) obviously can't have two distinct names, so that check only
      // applies once there's more than one block to compare.
      let nameRow=-1;
      for(let nr=R-1; nr>=Math.max(range.s.r,R-6); nr--){
        const vals = hits.map(c0=>{ const c=ws[XLSX.utils.encode_cell({r:nr,c:c0})]; return c?c.v:null; });
        const plausible = vals.filter(isPlausibleName);
        const distinct = new Set(plausible.map(v=>v.trim()));
        const distinctOk = hits.length>1 ? distinct.size>=2 : distinct.size>=1;
        if(plausible.length >= hits.length*0.5 && distinctOk){ nameRow = nr; break; }
      }
      if(nameRow<0) continue;

      let dateCol=-1, dateColHits=0;
      for(let C=Math.max(range.s.c, hits[0]-4); C<hits[0]; C++){
        let hitcount=0;
        for(let dr=R+1; dr<=Math.min(range.e.r,R+35); dr++){
          if(dateParts(ws[XLSX.utils.encode_cell({r:dr,c:C})])) hitcount++;
        }
        if(hitcount>dateColHits){ dateColHits=hitcount; dateCol=C; }
      }
      if(dateCol<0 || dateColHits<5) continue;

      const employees = hits.map(c0=>{
        const nameCell = ws[XLSX.utils.encode_cell({r:nameRow,c:c0})];
        return isPlausibleName(nameCell&&nameCell.v) ? {name:String(nameCell.v).trim(), col0:c0} : null;
      }).filter(Boolean);
      if(employees.length===0) continue;

      let anchorRow=-1, anchorYMD=null;
      for(let dr=R+1; dr<=range.e.r; dr++){
        const parts = dateParts(ws[XLSX.utils.encode_cell({r:dr,c:dateCol})]);
        if(parts){ anchorRow=dr; anchorYMD=parts; break; }
      }
      if(anchorRow<0) continue;
      // If the user explicitly picked a month for this conversion, trust that for
      // the calendar year/month (source files can be mislabeled or ambiguous) but
      // keep the day-of-month actually detected, since row alignment (day 1 = the
      // anchor row) is a structural fact of this template, not something to override.
      if(selectedPeriod){
        const pm = selectedPeriod.match(/^(\d{4})-(\d{2})$/);
        if(pm) anchorYMD = {y:+pm[1], m:+pm[2], d:anchorYMD.d};
      }
      const anchorMs = Date.UTC(anchorYMD.y, anchorYMD.m-1, anchorYMD.d);

      // Classify a single cell: 'work' (a real time/number value, or literal "8:00"-style
      // text, or the word 출근), 'off' (a bare "-"), 'custom' (any other non-blank text,
      // e.g. "무급" — returned verbatim), or 'blank' (no value at all).
      const classifyCell = (c)=>{
        if(!c || c.v==null || c.v==='') return {kind:'blank'};
        if(c.t==='n') return {kind:'work'}; // a real numeric/time-serial value, whatever its display format
        const disp = String(c.v).trim();
        if(disp==='') return {kind:'blank'};
        if(disp==='-') return {kind:'off'};
        // 시각(09:00), 근무시간 숫자(8, 8.5 — 텍스트로 적힌 경우 포함), "출근" 글자 → 출근
        if(/^\d{1,2}:\d{2}/.test(disp) || /^\d{1,2}(\.\d+)?$/.test(disp) || disp.includes('출근')) return {kind:'work'};
        return {kind:'custom', text:disp};
      };
      const cellText = (c)=>{
        if(!c || c.v==null || c.v==='') return '';
        return c.w!=null ? String(c.w).trim() : String(c.v).trim();
      };
      const matchRule = (text)=> text ? state.rules.find(r=>text.includes(r.pattern)) : null;
      // Combine 출근시간/퇴근시간/근무시간 with priority: a user-registered rule (from the
      // 규칙 관리 tab) wins outright if its pattern matches any of the three cells;
      // otherwise an explicit custom label (e.g. "무급") anywhere wins; otherwise
      // 근무시간 is the primary signal, falling back to 출근시간/퇴근시간 only if
      // 근무시간 itself is blank.
      const judge = (startCell, endCell, workCell)=>{
        for(const c of [workCell, startCell, endCell]){
          const rule = matchRule(cellText(c));
          if(rule){
            if(rule.action==='work') return 'O';
            if(rule.action==='off') return 'X';
            return rule.value;
          }
        }
        const st=classifyCell(startCell), en=classifyCell(endCell), wk=classifyCell(workCell);
        const custom = [wk, st, en].find(c=>c.kind==='custom');
        if(custom) return custom.text;
        if(wk.kind==='work') return 'O';
        if(wk.kind==='off') return 'X';
        if(st.kind==='work' || en.kind==='work') return 'O';
        if(st.kind==='off' || en.kind==='off') return 'X';
        return null; // no data at all
      };

      for(let i=0; i<dateColHits; i++){
        const dr = anchorRow + i;
        const dUtc = new Date(anchorMs + i*86400000);
        const dateStr = `${dUtc.getUTCFullYear()}-${String(dUtc.getUTCMonth()+1).padStart(2,'0')}-${String(dUtc.getUTCDate()).padStart(2,'0')}`;

        employees.forEach(emp=>{
          const startCell = ws[XLSX.utils.encode_cell({r:dr,c:emp.col0})];
          const endCell = ws[XLSX.utils.encode_cell({r:dr,c:emp.col0+1})];
          const workCell = ws[XLSX.utils.encode_cell({r:dr,c:emp.col0+2})]; // 근무시간
          const status = judge(startCell, endCell, workCell);
          if(status==null) return; // no data at all (pre-hire/post-term/gap)
          allRecords.push({name:emp.name, date:dateStr, status});
        });
      }
      matchedAny = true;
    }
  }
  return matchedAny ? allRecords : null;
}

/* Claude 호출: 아티팩트의 sample 기능(보는 사람의 Claude 계정)으로 실행 */
function dataUrlToBlob(dataUrl){
  const [meta, b64] = dataUrl.split(',');
  const mime = (meta.match(/data:(.*?);base64/)||[])[1] || 'image/jpeg';
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}

async function callClaude(content, sysOrOpts){
  const sample = await claudeCap('sample');
  if(!sample) throw new Error('Claude 분석 기능을 쓸 수 없는 환경입니다 (claude.ai에서 열어주세요).');
  const system = typeof sysOrOpts==='string' ? sysOrOpts : AI_SYSTEM_PROMPT;
  const texts = [], images = [];
  (Array.isArray(content)?content:[{type:'text',text:String(content)}]).forEach(part=>{
    if(part.type==='text') texts.push(part.text);
    else if(part.type==='image' && part.source) images.push(dataUrlToBlob(`data:${part.source.media_type};base64,${part.source.data}`));
  });
  const prompt = system + '\n\n---\n\n' + texts.join('\n');
  try{
    const opts = images.length ? {images} : {};
    if(state.abortCtl) opts.signal = state.abortCtl.signal;
    const res = await sample(prompt, opts);
    return res.text;
  }catch(e){
    const code = e && e.code;
    throw new Error(SAMPLE_ERR_COPY[code] || ('AI 분석 실패' + (code?` (${code})`:'')));
  }
}
function parseAiJson(text){
  let c = text.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'');
  const s=c.indexOf('{'), e=c.lastIndexOf('}');
  if(s>=0 && e>s) c = c.slice(s,e+1);
  return JSON.parse(c);
}
