/* =========================================================================
   인보이스 엔진: 원본 xlsx의 XML을 직접 고쳐서 서식·수식·외부연결·메모를 그대로 둔다.
   세부정산내역 시트의 입력 칸(성명·구분·매장명·입사일·퇴사일·근무일수·연장·야간·휴일)만 바꾸고,
   직원이 늘거나 줄면 행을 추가/삭제하면서 모든 수식·메모·필터 참조를 함께 옮긴다.
   ========================================================================= */
const INV_SHEET = '세부정산내역';
const SSML = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';

/* ---- A1 참조 도구 ---- */
function colToNum(c){ let n=0; for(const ch of c) n = n*26 + (ch.charCodeAt(0)-64); return n; }
function numToCol(n){ let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
const REF_RE = /(?<![A-Za-z0-9_.ㄱ-힝\]'$])((?:'(?:[^']|'')+'|[A-Za-z_ㄱ-힝][A-Za-z0-9_.ㄱ-힝]*)!)?(\$?)([A-Z]{1,3})(\$?)(\d+)(?::(\$?)([A-Z]{1,3})(\$?)(\d+))?(?![A-Za-z0-9_(!])/g;
function sheetOfPrefix(p){ if(!p) return null; let s=p.slice(0,-1); if(s.startsWith("'")) s=s.slice(1,-1).replace(/''/g,"'"); return s; }
// 문자열 상수("...") 바깥에서만 참조를 바꾼다
function mapFormulaRefs(f, fn){
  return f.split(/("(?:[^"]|"")*")/).map((seg,i)=> i%2 ? seg : seg.replace(REF_RE, (...m)=>{
    const [all, prefix, c1a, c1, r1a, r1, c2a, c2, r2a, r2] = m;
    const out = fn({prefix: prefix||'', sheet: sheetOfPrefix(prefix), c1a, c1, r1a, r1:+r1, isRange: r2!=null, c2a, c2, r2a, r2: r2!=null?+r2:null});
    return out==null ? all : out;
  })).join('');
}
function fmtRef(o){
  const a = `${o.c1a}${o.c1}${o.r1a}${o.r1}`;
  return o.prefix + (o.isRange ? `${a}:${o.c2a}${o.c2}${o.r2a}${o.r2}` : a);
}
// 복사 의미의 이동: 상대 참조만 dRow만큼 옮긴다
function translateFormula(f, dRow){
  if(!dRow) return f;
  return mapFormulaRefs(f, o=>{
    if(!o.r1a) o.r1 += dRow;
    if(o.isRange && !o.r2a) o.r2 += dRow;
    return fmtRef(o);
  });
}
// 구조 이동: 대상 시트를 가리키는 참조의 행 번호를 행 지도에 맞춰 바꾼다
function structuralFormula(f, onTargetSheet, rm){
  return mapFormulaRefs(f, o=>{
    const target = o.sheet ? o.sheet===INV_SHEET : onTargetSheet;
    if(!target) return null;
    if(!o.isRange){
      const n = rm.single(o.r1);
      if(n==null) return o.prefix + '#REF!';
      o.r1 = n; return fmtRef(o);
    }
    const a = rm.start(o.r1), b = rm.end(o.r2);
    if(a==null || b==null || b<a) return o.prefix + '#REF!';
    o.r1 = a; o.r2 = b; return fmtRef(o);
  });
}
function makeRowMap(first, last, newCount, oldToNew){
  const delta = newCount - (last-first+1);
  return {
    delta,
    single: x => x<first ? x : (x>last ? x+delta : (oldToNew.has(x) ? oldToNew.get(x) : null)),
    start:  x => x<first ? x : (x>last ? x+delta : first),
    end:    x => x<first ? x : (x>last ? x+delta : first+newCount-1),
  };
}

/* ---- XML 도구 ---- */
function kids(el, name){ return Array.from(el.childNodes).filter(n=>n.nodeType===1 && n.localName===name); }
function kid(el, name){ return kids(el, name)[0] || null; }
function cellRefParts(r){ const m = /^([A-Z]+)(\d+)$/.exec(r); return m ? {col:m[1], row:+m[2]} : null; }
function parseXml(text){ return new DOMParser().parseFromString(text, 'application/xml'); }
function serializeXml(doc){
  let s = new XMLSerializer().serializeToString(doc);
  if(!s.startsWith('<?xml')) s = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + s;
  return s;
}

/* ---- 통합 문서 읽기 ---- */
async function invLoad(arrayBuffer){
  const zip = await JSZip.loadAsync(new Uint8Array(arrayBuffer));
  const wbXml = parseXml(await zip.file('xl/workbook.xml').async('string'));
  const relsXml = parseXml(await zip.file('xl/_rels/workbook.xml.rels').async('string'));
  const rels = {};
  Array.from(relsXml.getElementsByTagName('Relationship')).forEach(r=>{ rels[r.getAttribute('Id')] = r.getAttribute('Target'); });
  const sheets = Array.from(wbXml.getElementsByTagNameNS(SSML,'sheet')).map(s=>{
    const rid = s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id') || s.getAttribute('r:id');
    let target = rels[rid] || '';
    target = target.startsWith('/') ? target.slice(1) : 'xl/' + target.replace(/^\.\//,'');
    return {name: s.getAttribute('name'), path: target};
  });
  const sheet = sheets.find(s=>s.name===INV_SHEET);
  if(!sheet) throw new Error(`"${INV_SHEET}" 시트를 찾지 못했습니다. 지난달 인보이스 파일이 맞는지 확인해주세요.`);
  let shared = [];
  if(zip.file('xl/sharedStrings.xml')){
    const ss = parseXml(await zip.file('xl/sharedStrings.xml').async('string'));
    shared = Array.from(ss.getElementsByTagNameNS(SSML,'si')).map(si=>Array.from(si.getElementsByTagNameNS(SSML,'t')).filter(t=>{
      // 윗주(rPh) 안의 글자는 빼고 본문만
      let p=t.parentNode; while(p && p!==si){ if(p.localName==='rPh') return false; p=p.parentNode; } return true;
    }).map(t=>t.textContent).join(''));
  }
  const sheetDoc = parseXml(await zip.file(sheet.path).async('string'));
  const info = invInspect(sheetDoc, shared);
  return {zip, sheets, sheet, shared, info, wbXml};
}
function cellValue(c, shared){
  if(!c) return null;
  const t = c.getAttribute('t');
  if(t==='inlineStr'){ const is = kid(c,'is'); return is ? is.textContent : ''; }
  const v = kid(c,'v'); if(!v) return null;
  if(t==='s') return shared[+v.textContent] ?? '';
  if(t==='str' || t==='e') return v.textContent;
  const n = +v.textContent; return isNaN(n) ? v.textContent : n;
}
function rowCells(rowEl){ const map={}; kids(rowEl,'c').forEach(c=>{ const p = cellRefParts(c.getAttribute('r')); if(p) map[p.col]=c; }); return map; }
function serialToISO(n){ if(typeof n!=='number' || !n) return ''; const d = new Date(Date.UTC(1899,11,30) + Math.round(n)*86400000); return d.toISOString().slice(0,10); }
function isoToSerial(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); if(!m) return null; return Math.round((Date.UTC(+m[1],+m[2]-1,+m[3]) - Date.UTC(1899,11,30))/86400000); }

// 머리글 "성명" 행을 찾고, 그 아래부터 "합계" 행 전까지를 직원 구역으로 본다
function invInspect(doc, shared){
  const sd = doc.getElementsByTagNameNS(SSML,'sheetData')[0];
  const rows = kids(sd,'row');
  let headerRow=null, cols={};
  for(const r of rows){
    const cells = rowCells(r);
    const labels = {};
    for(const col in cells){ const v = cellValue(cells[col], shared); if(typeof v==='string') labels[v.replace(/\s+/g,'')] = col; }
    if(labels['성명'] && (labels['구분'] || labels['입사일'])){
      headerRow = +r.getAttribute('r');
      const pick = re => { for(const l in labels) if(re.test(l)) return labels[l]; return null; };
      cols = {no: pick(/^No$/i), name: labels['성명'], grade: pick(/^구분$/), store: pick(/^매장명?$/), hire: pick(/^입사일/), term: pick(/^퇴사일/),
              days: pick(/^근무일수/), ot: pick(/^연장근무$/), night: pick(/^야간근무$/), hol: pick(/^휴일근무$/)};
      break;
    }
  }
  if(headerRow==null) throw new Error('세부정산내역 시트에서 "성명" 머리글 행을 찾지 못했습니다.');
  const missing = ['grade','store','hire','term','days','ot','night','hol'].filter(k=>!cols[k]);
  if(missing.length) throw new Error('세부정산내역 머리글에서 찾지 못한 칸이 있습니다: ' + missing.map(k=>({grade:'구분',store:'매장명',hire:'입사일',term:'퇴사일',days:'근무일수',ot:'연장근무',night:'야간근무',hol:'휴일근무'})[k]).join(', '));
  let totalRow=null; const employees=[];
  for(const r of rows){
    const rn = +r.getAttribute('r'); if(rn<=headerRow) continue;
    const cells = rowCells(r);
    const a = cellValue(cells.A, shared), b = cellValue(cells[cols.name], shared);
    if((typeof a==='string' && a.replace(/\s/g,'')==='합계') || (typeof b==='string' && b.replace(/\s/g,'')==='합계')){ totalRow = rn; break; }
    employees.push({row: rn, name: typeof b==='string' ? b.trim() : (b==null?'':String(b)),
      grade: cellValue(cells[cols.grade], shared) ?? '', store: cellValue(cells[cols.store], shared) ?? '',
      hire: serialToISO(cellValue(cells[cols.hire], shared)), term: serialToISO(cellValue(cells[cols.term], shared)),
      days: cellValue(cells[cols.days], shared), ot: cellValue(cells[cols.ot], shared), night: cellValue(cells[cols.night], shared), hol: cellValue(cells[cols.hol], shared)});
  }
  if(totalRow==null) throw new Error('세부정산내역 시트에서 "합계" 행을 찾지 못했습니다.');
  const first = headerRow+1, last = totalRow-1;
  // 정산일자·기준일수 칸 (머리글 바로 위 행)
  let periodCell=null, baseDaysCell=null;
  for(const r of rows){
    const rn = +r.getAttribute('r'); if(rn>=headerRow) break;
    const cells = rowCells(r);
    for(const col in cells){
      const v = cellValue(cells[col], shared);
      if(typeof v!=='string') continue;
      const k = v.replace(/\s/g,'');
      const right = numToCol(colToNum(col)+1);
      if(k==='정산일자') periodCell = `${right}${rn}`;
      if(k==='기준일수') baseDaysCell = `${right}${rn}`;
    }
  }
  const grades = [];
  return {headerRow, first, last, totalRow, cols, employees: employees.filter(e=>e.name), allRows: employees, periodCell, baseDaysCell, grades};
}

/* ---- 직급참고시트의 구분 목록 (VLOOKUP 대상) ---- */
async function invGrades(ctx){
  // 세부정산내역 수식에서 VLOOKUP 범위를 찾는다: '시트'!$B$3:$H$7
  const sheetXml = await ctx.zip.file(ctx.sheet.path).async('string');
  const m = /VLOOKUP\([A-Z]+\d+,((?:'(?:[^']|'')+'|[^!,()]+))!\$?([A-Z]+)\$?(\d+):\$?[A-Z]+\$?(\d+)/.exec(sheetXml.replace(/&apos;/g,"'"));
  if(!m) return [];
  const sname = sheetOfPrefix(m[1]+'!'), col = m[2], r1 = +m[3], r2 = +m[4];
  const s = ctx.sheets.find(x=>x.name===sname); if(!s) return [];
  const doc = parseXml(await ctx.zip.file(s.path).async('string'));
  const out = [];
  kids(doc.getElementsByTagNameNS(SSML,'sheetData')[0],'row').forEach(r=>{
    const rn = +r.getAttribute('r'); if(rn<r1 || rn>r2) return;
    const v = cellValue(rowCells(r)[col], ctx.shared);
    if(typeof v==='string' && v.trim()) out.push(v.trim());
  });
  return out;
}

/* ---- 셀 쓰기 ---- */
function ensureCell(doc, rowEl, col, rowNum){
  const ref = col + rowNum;
  const cells = kids(rowEl,'c');
  let c = cells.find(x=>x.getAttribute('r')===ref);
  if(c) return c;
  c = doc.createElementNS(SSML,'c'); c.setAttribute('r', ref);
  const n = colToNum(col);
  const after = cells.find(x=>colToNum(cellRefParts(x.getAttribute('r')).col) > n);
  rowEl.insertBefore(c, after||null);
  return c;
}
function clearCellContent(c){ ['f','v','is'].forEach(n=>kids(c,n).forEach(x=>c.removeChild(x))); c.removeAttribute('t'); }
function writeText(doc, c, text){
  clearCellContent(c);
  if(text==null || text==='') return;
  c.setAttribute('t','inlineStr');
  const is = doc.createElementNS(SSML,'is'), t = doc.createElementNS(SSML,'t');
  t.textContent = String(text); is.appendChild(t); c.appendChild(is);
}
function writeNumber(doc, c, num){
  clearCellContent(c);
  if(num==null || num==='' || isNaN(+num)) return;
  const v = doc.createElementNS(SSML,'v'); v.textContent = String(+num); c.appendChild(v);
}

/* ---- 공유 수식 풀기 (행을 옮기기 전에 모든 수식을 명시적으로) ---- */
function expandSharedFormulas(doc){
  const masters = {};
  const cs = Array.from(doc.getElementsByTagNameNS(SSML,'c'));
  cs.forEach(c=>{
    const f = kid(c,'f');
    if(f && f.getAttribute('t')==='shared' && f.getAttribute('ref')!=null){
      const p = cellRefParts(c.getAttribute('r'));
      masters[f.getAttribute('si')] = {text: f.textContent, row: p.row, col: colToNum(p.col)};
    }
  });
  cs.forEach(c=>{
    const f = kid(c,'f');
    if(!f || f.getAttribute('t')!=='shared') return;
    const m = masters[f.getAttribute('si')];
    const p = cellRefParts(c.getAttribute('r'));
    if(m){
      const dCol = colToNum(p.col) - m.col;
      let text = translateFormula(m.text, p.row - m.row);
      if(dCol) text = mapFormulaRefs(text, o=>{ if(!o.c1a) o.c1 = numToCol(colToNum(o.c1)+dCol); if(o.isRange && !o.c2a) o.c2 = numToCol(colToNum(o.c2)+dCol); return fmtRef(o); });
      f.textContent = text;
    }
    f.removeAttribute('t'); f.removeAttribute('ref'); f.removeAttribute('si');
  });
}
function stripCachedFormulaValues(doc){
  Array.from(doc.getElementsByTagNameNS(SSML,'c')).forEach(c=>{
    if(!kid(c,'f')) return;
    kids(c,'v').forEach(v=>c.removeChild(v));
    const t = c.getAttribute('t'); if(t==='str' || t==='e' || t==='b' || t==='n') c.removeAttribute('t');
  });
}
function setRowNumber(rowEl, newNum){
  rowEl.setAttribute('r', String(newNum));
  kids(rowEl,'c').forEach(c=>{ const p = cellRefParts(c.getAttribute('r')); if(p) c.setAttribute('r', p.col + newNum); });
}

/* ---- 메인: 반영된 xlsx 만들기 ----
   plan: [{name, grade, store, hire, term, days, ot, night, hol, srcRow|null}] — 출력 순서대로
   srcRow가 있으면 그 행을 그대로 옮겨 쓰고(개인별 수식·메모 유지), 없으면 비슷한 행을 복제한다. */
async function invBuild(ctx, plan, opts){
  const {zip, sheets, sheet} = ctx;
  const info = ctx.info;
  const doc = parseXml(await zip.file(sheet.path).async('string'));
  expandSharedFormulas(doc);
  const sd = doc.getElementsByTagNameNS(SSML,'sheetData')[0];
  const rowEls = {}; kids(sd,'row').forEach(r=>rowEls[+r.getAttribute('r')] = r);
  const {first, last, cols} = info;
  const n = plan.length;
  if(n===0) throw new Error('반영할 직원이 없습니다.');

  // 새로 넣을 직원이 복제할 행: 같은 구분의 기존 행 → 가장 흔한 형태의 행
  const blockRows = []; for(let r=first; r<=last; r++) if(rowEls[r]) blockRows.push(r);
  const fCount = r => kids(rowEls[r],'c').filter(c=>kid(c,'f')).length;
  const employeesByRow = {}; info.allRows.forEach(e=>employeesByRow[e.row]=e);
  const fallbackRow = blockRows.filter(r=>employeesByRow[r] && employeesByRow[r].name).sort((a,b)=>fCount(b)-fCount(a))[0] || blockRows[0];
  const templateFor = grade => {
    const same = blockRows.filter(r=>employeesByRow[r] && employeesByRow[r].grade===grade).sort((a,b)=>fCount(b)-fCount(a));
    return same[0] || fallbackRow;
  };

  const oldToNew = new Map();
  const newRows = plan.map((p,i)=>{
    const newNum = first + i;
    let src = p.srcRow, el;
    if(src!=null && rowEls[src]){ el = rowEls[src]; oldToNew.set(src, newNum); }
    else { src = templateFor(p.grade); el = rowEls[src].cloneNode(true); el.__cloned = true; }
    return {p, el, src, newNum};
  });
  const rm = makeRowMap(first, last, n, oldToNew);

  // 1) 직원 구역 밖(위·아래) 수식: 구조 이동
  kids(sd,'row').forEach(r=>{
    const rn = +r.getAttribute('r');
    if(rn>=first && rn<=last) return;
    kids(r,'c').forEach(c=>{ const f=kid(c,'f'); if(f) f.textContent = structuralFormula(f.textContent, true, rm); });
  });
  // 2) 직원 구역: 행마다 복사 의미로 수식 이동
  newRows.forEach(x=>{
    kids(x.el,'c').forEach(c=>{ const f=kid(c,'f'); if(f) f.textContent = translateFormula(f.textContent, x.newNum - x.src); });
  });
  // 3) 행 재배치: 직원 구역을 통째로 다시 만들고, 아래 행은 delta만큼 민다
  for(let r=first; r<=last; r++) if(rowEls[r] && rowEls[r].parentNode===sd) sd.removeChild(rowEls[r]);
  const below = kids(sd,'row').filter(r=>+r.getAttribute('r')>last);
  below.forEach(r=>setRowNumber(r, +r.getAttribute('r') + rm.delta));
  const anchor = below[0] || null;
  newRows.forEach(x=>{ setRowNumber(x.el, x.newNum); sd.insertBefore(x.el, anchor); });

  // 4) 입력 칸 쓰기
  newRows.forEach(x=>{
    const {p, el, newNum} = x;
    const put = (key, fn) => { if(cols[key]) fn(ensureCell(doc, el, cols[key], newNum)); };
    put('name', c=>writeText(doc, c, p.name));
    put('grade', c=>writeText(doc, c, p.grade));
    put('store', c=>writeText(doc, c, p.store));
    put('hire', c=>writeNumber(doc, c, isoToSerial(p.hire)));
    put('term', c=>writeNumber(doc, c, isoToSerial(p.term)));
    put('days', c=>writeNumber(doc, c, p.days));
    put('ot', c=>writeNumber(doc, c, p.ot));
    put('night', c=>writeNumber(doc, c, p.night));
    put('hol', c=>writeNumber(doc, c, p.hol));
    if(el.__cloned){
      // 복제한 행은 개인별 수기 입력(기타수당 등 숫자 상수)을 비운다
      kids(el,'c').forEach(c=>{
        const col = cellRefParts(c.getAttribute('r')).col;
        if(Object.values(cols).includes(col)) return;
        if(!kid(c,'f') && (kid(c,'v') || kid(c,'is'))) clearCellContent(c);
      });
    }
  });
  // 5) 정산일자·기준일수
  if(opts && opts.period){
    const [y,m] = opts.period.split('-').map(Number);
    const lastDay = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const setRef = (ref, fn) => {
      if(!ref) return; const p = cellRefParts(ref); const row = kids(sd,'row').find(r=>+r.getAttribute('r')===p.row); if(!row) return;
      fn(ensureCell(doc, row, p.col, p.row));
    };
    setRef(info.periodCell, c=>writeText(doc, c, `${y}.${String(m).padStart(2,'0')}.01 ~ ${y}.${String(m).padStart(2,'0')}.${lastDay}`));
    setRef(info.baseDaysCell, c=>writeNumber(doc, c, lastDay));
  }
  // 6) 시트 부속 정보: dimension, autoFilter, 병합, 조건부서식
  const mapRangeText = (txt, onTarget=true) => structuralFormula(txt, onTarget, rm);
  const dim = doc.getElementsByTagNameNS(SSML,'dimension')[0];
  if(dim) dim.setAttribute('ref', mapRangeText(dim.getAttribute('ref')));
  Array.from(doc.getElementsByTagNameNS(SSML,'autoFilter')).forEach(a=>a.setAttribute('ref', mapRangeText(a.getAttribute('ref'))));
  ['sortState','sortCondition'].forEach(tag=>Array.from(doc.getElementsByTagNameNS(SSML,tag)).forEach(a=>a.setAttribute('ref', mapRangeText(a.getAttribute('ref')))));
  Array.from(doc.getElementsByTagNameNS(SSML,'mergeCell')).forEach(mc=>mc.setAttribute('ref', mapRangeText(mc.getAttribute('ref'))));
  Array.from(doc.getElementsByTagNameNS(SSML,'conditionalFormatting')).forEach(cf=>{
    const parts = cf.getAttribute('sqref').split(/\s+/).map(rg=>{
      const m = /^([A-Z]+)(\d+)(?::([A-Z]+)(\d+))?$/.exec(rg); if(!m) return rg;
      const r1=+m[2], r2=m[4]?+m[4]:r1;
      if(r1>=first && r2<=last) return `${m[1]}${first}:${m[3]||m[1]}${first+n-1}`; // 직원 구역 안 → 새 구역 전체
      return mapRangeText(rg);
    });
    cf.setAttribute('sqref', [...new Set(parts)].join(' '));
  });
  Array.from(doc.getElementsByTagNameNS(SSML,'selection')).forEach(s=>{ s.setAttribute('activeCell', `${cols.name}${first}`); s.setAttribute('sqref', `${cols.name}${first}`); });
  stripCachedFormulaValues(doc);
  zip.file(sheet.path, serializeXml(doc));

  // 7) 메모(comments + vml): 행을 따라 옮기고, 삭제된 행의 메모는 지운다
  const relPath = sheet.path.replace(/([^/]+)$/, '_rels/$1.rels');
  if(zip.file(relPath)){
    const rels = parseXml(await zip.file(relPath).async('string'));
    const resolve = t => { const base = sheet.path.split('/').slice(0,-1); t.split('/').forEach(seg=>{ if(seg==='..') base.pop(); else if(seg!=='.') base.push(seg); }); return base.join('/'); };
    for(const r of Array.from(rels.getElementsByTagName('Relationship'))){
      const type = r.getAttribute('Type')||'', path = resolve(r.getAttribute('Target'));
      if(!zip.file(path)) continue;
      if(/\/comments$/.test(type)){
        const cdoc = parseXml(await zip.file(path).async('string'));
        Array.from(cdoc.getElementsByTagNameNS(SSML,'comment')).forEach(cm=>{
          const p = cellRefParts(cm.getAttribute('ref')); if(!p) return;
          const nr = rm.single(p.row);
          if(nr==null) cm.parentNode.removeChild(cm); else cm.setAttribute('ref', p.col+nr);
        });
        zip.file(path, serializeXml(cdoc));
      } else if(/\/vmlDrawing$/.test(type)){
        let vml = await zip.file(path).async('string');
        vml = vml.replace(/<v:shape\b[\s\S]*?<\/v:shape>/g, shape=>{
          const rowM = /<x:Row>(\d+)<\/x:Row>/.exec(shape);
          if(!rowM || !/ObjectType="Note"/.test(shape)) return shape;
          const oldRow = +rowM[1] + 1, nr = rm.single(oldRow);
          if(nr==null) return '';
          const d = nr - oldRow; if(!d) return shape;
          return shape.replace(/<x:Row>\d+<\/x:Row>/, `<x:Row>${nr-1}</x:Row>`)
            .replace(/<x:Anchor>([\s\S]*?)<\/x:Anchor>/, (all, a)=>{ const v = a.split(',').map(s=>s.trim()); v[2] = String(+v[2]+d); v[6] = String(+v[6]+d); return `<x:Anchor>${v.join(', ')}</x:Anchor>`; });
        });
        zip.file(path, vml);
      }
    }
  }
  // 8) 다른 시트에서 세부정산내역을 가리키는 수식
  for(const s of sheets){
    if(s===sheet || !zip.file(s.path)) continue;
    const text = await zip.file(s.path).async('string');
    if(!text.includes(INV_SHEET)) continue;
    const sdoc = parseXml(text);
    let touched = false;
    Array.from(sdoc.getElementsByTagNameNS(SSML,'f')).forEach(f=>{
      if(!f.textContent.includes(INV_SHEET)) return;
      const nf = structuralFormula(f.textContent, false, rm);
      if(nf!==f.textContent){ f.textContent = nf; touched = true; }
    });
    stripCachedFormulaValues(sdoc);
    zip.file(s.path, serializeXml(sdoc));
  }
  // 9) 이름 정의(필터 범위 등) + 열 때 전체 다시 계산 + calcChain 제거
  const wbXml = parseXml(await zip.file('xl/workbook.xml').async('string'));
  Array.from(wbXml.getElementsByTagNameNS(SSML,'definedName')).forEach(dn=>{
    if(dn.textContent.includes(INV_SHEET)) dn.textContent = structuralFormula(dn.textContent, false, rm);
  });
  let calcPr = wbXml.getElementsByTagNameNS(SSML,'calcPr')[0];
  if(!calcPr){ calcPr = wbXml.createElementNS(SSML,'calcPr'); wbXml.documentElement.appendChild(calcPr); }
  calcPr.setAttribute('fullCalcOnLoad','1');
  zip.file('xl/workbook.xml', serializeXml(wbXml));
  if(zip.file('xl/calcChain.xml')){
    zip.remove('xl/calcChain.xml');
    const rels = await zip.file('xl/_rels/workbook.xml.rels').async('string');
    zip.file('xl/_rels/workbook.xml.rels', rels.replace(/<Relationship\b[^>]*calcChain[^>]*\/>/g,''));
    const ct = await zip.file('[Content_Types].xml').async('string');
    zip.file('[Content_Types].xml', ct.replace(/<Override\b[^>]*calcChain[^>]*\/>/g,''));
  }
  return await zip.generateAsync({type:'blob', compression:'DEFLATE'});
}
/* =========================================================================
   인보이스 내려받기: 근태 분석 결과 → 지난달 청구내역서의 세부정산내역 입력 칸
   ========================================================================= */
state.invoice = state.invoice || {file:null, buf:null, info:null, grades:[], rows:[], error:null, busy:false};

function normDateStr(v){
  if(v==null || v==='') return '';
  if(v instanceof Date) return ymd(v.getFullYear(), v.getMonth()+1, v.getDate()) || '';
  const s = String(v).trim();
  let m = s.match(/^(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);
  if(m) return ymd(+m[1], +m[2], +m[3]) || '';
  if(/^\d{5}(\.\d+)?$/.test(s)){ const d = XLSX.SSF.parse_date_code(+s); return d ? (ymd(d.y,d.m,d.d)||'') : ''; }
  return '';
}
function periodBounds(p){ const [y,m] = p.split('-').map(Number); return {ps: Date.UTC(y,m-1,1), pe: Date.UTC(y,m,0), y, m, days: new Date(Date.UTC(y,m,0)).getUTCDate()}; }
function employmentDays(hire, term, p){
  const {ps, pe} = periodBounds(p);
  const h = hire ? Date.parse(hire+'T00:00:00Z') : ps;
  const t = term ? Date.parse(term+'T00:00:00Z') : pe;
  const s = Math.max(h, ps), e = Math.min(t, pe);
  return e < s ? 0 : Math.round((e-s)/86400000) + 1;
}
function employedInPeriod(hire, term, p){
  const {ps, pe} = periodBounds(p);
  if(hire && Date.parse(hire+'T00:00:00Z') > pe) return false;
  if(term && Date.parse(term+'T00:00:00Z') < ps) return false;
  return true;
}
const PT_GRADE_RE = /PT|파트|알바|아르바이트|시간제|일용/i;
const WORK_OVERRIDE = new Set(['출근','지각','외출']);

// 분석 결과를 직원별로 모은다: 출근일·휴일출근일·연장·야간(분)
function invAnalysisSummary(){
  const p = state.selectedPeriod;
  const map = new Map();
  const get = name => { const k = normName(name); if(!map.has(k)) map.set(k, {name, status:{}, ot:0, night:0}); return map.get(k); };
  state.sources.forEach(s=>(s.records||[]).forEach(r=>{ if(r.name && r.date && r.date.startsWith(p)) get(r.name).status[r.date] = r.status; }));
  state.dateOverrides.forEach(o=>{ if(o.name && o.date && o.date.startsWith(p)) get(matchRosterName(o.name)).status[o.date] = WORK_OVERRIDE.has(o.status) ? 'O' : o.status; });
  Object.entries(state.manualCells||{}).forEach(([key,val])=>{
    const [, name, date] = key.split('||'); if(!name || !date || !date.startsWith(p)) return;
    const x = get(name); if(val==='__blank') delete x.status[date]; else x.status[date] = val;
  });
  state.sources.forEach(s=>(s.otRecords||[]).forEach(r=>{
    if(!r.name || !r.date || !r.date.startsWith(p)) return;
    const x = get(r.name), e = runEmp(r.name);
    if(/연장/.test(r.category) && e.ot) x.ot += r.minutes;
    if(/심야/.test(r.category) && e.night) x.night += r.minutes;
  }));
  const weekend = ensureRun().weekendDays || [];
  map.forEach(x=>{
    const work = Object.entries(x.status).filter(([,st])=>st==='O').map(([d])=>d);
    x.workDays = work.length;
    x.holDays = work.filter(d=>weekend.includes(new Date(d+'T00:00:00Z').getUTCDay()) || isKoreanHoliday(d)).length;
    const dayStd = parseFloat(runEmp(x.name).day);
    x.hol = x.holDays * Math.round((isNaN(dayStd) ? 8 : dayStd) * 60);
  });
  return map;
}
function invFindSummary(summary, name, used){
  const k = normName(name);
  if(summary.has(k) && !used.has(k)) return summary.get(k);
  // 같은 길이·한 글자 차이, 후보가 하나일 때만
  const cands = [...summary.entries()].filter(([key])=>!used.has(key) && key.length===k.length && k.length>=2 && editDistanceLE1(key, k));
  return cands.length===1 ? cands[0][1] : null;
}
function rosterGrade(name, grades){
  const r = state.roster[normName(name)]; if(!r) return '';
  for(const key of Object.keys(r.fields)){
    if(!/^(구분|직급|직위|직책|직무|직종)$/.test(key.replace(/\s/g,''))) continue;
    const v = String(r.fields[key]).trim();
    if(grades.includes(v)) return v;
  }
  return '';
}
function rosterField(name, re){
  const r = state.roster[normName(name)]; if(!r) return '';
  for(const key of Object.keys(r.fields)) if(re.test(key.replace(/\s/g,''))) return String(r.fields[key]).trim();
  return '';
}

function invBuildRowsFromAnalysis(){
  const inv = state.invoice, info = inv.info;
  if(!info) return;
  const p = state.selectedPeriod;
  const summary = invAnalysisSummary();
  const used = new Set();
  const storeCount = {}; info.employees.forEach(e=>{ if(e.store) storeCount[e.store] = (storeCount[e.store]||0)+1; });
  const commonStore = Object.entries(storeCount).sort((a,b)=>b[1]-a[1])[0]?.[0] || '';
  const fill = (base, x) => {
    const name = base.name;
    const hire = normDateStr(findRosterValue((state.roster[normName(name)]||{fields:{}}).fields, '입사일')) || base.hire || '';
    const term = normDateStr(findRosterValue((state.roster[normName(name)]||{fields:{}}).fields, '퇴사일')) || base.term || '';
    const grade = base.grade || rosterGrade(name, inv.grades);
    const isPT = PT_GRADE_RE.test(grade);
    return {
      name, grade,
      store: base.store || rosterField(name, /^(매장명?|점포명?)$/) || commonStore,
      hire, term,
      days: isPT && x ? x.workDays : employmentDays(hire, term, p),
      workDays: x ? x.workDays : null,
      ot: x ? Math.round(x.ot) : 0, night: x ? Math.round(x.night) : 0, hol: x ? x.hol : 0,
      holDays: x ? x.holDays : 0,
    };
  };
  const rows = [];
  info.employees.forEach(e=>{
    const x = invFindSummary(summary, e.name, used);
    if(x) used.add(normName(x.name));
    const row = fill(e, x);
    row.matched = x ? x.name : '';
    row.srcRow = e.row;
    row.kind = x ? 'keep' : 'nodata';
    row.include = x ? true : employedInPeriod(row.hire, row.term, p);
    rows.push(row);
  });
  summary.forEach((x, k)=>{
    if(used.has(k)) return;
    if(x.workDays===0 && !x.ot && !x.night) return; // 출근 기록이 없는 이름은 넣지 않는다
    const row = fill({name: x.name, grade:'', store:'', hire:'', term:''}, x);
    const inRoster = !!state.roster[normName(x.name)];
    row.matched = x.name;
    row.srcRow = null; row.kind = inRoster ? 'new' : 'unknown';
    row.include = inRoster; // 사원명부에 없는 이름은 잘못 읽힌 이름일 수 있어 기본으로 빼둔다
    rows.push(row);
  });
  inv.rows = rows;
  inv.filledAt = Date.now();
}

async function invLoadFile(file){
  const inv = state.invoice;
  inv.busy = true; inv.error = null; render();
  try{
    if(typeof JSZip==='undefined') throw new Error('엑셀 처리 도구를 불러오지 못했습니다. 페이지를 새로고침해주세요.');
    const buf = await file.arrayBuffer();
    const ctx = await invLoad(buf);
    inv.file = file; inv.buf = buf; inv.info = ctx.info;
    inv.grades = await invGrades(ctx);
    invBuildRowsFromAnalysis();
  }catch(err){
    inv.error = err.message || String(err);
    inv.file = file; inv.info = null; inv.rows = [];
  }
  inv.busy = false; render();
}
function invValidate(){
  const inv = state.invoice;
  const inc = inv.rows.filter(r=>r.include);
  const problems = [];
  if(!inc.length) problems.push('반영할 직원이 없습니다.');
  inc.forEach(r=>{
    if(!r.name) problems.push('성명이 비어 있는 행이 있습니다.');
    if(inv.grades.length && !inv.grades.includes(r.grade)) problems.push(`${r.name||'(이름 없음)'}: 구분을 골라주세요`);
  });
  return problems;
}
async function invDownload(){
  const inv = state.invoice;
  const problems = invValidate();
  if(problems.length){ toast(problems.slice(0,3).join(' · '), {error:true}); return; }
  inv.busy = true; render();
  try{
    const ctx = await invLoad(inv.buf); // 매번 원본에서 새로 만든다
    const plan = inv.rows.filter(r=>r.include).map(r=>({
      name: r.name.trim(), grade: r.grade, store: r.store, hire: r.hire, term: r.term,
      days: r.days===''||r.days==null ? null : +r.days,
      ot: +r.ot||0, night: +r.night||0, hol: +r.hol||0, srcRow: r.srcRow,
    }));
    // 기존 직원은 원래 순서, 새 직원은 뒤에
    plan.sort((a,b)=> (a.srcRow==null) - (b.srcRow==null) || (a.srcRow||0) - (b.srcRow||0));
    const blob = await invBuild(ctx, plan, {period: state.selectedPeriod});
    const base = inv.file.name.replace(/\.xlsx?$/i,'');
    await saveFile(`${base}_${state.selectedPeriod}_반영.xlsx`, blob);
  }catch(err){
    console.error(err);
    toast('인보이스를 만들지 못했습니다: '+(err.message||err), {error:true});
  }
  inv.busy = false; render();
}

/* ---------- 화면 ---------- */
function viewInvoice(){
  const inv = state.invoice;
  const site = selectedSite();
  const analyzed = state.analyzed && state.sources.some(s=>(s.records||[]).length || (s.otRecords||[]).length);
  const summaryCount = analyzed ? invAnalysisSummary().size : 0;
  const inc = inv.rows.filter(r=>r.include);
  const cnt = k => inv.rows.filter(r=>r.include && r.kind===k).length;
  const dropped = inv.rows.filter(r=>!r.include && r.srcRow!=null).length;
  const problems = inv.info ? invValidate() : [];
  const fmtMin = m => { m = +m||0; return m ? `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}` : ''; };
  return `
  <div class="content inv-page">
    <div class="page-head">
      <h1>인보이스 내려받기</h1>
      <p>지난달 청구내역서를 올리면, 근태 분석 결과로 세부정산내역 시트의 입력 칸(성명·구분·매장명·입사일·퇴사일·근무일수·연장·야간·휴일근무)만 바꿉니다. 나머지 금액은 파일 안의 수식이 계산하고, 서식·메모·다른 시트는 그대로 둡니다.</p>
    </div>

    <div class="checklist">
      <span class="ck ${site?'on':''}">${site?'✓':'○'} 현장 ${site?escapeHtml(site.name):'미선택'}</span>
      <span class="ck on">✓ 대상 월 ${escapeHtml(state.selectedPeriod)}</span>
      <span class="ck ${analyzed?'on':''}">${analyzed?'✓':'○'} 근태 분석 ${analyzed?`${summaryCount}명`:'안 됨'}</span>
      <span class="ck ${inv.info?'on':''}">${inv.info?'✓':'○'} 인보이스 파일</span>
      ${!analyzed ? `<button type="button" class="btn sm primary" data-inv="goto-analysis">근태표 분석하러 가기</button>` : ''}
    </div>
    ${!analyzed ? `<div class="notice" style="margin-bottom:14px;border-color:#EAD3A6;background:var(--warn-dim);">근태 분석 결과가 없습니다. "월근태일괄등록 및 시간외수당"에서 현장·월을 고르고 근태표를 분석한 뒤 돌아오세요. 양식 없이 근태표만 올려도 분석할 수 있습니다. 분석 없이 파일을 올리면 연장·야간·휴일 칸은 0으로 채워집니다.</div>` : ''}

    <div class="panel">
      <h2>① 지난달 인보이스 파일</h2>
      ${inv.info && !inv.error ? `
        <div class="file-row">
          <div class="fi">
            <div class="fname">${escapeHtml(inv.file.name)}</div>
            <div class="fmeta">세부정산내역 · 기존 직원 ${inv.info.employees.length}명 · 구분 ${inv.grades.length}종 (${inv.grades.map(escapeHtml).join(', ')})</div>
          </div>
          <button type="button" class="btn sm" data-inv="refill" ${inv.busy?'disabled':''}>분석 결과로 다시 채우기</button>
          <button type="button" class="x" data-inv="remove" aria-label="파일 빼기">✕</button>
        </div>` : `
        <div class="drop" data-inv-drop="1">
          <div class="icon">🧾</div>
          <div class="t1">${inv.busy?'읽는 중…':'청구내역서(.xlsx)를 끌어다 놓거나 클릭해서 고르세요'}</div>
          <div class="t2">"세부정산내역" 시트가 있는 지난달 파일 그대로</div>
          <input type="file" id="invFile" data-inv="file" accept=".xlsx" ${inv.busy?'disabled':''} />
        </div>
        ${inv.error ? `<div class="errbox" style="margin-top:10px;"><h3>⚠ 파일을 읽지 못했습니다</h3><ul><li>${escapeHtml(inv.error)}</li></ul></div>` : ''}`}
    </div>

    ${inv.info && !inv.error ? `
    <div class="panel">
      <div class="run-head" style="margin-bottom:10px;">
        <div>
          <h2>② 반영할 내용 확인</h2>
          <p class="desc" style="margin:0;">값을 바로 고칠 수 있습니다. 연장·야간·휴일근무는 <b>분</b> 단위입니다(파일과 같음). 휴일근무는 휴일(규칙 관리의 휴일 요일·법정 공휴일)에 출근한 날 × 일 소정근로시간입니다.</p>
        </div>
        <div class="mini-kpis" style="margin:0;"><span><b>${cnt('keep')}</b>유지</span><span><b>${cnt('new')}</b>신규</span><span><b>${cnt('nodata')}</b>근태 없음</span><span><b>${dropped}</b>행 삭제</span><span><b>${inv.info.employees.length}→${inc.length}</b>명</span></div>
      </div>
      <div class="tablewrap emp-wrap" style="max-height:max(300px, calc(100vh - 420px));">
        <table class="list emp-table inv-table">
          <thead><tr>
            <th>반영</th><th>상태</th><th>성명</th><th title="근태 분석에서 이 직원으로 연결된 이름">근태표 이름</th><th>구분</th><th>매장명</th><th>입사일</th><th>퇴사일</th>
            <th title="급여 계산용 일수 (입사·퇴사일 기준, PT는 출근일수)">근무일수</th><th title="근태표에서 출근으로 판정된 날 (참고)">출근일</th>
            <th>연장(분)</th><th>야간(분)</th><th>휴일(분)</th>
          </tr></thead>
          <tbody>
            ${inv.rows.map((r,i)=>{
              const badGrade = r.include && inv.grades.length && !inv.grades.includes(r.grade);
              const pill = !r.include ? (r.srcRow!=null ? '<span class="pill" style="background:var(--danger-dim);color:var(--danger);">행 삭제</span>' : (r.kind==='unknown' ? '<span class="pill" title="근태표에서 읽혔지만 사원명부에 없는 이름입니다. 맞는 사람이면 체크하세요.">명부에 없음 · 제외</span>' : '<span class="pill">제외</span>'))
                : r.kind==='new' ? '<span class="pill brand">신규</span>' : r.kind==='unknown' ? '<span class="pill warn" title="근태표에서 읽혔지만 사원명부·인보이스에 없는 이름입니다">명부에 없음</span>' : r.kind==='nodata' ? '<span class="pill warn" title="이번 근태 분석에 이 사람이 없습니다">근태 없음</span>' : '<span class="pill good">유지</span>';
              return `<tr class="${r.include?'':'off-row'}">
                <td><input type="checkbox" data-inv="inc" data-i="${i}" ${r.include?'checked':''} aria-label="${escapeHtml(r.name)} 반영"/></td>
                <td>${pill}</td>
                <td><input class="cellin w-name" data-inv="f" data-k="name" data-i="${i}" value="${escapeHtml(r.name)}" ${r.srcRow!=null?'readonly':''} aria-label="성명"/></td>
                <td class="muted" style="white-space:nowrap;">${r.matched ? (normName(r.matched)===normName(r.name) ? '<span class="pill good">일치</span>' : `<span class="pill warn" title="이름이 한 글자 달라 이 직원으로 연결했습니다">${escapeHtml(r.matched)}</span>`) : '–'}</td>
                <td><select class="cellin w-grade ${badGrade?'bad':''}" data-inv="f" data-k="grade" data-i="${i}" aria-label="구분">
                  <option value="">고르기</option>${inv.grades.map(g=>`<option ${r.grade===g?'selected':''}>${escapeHtml(g)}</option>`).join('')}
                  ${r.grade && !inv.grades.includes(r.grade) ? `<option selected>${escapeHtml(r.grade)}</option>` : ''}</select></td>
                <td><input class="cellin w-store" data-inv="f" data-k="store" data-i="${i}" value="${escapeHtml(r.store)}" aria-label="매장명"/></td>
                <td><input class="cellin w-date" type="date" data-inv="f" data-k="hire" data-i="${i}" value="${escapeHtml(r.hire)}" aria-label="입사일"/></td>
                <td><input class="cellin w-date" type="date" data-inv="f" data-k="term" data-i="${i}" value="${escapeHtml(r.term)}" aria-label="퇴사일"/></td>
                <td><input class="cellin w-num" type="number" min="0" max="31" data-inv="f" data-k="days" data-i="${i}" value="${escapeHtml(r.days)}" aria-label="근무일수"/></td>
                <td class="mono muted">${r.workDays==null?'–':r.workDays}${r.holDays?`<span class="sub-note">휴일 ${r.holDays}</span>`:''}</td>
                <td><input class="cellin w-num" type="number" min="0" data-inv="f" data-k="ot" data-i="${i}" value="${escapeHtml(r.ot)}" aria-label="연장근무 분"/><span class="sub-note">${fmtMin(r.ot)}</span></td>
                <td><input class="cellin w-num" type="number" min="0" data-inv="f" data-k="night" data-i="${i}" value="${escapeHtml(r.night)}" aria-label="야간근무 분"/><span class="sub-note">${fmtMin(r.night)}</span></td>
                <td><input class="cellin w-num" type="number" min="0" data-inv="f" data-k="hol" data-i="${i}" value="${escapeHtml(r.hol)}" aria-label="휴일근무 분"/><span class="sub-note">${fmtMin(r.hol)}</span></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div class="row-actions" style="justify-content:flex-start;margin-top:10px;">
        <button type="button" class="btn sm" data-inv="add">+ 직원 직접 추가</button>
      </div>
      <p class="desc" style="margin:10px 0 0;">기존 직원 행은 그 사람의 수식·메모(관리비율, 연차수당, 4대보험 적용 여부 등)를 그대로 유지합니다. 신규 직원은 같은 구분의 기존 행을 복제해서 만들고, 행이 늘거나 줄면 합계·인보이스 시트의 참조도 함께 맞춥니다. 정산일자와 기준일수는 대상 월로 바뀝니다.</p>
    </div>` : ''}

    ${actionBar('',
      `<button type="button" class="btn primary" data-inv="download" ${inv.info && !inv.error && !inv.busy ? '' : 'disabled'}>${inv.busy?'<span class="spin light"></span> 만드는 중':`인보이스 받기 (${inc.length}명)`}</button>`,
      inv.info ? (problems.length ? `⚠ ${escapeHtml(problems[0])}${problems.length>1?` 외 ${problems.length-1}건`:''}` : '세부정산내역만 바뀌고 나머지는 원본 그대로입니다.') : '지난달 인보이스 파일을 올려주세요.')}
  </div>`;
}

/* ---------- 이벤트 ---------- */
function invClick(e){
  const el = e.target.closest('[data-inv]');
  if(!el || el.disabled || el.tagName==='INPUT' || el.tagName==='SELECT') return;
  const a = el.dataset.inv, inv = state.invoice;
  if(a==='goto-analysis'){ state.menu='attendance'; state.page='convert'; goStep(state.analyzed ? 2 : (state.selectedPeriod ? 2 : 1)); return; }
  if(a==='remove'){ Object.assign(inv, {file:null, buf:null, info:null, grades:[], rows:[], error:null}); render(); return; }
  if(a==='refill'){ invBuildRowsFromAnalysis(); render(); toast('분석 결과로 다시 채웠습니다.'); return; }
  if(a==='add'){ inv.rows.push({name:'', grade:'', store:(inv.rows.find(r=>r.store)||{}).store||'', hire:'', term:'', days: periodBounds(state.selectedPeriod).days, workDays:null, ot:0, night:0, hol:0, holDays:0, srcRow:null, kind:'new', include:true}); render(); return; }
  if(a==='download'){ invDownload(); return; }
}
function invChange(e){
  const el = e.target.closest('[data-inv]');
  if(!el) return;
  const a = el.dataset.inv, inv = state.invoice;
  if(a==='file'){ if(el.files[0]) invLoadFile(el.files[0]); el.value=''; return; }
  const r = inv.rows[+el.dataset.i]; if(!r) return;
  if(a==='inc'){ r.include = el.checked; render(); return; }
  if(a==='f'){
    const k = el.dataset.k;
    r[k] = ['days','ot','night','hol'].includes(k) ? (el.value===''?'':+el.value) : el.value;
    if(k==='hire' || k==='term' || k==='grade') r.days = PT_GRADE_RE.test(r.grade) && r.workDays!=null ? r.workDays : employmentDays(r.hire, r.term, state.selectedPeriod);
    render(); return;
  }
}
function invDrag(e){
  const zone = e.target.closest('[data-inv-drop]'); if(!zone) return;
  e.preventDefault();
  if(e.type==='dragover') zone.classList.add('drag');
  else if(e.type==='dragleave') zone.classList.remove('drag');
  else if(e.type==='drop'){ zone.classList.remove('drag'); if(e.dataTransfer.files[0]) invLoadFile(e.dataTransfer.files[0]); }
}
(function(){
  const app = document.getElementById('app');
  app.addEventListener('click', invClick);
  app.addEventListener('change', invChange);
  ['dragover','dragleave','drop'].forEach(t=>app.addEventListener(t, invDrag));
})();

(async function boot(){
  await Promise.all([loadSiteRegistry(), loadRuleArchive()]);
  render();
})();
</script>
